<style>

.hdr{position:sticky;top:0;z-index:50;background:rgba(8,8,11,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(239,237,232,.07)}

.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:14.5px;color:#C9C6BE;border-radius:999px;transition:color .3s,background .3s}

.hdr-cta{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid transparent;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background .35s,color .35s,border-color .35s;white-space:nowrap}

.burger{display:none;width:48px;height:48px;border-radius:999px;border:1px solid rgba(239,237,232,.2);background:transparent;color:#EFEDE8;align-items:center;justify-content:center}

@media (max-width:520px){.hdr-cta .btn-amber{display:none}}
.mnav{display:grid;padding:6px 0 22px}
.mnav a{display:flex;align-items:center;min-height:54px;font-family:'Syne',sans-serif;font-weight:700;font-size:22px;border-bottom:1px solid rgba(239,237,232,.08)}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#F2B544;font-weight:600}
.scene{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#9B988F;font-weight:500}
.scene b{color:#F2B544;font-weight:600}
.scene i{display:block;width:56px;height:1px;background:linear-gradient(90deg,#F2B544,transparent)}
.h2{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(32px,4.8vw,66px);line-height:1.02;letter-spacing:-.02em;overflow-wrap:anywhere}
.lead{font-size:clamp(17px,1.4vw,19px);color:#C9C6BE;max-width:640px}
.sec{padding:130px 0;position:relative}
@media (max-width:720px){.sec{padding:84px 0}}
.sec-head{display:grid;gap:22px;margin-bottom:56px}
/* hero */
.hero{position:relative;height:760px;overflow:hidden}
@media (max-width:720px){.hero{height:700px}}
.layer{position:absolute;top:-70px;left:-70px;right:-70px;bottom:-70px;transition:transform 1s cubic-bezier(.16,.84,.24,1)}
.ly{position:absolute;top:0;left:0;right:0;bottom:0}
.ly-back{background:url(assets/city-neon-aerial.webp) center/cover;filter:saturate(.6) brightness(.28) contrast(1.2);animation:drift 26s ease-in-out infinite alternate}
.ly-mid{left:30%;background:url(assets/gaming-den-neon.webp) center/cover;filter:sepia(.55) saturate(1.3) hue-rotate(-15deg) brightness(.55);-webkit-mask-image:radial-gradient(60% 65% at 60% 50%,#000 35%,transparent);mask-image:radial-gradient(60% 65% at 60% 50%,#000 35%,transparent);animation:drift2 18s ease-in-out infinite alternate}
.ly-pad{position:absolute;right:40px;bottom:60px;width:560px;height:420px;background:url(assets/controller-neon.webp) center/cover;-webkit-mask-image:radial-gradient(closest-side,#000 50%,transparent);mask-image:radial-gradient(closest-side,#000 50%,transparent);filter:brightness(.9);animation:float 8s ease-in-out infinite alternate}
@media (max-width:720px){.ly-pad{width:340px;height:260px;right:-40px;bottom:80px;opacity:.6}}
.ly-fog{background:radial-gradient(45% 40% at 25% 75%,rgba(242,181,68,.25),transparent 70%),radial-gradient(35% 30% at 75% 30%,rgba(0,174,239,.18),transparent 70%);animation:fog 12s ease-in-out infinite alternate}
.hud{position:absolute;top:80px;right:60px;bottom:80px;left:60px;z-index:4;pointer-events:none}
.hud i{position:absolute;width:34px;height:34px;border-color:rgba(242,181,68,.55);border-style:solid;border-width:0}
.hud .a{top:0;left:0;border-top-width:1px;border-left-width:1px}.hud .b{top:0;right:0;border-top-width:1px;border-right-width:1px}.hud .c{bottom:0;left:0;border-bottom-width:1px;border-left-width:1px}.hud .d{bottom:0;right:0;border-bottom-width:1px;border-right-width:1px}
.hud-read{position:absolute;top:14px;right:50px;font-size:11px;letter-spacing:.26em;color:#F2B544;text-transform:uppercase;animation:blink 2s steps(2) infinite}
.vign{position:absolute;top:0;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(90deg,rgba(8,8,11,.94),rgba(8,8,11,.35) 58%,transparent),linear-gradient(180deg,transparent 55%,#08080B)}
.grain{position:absolute;top:-40px;left:-40px;right:-40px;bottom:-40px;pointer-events:none;z-index:7;opacity:.1;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");animation:grain .9s steps(5) infinite}
.lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:8;overflow:hidden;animation:lb 1.4s cubic-bezier(.7,0,.2,1) .1s forwards}
.lb.t{top:0}.lb.b{bottom:0}
.lb-row{height:48px;display:flex;align-items:center;justify-content:space-between;font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:#9B988F;animation:fadeIn 1s ease 1.2s both}
.hero-in{position:relative;z-index:5;height:760px;display:flex;flex-direction:column;justify-content:center}
@media (max-width:720px){.hero-in{height:700px}}
.hero-h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(34px,6.2vw,92px);line-height:.98;letter-spacing:-.02em;margin:22px 0 24px;max-width:1000px;overflow-wrap:anywhere}
.ln{display:block;overflow:hidden;padding-bottom:.06em}
.ln-in{display:inline-block;animation:lnUp 1.1s cubic-bezier(.2,.8,.1,1) both}
.fade{animation:fadeUp 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes lb{to{height:48px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.12) translate(-22px,-10px)}}
@keyframes drift2{from{transform:scale(1.02)}to{transform:scale(1.09) translate(16px,-8px)}}
@keyframes fog{from{transform:translate(-14px,0)}to{transform:translate(20px,-12px)}}
@keyframes float{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-20px) rotate(2deg)}}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-12px,8px)}50%{transform:translate(10px,-14px)}75%{transform:translate(-6px,12px)}100%{transform:translate(0,0)}}
@keyframes lnUp{from{transform:translateY(108%)}to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:.25}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-14px,-8px)}}
@keyframes loop{to{transform:rotate(360deg)}}
@keyframes tw{0%,100%{opacity:.55}50%{opacity:1}}
/* levels */
.lvls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;margin-bottom:22px}
.lvl{position:relative;display:grid;gap:4px;text-align:left;min-height:84px;padding:16px 20px;border-radius:12px;border:1px solid rgba(239,237,232,.1);background:transparent;color:#EFEDE8;overflow:hidden;transition:border-color .4s,background .4s,transform .4s}
.lvl:hover{transform:translateY(-3px);border-color:rgba(242,181,68,.35)}
.lvl small{font-size:10.5px;letter-spacing:.28em;color:#9B988F;text-transform:uppercase}
.lvl b{font-family:'Syne',sans-serif;font-size:17px;line-height:1.2}
.lvl .xp{position:absolute;left:0;bottom:0;height:3px;background:#F2B544;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.arena{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);border-radius:16px;overflow:hidden;border:1px solid rgba(239,237,232,.08);background:#121218}
@media (max-width:960px){.arena{grid-template-columns:1fr}}
.ar-txt{padding:44px}
@media (max-width:720px){.ar-txt{padding:26px 22px}}
.ar-txt h3{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(26px,2.8vw,38px);line-height:1.05;margin:12px 0 14px;animation:fadeUp .5s both}
.ar-txt p{color:#C9C6BE;animation:fadeUp .5s .05s both}
.ar-pts{display:grid;gap:10px;margin-top:24px}
.ar-pts span{display:flex;align-items:center;gap:12px;font-size:15px;color:#D3D0C8}
.ar-pts span i{width:6px;height:6px;border-radius:50%;background:#F2B544;flex:0 0 auto}
.ar-vis{position:relative;min-height:460px;padding:36px;background:radial-gradient(60% 60% at 50% 50%,rgba(242,181,68,.07),transparent 70%),#0B0B10;display:flex;flex-direction:column;justify-content:center;gap:22px}
@media (max-width:720px){.ar-vis{padding:24px 18px}}
.illus{position:absolute;top:16px;right:18px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#9B988F;border:1px solid rgba(239,237,232,.15);border-radius:999px;padding:5px 10px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:10px}
.gauge svg{width:100%;max-width:380px;height:auto}
.g-val{font-family:'Syne',sans-serif;font-weight:800;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.g-lab{font-size:13px;letter-spacing:.24em;text-transform:uppercase}
.range{width:100%;accent-color:#F2B544;height:44px;cursor:pointer}
.rl{display:flex;justify-content:space-between;font-size:12px;color:#9B988F}
.sys{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(130px,100%),1fr));gap:10px}
.sys button{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:0 16px;border-radius:10px;border:1px solid rgba(239,237,232,.12);background:transparent;color:#C9C6BE;font-size:14.5px;font-weight:500;transition:all .35s}
.sys button i{width:10px;height:10px;border-radius:50%;background:#3A3A44;transition:all .35s}
.budget{height:46px;border-radius:10px;background:#15151C;border:1px solid rgba(239,237,232,.08);display:flex;overflow:hidden}
.budget span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#08080B;transition:width .6s cubic-bezier(.2,.8,.2,1);overflow:hidden;white-space:nowrap}
.loop{display:flex;align-items:center;gap:18px;font-size:14px;color:#9B988F}
.loop svg{animation:loop 3s linear infinite;flex:0 0 auto}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:6px}
.dots i{display:block;height:12px;border-radius:3px;background:#1E1E26;transition:background .4s,box-shadow .4s}
.pl-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px}
.pl-num{font-family:'Syne',sans-serif;font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px}
.stat div{padding:14px 16px;border-radius:10px;background:#15151C;border:1px solid rgba(239,237,232,.07);font-size:13px;color:#9B988F}
.stat b{display:block;font-size:15px;color:#EFEDE8;margin-top:2px}
.shield{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-radius:12px;background:#15151C;border:1px solid rgba(239,237,232,.08)}
.switch{position:relative;width:64px;height:36px;border-radius:999px;border:0;padding:0;transition:background .4s;flex:0 0 auto}
.switch i{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#EFEDE8;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.log{display:grid;gap:6px}
.log div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;min-height:46px;padding:0 14px;border-radius:8px;background:#0F0F14;border:1px solid rgba(239,237,232,.06);font-size:14px;animation:fadeUp .45s both}
.log b{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
/* why */
.why{display:grid;gap:12px}
.why-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);align-items:center;gap:20px;padding:30px 34px;border-radius:14px;border:1px solid rgba(239,237,232,.08);background:#0E0E13;overflow:hidden;transition:border-color .5s,background .5s}
@media (max-width:820px){.why-row{grid-template-columns:1fr;padding:24px 22px}}
.why-row::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(90deg,transparent,rgba(242,181,68,.08),transparent);transition:left 1s cubic-bezier(.2,.8,.2,1)}
.why-row:hover{border-color:rgba(242,181,68,.35);background:#121218}

.why-k{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#9B988F;margin-bottom:6px}
.why-t{font-family:'Syne',sans-serif;font-weight:700;font-size:21px;line-height:1.2}
.why-d{color:#9B988F;font-size:15px;margin-top:6px}
.why-ar{width:56px;height:56px;border-radius:50%;border:1px solid rgba(242,181,68,.4);display:flex;align-items:center;justify-content:center;color:#F2B544;transition:transform .6s cubic-bezier(.2,.8,.2,1),background .5s}
.why-row:hover .why-ar{transform:rotate(360deg);background:rgba(242,181,68,.12)}
@media (max-width:820px){.why-ar{transform:rotate(90deg)}}

.w3{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-radius:18px;overflow:hidden;border:1px solid rgba(239,237,232,.08);background:#121218}

.w3-img{position:relative;min-height:540px;overflow:hidden}
.w3-img img{position:absolute;top:0;left:0;width:100%;height:620px;object-fit:cover;filter:brightness(.7) saturate(.9);animation:kb 18s ease-in-out infinite alternate}
.w3-img .sh{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent 50%,#121218)}
.w3-orb{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;border:1px solid rgba(242,181,68,.6);box-shadow:0 0 80px rgba(242,181,68,.25),inset 0 0 40px rgba(242,181,68,.2);animation:tw 4s ease-in-out infinite}
.w3-orb::before{content:"";position:absolute;top:-16px;left:-16px;right:-16px;bottom:-16px;border-radius:50%;border:1px dashed rgba(239,237,232,.25);animation:loop 30s linear infinite}
.w3-txt{padding:52px 48px}
@media (max-width:720px){.w3-txt{padding:28px 22px}}
.w3-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px;margin-top:28px}
.w3-it{padding:18px;border-radius:12px;background:#0C0C10;border:1px solid rgba(239,237,232,.07);transition:border-color .4s,transform .4s}
.w3-it:hover{border-color:rgba(242,181,68,.4);transform:translateY(-3px)}
.w3-it b{display:block;font-family:'Syne',sans-serif;font-size:16px;margin:10px 0 4px}
.w3-it span{font-size:14px;color:#9B988F}
.w3-it svg{color:#F2B544}
/* cta + footer */
.cta{position:relative;padding:150px 0;overflow:hidden;text-align:center}
.cta-bg{position:absolute;top:-40px;left:-40px;right:-40px;bottom:-40px;background:url(assets/controller-hands.webp) center/cover;filter:sepia(.5) brightness(.3);animation:kb 20s ease-in-out infinite alternate}
.cta-shade{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(70% 70% at 50% 50%,rgba(8,8,11,.3),#08080B)}
.cta-in{position:relative;z-index:2}
.cta h2{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(32px,5.4vw,78px);line-height:1;letter-spacing:-.02em;margin:22px auto 34px;max-width:1040px;overflow-wrap:anywhere}
.ftr{background:#050507;border-top:1px solid rgba(239,237,232,.07);padding:90px 0 36px}
.ftr-word{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(46px,13vw,184px);line-height:.9;letter-spacing:.04em;color:transparent;-webkit-text-stroke:1px rgba(242,181,68,.4);transition:color .8s;margin-bottom:60px;overflow-wrap:anywhere}
.ftr-word:hover{color:rgba(242,181,68,.12)}
.ftr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:36px}
.ftr h4{font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:#9B988F;font-weight:600;margin-bottom:16px}
.ftr-grid a,.ftr-grid p{display:flex;align-items:center;min-height:36px;color:#D3D0C8;font-size:15px;transition:color .3s}
.ftr-grid a:hover{color:#F2B544}
.ftr-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;margin-top:60px;padding-top:26px;border-top:1px solid rgba(239,237,232,.07);font-size:13px;color:#9B988F}
.ftr-bottom a{min-height:44px;display:inline-flex;align-items:center}
.ftr-bottom a:hover{color:#F2B544}
</style>

    </div>
  </div>
</section>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5100},"letterbox":{"editor":"boolean","default":true},"grain":{"editor":"boolean","default":true}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { menu:false, mx:0, my:0, lvl:0, lat:12, sys:[true,true,true,true], plv:40, shield:true };
  }
  val(e){ return e && e.target ? e.target.value : e; }
  move(e){
    const t = e && e.currentTarget;
    if (!t || !t.getBoundingClientRect) return;
    const r = t.getBoundingClientRect();
    if (!r.width || !r.height) return;
    this.setState({ mx: (e.clientX - r.left) / r.width - 0.5, my: (e.clientY - r.top) / r.height - 0.5 });
  }
  fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  renderVals(){
    const s = this.state, pr = this.props || {};
    const tr = (k) => 'transform:translate3d(' + (s.mx * -k).toFixed(1) + 'px,' + (s.my * -k * 0.6).toFixed(1) + 'px,0)';

    const LV = [
      { t:'Performance temps réel', d:'Réponse sub-milliseconde et synchronisation parfaite entre systèmes : dans un jeu, le moindre décalage se voit, se sent, et fait partir le joueur.', pts:['Boucles de calcul optimisées','Synchronisation entre systèmes','Profilage continu des performances'] },
      { t:'Architecture complexe', d:'Graphismes, physique, réseau et saisie tournent en même temps, dans la même boucle. Concevoir pour que tout tienne, sans que rien ne bloque.', pts:['Systèmes découplés','Budget de temps maîtrisé','Gestion d’état complexe'] },
      { t:'Multijoueur évolutif', d:'Des milliers d’utilisateurs simultanés, une cohérence d’état et une latence minimale : la montée en charge comme principe de conception.', pts:['Cohérence d’état partagée','Montée en charge progressive','Latence minimale'] },
      { t:'Sécurité & anti-triche', d:'Une protection avancée qui détecte et bloque les comportements anormaux, sans jamais dégrader l’expérience des joueurs honnêtes.', pts:['Détection des anomalies','Validation côté serveur','Expérience préservée'] }
    ];
    const lvls = LV.map((l, i) => ({ n: i + 1, t: l.t,
      pressed: s.lvl === i ? 'true' : 'false',
      style: s.lvl === i ? 'border-color:rgba(242,181,68,.5);background:#121218' : '',
      xp: 'width:' + (s.lvl === i ? 100 : (i < s.lvl ? 35 : 0)) + '%',
      pick: () => this.setState({ lvl: i }) }));
    const L = LV[s.lvl];

    // jauge de latence
    const lat = Number(s.lat) || 1;
    const zone = lat <= 16 ? ['Fluide', '#F2B544'] : lat <= 50 ? ['Perceptible', '#E8C27A'] : lat <= 100 ? ['Gênant', '#FF9F6B'] : ['Injouable', '#FF7A6B'];
    const frac = Math.min(lat, 200) / 200;

    // architecture
    const SYS = [['Graphismes', 7, '#F2B544'], ['Physique', 3, '#E8C27A'], ['Réseau', 2.5, '#5FD3FF'], ['Saisie', 1, '#EFEDE8']];
    const systems = SYS.map((y, i) => {
      const on = s.sys[i];
      return { t: y[0], pressed: on ? 'true' : 'false',
        style: on ? 'border-color:rgba(242,181,68,.5);color:#EFEDE8;background:#15151C' : '',
        dot: on ? 'background:' + y[2] + ';box-shadow:0 0 10px ' + y[2] : '',
        pick: () => { const n = s.sys.slice(); n[i] = !n[i]; this.setState({ sys: n }); } };
    });
    const used = SYS.reduce((a, y, i) => a + (s.sys[i] ? y[1] : 0), 0);
    const segs = SYS.map((y, i) => ({ t: s.sys[i] ? y[0] : '', style: 'width:' + (s.sys[i] ? (y[1] / 16.7 * 100).toFixed(1) : 0) + '%;background:' + y[2] }));

    // multijoueur
    const plv = Number(s.plv) || 0;
    const players = Math.round(10 * Math.pow(1000, plv / 100));
    const lit = Math.max(1, Math.round(160 * plv / 100));
    const dots = [];
    for (let i = 0; i < 160; i++) dots.push(i < lit ? 'background:#F2B544;box-shadow:0 0 8px rgba(242,181,68,.5)' : '');
    const perDot = this.fmt(Math.max(1, Math.round(players / lit)));

    // anti-triche
    const EV = [['Connexion d’un joueur', false], ['Vitesse de déplacement impossible', true], ['Achat en jeu, signature valide', false], ['Requêtes répétées anormales', true], ['Modification de la mémoire du client', true]];
    const events = EV.map((e, i) => ({ t: e[0], delay: 'animation-delay:' + (i * 0.06).toFixed(2) + 's',
      s: e[1] ? (s.shield ? 'Bloqué' : 'Non détecté') : 'Autorisé',
      c: e[1] ? (s.shield ? 'color:#F2B544' : 'color:#FF7A6B') : 'color:#5FD3FF' }));

    return {
      menuOpen: s.menu,
      menuLabel: s.menu ? 'Fermer le menu' : 'Ouvrir le menu',
      menuExp: s.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !s.menu }),
      onMove: (e) => this.move(e),
      onLeave: () => this.setState({ mx: 0, my: 0 }),
      L0: tr(12), L1: tr(30), L2: tr(54), L3: tr(96),
      grainOn: pr.grain !== false,
      lbOn: pr.letterbox !== false,
      lvls: lvls, lv: { n: s.lvl + 1, t: L.t, d: L.d, pts: L.pts },
      l0: s.lvl === 0, l1: s.lvl === 1, l2: s.lvl === 2, l3: s.lvl === 3,
      lat: lat, setLat: (e) => this.setState({ lat: Number(this.val(e)) }),
      latTxt: lat + ' ms', latLab: zone[0],
      gValStyle: 'color:' + zone[1],
      gArc: 'stroke:' + zone[1] + ';stroke-dashoffset:' + (377 * (1 - frac)).toFixed(1) + ';transition:stroke-dashoffset .3s',
      needle: 'transform-origin:150px 150px;transform:rotate(' + (-90 + frac * 180).toFixed(1) + 'deg);transition:transform .3s',
      systems: systems, segs: segs,
      budTxt: used.toFixed(1).replace('.', ',') + ' ms utilisées sur 16,7',
      budStyle: used > 16.7 ? 'color:#FF7A6B' : 'color:#F2B544',
      plv: plv, setPl: (e) => this.setState({ plv: Number(this.val(e)) }),
      plTxt: this.fmt(players), dots: dots, perDot: perDot,
      cohTxt: 'Synchronisée',
      archTxt: players < 500 ? 'Serveur unique' : (players < 3000 ? 'Instances multiples' : 'Distribuée par régions'),
      shPressed: s.shield ? 'true' : 'false',
      toggleShield: () => this.setState({ shield: !s.shield }),
      shTxt: s.shield ? 'Active : les comportements anormaux sont bloqués' : 'Désactivée : les triches passent inaperçues',
      swStyle: s.shield ? 'background:#F2B544' : 'background:#3A3A44',
      knob: s.shield ? 'transform:translateX(28px);background:#08080B' : '',
      events: events,
      blocked: s.shield ? '3 sur 3' : '0 sur 3'
    };
  }
}
</script>
