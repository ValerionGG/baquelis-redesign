<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nocturne — Contact</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#08080B}
sc-for,sc-if{display:contents}
.nx,.nx *{box-sizing:border-box}
.nx{font-family:'Outfit',system-ui,sans-serif;color:#EFEDE8;background:#08080B;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
.nx a{color:inherit;text-decoration:none}
.nx h1,.nx h2,.nx h3,.nx h4,.nx p{margin:0}
.nx button{font-family:inherit;cursor:pointer}
.nx :focus-visible{outline:2px solid #F2B544;outline-offset:3px;border-radius:6px}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
@media (max-width:720px){.wrap{padding:0 16px}}
.amb{color:#F2B544}
.muted{color:#9B988F}
.hdr{position:sticky;top:0;z-index:50;background:rgba(8,8,11,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(239,237,232,.07)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px}
.logo{display:flex;align-items:center;gap:12px;min-height:44px}
.logo-word{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:.2em;font-size:17px}
.logo .ring{transform-origin:17px 17px;animation:spin 16s linear infinite}
.nav{display:flex;gap:2px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:14.5px;color:#C9C6BE;border-radius:999px;transition:color .3s,background .3s}
.nav a:hover{color:#EFEDE8;background:rgba(239,237,232,.06)}
.nav a[aria-current="page"]{color:#F2B544}
.hdr-cta{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid transparent;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background .35s,color .35s,border-color .35s;white-space:nowrap}
.btn-amber{background:#F2B544;color:#08080B}
.btn-amber:hover{transform:translateY(-2px);box-shadow:0 14px 44px -10px rgba(242,181,68,.6)}
.btn-ghost{border-color:rgba(239,237,232,.24);color:#EFEDE8;background:rgba(8,8,11,.35)}
.btn-ghost:hover{border-color:#F2B544;color:#F2B544}
.btn svg{transition:transform .35s}
.btn:hover svg{transform:translateX(4px)}
.burger{display:none;width:48px;height:48px;border-radius:999px;border:1px solid rgba(239,237,232,.2);background:transparent;color:#EFEDE8;align-items:center;justify-content:center}
@media (max-width:1060px){.nav,.hdr-cta .btn-ghost{display:none}.burger{display:inline-flex}}
@media (max-width:520px){.hdr-cta .btn-amber{display:none}}
.mnav{display:grid;padding:6px 0 22px}
.mnav a{display:flex;align-items:center;min-height:54px;font-family:'Syne',sans-serif;font-weight:700;font-size:22px;border-bottom:1px solid rgba(239,237,232,.08)}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#F2B544;font-weight:600}
.scene{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#9B988F;font-weight:500}
.scene b{color:#F2B544;font-weight:600}
.scene i{display:block;width:56px;height:1px;background:linear-gradient(90deg,#F2B544,transparent)}
.lead{font-size:clamp(17px,1.4vw,19px);color:#C9C6BE;max-width:640px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes lnUp{from{transform:translateY(108%)}to{transform:translateY(0)}}
@keyframes lb{to{height:48px}}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.12) translate(-22px,-10px)}}
@keyframes drift2{from{transform:scale(1.02)}to{transform:scale(1.09) translate(16px,-8px)}}
@keyframes fog{from{transform:translate(-14px,0)}to{transform:translate(20px,-12px)}}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-12px,8px)}50%{transform:translate(10px,-14px)}75%{transform:translate(-6px,12px)}100%{transform:translate(0,0)}}
@keyframes ping{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes clap{0%{transform:rotate(-18deg)}40%{transform:rotate(0)}55%{transform:rotate(-5deg)}70%{transform:rotate(0)}100%{transform:rotate(0)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* hero */
.hero{position:relative;height:540px;overflow:hidden}
.layer{position:absolute;top:-70px;left:-70px;right:-70px;bottom:-70px;transition:transform 1s cubic-bezier(.16,.84,.24,1)}
.ly{position:absolute;top:0;left:0;right:0;bottom:0}
.ly-back{background:url(assets/earth-night.webp) center/cover;filter:sepia(.8) saturate(1.6) hue-rotate(-10deg) brightness(.35);animation:drift 30s ease-in-out infinite alternate}
.ly-mid{left:40%;background:url(assets/office-glass-night.webp) center/cover;filter:brightness(.6) saturate(.9);-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%,#000 85%,transparent);mask-image:linear-gradient(90deg,transparent,#000 40%,#000 85%,transparent);animation:drift2 18s ease-in-out infinite alternate}
.ly-fog{background:radial-gradient(45% 45% at 25% 70%,rgba(242,181,68,.25),transparent 70%),radial-gradient(30% 30% at 75% 30%,rgba(0,174,239,.12),transparent 70%);animation:fog 12s ease-in-out infinite alternate}
.vign{position:absolute;top:0;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(90deg,rgba(8,8,11,.94),rgba(8,8,11,.35) 60%,transparent),linear-gradient(180deg,transparent 50%,#08080B)}
.grain{position:absolute;top:-40px;left:-40px;right:-40px;bottom:-40px;pointer-events:none;z-index:7;opacity:.1;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");animation:grain .9s steps(5) infinite}
.lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:8;overflow:hidden;animation:lb 1.4s cubic-bezier(.7,0,.2,1) .1s forwards}
.lb.t{top:0}.lb.b{bottom:0}
.lb-row{height:48px;display:flex;align-items:center;justify-content:space-between;font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:#9B988F;animation:fadeIn 1s ease 1.2s both}
.hero-in{position:relative;z-index:5;height:540px;display:flex;flex-direction:column;justify-content:center}
.hero-h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(36px,6.4vw,92px);line-height:.98;letter-spacing:-.02em;margin:22px 0 22px;overflow-wrap:anywhere}
.ln{display:block;overflow:hidden;padding-bottom:.06em}
.ln-in{display:inline-block;animation:lnUp 1.1s cubic-bezier(.2,.8,.1,1) both}
.fade{animation:fadeUp 1s cubic-bezier(.2,.8,.2,1) both}
/* layout */
.main{padding:40px 0 130px}
.cols{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:26px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.card{border-radius:18px;background:#121218;border:1px solid rgba(239,237,232,.08);overflow:hidden}
/* clapper */
.clap{position:relative;padding:22px 30px 20px;background:#0C0C10;border-bottom:1px solid rgba(239,237,232,.08)}
.clap-stripes{position:absolute;top:0;left:0;right:0;height:10px;background:repeating-linear-gradient(135deg,#F2B544 0 16px,#08080B 16px 32px);transform-origin:0 100%;animation:clap .8s cubic-bezier(.3,.7,.3,1) .3s both}
.clap-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.clap-row div{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#9B988F}
.clap-row b{display:block;font-family:'Syne',sans-serif;font-size:18px;letter-spacing:.02em;color:#EFEDE8;margin-top:2px;text-transform:none}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:16px}
.prog i{display:block;height:3px;border-radius:2px;background:#26262E;transition:background .5s,box-shadow .5s}
.fbody{padding:34px 30px 30px}
@media (max-width:720px){.fbody,.clap{padding-left:18px;padding-right:18px}}
.fq{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(24px,2.6vw,34px);line-height:1.1;margin:8px 0 22px;animation:fadeUp .5s both}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;animation:fadeUp .5s .05s both}
.opt{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;text-align:left;min-height:80px;padding:14px 16px;border-radius:12px;border:1px solid rgba(239,237,232,.12);background:#0E0E13;color:#EFEDE8;transition:border-color .35s,background .35s,transform .35s}
.opt:hover{transform:translateY(-3px);border-color:rgba(242,181,68,.4)}
.opt-ic{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(239,237,232,.06);color:#9B988F;transition:all .35s}
.opt b{display:block;font-family:'Syne',sans-serif;font-size:16px;line-height:1.2}
.opt small{font-size:13px;color:#9B988F}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:14px;animation:fadeUp .5s both}
.fld{display:grid;gap:6px}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;color:#C9C6BE}
.fld input,.fld textarea{width:100%;min-height:52px;padding:12px 16px;border-radius:10px;border:1px solid rgba(239,237,232,.16);background:#0B0B10;color:#EFEDE8;font-family:inherit;font-size:16px;transition:border-color .3s,box-shadow .3s}
.fld textarea{min-height:110px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;border-color:#F2B544;box-shadow:0 0 0 3px rgba(242,181,68,.18)}
.fld input::placeholder,.fld textarea::placeholder{color:#6E6C66}
.consent{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:#C9C6BE;min-height:44px;padding-top:4px;cursor:pointer}
.consent input{width:22px;height:22px;accent-color:#F2B544;margin-top:1px;flex:0 0 auto}
.err{display:flex;gap:10px;align-items:center;margin-top:18px;padding:12px 16px;border-radius:10px;background:rgba(255,122,107,.08);border:1px solid rgba(255,122,107,.4);color:#FFB4AA;font-size:14.5px;animation:shake .4s both}
.factions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}
.sent{text-align:center;padding:30px 10px 10px;animation:fadeUp .6s both}
.sent-ic{width:84px;height:84px;margin:0 auto 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(242,181,68,.12);border:1px solid rgba(242,181,68,.5);color:#F2B544}
.sent h3{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(26px,3vw,38px);line-height:1.1;margin-bottom:12px}
.recap{display:grid;gap:8px;max-width:440px;margin:24px auto 0;text-align:left}
.recap div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-radius:10px;background:#0E0E13;border:1px solid rgba(239,237,232,.07);font-size:14.5px}
.recap span{color:#9B988F}
.proto{display:inline-flex;align-items:center;gap:8px;min-height:30px;padding:0 12px;border-radius:999px;border:1px solid rgba(242,181,68,.5);color:#F2B544;font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px}
/* side */
.side{display:grid;gap:26px}
.map{position:relative;height:220px;background:linear-gradient(rgba(239,237,232,.04) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(239,237,232,.04) 1px,transparent 1px) 0 0/28px 28px,radial-gradient(60% 80% at 40% 60%,rgba(242,181,68,.1),transparent 70%),#0B0B10;overflow:hidden}
.map svg{position:absolute;top:0;left:0}
.pin{position:absolute;left:58%;top:52%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#F2B544;box-shadow:0 0 18px #F2B544}
.pin::before{content:"";position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50%;border:1px solid #F2B544;animation:ping 2s ease-out infinite}
.pin-lab{position:absolute;left:58%;top:52%;margin:14px 0 0 14px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#EFEDE8}
.info{padding:26px 28px 28px;display:grid;gap:4px}
.info-row{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:center;min-height:58px;border-top:1px solid rgba(239,237,232,.07)}
.info-row:first-child{border-top:0}
.info-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(242,181,68,.3);color:#F2B544}
.info-row small{display:block;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#9B988F}
.rdv{padding:28px}
@media (max-width:720px){.rdv,.info{padding:22px 18px}}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:16px 0}
.day{display:grid;justify-items:center;gap:2px;min-height:64px;padding:8px 2px;border-radius:10px;border:1px solid rgba(239,237,232,.12);background:transparent;color:#EFEDE8;transition:all .3s}
.day:hover{border-color:rgba(242,181,68,.45)}
.day b{font-family:'Syne',sans-serif;font-size:15px}
.day small{font-size:10px;color:#9B988F;letter-spacing:.06em}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.slot{min-height:48px;border-radius:10px;border:1px dashed rgba(239,237,232,.2);background:transparent;color:#C9C6BE;font-size:14px;transition:all .3s}
.slot:hover{border-color:#F2B544;color:#F2B544}
.rdv-sum{margin-top:16px;padding:14px 16px;border-radius:10px;background:#0E0E13;border:1px solid rgba(239,237,232,.07);font-size:14px;color:#C9C6BE;animation:fadeUp .4s both}
/* footer */
.ftr{background:#050507;border-top:1px solid rgba(239,237,232,.07);padding:90px 0 36px}
.ftr-word{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(46px,13vw,184px);line-height:.9;letter-spacing:.04em;color:transparent;-webkit-text-stroke:1px rgba(242,181,68,.4);transition:color .8s;margin-bottom:60px;overflow-wrap:anywhere}
.ftr-word:hover{color:rgba(242,181,68,.12)}
.ftr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:36px}
.ftr h4{font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:#9B988F;font-weight:600;margin-bottom:16px}
.ftr-grid a,.ftr-grid p{display:flex;align-items:center;min-height:36px;color:#D3D0C8;font-size:15px;transition:color .3s}
.ftr-grid a:hover{color:#F2B544}
.ftr-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;margin-top:60px;padding-top:26px;border-top:1px solid rgba(239,237,232,.07);font-size:13px;color:#9B988F}
.ftr-bottom a{min-height:44px;display:inline-flex;align-items:center}
.ftr-bottom a:hover{color:#F2B544}
</style>
</helmet>
<div class="nx">

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="Nocturne-Accueil.html" aria-label="Baquelis, retour à l’accueil">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle class="ring" cx="17" cy="17" r="15.5" fill="none" stroke="#F2B544" stroke-width="1.4" stroke-dasharray="70 28"></circle><path d="M12.5 9.5h5.6a3.9 3.9 0 0 1 0 7.8h-5.6zM12.5 17.3h6.6a4.6 4.6 0 0 1 0 9.2h-6.6z" fill="none" stroke="#EFEDE8" stroke-width="1.8"></path><circle cx="26" cy="8" r="2" fill="#F2B544"></circle></svg>
      <span class="logo-word">BAQUELIS</span>
    </a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="Nocturne-Expertises.html">Expertises</a>
      <a href="Nocturne-IA.html">IA</a>
      <a href="Nocturne-Jeux.html">Jeux &amp; Web3</a>
      <a href="Nocturne-Offres.html">Offres</a>
      <a href="Nocturne-Contact.html" aria-current="page">Contact</a>
    </nav>
    <div class="hdr-cta">
      <a class="btn btn-ghost" href="Nocturne-Offres.html">Voir les offres</a>
      <a class="btn btn-amber" href="Nocturne-Contact.html">Commencer</a>
      <button class="burger" type="button" aria-label="{{ menuLabel }}" aria-expanded="{{ menuExp }}" onClick="{{ toggleMenu }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8h16M4 16h16"></path></svg></button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div class="wrap">
      <nav class="mnav" aria-label="Navigation mobile">
        <a href="Nocturne-Expertises.html">Expertises</a>
        <a href="Nocturne-IA.html">IA</a>
        <a href="Nocturne-Jeux.html">Jeux &amp; Web3</a>
        <a href="Nocturne-Offres.html">Offres</a>
        <a href="Nocturne-Contact.html" style="color:#F2B544">Contact</a>
      </nav>
    </div>
  </sc-if>
</header>

<main>
<section class="hero" onMouseMove="{{ onMove }}" onMouseLeave="{{ onLeave }}" aria-label="Contact">
  <div class="layer" style="{{ L0 }}"><div class="ly ly-back"></div></div>
  <div class="layer" style="{{ L1 }}"><div class="ly ly-mid"></div></div>
  <div class="layer" style="{{ L2 }}"><div class="ly ly-fog"></div></div>
  <div class="vign" aria-hidden="true"></div>
  <sc-if value="{{ grainOn }}" hint-placeholder-val="{{ true }}"><div class="grain" aria-hidden="true"></div></sc-if>
  <div class="wrap hero-in">
    <div class="scene fade" style="animation-delay:.9s"><b>Acte VI</b><i></i>Contact</div>
    <h1 class="hero-h1">
      <span class="ln"><span class="ln-in" style="animation-delay:1.1s">Dernière scène :</span></span>
      <span class="ln"><span class="ln-in amb" style="animation-delay:1.35s">la vôtre.</span></span>
    </h1>
    <p class="lead fade" style="animation-delay:1.7s">Quatre plans suffisent pour nous présenter votre projet. Nous revenons vers vous pour un appel découverte.</p>
  </div>
  <sc-if value="{{ lbOn }}" hint-placeholder-val="{{ true }}">
    <div class="lb t"><div class="wrap lb-row"><span>Acte VI · Contact</span><span>Nice</span></div></div>
    <div class="lb b"><div class="wrap lb-row"><span>4 plans · 1 appel</span><span>Silence, on tourne</span></div></div>
  </sc-if>
</section>

<section class="main">
  <div class="wrap cols">
    <!-- FORMULAIRE -->
    <div class="card">
      <div class="clap">
        <div class="clap-stripes" aria-hidden="true"></div>
        <div class="clap-row">
          <div>Production<b>Baquelis</b></div>
          <div>Plan<b>{{ planTxt }}</b></div>
          <div>Prise<b>01</b></div>
        </div>
        <div class="prog" aria-hidden="true"><sc-for list="{{ prog }}" as="g" hint-placeholder-count="4"><i style="{{ g }}"></i></sc-for></div>
      </div>
      <form class="fbody" onSubmit="{{ submit }}" novalidate="novalidate">
        <sc-if value="{{ s0 }}" hint-placeholder-val="{{ true }}">
          <div class="eyebrow">Plan 1 · Votre besoin</div>
          <h2 class="fq">De quoi avez-vous besoin ?</h2>
          <div class="opts" role="radiogroup" aria-label="Besoin">
            <sc-for list="{{ needs }}" as="o" hint-placeholder-count="4">
              <button class="opt" type="button" role="radio" aria-checked="{{ o.pressed }}" onClick="{{ o.pick }}" style="{{ o.style }}">
                <span class="opt-ic" style="{{ o.ic }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ o.path }}"></path></svg></span>
                <span><b>{{ o.t }}</b><small>{{ o.s }}</small></span>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ s1 }}" hint-placeholder-val="{{ false }}">
          <div class="eyebrow">Plan 2 · Formule envisagée</div>
          <h2 class="fq">Quelle formule vous attire ?</h2>
          <div class="opts" role="radiogroup" aria-label="Formule">
            <sc-for list="{{ plans }}" as="o" hint-placeholder-count="4">
              <button class="opt" type="button" role="radio" aria-checked="{{ o.pressed }}" onClick="{{ o.pick }}" style="{{ o.style }}">
                <span class="opt-ic" style="{{ o.ic }}">{{ o.k }}</span>
                <span><b>{{ o.t }}</b><small>{{ o.s }}</small></span>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ s2 }}" hint-placeholder-val="{{ false }}">
          <div class="eyebrow">Plan 3 · Votre entreprise</div>
          <h2 class="fq">Quelle est la taille de votre entreprise ?</h2>
          <div class="opts" role="radiogroup" aria-label="Taille d’entreprise">
            <sc-for list="{{ sizes }}" as="o" hint-placeholder-count="4">
              <button class="opt" type="button" role="radio" aria-checked="{{ o.pressed }}" onClick="{{ o.pick }}" style="{{ o.style }}">
                <span class="opt-ic" style="{{ o.ic }}">{{ o.k }}</span>
                <span><b>{{ o.t }}</b><small>{{ o.s }}</small></span>
              </button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ s3 }}" hint-placeholder-val="{{ false }}">
          <div class="eyebrow">Plan 4 · Vos coordonnées</div>
          <h2 class="fq">Comment vous joindre ?</h2>
          <div class="fields">
            <div class="fld"><label for="c-name">Nom complet *</label><input id="c-name" type="text" autocomplete="name" placeholder="Prénom Nom" value="{{ name }}" onInput="{{ setName }}" style="{{ nameErr }}"></div>
            <div class="fld"><label for="c-co">Entreprise *</label><input id="c-co" type="text" autocomplete="organization" placeholder="Nom de l’entreprise" value="{{ company }}" onInput="{{ setCompany }}" style="{{ coErr }}"></div>
            <div class="fld"><label for="c-mail">E-mail professionnel *</label><input id="c-mail" type="email" autocomplete="email" placeholder="vous@entreprise.fr" value="{{ email }}" onInput="{{ setEmail }}" style="{{ mailErr }}"></div>
            <div class="fld"><label for="c-tel">Téléphone (facultatif)</label><input id="c-tel" type="tel" autocomplete="tel" placeholder="+33" value="{{ phone }}" onInput="{{ setPhone }}"></div>
            <div class="fld full"><label for="c-msg">Votre projet en quelques lignes (facultatif)</label><textarea id="c-msg" placeholder="Contexte, objectifs, échéances…" value="{{ msg }}" onInput="{{ setMsg }}"></textarea></div>
            <label class="consent fld full"><input type="checkbox" checked="{{ consent }}" onChange="{{ toggleConsent }}"><span>J’accepte d’être recontacté·e au sujet de ma demande. *</span></label>
          </div>
        </sc-if>
        <sc-if value="{{ sent }}" hint-placeholder-val="{{ false }}">
          <div class="sent" role="status">
            <div class="sent-ic"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div>
            <span class="proto">Prototype — rien n’est envoyé</span>
            <h3>C’est dans la boîte, {{ firstName }}.</h3>
            <p class="muted">Dans la version en ligne, l’équipe Baquelis vous recontacterait pour un appel découverte. Ici, aucune donnée n’a quitté votre navigateur.</p>
            <div class="recap">
              <div><span>Besoin</span><b>{{ needTxt }}</b></div>
              <div><span>Formule</span><b>{{ planTxt2 }}</b></div>
              <div><span>Taille</span><b>{{ sizeTxt }}</b></div>
              <div><span>E-mail</span><b>{{ email }}</b></div>
            </div>
            <button class="btn btn-ghost" type="button" onClick="{{ reset }}" style="margin-top:24px">Nouvelle prise</button>
          </div>
        </sc-if>

        <sc-if value="{{ hasErr }}" hint-placeholder-val="{{ false }}">
          <div class="err" role="alert"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>{{ err }}</div>
        </sc-if>

        <sc-if value="{{ notSent }}" hint-placeholder-val="{{ true }}">
          <div class="factions">
            <button class="btn btn-ghost" type="button" onClick="{{ back }}" style="{{ backStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Retour</button>
            <sc-if value="{{ notLast }}" hint-placeholder-val="{{ true }}"><button class="btn btn-amber" type="button" onClick="{{ next }}">Plan suivant <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></sc-if>
            <sc-if value="{{ isLast }}" hint-placeholder-val="{{ false }}"><button class="btn btn-amber" type="submit">Envoyer (prototype) <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button></sc-if>
          </div>
        </sc-if>
      </form>
    </div>

    <!-- INFOS + RDV -->
    <div class="side">
      <div class="card">
        <div class="map" aria-hidden="true">
          <svg width="600" height="220" viewBox="0 0 600 220"><path d="M0 150C80 140 120 170 200 160S330 120 380 128 470 170 600 150" fill="none" stroke="rgba(0,174,239,.35)" stroke-width="1.2"></path><path d="M0 170C90 160 140 190 230 180S360 140 420 150 520 190 600 172" fill="none" stroke="rgba(0,174,239,.18)" stroke-width="1"></path></svg>
          <span class="pin"></span><span class="pin-lab">Nice</span>
        </div>
        <div class="info">
          <div class="info-row"><span class="info-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg></span><div><small>Siège</small>31 B avenue Maréchal Foch, 06000 Nice</div></div>
          <div class="info-row"><span class="info-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></span><div><small>E-mail</small>[contact@domaine-baquelis]</div></div>
          <div class="info-row"><span class="info-ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16"></path><path d="M9 7h6M9 11h6M9 15h6"></path></svg></span><div><small>Société</small>[RAISON SOCIALE] · [N° TVA]</div></div>
        </div>
      </div>
      <div class="card rdv">
        <div class="eyebrow">Prise de rendez-vous · illustrative</div>
        <p style="font-family:'Syne',sans-serif;font-weight:700;font-size:22px;margin-top:10px">Réservez votre appel découverte</p>
        <div class="days" role="radiogroup" aria-label="Jour">
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="5">
            <button class="day" type="button" role="radio" aria-checked="{{ d.pressed }}" onClick="{{ d.pick }}" style="{{ d.style }}"><b>{{ d.t }}</b><small>[DATE]</small></button>
          </sc-for>
        </div>
        <div class="slots" role="radiogroup" aria-label="Créneau">
          <sc-for list="{{ slots }}" as="c" hint-placeholder-count="4">
            <button class="slot" type="button" role="radio" aria-checked="{{ c.pressed }}" onClick="{{ c.pick }}" style="{{ c.style }}">{{ c.t }}</button>
          </sc-for>
        </div>
        <sc-if value="{{ hasRdv }}" hint-placeholder-val="{{ false }}">
          <div class="rdv-sum">{{ rdvTxt }}</div>
          <button class="btn btn-amber" type="button" onClick="{{ confirmRdv }}" style="width:100%;margin-top:12px">{{ rdvBtn }}</button>
        </sc-if>
        <p class="muted" style="font-size:12.5px;margin-top:14px">Démonstration : les créneaux réels seront connectés à l’agenda de l’équipe. [CRÉNEAUX]</p>
      </div>
    </div>
  </div>
</section>
</main>

<footer class="ftr">
  <div class="wrap">
    <div class="ftr-word" aria-hidden="true">BAQUELIS</div>
    <div class="ftr-grid">
      <div><h4>Baquelis</h4><p>Flexibilité. Continuité. Performance.</p><p class="muted">Excellence IA par la technologie.</p></div>
      <div><h4>Explorer</h4><a href="Nocturne-Expertises.html">Expertises</a><a href="Nocturne-IA.html">Intelligence artificielle</a><a href="Nocturne-Jeux.html">Jeux &amp; Web3</a><a href="Nocturne-Contact.html">Contact</a></div>
      <div><h4>Formules</h4><a href="Nocturne-Offres.html">Intégration · 4 500 €/mois</a><a href="Nocturne-Offres.html">Flex · 6 200 €/mois</a><a href="Nocturne-Offres.html">Performance · 18 900 €/mois</a></div>
      <div><h4>Siège</h4><p>31 B avenue Maréchal Foch</p><p>06000 Nice</p><p>[contact@domaine-baquelis]</p></div>
    </div>
    <div class="ftr-bottom">
      <span>© 2026 Baquelis · [RAISON SOCIALE] · [N° TVA]</span>
      <a href="index.html">Toutes les propositions</a>
      <span>Proposition de refonte — concept</span>
    </div>
  </div>
</footer>

</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2450},"letterbox":{"editor":"boolean","default":true},"grain":{"editor":"boolean","default":true}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { menu:false, mx:0, my:0, step:0, need:'', plan:'', size:'', name:'', company:'', email:'', phone:'', msg:'', consent:false, tried:false, err:'', sent:false, day:-1, slot:-1, rdvOk:false };
  }
  val(e){ return e && e.target ? e.target.value : e; }
  move(e){
    const t = e && e.currentTarget;
    if (!t || !t.getBoundingClientRect) return;
    const r = t.getBoundingClientRect();
    if (!r.width || !r.height) return;
    this.setState({ mx: (e.clientX - r.left) / r.width - 0.5, my: (e.clientY - r.top) / r.height - 0.5 });
  }
  mailOk(m){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(m || '').trim()); }
  validate(step){
    const s = this.state;
    if (step === 0 && !s.need) return 'Choisissez votre besoin pour passer au plan suivant.';
    if (step === 1 && !s.plan) return 'Choisissez une formule (ou « Je ne sais pas encore »).';
    if (step === 2 && !s.size) return 'Indiquez la taille de votre entreprise.';
    if (step === 3) {
      if (!s.name.trim()) return 'Indiquez votre nom.';
      if (!s.company.trim()) return 'Indiquez le nom de votre entreprise.';
      if (!this.mailOk(s.email)) return 'Saisissez une adresse e-mail valide.';
      if (!s.consent) return 'Merci d’accepter d’être recontacté·e.';
    }
    return '';
  }
  next(){
    const err = this.validate(this.state.step);
    if (err) { this.setState({ err: err }); return; }
    this.setState({ step: Math.min(3, this.state.step + 1), err: '' });
  }
  submit(e){
    if (e && e.preventDefault) e.preventDefault();
    if (this.state.step !== 3) { this.next(); return; }
    const err = this.validate(3);
    if (err) { this.setState({ err: err, tried: true }); return; }
    this.setState({ sent: true, err: '' });
  }
  renderVals(){
    const s = this.state, pr = this.props || {};
    const tr = (k) => 'transform:translate3d(' + (s.mx * -k).toFixed(1) + 'px,' + (s.my * -k * 0.6).toFixed(1) + 'px,0)';
    const ON = 'border-color:#F2B544;background:rgba(242,181,68,.09)';
    const ICON_ON = 'background:#F2B544;color:#08080B';
    const opt = (list, key) => list.map(o => ({ t: o.t, s: o.s, k: o.k || '', path: o.path || '',
      pressed: s[key] === o.t ? 'true' : 'false',
      style: s[key] === o.t ? ON : '',
      ic: s[key] === o.t ? ICON_ON + ';font-family:Syne,sans-serif;font-weight:800' : 'font-family:Syne,sans-serif;font-weight:800',
      pick: () => { const u = { err: '' }; u[key] = o.t; this.setState(u); } }));

    const NEEDS = [
      { t:'Une équipe technique', s:'Profil dédié ou équipe d’experts', path:'M8 9a3 3 0 1 0 0-.01M16.5 9a3 3 0 1 0 0-.01M2.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M13 15.2c1-.5 2.1-.7 3.5-.7 2.5 0 4.7 1.5 5.5 4.5' },
      { t:'Intelligence artificielle', s:'Modèles affinés, agents, intégration', path:'M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8' },
      { t:'Jeux & Web3', s:'Temps réel, multijoueur, plateforme', path:'M6 11h4M8 9v4M15 12h.01M18 10h.01M17.3 5H6.7a4 4 0 0 0-4 3.6L2 15a3 3 0 0 0 5.2 2.1L9 15h6l1.8 2.1A3 3 0 0 0 22 15l-.7-6.4A4 4 0 0 0 17.3 5z' },
      { t:'Autre besoin', s:'Parlons-en librement', path:'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z' }
    ];
    const PLANS = [
      { t:'Intégration', s:'4 500 €/mois · 1 profil dédié', k:'I' },
      { t:'Flex', s:'6 200 €/mois · plus populaire', k:'II' },
      { t:'Performance', s:'18 900 €/mois · équipe de 5', k:'III' },
      { t:'Je ne sais pas encore', s:'Nous vous conseillerons', k:'?' }
    ];
    const SIZES = [
      { t:'Startup', s:'Jeune entreprise en croissance', k:'S' },
      { t:'PME', s:'Petite ou moyenne entreprise', k:'M' },
      { t:'ETI', s:'Entreprise de taille intermédiaire', k:'L' },
      { t:'Grande entreprise', s:'Groupe ou grand compte', k:'XL' }
    ];
    const bad = 'border-color:#FF7A6B';
    const DAYS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven'];
    const DAYS_FULL = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi'];
    const SLOTS = ['[CRÉNEAU 1]', '[CRÉNEAU 2]', '[CRÉNEAU 3]', '[CRÉNEAU 4]'];

    return {
      menuOpen: s.menu,
      menuLabel: s.menu ? 'Fermer le menu' : 'Ouvrir le menu',
      menuExp: s.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !s.menu }),
      onMove: (e) => this.move(e),
      onLeave: () => this.setState({ mx: 0, my: 0 }),
      L0: tr(14), L1: tr(34), L2: tr(60),
      grainOn: pr.grain !== false,
      lbOn: pr.letterbox !== false,
      planTxt: s.sent ? 'Fin' : '0' + (s.step + 1) + ' / 04',
      prog: [0, 1, 2, 3].map(i => (s.sent || i <= s.step) ? 'background:#F2B544;box-shadow:0 0 10px rgba(242,181,68,.5)' : ''),
      s0: !s.sent && s.step === 0, s1: !s.sent && s.step === 1, s2: !s.sent && s.step === 2, s3: !s.sent && s.step === 3,
      sent: s.sent, notSent: !s.sent,
      needs: opt(NEEDS, 'need'), plans: opt(PLANS, 'plan'), sizes: opt(SIZES, 'size'),
      name: s.name, company: s.company, email: s.email, phone: s.phone, msg: s.msg, consent: s.consent,
      setName: (e) => this.setState({ name: this.val(e) }),
      setCompany: (e) => this.setState({ company: this.val(e) }),
      setEmail: (e) => this.setState({ email: this.val(e) }),
      setPhone: (e) => this.setState({ phone: this.val(e) }),
      setMsg: (e) => this.setState({ msg: this.val(e) }),
      toggleConsent: (e) => this.setState({ consent: e && e.target ? !!e.target.checked : !s.consent }),
      nameErr: s.tried && !s.name.trim() ? bad : '',
      coErr: s.tried && !s.company.trim() ? bad : '',
      mailErr: s.tried && !this.mailOk(s.email) ? bad : '',
      hasErr: !!s.err, err: s.err,
      back: () => this.setState({ step: Math.max(0, s.step - 1), err: '' }),
      backStyle: s.step === 0 ? 'visibility:hidden' : '',
      next: () => this.next(),
      submit: (e) => this.submit(e),
      notLast: s.step < 3, isLast: s.step === 3,
      firstName: (s.name.trim().split(' ')[0]) || 'merci',
      needTxt: s.need || '—', planTxt2: s.plan || '—', sizeTxt: s.size || '—',
      reset: () => this.setState({ step:0, need:'', plan:'', size:'', name:'', company:'', email:'', phone:'', msg:'', consent:false, tried:false, err:'', sent:false }),
      days: DAYS.map((d, i) => ({ t: d, pressed: s.day === i ? 'true' : 'false', style: s.day === i ? 'border-color:#F2B544;background:#F2B544;color:#08080B' : '', pick: () => this.setState({ day: i, rdvOk: false }) })),
      slots: SLOTS.map((c, i) => ({ t: c, pressed: s.slot === i ? 'true' : 'false', style: s.slot === i ? 'border-style:solid;border-color:#F2B544;color:#F2B544;background:rgba(242,181,68,.08)' : '', pick: () => this.setState({ slot: i, rdvOk: false }) })),
      hasRdv: s.day > -1 && s.slot > -1,
      rdvTxt: s.day > -1 && s.slot > -1 ? (s.rdvOk ? 'Créneau retenu (démonstration) : ' : 'Appel découverte proposé : ') + DAYS_FULL[s.day] + ' [DATE] · ' + SLOTS[s.slot] + ' — rien n’est réservé.' : '',
      rdvBtn: s.rdvOk ? 'Créneau retenu ✓ (démo)' : 'Retenir ce créneau (démo)',
      confirmRdv: () => this.setState({ rdvOk: !s.rdvOk })
    };
  }
}
</script>
</body>
