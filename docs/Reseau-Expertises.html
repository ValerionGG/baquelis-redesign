<style>
body{margin:0}
sc-for,sc-if{display:contents}
*{box-sizing:border-box}
.rx{background:#060B18;color:#E6ECF7;font-family:'Space Grotesk',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative}
.rx a{color:inherit}

.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.wrap{max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,40px);position:relative}
.gridbg{background-image:linear-gradient(rgba(23,34,61,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(23,34,61,.55) 1px,transparent 1px);background-size:56px 56px}
.strip{border-bottom:1px solid #17223D;font-size:12px;color:#8E9BB5;background:#050915}

.strip a{color:#00AEEF;text-decoration:none;padding:8px 0}
.strip a:hover{text-decoration:underline}
.hdr{position:sticky;top:0;z-index:50;background:rgba(6,11,24,.88);backdrop-filter:blur(14px);border-bottom:1px solid #17223D}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:24px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:22px;letter-spacing:-.02em;min-height:44px}
.logo-pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.nav{display:flex;gap:2px}
.nav a{padding:12px 14px;border-radius:8px;text-decoration:none;color:#8E9BB5;font-size:15px;font-weight:500;transition:color .2s,background .2s}
.nav a:hover,.nav a.on{color:#E6ECF7;background:#0C1428}
.nav a.on{box-shadow:inset 0 -2px 0 #3DFFA2}
.hdr-cta{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:10px;background:#3DFFA2;color:#060B18;font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit;font-size:16px;transition:transform .2s,box-shadow .25s,border-color .2s,background .2s}
.rx a.btn{color:#060B18}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 4px rgba(61,255,162,.16),0 14px 34px -12px rgba(61,255,162,.6)}
.btn-ghost,.rx a.btn-ghost{background:transparent;color:#E6ECF7;border:1px solid #2A3A60}
.btn-ghost:hover{border-color:#00AEEF;box-shadow:0 0 0 4px rgba(0,174,239,.14)}
.btn-sm{min-height:44px;padding:0 16px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.menu-btn{display:none;width:44px;height:44px;border-radius:10px;border:1px solid #2A3A60;background:#0C1428;color:#E6ECF7;cursor:pointer;align-items:center;justify-content:center}
.mnav{display:flex;flex-direction:column;padding:6px clamp(16px,4vw,40px) 16px;border-top:1px solid #17223D}
.mnav a{padding:14px 4px;border-bottom:1px solid #17223D;text-decoration:none;font-weight:500}
@media(max-width:900px){.nav{display:none}.menu-btn{display:inline-flex}.hdr-cta .btn{display:none}}
@media(min-width:901px){.mnav{display:none}}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:#8E9BB5}
.dot{width:8px;height:8px;border-radius:50%;background:#3DFFA2;animation:ping 1.8s infinite;flex:none}
.h1{font-size:clamp(40px,5.2vw,74px);line-height:1;letter-spacing:-.04em;font-weight:700;margin:22px 0 0;overflow-wrap:anywhere}
.h2{font-size:clamp(32px,4.2vw,56px);line-height:1.04;letter-spacing:-.03em;font-weight:600;margin:16px 0 0;overflow-wrap:anywhere}
.lead{color:#8E9BB5;font-size:clamp(17px,1.4vw,19px);max-width:640px;margin-top:18px}
.sec{padding:clamp(72px,9vw,128px) 0;position:relative}
.card{background:#0C1428;border:1px solid #17223D;border-radius:16px;transition:border-color .25s,transform .25s,box-shadow .25s}
.lift:hover{transform:translateY(-4px);border-color:#00AEEF;box-shadow:0 22px 50px -26px rgba(0,174,239,.6)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;border:1px solid #2A3A60;color:#8E9BB5;white-space:nowrap}
.illu{color:#FFB020;border-color:rgba(255,176,32,.45)}
.kpi{padding:16px;border-radius:12px;background:#060B18;border:1px solid #17223D}
.kpi-l{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#8E9BB5;font-family:'JetBrains Mono',monospace}
.bar{height:8px;border-radius:99px;background:#17223D;overflow:hidden}
.bar i{display:block;height:8px;border-radius:99px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.ftr{border-top:1px solid #17223D;background:#050915;padding:72px 0 28px;font-size:15px}
.ftr-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:40px}
.ftr h4{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8E9BB5;font-weight:500;margin:0 0 12px}
.ftr-l a{display:flex;align-items:center;min-height:40px;color:#E6ECF7;text-decoration:none;transition:color .2s}
.ftr-l a:hover{color:#3DFFA2}
.ftr-b{margin-top:56px;padding-top:22px;border-top:1px solid #17223D;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#8E9BB5;font-size:13px}
.rv{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}.d4{animation-delay:.4s}
:focus-visible{outline:2px solid #00AEEF;outline-offset:3px}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(61,255,162,.55)}70%{box-shadow:0 0 0 10px rgba(61,255,162,0)}100%{box-shadow:0 0 0 0 rgba(61,255,162,0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pk{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* page */
.hero{padding:clamp(48px,7vw,96px) 0 clamp(56px,7vw,96px)}
.hero-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:center}

.arch{border:1px solid #17223D;border-radius:22px;background:#0A1122;padding:18px}
.arch svg{width:100%;height:auto;display:block}
.layer{transition:opacity .3s;cursor:default}
.layer rect.lb{transition:stroke .3s,fill .3s}
.layer:hover rect.lb{stroke:#3DFFA2;fill:#0F1A33}
.pk{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:4 96;animation:pk 2.2s linear infinite}
.lt{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;fill:#8E9BB5}
.lt2{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;fill:#E6ECF7}
.acc{display:flex;flex-direction:column;gap:12px;margin-top:48px}
.acc-h{width:100%;display:grid;grid-template-columns:64px minmax(0,1fr) 44px;align-items:center;gap:16px;min-height:88px;padding:16px 24px;background:transparent;border:0;color:#E6ECF7;font-family:inherit;text-align:left;cursor:pointer}
.acc-h .mono{font-size:13px;color:#8E9BB5}
.acc-t{font-size:clamp(20px,2.2vw,28px);font-weight:600;letter-spacing:-.02em}
.acc-i{width:44px;height:44px;border-radius:50%;border:1px solid #2A3A60;display:flex;align-items:center;justify-content:center;transition:transform .3s,border-color .3s}
.acc-b{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:28px;padding:0 24px 28px;animation:fadeIn .5s both}
@media(max-width:860px){.acc-b{grid-template-columns:minmax(0,1fr)}.acc-h{grid-template-columns:44px minmax(0,1fr) 44px;padding:14px 16px}.acc-b{padding:0 16px 22px}}
.acc-q{font-size:clamp(19px,1.8vw,24px);line-height:1.35;color:#E6ECF7;font-weight:500}
.acc-l{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:10px;margin-top:22px}
.acc-l div{padding:14px 16px;border-radius:10px;background:#060B18;border:1px solid #17223D;font-size:15px}
.acc-l b{display:block;font-weight:600;margin-bottom:2px}
.acc-l span{color:#8E9BB5;font-size:14px}
.acc-img{position:relative;border-radius:12px;overflow:hidden;border:1px solid #17223D}
.acc-img img{width:100%;height:280px;object-fit:cover;display:block;filter:saturate(.85)}
.acc-img .mono{position:absolute;left:12px;top:12px;background:rgba(6,11,24,.85);border:1px solid #2A3A60;border-radius:6px;padding:4px 8px;font-size:11px}
.dom-g{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;margin-top:48px;align-items:start}
@media(max-width:960px){.dom-g{grid-template-columns:minmax(0,1fr)}}
.hub{padding:18px}
.hub svg{width:100%;height:auto;display:block;max-width:420px;margin:0 auto}
.hn{cursor:pointer}
.hn circle{transition:fill .3s,stroke .3s}
.he{stroke-width:2;transition:stroke .3s,opacity .3s}
.dl{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.dbtn{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid #17223D;background:#060B18;color:#E6ECF7;font-family:inherit;font-size:14.5px;cursor:pointer;transition:border-color .2s,color .2s}
.dbtn:hover{border-color:#00AEEF}
.dpanel{padding:clamp(24px,3vw,36px);animation:fadeIn .45s both}
.dlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;margin-top:22px}
.dlist div{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1px solid #17223D;border-radius:10px;background:#060B18;font-size:15px}
.dot-s{width:6px;height:6px;border-radius:50%;background:#3DFFA2;flex:none;box-shadow:0 0 8px #3DFFA2}
.met{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px;margin-top:48px}
@media(max-width:860px){.met{grid-template-columns:minmax(0,1fr)}}
.ml{display:flex;flex-direction:column;gap:6px;position:relative}
.mbtn{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 14px;border-radius:12px;border:1px solid transparent;background:transparent;color:#E6ECF7;font-family:inherit;font-size:16px;font-weight:500;text-align:left;cursor:pointer;transition:background .2s,border-color .2s}
.mbtn:hover{background:#0C1428}
.mn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:13px;border:2px solid;flex:none;transition:all .3s}
.mpanel{padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;gap:22px;animation:fadeIn .45s both}
.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.eng{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr));gap:16px;margin-top:48px}
.engc{width:100%;text-align:left;padding:26px;font-family:inherit;color:#E6ECF7;cursor:pointer;display:flex;flex-direction:column;gap:14px;min-height:280px}
.engt{display:block;font-size:22px;font-weight:600;letter-spacing:-.01em}
.engd{display:block;color:#8E9BB5;font-size:15.5px}
.more{display:block}
.hs{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#8E9BB5}
.hs svg{flex:none}
.more{font-size:15px;color:#E6ECF7;padding-top:14px;border-top:1px solid #17223D;animation:fadeIn .4s both}
.cta-bg{background:linear-gradient(90deg,rgba(6,11,24,.97) 35%,rgba(6,11,24,.6)),url(assets/office-glass-night.webp) center/cover;border-radius:24px;border:1px solid #17223D;padding:clamp(40px,6vw,88px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":6400},"accent":{"editor":"color","default":"#3DFFA2","options":["#3DFFA2","#00AEEF","#FFB020"]}}'>

    const s = this.state;

      { n: '04', t: 'Transparence radicale', q: 'Pas de coûts cachés ni de mises à jour vagues : des progrès visibles en temps réel.', img: 'assets/meeting-room.webp', alt: 'Salle de réunion lumineuse',

    ];
    const acc = P.map((p, i) => {
      const open = s.open === i;
      return {
        n: p.n, t: p.t, q: p.q, img: p.img, alt: p.alt, open: open, exp: open ? 'true' : 'false',
        items: p.i.map(x => ({ t: x[0], d: x[1] })),
        card: open ? 'border-color:' + A + ';box-shadow:0 30px 80px -50px ' + A : '',
        icon: open ? 'transform:rotate(180deg);border-color:' + A + ';color:' + A : '',
        toggle: () => this.setState({ open: open ? -1 : i })
      };
    });

    const D = [
      { t: 'Applications web & mobiles', d: 'Des interfaces rapides et fiables, conçues pour évoluer avec vos utilisateurs et vos usages.', pil: 'RAPIDITÉ AVEC PRÉCISION', i: ['Prototypage rapide', 'Architecture front & back', 'Assurance qualité', 'Intégration continue'] },
      { t: 'Plateformes temps réel', d: 'Synchronisation, état partagé, tableaux de bord vivants : des systèmes qui réagissent instantanément à ce qui se passe.', pil: 'SOLUTIONS ÉPROUVÉES', i: ['Gestion d’état complexe', 'Synchronisation entre systèmes', 'Suivi en temps réel', 'Montée en charge'] },

    ];
    const hub = {};
    D.forEach((d, i) => {
      const on = i === s.dom;

    const doms = D.map((d, i) => ({

    ];
    const msteps = M.map((m, i) => ({

    const cm = M[s.step];
    const pct = (s.step + 1) * 20;

      n: '0' + (s.step + 1), t: cm.t, d: cm.d, out: cm.out, delai: cm.delai,

      prevSt: s.step === 0 ? 'opacity:.4' : '',
      nextSt: 'background:' + A + (s.step === 4 ? ';opacity:.4' : ''), anim: 'animation-name:' + (s.step % 2 ? 'fadeIn' : 'up')
    };

    const EN = [
      { code: 'ENG-01', t: 'Transparence', d: 'Pas de coûts cachés ni de mises à jour vagues. Une tarification publique et des progrès visibles en temps réel.', more: 'Vous voyez ce que nous voyons : tickets, avancement, décisions et alertes, partagés au fil de l’eau.' },

      { code: 'ENG-03', t: 'Sécurité & confidentialité', d: 'Vos données restent les vôtres, à chaque étape du parcours technologique.', more: 'Les modèles affinés sont entraînés dans le respect de la confidentialité et de la sécurité ; notre culture anti-triche issue du jeu protège sans dégrader l’expérience.' },
      { code: 'ENG-04', t: 'Qualité', d: 'La rapidité ne se fait jamais au détriment de la précision.', more: 'Assurance qualité, revues de code et intégration continue : chaque livraison est vérifiée avant d’arriver chez vous.' }
    ];
    const engs = EN.map((e, i) => {
      const open = s.eng === i;
      return {
        code: e.code, t: e.t, d: e.d, more: e.more, open: open, exp: open ? 'true' : 'false',
        state: open ? 'CONNECTÉ' : 'CLIQUER',
        dot: open ? 'fill:' + A : 'fill:#2A3A60',
        st: open ? 'border-color:' + A : '',
        toggle: () => this.setState({ eng: open ? -1 : i })
      };
    });

    return {
      menuOpen: s.menu,
      toggleMenu: () => this.setState({ menu: !s.menu }),
      ui: { dotBg: 'background:' + A, accentText: 'color:' + A, ctaBg: 'background:' + A, stroke: 'stroke:' + A },
      acc: acc, hub: hub, doms: doms, dom: dom,

      prevStep: () => this.setState({ step: Math.max(0, s.step - 1) }),
      nextStep: () => this.setState({ step: Math.min(4, s.step + 1) }),

  }
}
</script>
