<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Noyau — Contact</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#07090C}
sc-for,sc-if{display:contents}
.nx{--c:#00AEEF;--w:#FFB547;background:#07090C;color:#E7EDF3;font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.nx *{box-sizing:border-box}
.nx a{color:inherit;text-decoration:none}
.nx img{display:block;max-width:100%}
.nx button{font-family:inherit;color:inherit}
.nx h1,.nx h2,.nx h3,.nx h4,.nx p{margin:0}
.nx ::selection{background:var(--c);color:#03131B}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px;position:relative}
.lab{font-family:'Geist Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#8A96A3}
.c{color:var(--c)}
.mut{color:#8A96A3}
.disp{font-weight:600;letter-spacing:-.045em;line-height:.98;overflow-wrap:anywhere}
.h2{font-size:clamp(34px,4.4vw,60px);font-weight:600;letter-spacing:-.04em;line-height:1.03;overflow-wrap:anywhere}
.lead{font-size:clamp(17px,1.35vw,19px);color:#B4BFCA;line-height:1.65}
.gridbg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#131920 1px,transparent 1px),linear-gradient(90deg,#131920 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 60% 40%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 70% 60% at 60% 40%,#000 25%,transparent 78%)}
.panel{background:#0E1217;border:1px solid #1C232B;border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:10px;border:1px solid var(--c);background:var(--c);color:#03131B;font:600 15px/1 'Geist',sans-serif;cursor:pointer;box-shadow:0 10px 30px -12px color-mix(in srgb,var(--c) 75%,transparent);transition:box-shadow .3s,transform .3s,border-color .3s,background .3s}
.nx a.btn{color:#03131B}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent),0 14px 40px -8px color-mix(in srgb,var(--c) 80%,transparent)}
.btn svg{transition:transform .3s}
.btn:hover svg{transform:translateX(3px)}
.btn-g,.nx a.btn-g{background:rgba(255,255,255,.02);color:#E7EDF3;border-color:#2A333D;box-shadow:none}
.btn-g:hover{border-color:var(--c);box-shadow:0 0 26px -8px color-mix(in srgb,var(--c) 70%,transparent)}
.btn-sm{min-height:44px;padding:0 16px;font-size:14px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.kbd{display:inline-flex;align-items:center;font:500 11px/1 'Geist Mono',monospace;padding:4px 6px;border:1px solid #2A333D;border-bottom-width:2px;border-radius:6px;color:#8A96A3;background:#0B0E12}
.nx :focus-visible{outline:2px solid var(--c);outline-offset:3px}
.hdr{position:relative;z-index:50;border-bottom:1px solid #1C232B;background:rgba(7,9,12,.75);backdrop-filter:blur(14px)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:21px;letter-spacing:-.035em;min-height:44px}
.lspin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.nl{display:inline-flex;align-items:center;min-height:44px;padding:0 13px;font-size:14px;color:#B4BFCA;border-radius:8px;transition:color .2s,background .2s}
.nl:hover{color:#fff;background:#0E1217}
.cmdk{display:inline-flex;align-items:center;gap:10px;min-height:44px;min-width:44px;padding:0 8px 0 12px;background:#0B0E12;border:1px solid #1C232B;border-radius:10px;color:#8A96A3;font-size:14px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.cmdk:hover{border-color:#2F3A45;color:#E7EDF3;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent)}
.burger{display:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #1C232B;border-radius:10px;background:#0B0E12;cursor:pointer}
.mnav{border-top:1px solid #1C232B;padding:8px 20px 22px}
.mi{display:flex;justify-content:space-between;align-items:center;min-height:54px;border-bottom:1px solid #1C232B;font-size:18px}
.palx{position:absolute;left:0;right:0;top:86px;z-index:90;padding:0 20px;animation:palIn .28s cubic-bezier(.2,.8,.2,1) both}
.pal{max-width:660px;margin:0 auto;background:rgba(14,18,23,.97);border:1px solid #2A333D;border-radius:16px;box-shadow:0 40px 120px -20px #000,0 0 70px -24px color-mix(in srgb,var(--c) 55%,transparent);backdrop-filter:blur(20px);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:12px;padding:0 12px 0 18px;border-bottom:1px solid #1C232B;color:#8A96A3}
.pal-in input{flex:1;min-width:0;min-height:60px;background:transparent;border:0;color:#E7EDF3;font:400 17px 'Geist',sans-serif;outline:none}
.pal-in input::placeholder{color:#76838F}
.pal-tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid #1C232B}
.ptab{min-height:44px;padding:0 14px;border:1px solid transparent;border-radius:8px;background:transparent;color:#8A96A3;font:500 12px 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:color .2s,background .2s}
.ptab:hover{color:#E7EDF3}
.pal-list{max-height:360px;overflow:auto;padding:8px}
.pit{display:grid;grid-template-columns:76px minmax(0,1fr) auto 18px;align-items:center;gap:12px;min-height:50px;padding:0 12px;border-radius:10px;transition:background .15s}
.pit:hover,.pit:focus-visible{background:#151B22}
.pk{font:500 10px/1 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:6px 0;border-radius:5px;border:1px solid #2A333D;color:#8A96A3;text-align:center}
.pgo{opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .2s;color:var(--c)}
.pit:hover .pgo,.pit:focus-visible .pgo{opacity:1;transform:none}
.pal-f{display:flex;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid #1C232B;font:500 11px 'Geist Mono',monospace;color:#8A96A3;letter-spacing:.04em}
@keyframes palIn{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
.ft{border-top:1px solid #1C232B;padding:80px 0 28px;position:relative;background:linear-gradient(#07090C,#090C10)}
.fgrid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:40px}
.fl{display:flex;align-items:center;min-height:44px;color:#B4BFCA;font-size:14px;transition:color .2s}
.fl:hover{color:var(--c)}
.fi{display:flex;align-items:center;min-height:44px;color:#8A96A3;font:500 13px 'Geist Mono',monospace}
.fwm{font-weight:600;font-size:clamp(56px,17vw,250px);letter-spacing:-.065em;line-height:.82;color:transparent;-webkit-text-stroke:1px #222B34;margin:72px 0 0;white-space:nowrap;user-select:none;text-align:center}
.fbot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid #1C232B;padding-top:22px;margin-top:8px;font:500 12px 'Geist Mono',monospace;color:#8A96A3}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}.d4{animation-delay:.38s}.d5{animation-delay:.48s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{50%{opacity:0}}
.live{display:inline-flex;align-items:center;gap:8px;font:500 11px/1 'Geist Mono',monospace;letter-spacing:.1em;color:var(--w);padding:6px 10px;border:1px solid rgba(255,181,71,.32);border-radius:999px;background:rgba(255,181,71,.06)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--w);box-shadow:0 0 10px var(--w);animation:pulse 1.6s infinite}
.sect{padding:120px 0;position:relative}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:56px}
.eyb{display:inline-flex;align-items:center;gap:10px;margin-bottom:20px}
.eyb::before{content:"";width:18px;height:1px;background:var(--c);box-shadow:0 0 8px var(--c)}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:1px solid #1C232B;border-radius:6px;font:500 12px 'Geist Mono',monospace;color:#B4BFCA;background:#07090C}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#1C232B}
/* page: contact */
.hero{position:relative;padding:96px 0 56px}
.fw{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.fp{padding:36px;overflow:hidden}
.srail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:30px}
.sr{display:flex;flex-direction:column;gap:8px;font:500 12px 'Geist Mono',monospace;color:#8A96A3}
.sr i{display:block;height:3px;border-radius:3px;background:#1C232B;transition:background .4s,box-shadow .4s}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px;margin-top:22px}
.op{display:grid;grid-template-columns:44px minmax(0,1fr) 20px;gap:14px;align-items:center;width:100%;min-height:76px;padding:14px 16px;text-align:left;border:1px solid #1C232B;border-radius:14px;background:#0B0E12;cursor:pointer;transition:border-color .3s,background .3s,transform .3s,box-shadow .3s}
.op:hover{border-color:#2A3540;transform:translateY(-2px)}
.oi{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:10px;border:1px solid #2A333D;color:var(--c);background:#07090C}
.rd{width:20px;height:20px;border-radius:50%;border:1.5px solid #2F3A45;transition:all .3s}
.stp{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.fld{display:block;margin-top:16px}
.inp{width:100%;min-height:52px;margin-top:8px;padding:0 16px;border:1px solid #1C232B;border-radius:10px;background:#0B0E12;color:#E7EDF3;font:400 16px 'Geist',sans-serif;transition:border-color .25s,box-shadow .25s}
textarea.inp{min-height:120px;padding:14px 16px;resize:vertical;line-height:1.55}
.inp::placeholder{color:#76838F}
.inp:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 16%,transparent)}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:20px;min-height:44px;cursor:pointer;font-size:14px;color:#B4BFCA}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--c);flex:none}
.err{display:flex;gap:10px;align-items:center;margin-top:18px;padding:12px 14px;border:1px solid rgba(255,181,71,.35);border-radius:10px;background:rgba(255,181,71,.06);color:#FFB547;font-size:14px;animation:up .3s both}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:30px;padding-top:24px;border-top:1px solid #1C232B;flex-wrap:wrap}
.json{font:400 13px/1.85 'Geist Mono',monospace;padding:22px;color:#B4BFCA;white-space:pre-wrap;overflow-wrap:anywhere}
.jk{color:#8A96A3}.jv{color:#E7EDF3}.jn{color:#5E6A76}
.caret{display:inline-block;width:7px;height:14px;background:var(--c);vertical-align:-2px;animation:blink 1s steps(1) infinite}
.done{text-align:left;animation:up .5s both}
.ok{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:50%;border:1px solid var(--c);color:var(--c);box-shadow:0 0 40px -6px var(--c);margin-bottom:22px}
.info{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px}
.ir{display:grid;grid-template-columns:140px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid #1C232B}
.map{position:relative;overflow:hidden;min-height:360px}
.map svg{position:absolute;left:0;top:0;width:100%;height:360px}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:76px;border:1px solid #1C232B;border-radius:12px;background:#0B0E12;cursor:pointer;transition:all .3s}
.day:hover{border-color:#2A3540}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:8px;margin-top:14px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:0 16px;border:1px solid #1C232B;border-radius:12px;background:#0B0E12;cursor:pointer;font-size:15px;transition:all .3s}
.slot:hover{border-color:#2A3540}
@media (max-width:1080px){.nav-links{display:none!important}.burger{display:inline-flex}.hide-m{display:none!important}.fw,.info{grid-template-columns:1fr}}
@media (max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}
@media (max-width:720px){.wrap{padding:0 20px}.sect{padding:80px 0}.hide-s{display:none!important}.fp{padding:24px}.srail span{display:none}.ir{grid-template-columns:1fr;gap:2px}.days{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.nx *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="nx" style="{{ rootStyle }}">

<header class="hdr">
  <div class="wrap hrow">
    <a class="logo" href="Noyau-Accueil.html" aria-label="Baquelis — accueil">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13.5" fill="none" stroke="#2A333D"></circle><circle class="lspin" cx="15" cy="15" r="9" fill="none" stroke-width="1.5" stroke-dasharray="14 4.85" style="stroke:var(--c)"></circle><circle cx="15" cy="15" r="3.6" style="fill:var(--c);filter:drop-shadow(0 0 4px var(--c))"></circle></svg>
      <span>Baquelis</span>
    </a>
    <nav class="nav-links" aria-label="Navigation principale" style="display:flex;gap:2px">
      <sc-for list="{{ navs }}" as="n" hint-placeholder-count="5"><a class="nl" href="{{ n.href }}" aria-current="{{ n.cur }}" style="{{ n.style }}">{{ n.label }}</a></sc-for>
    </nav>
    <div style="display:flex;align-items:center;gap:10px">
      <button type="button" class="cmdk" onClick="{{ openPal }}" aria-expanded="{{ palExp }}" aria-label="Recherche rapide dans les pages et sections">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span class="hide-s">Aller à…</span><span class="kbd hide-s">⌘K</span>
      </button>
      <a class="btn btn-sm hide-m" href="#rdv">Réserver un appel</a>
      <button type="button" class="ib burger" onClick="{{ toggleMenu }}" aria-expanded="{{ menuExp }}" aria-label="Ouvrir le menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 8h16M4 16h16"></path></svg></button>
    </div>
  </div>
  <sc-if value="{{ menu }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav" aria-label="Menu mobile">
      <sc-for list="{{ navs }}" as="n" hint-placeholder-count="5"><a class="mi" href="{{ n.href }}">{{ n.label }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></sc-for>
      <a class="btn" href="#formulaire" style="margin-top:18px;width:100%">Commencer</a>
    </nav>
  </sc-if>
</header>
<sc-if value="{{ pal }}" hint-placeholder-val="{{ false }}">
  <div class="palx">
    <div class="pal" role="dialog" aria-label="Navigation rapide">
      <div class="pal-in">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input type="text" value="{{ q }}" onInput="{{ setQ }}" placeholder="Page, section… (ex. FAQ, ATOM, Flex)" aria-label="Filtrer les pages et sections" autocomplete="off">
        <button type="button" class="kbd" onClick="{{ closePal }}" aria-label="Fermer la recherche" style="min-height:44px;min-width:52px;justify-content:center;cursor:pointer">Échap</button>
      </div>
      <div class="pal-tabs" role="group" aria-label="Type de résultat"><sc-for list="{{ palTabs }}" as="t" hint-placeholder-count="3"><button type="button" class="ptab" style="{{ t.style }}" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}">{{ t.label }}</button></sc-for></div>
      <div class="pal-list">
        <sc-for list="{{ palItems }}" as="it" hint-placeholder-count="6"><a class="pit" href="{{ it.href }}"><span class="pk">{{ it.kind }}</span><span style="color:#E7EDF3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.label }}</span><span class="mut hide-s" style="font-size:13px">{{ it.page }}</span><svg class="pgo" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></sc-for>
        <sc-if value="{{ palEmpty }}" hint-placeholder-val="{{ false }}"><p class="mut" style="padding:30px 14px;text-align:center;font-size:15px">Aucun résultat pour « {{ q }} ». Essayez « offres » ou « agents ».</p></sc-if>
      </div>
      <div class="pal-f"><span>{{ palCount }}</span><span>Baquelis · navigation rapide</span></div>
    </div>
  </div>
</sc-if>

<!-- HERO -->
<section class="hero">
  <div class="gridbg" aria-hidden="true"></div>
  <div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:40px;align-items:end">
    <div>
      <p class="lab eyb up">Contact · Nice</p>
      <h1 class="disp up d1" style="font-size:clamp(44px,6.4vw,92px)">Démarrons<br><span class="mut">votre projet.</span></h1>
    </div>
    <div class="up d2">
      <p class="lead" style="max-width:520px">Quatre questions pour cadrer votre besoin, ou un créneau pour en parler directement. Nous revenons vers vous pour un appel découverte.</p>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:24px">
        <a class="btn" href="#formulaire">Décrire mon besoin<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></a>
        <a class="btn btn-g" href="#rdv">Choisir un créneau</a>
      </div>
    </div>
  </div>
</section>

<!-- FORMULAIRE -->
<section id="formulaire" style="padding:20px 0 100px;position:relative">
  <div class="wrap">
    <div class="fw">
      <div class="panel fp">
        <sc-if value="{{ formOn }}" hint-placeholder-val="{{ true }}">
          <form onSubmit="{{ submit }}" novalidate aria-label="Demande de contact en 4 étapes">
            <div class="srail" aria-hidden="true"><sc-for list="{{ rail }}" as="r" hint-placeholder-count="4"><div class="sr" style="{{ r.style }}"><i style="{{ r.bar }}"></i><span>{{ r.n }} {{ r.t }}</span></div></sc-for></div>
            <p class="lab">Étape <span class="c">{{ stepN }}</span> / 4</p>

            <sc-if value="{{ s0 }}" hint-placeholder-val="{{ true }}">
              <div class="stp">
                <h2 style="font-size:clamp(24px,2.6vw,32px);font-weight:600;letter-spacing:-.03em;margin-top:8px">De quoi avez-vous besoin ?</h2>
                <div class="opts" role="radiogroup" aria-label="Type de besoin">
                  <sc-for list="{{ needs }}" as="o" hint-placeholder-count="4"><button type="button" role="radio" class="op" style="{{ o.style }}" aria-checked="{{ o.sel }}" onClick="{{ o.pick }}"><span class="oi mono" style="font-size:13px">{{ o.n }}</span><span><span style="display:block;font-weight:600">{{ o.t }}</span><span class="mut" style="display:block;font-size:13px">{{ o.s }}</span></span><span class="rd" style="{{ o.rd }}"></span></button></sc-for>
                </div>
              </div>
            </sc-if>
            <sc-if value="{{ s1 }}" hint-placeholder-val="{{ false }}">
              <div class="stp">
                <h2 style="font-size:clamp(24px,2.6vw,32px);font-weight:600;letter-spacing:-.03em;margin-top:8px">Quelle formule envisagez-vous ?</h2>
                <div class="opts" role="radiogroup" aria-label="Formule envisagée">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3700},"accent":{"editor":"color","default":"#00AEEF","options":["#00AEEF","#7C5CFF","#F5B700"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { pal:false, q:'', palF:'Tout', menu:false,
      step:0, need:'', plan:'', size:'', projet:'', nom:'', mail:'', soc:'', tel:'', rgpd:false, err:'', sent:false,

  norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  palData(){

      { k:'Page', l:'Contact', p:'Réserver un appel', h:'Noyau-Contact.html', t:'rendez-vous formulaire' },
      { k:'Section', l:'Les 4 piliers', p:'Expertises', h:'Noyau-Expertises.html#piliers', t:'solutions partenariat rapidite transparence' },

      { k:'Section', l:'Plateforme Web3', p:'Jeux & Web3', h:'Noyau-Jeux.html#web3', t:'blockchain actifs' },

      { k:'Section', l:'Prise de rendez-vous', p:'Contact', h:'Noyau-Contact.html#rdv', t:'creneaux agenda appel' },
      { k:'Lien', l:'Toutes les propositions', p:'Canvas', h:'index.html', t:'propositions main' }
    ];
  }
  shell(page){
    const s = this.state, q = this.norm(s.q).trim(), f = s.palF;
    const items = this.palData()
      .filter(it => (f === 'Tout' || it.k === f) && (!q || this.norm(it.l + ' ' + it.p + ' ' + it.t).indexOf(q) > -1))
      .map(it => ({ kind: it.k, label: it.l, page: it.p, href: it.h }));
    const palTabs = [['Tout','Tout'],['Page','Pages'],['Section','Sections']].map(([v, l]) => ({
      label: l, pressed: f === v ? 'true' : 'false',
      style: f === v ? 'background:#151B22;color:#E7EDF3;border-color:#2F3A45' : '',
      pick: () => this.setState({ palF: v })
    }));
    const navs = [['Expertises','Noyau-Expertises.html'],['IA','Noyau-IA.html'],['Jeux & Web3','Noyau-Jeux.html'],['Offres','Noyau-Offres.html'],['Contact','Noyau-Contact.html']]
      .map(([l, h]) => ({ label: l, href: h, cur: l === page ? 'page' : 'false', style: l === page ? 'color:#fff;background:#0E1217;box-shadow:inset 0 -2px 0 var(--c)' : '' }));
    const accent = (this.props && this.props.accent) || '#00AEEF';
    return {
      rootStyle: '--c:' + accent, navs,
      pal: s.pal, palExp: s.pal ? 'true' : 'false', q: s.q,
      setQ: e => this.setState({ q: e && e.target ? e.target.value : '' }),
      palItems: items, palEmpty: items.length === 0, palTabs,
      palCount: items.length + (items.length > 1 ? ' résultats' : ' résultat'),
      openPal: () => this.setState({ pal: !s.pal, menu: false }),
      closePal: () => this.setState({ pal: false, q: '' }),
      menu: s.menu, menuExp: s.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !s.menu, pal: false })
    };
  }
  check(st){
    const s = this.state;
    if (st === 0 && !s.need) return 'Choisissez le type de besoin pour continuer.';
    if (st === 1 && !s.plan) return 'Indiquez une formule (ou « Je ne sais pas encore »).';
    if (st === 2 && !s.size) return 'Précisez la taille de votre entreprise.';
    if (st === 3) {
      if (!s.nom.trim()) return 'Indiquez votre nom.';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(s.mail.trim())) return 'Saisissez une adresse e-mail valide.';

  }
  renderVals(){
    const s = this.state;
    const SEL = 'border-color:var(--c);background:color-mix(in srgb,var(--c) 7%,#0B0E12);box-shadow:0 18px 40px -26px var(--c)';

      n: '0' + (i + 1), t: o[0], s: o[1], sel: s[key] === o[0] ? 'true' : 'false',
      style: s[key] === o[0] ? SEL : '', rd: s[key] === o[0] ? RD : '',
      pick: () => { const u = { err: '' }; u[key] = o[0]; this.setState(u); }
    }));
    const set = k => e => { const u = {}; u[k] = e && e.target ? e.target.value : ''; this.setState(u); };
    const STEPS = ['Besoin', 'Formule', 'Taille', 'Coordonnées'];
    const rail = STEPS.map((t, i) => ({
      n: '0' + (i + 1), t,
      style: i === s.step ? 'color:#E7EDF3' : (i < s.step ? 'color:var(--c)' : ''),
      bar: i <= s.step ? 'background:var(--c);box-shadow:0 0 10px var(--c)' : ''
    }));
    const str = v => v ? '"' + v + '"' : 'null';
    const recap = [
      ['besoin', s.need], ['formule', s.plan], ['taille', s.size], ['projet', s.projet ? (s.projet.length > 40 ? s.projet.slice(0, 40) + '…' : s.projet) : ''],
      ['nom', s.nom], ['email', s.mail], ['entreprise', s.soc]
    ].map(r => ({ k: r[0], v: str(r[1]), style: r[1] ? 'color:#E7EDF3' : 'color:#5E6A76' }));
    const filled = [s.need, s.plan, s.size, s.nom, s.mail, s.rgpd].filter(Boolean).length;
    const pct = Math.round(filled / 6 * 100);
    const DAYS = [['Lun','Lundi'],['Mar','Mardi'],['Mer','Mercredi'],['Jeu','Jeudi'],['Ven','Vendredi']];
    const SLOTS = ['Matin', 'Midi', 'Après-midi'];
    const DSEL = 'border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#0B0E12);box-shadow:0 0 24px -10px var(--c)';
    return Object.assign(this.shell('Contact'), {
      formOn: !s.sent, doneOn: s.sent,
      rail, stepN: '0' + (s.step + 1),
      s0: s.step === 0, s1: s.step === 1, s2: s.step === 2, s3: s.step === 3,
      needs: opt('need', [['Équipe dédiée','Un profil ou une équipe intégrée'],['Intelligence artificielle','Modèles affinés, agents, intégration'],['Jeux & Web3','Temps réel, multijoueur, Web3'],['Autre','Un besoin technique différent']]),
      plans: opt('plan', [['Intégration','4 500 €/mois · 1 profil dédié'],['Flex','6 200 €/mois · profil senior'],['Performance','18 900 €/mois · 5 experts'],['Je ne sais pas encore','Nous vous conseillerons']]),
      sizes: opt('size', [['Startup','Équipe réduite, forte croissance'],['PME','Équipes établies, besoins ciblés'],['Grande entreprise','Projets stratégiques complexes']]),
      projet: s.projet, nom: s.nom, mail: s.mail, soc: s.soc, tel: s.tel, rgpd: s.rgpd,
      setProjet: set('projet'), setNom: set('nom'), setMail: set('mail'), setSoc: set('soc'), setTel: set('tel'),
      setRgpd: e => this.setState({ rgpd: !!(e && e.target && e.target.checked), err: '' }),
      hasErr: !!s.err, errTxt: s.err,
      backDis: s.step === 0, notLast: s.step < 3, isLast: s.step === 3,
      back: () => this.setState({ step: Math.max(0, s.step - 1), err: '' }),
      next: () => { const e = this.check(s.step); this.setState(e ? { err: e } : { step: s.step + 1, err: '' }); },
      submit: e => { if (e && e.preventDefault) e.preventDefault(); const er = this.check(3); this.setState(er ? { err: er } : { sent: true, err: '' }); },
      restart: () => this.setState({ step:0, need:'', plan:'', size:'', projet:'', nom:'', mail:'', soc:'', tel:'', rgpd:false, err:'', sent:false }),
      prenom: s.nom.trim().split(' ')[0] || '',
      recap, pctTxt: (s.sent ? 100 : pct) + ' %',
      pctBar: 'height:3px;width:' + (s.sent ? 100 : pct) + '%;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .5s',
      jsonState: s.sent ? 'validé' : 'brouillon',
      jsonStateStyle: 'font-size:11px;' + (s.sent ? 'color:var(--c)' : 'color:#FFB547'),
      days: DAYS.map((d, i) => ({ n: d[0].toUpperCase(), t: d[1], sel: s.day === i ? 'true' : 'false', style: s.day === i ? DSEL : '', pick: () => this.setState({ day: i, slot: -1, booked: false }) })),
      slots: SLOTS.map((t, i) => ({ t, sel: s.slot === i ? 'true' : 'false', style: s.slot === i ? DSEL : '', pick: () => this.setState({ slot: i, booked: false }) })),
      rdvTxt: DAYS[s.day][1] + ' · ' + (s.slot > -1 ? SLOTS[s.slot] + ' · [CRÉNEAU]' : 'choisissez un créneau'),
      bookDis: s.slot < 0, booked: s.booked,
      book: () => { if (s.slot > -1) this.setState({ booked: true }); }
    });
  }
}
</script>
