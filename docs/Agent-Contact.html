<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agent — Contact</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;display=swap">
<style>
body{margin:0}
sc-for,sc-if{display:contents}
*{box-sizing:border-box}
.bq{background:#F6F7F4;color:#15181C;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bq a{color:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.sec{padding:112px 0}
.hdr{position:sticky;top:0;z-index:20;background:rgba(246,247,244,.88);backdrop-filter:blur(14px);border-bottom:1px solid #E4E7E2}
.hdr-in{display:flex;align-items:center;justify-content:space-between;height:72px;gap:24px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:21px;letter-spacing:-.025em;min-height:44px}
.nav{display:flex;gap:2px;align-items:center}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;text-decoration:none;font-size:15px;color:#3B4148;transition:background .2s,color .2s}
.nav a:hover{background:#ECEEEA;color:#15181C}
.nav a.on{color:#15181C;background:#fff;box-shadow:0 0 0 1px #E4E7E2}
.hdr-cta{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;font:500 15px/1.1 'IBM Plex Sans',sans-serif;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s,color .2s}
.btn-cta{color:#15181C;box-shadow:0 1px 0 rgba(21,24,28,.08),0 10px 24px -12px rgba(255,122,69,.8)}
.btn-cta:hover{transform:translateY(-2px);box-shadow:0 1px 0 rgba(21,24,28,.08),0 16px 30px -12px rgba(255,122,69,.9)}
.btn-ink{background:#15181C;color:#fff}
.btn-ink:hover{background:#2A2F35;transform:translateY(-2px)}
.btn-line{background:#fff;color:#15181C;box-shadow:inset 0 0 0 1px #D6DAD3}
.btn-line:hover{box-shadow:inset 0 0 0 1px #0091C7;color:#00739E}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1px solid #D6DAD3;background:#fff;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none;border-top:1px solid #E4E7E2}
.mnav a{display:flex;align-items:center;min-height:48px;padding:0 12px;border-radius:12px;text-decoration:none;font-size:17px}
.mnav a:hover{background:#ECEEEA}
@media (max-width:960px){.nav,.hdr-cta{display:none}.burger{display:inline-flex}.mnav{display:block}}
.h1{font-weight:500;font-size:clamp(38px,5vw,72px);line-height:1.04;letter-spacing:-.04em;margin:0;overflow-wrap:anywhere}
.h2{font-weight:500;font-size:clamp(28px,3.2vw,44px);line-height:1.1;letter-spacing:-.03em;margin:0;overflow-wrap:anywhere}
.lead{font-size:clamp(17px,1.5vw,20px);color:#5C636B;line-height:1.55;margin:0}
.muted{color:#5C636B}
.ask{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid #E4E7E2;border-radius:18px 18px 18px 6px;padding:6px 16px 6px 6px;font-size:15px;color:#3B4148;margin:0 0 22px;max-width:100%}
.ask b{font:500 11px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;background:#F1F2EF;color:#5C636B;padding:7px 9px;border-radius:999px;flex:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:20px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:56px;align-items:center}
.card{background:#fff;border:1px solid #E4E7E2;border-radius:22px}
.ok{width:22px;height:22px;border-radius:50%;background:#C8F0E2;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pend{width:22px;height:22px;border-radius:50%;border:1.5px dashed #C3C9C0;display:inline-flex;flex:none}
.av{width:36px;height:36px;border-radius:50%;background:#15181C;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tag{font:500 11.5px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;padding:7px 10px;border-radius:999px;background:#EAF5FA;color:#00739E}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid #D6DAD3;color:#15181C;font:400 14.5px/1.2 'IBM Plex Sans',sans-serif;cursor:pointer;text-align:left;transition:border-color .2s,background .2s,transform .2s,color .2s}
.chip:hover{border-color:#0091C7;background:#F0F8FB;transform:translateY(-1px)}
.msg-a{align-self:flex-start;max-width:94%;background:#F3F5F1;border-radius:6px 18px 18px 18px;padding:14px 16px;font-size:15px;line-height:1.6}
.msg-u{align-self:flex-end;max-width:85%;background:#15181C;color:#fff;border-radius:18px 18px 6px 18px;padding:12px 16px;font-size:15px}
.trace-h{display:flex;justify-content:space-between;align-items:center;gap:10px;font:500 11.5px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#5C636B}
.tool{border:1px solid #E4E7E2;border-radius:14px;background:#fff;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.5}
.tool-h{padding:10px 12px;color:#3B4148;overflow-wrap:anywhere}
.tool-h b{color:#00739E;font-weight:500}
.tool-r{padding:9px 12px;border-top:1px dashed #DDE2DA;color:#0B5D43;background:#F1FBF6;border-radius:0 0 14px 14px;overflow-wrap:anywhere}
.ghost-row{height:14px;border-radius:7px;background:repeating-linear-gradient(90deg,#ECEEEA 0 10px,#F4F5F2 10px 20px)}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing span{width:6px;height:6px;border-radius:50%;background:#0091C7;display:inline-block;animation:blink 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
.live{width:8px;height:8px;border-radius:50%;background:#0091C7;display:inline-block;animation:pulse 1.8s infinite;flex:none}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid #CFE7F1;border-top-color:#0091C7;animation:spin .8s linear infinite;display:inline-block}
.rise{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.formc{background:#fff;border:1px solid #E4E7E2;border-radius:28px;padding:36px;box-shadow:0 50px 90px -60px rgba(21,24,28,.35)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps span{height:4px;border-radius:4px;transition:background .4s}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:16px 18px;border-radius:18px;border:1px solid #E4E7E2;background:#fff;cursor:pointer;text-align:left;font:500 16px/1.3 'IBM Plex Sans',sans-serif;color:#15181C;transition:border-color .2s,transform .2s,box-shadow .2s,background .2s}
.opt:hover{border-color:#0091C7;transform:translateY(-2px)}
.oico{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:background .2s,color .2s}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:14px;font-weight:500}
.inp{width:100%;min-height:50px;padding:12px 14px;border-radius:12px;border:1px solid #D6DAD3;background:#FAFBF9;font:400 16px/1.4 'IBM Plex Sans',sans-serif;color:#15181C;transition:border-color .2s,box-shadow .2s,background .2s}
.inp:focus{outline:none;border-color:#0091C7;box-shadow:0 0 0 4px rgba(0,145,199,.14);background:#fff}
.err{font-size:13.5px;color:#B3261E}
.brief{background:#FAFBF9;border:1px solid #E4E7E2;border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:14px}
.bl{display:flex;gap:12px;align-items:flex-start}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:72px;min-height:64px;padding:8px 12px;border-radius:14px;border:1px solid #E4E7E2;background:#fff;cursor:pointer;font:inherit;color:inherit;transition:border-color .2s,background .2s,color .2s}
.day:hover{border-color:#0091C7}
.slot{min-height:46px;padding:0 14px;border-radius:12px;border:1px dashed #C3C9C0;background:#fff;cursor:pointer;font:400 14px/1.2 'IBM Plex Mono',monospace;color:#3B4148;transition:border-color .2s,background .2s,color .2s}
.slot:hover{border-color:#0091C7;color:#00739E}
.mapc{position:relative;height:220px;border-radius:18px;overflow:hidden;background-color:#EEF1EC;background-image:linear-gradient(#E1E5DE 1px,transparent 1px),linear-gradient(90deg,#E1E5DE 1px,transparent 1px);background-size:28px 28px}
.askp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));background:#fff;border:1px solid #E4E7E2;border-radius:28px;overflow:hidden}
.askp-l{padding:32px;border-right:1px solid #EDEFEB}
.askp-r{padding:32px;background:#FAFBF9;display:flex;flex-direction:column;gap:12px;min-height:320px}
.chips-col{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.ft-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:40px}
.ft-t{font:500 11.5px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#5C636B;margin-bottom:12px}
.ft-l a{display:flex;align-items:center;min-height:44px;text-decoration:none;color:#3B4148;font-size:15px;transition:color .2s}
.ft-l a:hover{color:#00739E}
:focus-visible{outline:2px solid #0091C7;outline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,145,199,.45)}100%{box-shadow:0 0 0 10px rgba(0,145,199,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .6s cubic-bezier(.2,.7,.2,1) both}
@media (max-width:640px){.wrap{padding:0 20px}.sec{padding:80px 0}.askp-l,.askp-r{padding:24px}.formc{padding:22px}.brief{padding:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="bq">

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="Agent-Accueil.html" aria-label="Baquelis, accueil">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" fill="#15181C"></rect><circle cx="9.5" cy="15" r="2.4" fill="#FFFFFF"></circle><circle cx="15" cy="15" r="2.4" fill="#FFFFFF" opacity=".55"></circle><circle cx="20.5" cy="15" r="2.4" fill="#0091C7"></circle></svg>
      <span>Baquelis</span>
    </a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="Agent-Expertises.html">Expertises</a>
      <a href="Agent-IA.html">IA</a>
      <a href="Agent-Jeux.html">Jeux &amp; Web3</a>
      <a href="Agent-Offres.html">Offres</a>
      <a class="on" href="Agent-Contact.html" aria-current="page">Contact</a>
    </nav>
    <div class="hdr-cta">
      <a class="btn btn-line" href="#rdv">Réserver un appel</a>
      <a class="btn btn-cta" style="{{ cta }}" href="#brief">Commencer</a>
    </div>
    <button class="burger" type="button" aria-label="Ouvrir ou fermer le menu" aria-expanded="{{ menuExpanded }}" onClick="{{ toggleMenu }}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15181C" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg>
    </button>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div class="mnav">
      <div class="wrap" style="display:grid;gap:2px;padding-top:10px;padding-bottom:20px">
        <a href="Agent-Expertises.html">Expertises</a>
        <a href="Agent-IA.html">IA</a>
        <a href="Agent-Jeux.html">Jeux &amp; Web3</a>
        <a href="Agent-Offres.html">Offres</a>
        <a href="Agent-Contact.html">Contact</a>
        <a class="btn btn-cta" style="{{ cta }}" href="#brief">Commencer</a>
      </div>
    </div>
  </sc-if>
</header>

<main>
<!-- HERO -->
<section style="padding:80px 0 40px">
  <div class="wrap">
    <p class="ask rise"><b>Vous</b>Comment démarrer avec Baquelis ?</p>
    <div class="split" style="align-items:end">
      <h1 class="h1 rise" style="animation-delay:.08s">Parlons de votre projet.</h1>
      <p class="lead rise" style="animation-delay:.16s">Quatre questions, moins de deux minutes. Pendant que vous répondez, ATOM prépare le brief que l’équipe lira avant votre appel découverte.</p>
    </div>
  </div>
</section>

<!-- FORMULAIRE + BRIEF -->
<section style="padding:24px 0 112px" id="brief">
  <div class="wrap split" style="align-items:start;gap:28px;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))">
    <div class="formc">
      <sc-if value="{{ notDone }}" hint-placeholder-val="{{ true }}">
        <form onSubmit="{{ submit }}" novalidate="novalidate" aria-label="Formulaire de contact en quatre étapes">
          <div class="trace-h" style="margin-bottom:12px"><span>Étape {{ stepN }} / 4</span><span>{{ stepName }}</span></div>
          <div class="steps" aria-hidden="true">
            <sc-for list="{{ bars }}" as="b" hint-placeholder-count="4"><span style="{{ b.s }}"></span></sc-for>
          </div>

          <sc-if value="{{ s0 }}" hint-placeholder-val="{{ true }}">
            <div class="rise" style="margin-top:28px">
              <h2 style="font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0 0 6px">De quoi avez-vous besoin ?</h2>
              <p class="muted" style="margin:0 0 20px;font-size:15px">Choisissez le besoin principal, nous affinerons ensemble.</p>
              <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px" role="group" aria-label="Besoin">
                <sc-for list="{{ needs }}" as="o" hint-placeholder-count="4">
                  <button class="opt" type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.pressed }}" style="{{ o.style }}">
                    <span class="oico" style="{{ o.ico }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ o.path }}"></path></svg></span>
                    <span style="display:flex;flex-direction:column;gap:2px"><span>{{ o.label }}</span><span style="{{ o.subStyle }}">{{ o.sub }}</span></span>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ s1 }}" hint-placeholder-val="{{ false }}">
            <div class="rise" style="margin-top:28px">
              <h2 style="font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0 0 6px">Quelle formule envisagez-vous ?</h2>
              <p class="muted" style="margin:0 0 20px;font-size:15px">Pas encore décidé ? C’est justement le rôle de l’appel découverte.</p>
              <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px" role="group" aria-label="Formule envisagée">
                <sc-for list="{{ plans }}" as="o" hint-placeholder-count="4">
                  <button class="opt" type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.pressed }}" style="{{ o.style }}">
                    <span style="display:flex;flex-direction:column;gap:2px"><span>{{ o.label }}</span><span style="{{ o.subStyle }}">{{ o.sub }}</span></span>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ s2 }}" hint-placeholder-val="{{ false }}">
            <div class="rise" style="margin-top:28px">
              <h2 style="font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0 0 6px">Quelle est la taille de votre entreprise ?</h2>
              <p class="muted" style="margin:0 0 20px;font-size:15px">Pour vous orienter vers la bonne équipe.</p>
              <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px" role="group" aria-label="Taille de l’entreprise">
                <sc-for list="{{ sizes }}" as="o" hint-placeholder-count="4">
                  <button class="opt" type="button" onClick="{{ o.pick }}" aria-pressed="{{ o.pressed }}" style="{{ o.style }}">
                    <span style="display:flex;flex-direction:column;gap:2px"><span>{{ o.label }}</span><span style="{{ o.subStyle }}">{{ o.sub }}</span></span>
                  </button>
                </sc-for>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ s3 }}" hint-placeholder-val="{{ false }}">
            <div class="rise" style="margin-top:28px;display:flex;flex-direction:column;gap:16px">
              <div>
                <h2 style="font-size:26px;font-weight:500;letter-spacing:-.02em;margin:0 0 6px">Comment vous joindre ?</h2>
                <p class="muted" style="margin:0;font-size:15px">Prototype : aucune donnée n’est envoyée ni conservée.</p>
              </div>
              <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px">
                <div class="fld">
                  <label for="f-nom">Nom et prénom *</label>
                  <input class="inp" id="f-nom" type="text" autocomplete="name" value="{{ name }}" onInput="{{ setName }}" style="{{ nameStyle }}" aria-invalid="{{ nameInvalid }}">
                  <sc-if value="{{ nameErr }}" hint-placeholder-val="{{ false }}"><span class="err">Indiquez votre nom.</span></sc-if>
                </div>
                <div class="fld">
                  <label for="f-soc">Société *</label>
                  <input class="inp" id="f-soc" type="text" autocomplete="organization" value="{{ company }}" onInput="{{ setCompany }}" style="{{ companyStyle }}" aria-invalid="{{ companyInvalid }}">
                  <sc-if value="{{ companyErr }}" hint-placeholder-val="{{ false }}"><span class="err">Indiquez le nom de votre société.</span></sc-if>
                </div>
              </div>
              <div class="fld">
                <label for="f-mail">E-mail professionnel *</label>
                <input class="inp" id="f-mail" type="email" autocomplete="email" value="{{ email }}" onInput="{{ setEmail }}" style="{{ emailStyle }}" aria-invalid="{{ emailInvalid }}">
                <sc-if value="{{ emailErr }}" hint-placeholder-val="{{ false }}"><span class="err">Saisissez une adresse e-mail valide (ex. nom@societe.fr).</span></sc-if>
              </div>
              <div class="fld">
                <label for="f-msg">Votre projet en quelques mots <span class="muted" style="font-weight:400">(facultatif)</span></label>
                <textarea class="inp" id="f-msg" rows="4" style="resize:vertical;min-height:110px" onInput="{{ setMsg }}">{{ msg }}</textarea>
              </div>
            </div>
          </sc-if>

          <sc-if value="{{ choiceErr }}" hint-placeholder-val="{{ false }}">
            <p class="err rise" style="margin:16px 0 0">Choisissez une option pour continuer.</p>
          </sc-if>

          <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:22px;border-top:1px solid #EDEFEB">
            <sc-if value="{{ canBack }}" hint-placeholder-val="{{ false }}">
              <button class="btn btn-line" type="button" onClick="{{ back }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Retour</button>
            </sc-if>
            <sc-if value="{{ noBack }}" hint-placeholder-val="{{ true }}"><span></span></sc-if>
            <sc-if value="{{ notLast }}" hint-placeholder-val="{{ true }}">
              <button class="btn btn-ink" type="button" onClick="{{ next }}">Continuer
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
            </sc-if>
            <sc-if value="{{ isLast }}" hint-placeholder-val="{{ false }}">
              <button class="btn btn-cta" type="submit" style="{{ cta }}">Envoyer le brief (prototype)</button>
            </sc-if>
          </div>
        </form>
      </sc-if>

      <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}">
        <div class="rise" role="status" style="text-align:center;padding:24px 0">
          <span class="ok pop" style="width:72px;height:72px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0B5D43" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
          <h2 style="font-size:30px;font-weight:500;letter-spacing:-.025em;margin:22px 0 8px">Merci {{ firstName }}, votre brief est prêt.</h2>
          <p class="mono" style="display:inline-block;margin:0 0 20px;font-size:12.5px;background:#FFF1EA;color:#8A3A10;padding:8px 12px;border-radius:999px">Prototype — rien n’est envoyé</p>
          <p class="muted" style="margin:0 auto 24px;max-width:440px">Dans la version finale, l’équipe Baquelis recevrait ce brief et vous recontacterait pour fixer l’appel découverte.</p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <button class="btn btn-line" type="button" onClick="{{ restart }}">Recommencer</button>
            <a class="btn btn-ink" href="#rdv">Choisir un créneau</a>
          </div>
        </div>

      askA: A || { q:"", think:"", tool:"", result:"", answer:"", cta:"", href:"Agent-Contact.html" },
      askThink: !!A && as >= 1,
      askTool: !!A && as >= 2,
      askToolRun: !!A && as === 2,
      askToolDone: !!A && as >= 3,
      askTyping: !!A && as < 3,
      askAnswer: !!A && as >= 3,
      askLink: !!A && as >= 4
    };
  }
}
