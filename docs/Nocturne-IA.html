<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#08080B}
sc-for,sc-if{display:contents}
.nx,.nx *{box-sizing:border-box}
.nx{font-family:'Outfit',system-ui,sans-serif;color:#EFEDE8;background:#08080B;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:clip}
.nx a{color:inherit;text-decoration:none}
.nx h1,.nx h2,.nx h3,.nx h4,.nx p{margin:0}
.nx button{font-family:inherit;cursor:pointer}
.nx :focus-visible{outline:2px solid #F2B544;outline-offset:3px;border-radius:6px}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
@media (max-width:720px){.wrap{padding:0 16px}}
.amb{color:#F2B544}
.cy{color:#5FD3FF}
.muted{color:#9B988F}
.hdr{position:sticky;top:0;z-index:50;background:rgba(8,8,11,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(239,237,232,.07)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px}
.logo{display:flex;align-items:center;gap:12px;min-height:44px}
.logo-word{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:.2em;font-size:17px}
.logo .ring{transform-origin:17px 17px;animation:spin 16s linear infinite}
.nav{display:flex;gap:2px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:14.5px;color:#C9C6BE;border-radius:999px;transition:color .3s,background .3s}
.nav a:hover{color:#EFEDE8;background:rgba(239,237,232,.06)}
.nav a[aria-current="page"]{color:#F2B544}
.hdr-cta{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;border:1px solid transparent;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,background .35s,color .35s,border-color .35s;white-space:nowrap}
.btn-amber{background:#F2B544;color:#08080B}
.btn-amber:hover{transform:translateY(-2px);box-shadow:0 14px 44px -10px rgba(242,181,68,.6)}
.btn-ghost{border-color:rgba(239,237,232,.24);color:#EFEDE8;background:rgba(8,8,11,.35)}
.btn-ghost:hover{border-color:#F2B544;color:#F2B544}
.btn svg{transition:transform .35s}
.btn:hover svg{transform:translateX(4px)}
.burger{display:none;width:48px;height:48px;border-radius:999px;border:1px solid rgba(239,237,232,.2);background:transparent;color:#EFEDE8;align-items:center;justify-content:center}
@media (max-width:1060px){.nav,.hdr-cta .btn-ghost{display:none}.burger{display:inline-flex}}
@media (max-width:520px){.hdr-cta .btn-amber{display:none}}
.mnav{display:grid;padding:6px 0 22px}
.mnav a{display:flex;align-items:center;min-height:54px;font-family:'Syne',sans-serif;font-weight:700;font-size:22px;border-bottom:1px solid rgba(239,237,232,.08)}
.eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#F2B544;font-weight:600}
.scene{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#9B988F;font-weight:500}
.scene b{color:#F2B544;font-weight:600}
.scene i{display:block;width:56px;height:1px;background:linear-gradient(90deg,#F2B544,transparent)}
.h2{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(32px,4.8vw,66px);line-height:1.02;letter-spacing:-.02em;overflow-wrap:anywhere}
.lead{font-size:clamp(17px,1.4vw,19px);color:#C9C6BE;max-width:640px}
.sec{padding:130px 0;position:relative}
@media (max-width:720px){.sec{padding:84px 0}}
.sec-head{display:grid;gap:22px;margin-bottom:56px}
/* hero */
.hero{position:relative;height:720px;overflow:hidden}
@media (max-width:720px){.hero{height:660px}}
.layer{position:absolute;top:-70px;left:-70px;right:-70px;bottom:-70px;transition:transform 1s cubic-bezier(.16,.84,.24,1)}
.ly{position:absolute;top:0;left:0;right:0;bottom:0}
.ly-back{background:url(assets/server-lights.webp) center/cover;filter:hue-rotate(160deg) saturate(.7) brightness(.3);animation:drift 26s ease-in-out infinite alternate}
.ly-mid{left:34%;background:url(assets/datacenter-corridor.webp) center/cover;filter:brightness(.75);-webkit-mask-image:radial-gradient(60% 70% at 55% 50%,#000 40%,transparent);mask-image:radial-gradient(60% 70% at 55% 50%,#000 40%,transparent);animation:drift2 18s ease-in-out infinite alternate}
.ly-net{left:46%;top:90px;right:auto;bottom:auto;width:720px;height:600px;opacity:.85;animation:fog 14s ease-in-out infinite alternate}
.ly-fog{background:radial-gradient(40% 40% at 70% 50%,rgba(0,174,239,.22),transparent 70%),radial-gradient(50% 40% at 20% 80%,rgba(242,181,68,.22),transparent 70%)}
.vign{position:absolute;top:0;left:0;right:0;bottom:0;z-index:3;background:linear-gradient(90deg,rgba(8,8,11,.94),rgba(8,8,11,.4) 55%,transparent),linear-gradient(180deg,transparent 55%,#08080B)}
.grain{position:absolute;top:-40px;left:-40px;right:-40px;bottom:-40px;pointer-events:none;z-index:7;opacity:.1;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");animation:grain .9s steps(5) infinite}
.lb{position:absolute;left:0;right:0;height:0;background:#000;z-index:8;overflow:hidden;animation:lb 1.4s cubic-bezier(.7,0,.2,1) .1s forwards}
.lb.t{top:0}.lb.b{bottom:0}
.lb-row{height:48px;display:flex;align-items:center;justify-content:space-between;font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:#9B988F;animation:fadeIn 1s ease 1.2s both}
.hero-in{position:relative;z-index:5;height:720px;display:flex;flex-direction:column;justify-content:center}
@media (max-width:720px){.hero-in{height:660px}}
.hero-h1{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(34px,6vw,88px);line-height:.98;letter-spacing:-.02em;margin:22px 0 24px;max-width:960px;overflow-wrap:anywhere}
.ln{display:block;overflow:hidden;padding-bottom:.06em}
.ln-in{display:inline-block;animation:lnUp 1.1s cubic-bezier(.2,.8,.1,1) both}
.fade{animation:fadeUp 1s cubic-bezier(.2,.8,.2,1) both}
.x10{display:inline-flex;align-items:center;gap:14px;margin-top:30px;padding:12px 18px 12px 12px;border-radius:999px;border:1px solid rgba(242,181,68,.3);background:rgba(8,8,11,.5);font-size:14px;color:#C9C6BE}
.x10 b{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:#F2B544;color:#08080B;font-family:'Syne',sans-serif;font-weight:800;font-size:17px}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes lb{to{height:48px}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:scale(1.04)}to{transform:scale(1.12) translate(-22px,-10px)}}
@keyframes drift2{from{transform:scale(1.02)}to{transform:scale(1.09) translate(16px,-8px)}}
@keyframes fog{from{transform:translate(-14px,0)}to{transform:translate(20px,-12px)}}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-12px,8px)}50%{transform:translate(10px,-14px)}75%{transform:translate(-6px,12px)}100%{transform:translate(0,0)}}
@keyframes lnUp{from{transform:translateY(108%)}to{transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-14px,-8px)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes grow{from{width:0}}
/* capacities */
.cams{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.cam{display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:0 22px 0 14px;border-radius:999px;border:1px solid rgba(239,237,232,.12);background:transparent;color:#EFEDE8;font-size:15.5px;font-weight:500;transition:border-color .4s,background .4s}
.cam:hover{border-color:rgba(242,181,68,.45)}
.cam-tag{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:30px;padding:0 10px;border-radius:999px;background:rgba(239,237,232,.07);font-size:10.5px;letter-spacing:.22em;color:#9B988F;transition:all .4s}
.capbox{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:16px;overflow:hidden;border:1px solid rgba(239,237,232,.08);background:#121218}
@media (max-width:960px){.capbox{grid-template-columns:1fr}}
.cap-txt{padding:46px}
@media (max-width:720px){.cap-txt{padding:26px 22px}}
.cap-txt h3{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(28px,3vw,40px);line-height:1.05;margin:12px 0 14px;animation:fadeUp .6s both}
.cap-txt p{color:#C9C6BE;animation:fadeUp .6s .05s both}
.cap-list{display:grid;gap:0;margin-top:28px}
.cap-li{display:flex;align-items:center;gap:14px;min-height:56px;border-top:1px solid rgba(239,237,232,.08);font-size:16px;animation:fadeUp .6s both}
.cap-li i{flex:0 0 28px;height:28px;border-radius:50%;border:1px solid rgba(0,174,239,.45);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#5FD3FF}
.cap-vis{position:relative;min-height:440px;background:radial-gradient(60% 60% at 50% 50%,rgba(0,174,239,.12),transparent 70%),#0B0B10;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cap-vis svg{width:88%;max-width:460px;height:auto}
.cap-vis .flow{stroke-dasharray:6 6;animation:dash 1.6s linear infinite}
.cap-vis .spin{transform-origin:230px 170px;animation:rot 24s linear infinite}
.vis-tag{position:absolute;left:18px;top:16px;font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:#9B988F}
/* film strip */
.strip-wrap{position:relative;background:#040406;border-top:1px solid rgba(239,237,232,.06);border-bottom:1px solid rgba(239,237,232,.06)}
.strip{display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 40px;scrollbar-width:thin;scrollbar-color:#F2B544 #121218}
.strip::-webkit-scrollbar{height:6px}
.strip::-webkit-scrollbar-thumb{background:#F2B544;border-radius:6px}
.fr{position:relative;flex:0 0 360px;scroll-snap-align:start;padding:36px 12px;background:#040406;border:0;color:#EFEDE8;text-align:left}
.fr::before,.fr::after{content:"";position:absolute;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,transparent 0 12px,#1E1E26 12px 30px,transparent 30px 42px)}
.fr::before{top:11px}.fr::after{bottom:11px}
.fr-in{position:relative;display:block;height:330px;border-radius:6px;overflow:hidden;border:1px solid rgba(239,237,232,.08);transition:transform .6s cubic-bezier(.2,.8,.2,1),border-color .5s,box-shadow .5s}
.fr:hover .fr-in{transform:translateY(-6px);border-color:rgba(242,181,68,.4)}
.fr img{position:absolute;top:0;left:0;width:100%;height:330px;object-fit:cover;filter:brightness(.45) saturate(.75);transition:filter .6s,transform 1.4s}
.fr:hover img{filter:brightness(.6) saturate(1);transform:scale(1.06)}
.fr-sh{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(4,4,6,.1),rgba(4,4,6,.92))}
.fr-num{position:absolute;top:16px;left:18px;font-family:'Syne',sans-serif;font-weight:800;font-size:56px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(242,181,68,.7)}
.fr-code{position:absolute;top:22px;right:18px;font-size:10.5px;letter-spacing:.24em;color:#9B988F}
.fr-t{position:absolute;left:18px;right:18px;bottom:20px;font-family:'Syne',sans-serif;font-weight:700;font-size:21px;line-height:1.15}
.strip-hint{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:22px;font-size:13px;color:#9B988F}
.case{margin-top:30px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;padding:40px 44px;border-radius:16px;background:#121218;border:1px solid rgba(239,237,232,.08)}
@media (max-width:900px){.case{grid-template-columns:1fr;padding:26px 22px}}
.case h3{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(26px,2.8vw,38px);line-height:1.05;margin:10px 0 14px;animation:fadeUp .5s both}
.case p{color:#C9C6BE;animation:fadeUp .5s .05s both}
.case-gain{display:grid;gap:10px;align-content:start}
.case-gain div{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;border-radius:10px;background:#0C0C10;border:1px solid rgba(239,237,232,.06);font-size:15px;animation:fadeUp .5s both}
.case-gain svg{color:#F2B544;flex:0 0 auto}
.note{font-size:12.5px;color:#9B988F;margin-top:14px}
/* compare */
.seg{display:inline-flex;padding:5px;border-radius:999px;background:#121218;border:1px solid rgba(239,237,232,.1);gap:4px;margin-bottom:26px}
.seg button{min-height:46px;padding:0 22px;border-radius:999px;border:0;background:transparent;color:#C9C6BE;font-size:15px;font-weight:600;transition:background .4s,color .4s}
.cmp{border-radius:16px;overflow:hidden;border:1px solid rgba(239,237,232,.08)}
.cmp-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1.3fr);border-bottom:1px solid rgba(239,237,232,.07)}
.cmp-row:last-child{border-bottom:0}
@media (max-width:820px){.cmp-row{grid-template-columns:1fr}}
.cmp-row > div{padding:22px 24px;transition:background .5s,opacity .5s}
.cmp-h{background:#0C0C10;font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:#9B988F;font-weight:600}
.cmp-k{font-family:'Syne',sans-serif;font-weight:700;font-size:17px;background:#0E0E13}
.meter{display:flex;gap:5px;margin-bottom:10px}
.meter i{display:block;width:26px;height:6px;border-radius:3px;background:rgba(239,237,232,.12)}
.meter i.on{background:#F2B544;box-shadow:0 0 10px rgba(242,181,68,.5)}
.cmp-row span{font-size:15px;color:#C9C6BE}
.verdict{margin-top:22px;padding:24px 28px;border-radius:14px;border:1px solid rgba(242,181,68,.3);background:rgba(242,181,68,.06);display:flex;gap:18px;align-items:flex-start;animation:fadeUp .5s both}
.verdict b{font-family:'Syne',sans-serif;font-size:18px;display:block;margin-bottom:4px}
/* ATOM */
.atom{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:22px}
@media (max-width:960px){.atom{grid-template-columns:1fr}}
.tasks{display:grid;gap:10px;align-content:start}
.task{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:center;text-align:left;min-height:78px;padding:14px 18px;border-radius:12px;border:1px solid rgba(239,237,232,.1);background:#0E0E13;color:#EFEDE8;transition:border-color .4s,background .4s,transform .4s}
.task:hover{transform:translateX(4px);border-color:rgba(242,181,68,.35)}
.task-ic{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(239,237,232,.06);color:#9B988F;transition:all .4s}
.task b{display:block;font-family:'Syne',sans-serif;font-size:16px;line-height:1.2}
.task small{font-size:13px;color:#9B988F}
.console{position:relative;border-radius:16px;overflow:hidden;border:1px solid rgba(0,174,239,.25);background:linear-gradient(180deg,#0B0E13,#08080B);min-height:520px;display:flex;flex-direction:column}
.con-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-bottom:1px solid rgba(239,237,232,.07);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:#9B988F}
.con-top .dots{display:flex;gap:6px}
.con-top .dots i{width:10px;height:10px;border-radius:50%;background:#26262E}
.demo-badge{display:inline-flex;align-items:center;gap:8px;min-height:26px;padding:0 10px;border-radius:999px;border:1px solid rgba(242,181,68,.45);color:#F2B544;font-size:10px;letter-spacing:.22em}
.con-body{flex:1;padding:24px 24px 18px;font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;font-size:14px}
.con-prompt{color:#5FD3FF;margin-bottom:18px}
.con-step{display:flex;align-items:center;gap:14px;min-height:46px;border-bottom:1px dashed rgba(239,237,232,.07);color:#5F5D57;transition:color .4s}
.st-ic{flex:0 0 22px;height:22px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center}
.st-spin{border-color:#5FD3FF;border-top-color:transparent;animation:rot .8s linear infinite}
.con-bar{height:3px;background:rgba(239,237,232,.06)}
.con-bar i{display:block;height:3px;background:linear-gradient(90deg,#00AEEF,#F2B544);transition:width .6s ease}
.result{margin:0 24px 24px;padding:18px 20px;border-radius:12px;background:rgba(242,181,68,.08);border:1px solid rgba(242,181,68,.35);display:flex;gap:14px;align-items:flex-start;font-size:15px;animation:fadeUp .5s both}
.con-idle{margin:auto 24px 24px;color:#9B988F;font-size:14px;font-family:'Outfit',sans-serif}
/* cta + footer */
.cta{position:relative;padding:150px 0;overflow:hidden;text-align:center}
.cta-bg{position:absolute;top:-40px;left:-40px;right:-40px;bottom:-40px;background:url(assets/wafer.webp) center/cover;filter:brightness(.3) saturate(.8);animation:kb 20s ease-in-out infinite alternate}
.cta-shade{position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(70% 70% at 50% 50%,rgba(8,8,11,.3),#08080B)}
.cta-in{position:relative;z-index:2}
.cta h2{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(34px,5.6vw,80px);line-height:1;letter-spacing:-.02em;margin:22px auto 34px;max-width:1000px;overflow-wrap:anywhere}
.ftr{background:#050507;border-top:1px solid rgba(239,237,232,.07);padding:90px 0 36px}
.ftr-word{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(46px,13vw,184px);line-height:.9;letter-spacing:.04em;color:transparent;-webkit-text-stroke:1px rgba(242,181,68,.4);transition:color .8s;margin-bottom:60px;overflow-wrap:anywhere}
.ftr-word:hover{color:rgba(242,181,68,.12)}
.ftr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:36px}
.ftr h4{font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;color:#9B988F;font-weight:600;margin-bottom:16px}
.ftr-grid a,.ftr-grid p{display:flex;align-items:center;min-height:36px;color:#D3D0C8;font-size:15px;transition:color .3s}
.ftr-grid a:hover{color:#F2B544}
.ftr-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;margin-top:60px;padding-top:26px;border-top:1px solid rgba(239,237,232,.07);font-size:13px;color:#9B988F}
.ftr-bottom a{min-height:44px;display:inline-flex;align-items:center}
.ftr-bottom a:hover{color:#F2B544}
</style>
</helmet>

class Component extends DCLogic {
  constructor(props){

      { t:'Optimisation des processus', img:'assets/server-cables.webp', d:'Repérer les étapes lentes ou répétitives et les automatiser intelligemment, sans casser les outils que vos équipes utilisent déjà.', note:'', gains:['Moins de tâches fastidieuses','Flux de travail rationalisés','Efficacité opérationnelle'] },
      { t:'Modèles affinés vs RAG', img:'assets/wafer.webp', d:'Quand un modèle affiné sur votre domaine apporte une précision supérieure, des réponses plus rapides et une intelligence spécifique — et quand le RAG suffit.', note:'', gains:['Précision supérieure','Réponses plus rapides','Intelligence spécifique au métier'] },
      { t:'Automatisation métier agentique', img:'assets/cpu-hand.webp', d:'Des agents coordonnés qui prennent des décisions, enchaînent les actions et apprennent de chaque exécution, sous votre supervision.', note:'', gains:['Processus de bout en bout','Coordination multi-agents','Amélioration continue'] }
    ];
    const cases = CASES.map((k, i) => ({ n: this.pad(i + 1), t: k.t, img: k.img, code: 'PLAN ' + this.pad(i + 1) + 'A',
      pressed: s.cs === i ? 'true' : 'false',
      style: s.cs === i ? 'border-color:#F2B544;box-shadow:0 0 0 1px #F2B544,0 24px 60px -24px rgba(242,181,68,.55)' : '',
      pick: () => this.setState({ cs: i }) }));
    const K = CASES[s.cs];
    const cs = { n: this.pad(s.cs + 1), t: K.t, d: K.d, note: K.note, hasNote: !!K.note, gains: K.gains.map((g, j) => ({ t: g, delay: 'animation-delay:' + (0.08 * j).toFixed(2) + 's' })) };

    const ROWS = [
      { k:'Précision sur votre domaine', f:4, r:3, ft:'Supérieure : le modèle a appris votre vocabulaire et vos cas.', rag:'Dépend de la qualité des documents retrouvés.' },
      { k:'Vitesse de réponse', f:4, r:3, ft:'Plus rapide : aucune étape de recherche préalable.', rag:'Une recherche documentaire précède chaque réponse.' },
      { k:'Intelligence spécifique', f:4, r:2, ft:'Raisonne avec la logique de votre métier.', rag:'Cite vos documents, raisonne en généraliste.' },
      { k:'Mise à jour des connaissances', f:2, r:4, ft:'Passe par l’apprentissage continu du modèle.', rag:'Il suffit d’ajouter ou de modifier des documents.' }
    ];
    const ft = s.cmp === 'ft';
    const HL = 'background:rgba(242,181,68,.07)', DIM = 'opacity:.5';
    const meter = (n) => [0, 1, 2, 3].map(j => j < n ? 'background:#F2B544;box-shadow:0 0 10px rgba(242,181,68,.5)' : '');
    const rows = ROWS.map(r => ({ k: r.k, ft: r.ft, rag: r.rag, ftM: meter(r.f), ragM: meter(r.r), ftCol: ft ? HL : DIM, ragCol: ft ? DIM : HL }));

    const TASKS = [
      { t:'Trier les demandes du support', s:'File entrante · base de connaissances', steps:['Lecture de la file de demandes','Classification par intention et urgence','Recherche dans la base de connaissances','Rédaction des réponses proposées','Escalade des cas sensibles vers un humain'], r:'File triée : réponses prêtes à valider, cas sensibles transmis à l’équipe.' },
      { t:'Préparer le rapport hebdomadaire', s:'Indicateurs · synthèse', steps:['Collecte des indicateurs de la semaine','Détection des écarts et tendances','Rédaction de la synthèse','Mise en forme du rapport','Envoi pour relecture'], r:'Synthèse prête : écarts signalés et recommandations proposées.' },
      { t:'Qualifier un nouveau prospect', s:'Demande entrante · formule', steps:['Lecture de la demande','Enrichissement du contexte','Évaluation de la priorité','Suggestion de formule adaptée','Brouillon de réponse personnalisée'], r:'Prospect qualifié : formule suggérée et réponse rédigée en brouillon.' }
    ];
    const T = TASKS[s.task];
    const tasks = TASKS.map((t, i) => ({ t: t.t, s: t.s,
      pressed: s.task === i ? 'true' : 'false',
      style: s.task === i ? 'border-color:rgba(242,181,68,.5);background:#121218' : '',
      ic: s.task === i ? 'background:#F2B544;color:#08080B' : '',
      pick: () => { this.stop(); this.setState({ task: i, run: 0, shown: 0 }); } }));
    const conSteps = T.steps.map((x, i) => {
      const done = s.run > 0 && i < s.shown;
      const active = s.run === 1 && i === s.shown;
      return { t: x, done: done, active: active, wait: !done && !active,
        style: done ? 'color:#EFEDE8' : (active ? 'color:#5FD3FF' : '') };
    });

    return {
      menuOpen: s.menu,
      menuLabel: s.menu ? 'Fermer le menu' : 'Ouvrir le menu',
      menuExp: s.menu ? 'true' : 'false',
      toggleMenu: () => this.setState({ menu: !s.menu }),
      onMove: (e) => this.move(e),
      onLeave: () => this.setState({ mx: 0, my: 0 }),
      L0: tr(12), L1: tr(30), L2: tr(60),
      grainOn: pr.grain !== false,
      lbOn: pr.letterbox !== false,
      cams: cams, cap: cap, v0: s.cap === 0, v1: s.cap === 1, v2: s.cap === 2,
      cases: cases, cs: cs,
      pickFt: () => this.setState({ cmp: 'ft' }),
      pickRag: () => this.setState({ cmp: 'rag' }),
      ftPressed: ft ? 'true' : 'false', ragPressed: ft ? 'false' : 'true',
      ftBtn: ft ? 'background:#F2B544;color:#08080B' : '',
      ragBtn: ft ? '' : 'background:#F2B544;color:#08080B',
      ftCol: ft ? 'color:#F2B544' : '', ragCol: ft ? '' : 'color:#F2B544',
      rows: rows,
      verdictT: ft ? 'Choisissez le modèle affiné quand…' : 'Choisissez le RAG quand…',
      verdictD: ft ? 'la précision, la rapidité et un raisonnement propre à votre métier priment — support expert, décisions récurrentes, vocabulaire spécialisé.' : 'vos connaissances changent souvent et doivent être citées telles quelles — documentation vivante, catalogues, procédures mises à jour.',
      tasks: tasks, task: T, conSteps: conSteps,
      launch: () => this.launch(),
      launchLabel: s.run === 1 ? 'ATOM travaille…' : (s.run === 2 ? 'Relancer ATOM' : 'Lancer ATOM'),
      barStyle: 'width:' + (s.run === 0 ? 0 : s.shown * 20) + '%',
      isDone: s.run === 2,
      isIdle: s.run === 0
    };
  }
}
</script>
