<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Monolithe — IA</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#0B0B0A}
sc-for,sc-if{display:contents}
.m-root{font-family:'Manrope',system-ui,sans-serif;font-size:16px;line-height:1.6;color:#F3EFE7;background:#0B0B0A;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.m-root *,.m-root *::before,.m-root *::after{box-sizing:border-box}
.m-root img{display:block;max-width:100%}
.m-root button{font-family:inherit;cursor:pointer}
.m-root a:focus-visible,.m-root button:focus-visible,.m-root input:focus-visible,.m-root textarea:focus-visible{outline:1px solid var(--acc);outline-offset:4px}
.wrap{max-width:1280px;margin:0 auto;padding:0 48px}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.ink{background:#0B0B0A;color:#F3EFE7}
.ivory{background:#F3EFE7;color:#0B0B0A}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;line-height:1.5;margin:0}
.ink .lbl,.ink .muted{color:#ADA89E}
.ivory .lbl,.ivory .muted{color:#5E5A53}
.ivory p{color:#2A2926}
.ink p{color:#D6D1C7}
.sec{padding:140px 0;position:relative}
.chap{display:flex;align-items:center;gap:16px;margin:0 0 34px}
.chap-n{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:24px;line-height:1;min-width:30px}
.chap-l{display:block;width:56px;height:1px;background:var(--acc);flex:none}
.h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(52px,7.4vw,118px);line-height:.96;letter-spacing:-.015em;margin:0;overflow-wrap:anywhere}
.h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(40px,5vw,76px);line-height:1.02;letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
.h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(26px,2.4vw,36px);line-height:1.12;margin:0}
.h1 em,.h2 em,.h3 em{font-style:italic}
.lead{font-size:18px;line-height:1.7;max-width:560px;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:50px;padding:0 28px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;border:1px solid transparent;border-radius:0;transition:background .35s,color .35s,border-color .35s}
.btn .arr{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.btn:hover .arr{transform:translateX(6px)}
.btn-light{background:#F3EFE7;color:#0B0B0A}
.btn-light:hover{background:#FFFFFF}
.btn-ghost{color:#F3EFE7;border-color:rgba(243,239,231,.32);background:transparent}
.btn-ghost:hover{border-color:#F3EFE7}
.btn-dark{background:#0B0B0A;color:#F3EFE7}
.btn-dark:hover{background:#2A2926}
.btn-out{color:#0B0B0A;border-color:rgba(11,11,10,.4);background:transparent}
.btn-out:hover{border-color:#0B0B0A}
.acc-fill{fill:var(--acc)}
/* header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(11,11,10,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(243,239,231,.08)}
.hdr-in{display:flex;align-items:center;gap:36px;height:84px}
.logo{display:inline-flex;align-items:center;gap:14px;text-decoration:none;color:#F3EFE7;min-height:44px}
.logo-w{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:21px;letter-spacing:.34em;text-transform:uppercase}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:13px;font-weight:500;letter-spacing:.04em;color:#CFCAC0;text-decoration:none;transition:color .3s}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:8px;height:1px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.nav a:hover,.nav a[aria-current="page"]{color:#F3EFE7}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1)}
.burger{display:none;margin-left:auto;width:48px;height:48px;align-items:center;justify-content:center;background:transparent;border:1px solid rgba(243,239,231,.25);color:#F3EFE7}
.mnav{display:flex;flex-direction:column;padding-top:8px;padding-bottom:28px;border-top:1px solid rgba(243,239,231,.08);animation:drop .4s ease both}
.ml{display:flex;align-items:center;justify-content:space-between;min-height:58px;font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;color:#F3EFE7;text-decoration:none;border-bottom:1px solid rgba(243,239,231,.08)}
.mnav .btn{margin-top:22px}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
@media(max-width:1000px){.nav,.hdr-cta{display:none}.burger{display:inline-flex}}
@media(min-width:1001px){.mnav{display:none}}
/* footer */
.ftr{padding:110px 0 40px;border-top:1px solid rgba(243,239,231,.08)}
.ftr-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:48px}
.ftr-col{display:flex;flex-direction:column;align-items:flex-start}
.ftr-h{margin-bottom:14px}
.ftr-col a{display:inline-flex;align-items:center;min-height:38px;font-size:14px;color:#D6D1C7;text-decoration:none;transition:color .3s}
.ftr-col a:hover{color:#F3EFE7}
.ftr .ftr-tag{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:30px;line-height:1.15;margin:0;color:#F3EFE7}
.ftr-addr{font-style:normal;font-size:14px;line-height:1.8;color:#D6D1C7;margin-bottom:6px}
.ftr-giant{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;font-size:clamp(84px,16vw,236px);line-height:.9;letter-spacing:-.02em;margin:90px 0 36px;color:#F3EFE7;display:flex;align-items:flex-end;gap:24px}
.ftr-giant i{display:block;flex:1;height:1px;background:var(--acc);margin-bottom:.16em;font-style:normal}
.ftr-bot{display:flex;flex-wrap:wrap;gap:10px 32px;justify-content:space-between;align-items:center;padding-top:26px;border-top:1px solid rgba(243,239,231,.1);font-size:13px;color:#ADA89E}
.ftr-bot a{color:#F3EFE7;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.ftr-bot a:hover{text-decoration:underline}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
@keyframes panel{from{opacity:0;transform:translateY(18px)}}
.rise{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.25s}.d3{animation-delay:.45s}.d4{animation-delay:.65s}
@supports (animation-timeline: view()){.rv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% cover 26%}}
@media(max-width:700px){.wrap{padding:0 20px}.sec{padding:96px 0}}
@media (prefers-reduced-motion: reduce){.m-root *{animation:none !important;transition:none !important}}
.head-split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:60px;align-items:end}
@media(max-width:980px){.head-split{grid-template-columns:1fr;gap:32px}}

/* hero : monolithe ATOM */
.hero{padding:96px 0 120px;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:48px;align-items:center}
.stage{position:relative;height:600px;perspective:1600px;display:flex;justify-content:center}
.halo{position:absolute;left:50%;top:0;width:540px;height:540px;margin-left:-270px;border-radius:50%;background:radial-gradient(closest-side,rgba(243,239,231,.11),rgba(243,239,231,0));pointer-events:none}
.mono{position:relative;width:210px;height:420px;margin-top:40px;transform-style:preserve-3d;animation:turn 18s ease-in-out infinite}
@keyframes turn{0%,100%{transform:rotateY(14deg) rotateX(3deg)}50%{transform:rotateY(-12deg) rotateX(3deg)}}
.face{position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;background-color:#0D0C0B;background-image:radial-gradient(rgba(243,239,231,.07) 1px,transparent 1.2px),linear-gradient(102deg,#1B1A18 0%,#0D0C0B 34%,#201F1D 50%,#0B0B0A 66%,#151413 100%);background-size:14px 14px,100% 100%;border:1px solid rgba(243,239,231,.16);box-shadow:0 70px 120px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(243,239,231,.24)}
.scan{position:absolute;left:0;right:0;height:1px;background:var(--acc);box-shadow:0 0 14px var(--acc);opacity:.85;animation:scan 5s cubic-bezier(.5,0,.5,1) infinite}
@keyframes scan{0%{top:6%}50%{top:92%}100%{top:6%}}
.side{position:absolute;top:0;width:32px;height:420px;background:linear-gradient(180deg,#252422,#070707);border:1px solid rgba(243,239,231,.08)}
.side-r{right:0;transform-origin:right center;transform:rotateY(-90deg)}
.side-l{left:0;transform-origin:left center;transform:rotateY(90deg)}
.atom{position:absolute;left:0;right:0;top:150px;text-align:center}
.atom-t{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:44px;letter-spacing:.3em;padding-left:.3em;color:#F3EFE7;line-height:1}
.atom-s{margin-top:14px;font-size:9.5px;font-weight:600;letter-spacing:.36em;text-transform:uppercase;color:#ADA89E}
.atom-dots{display:flex;justify-content:center;gap:6px;margin-top:26px}
.atom-dots span{width:5px;height:5px;border-radius:50%;background:#F3EFE7;opacity:.25;animation:blink 1.4s ease-in-out infinite}
.atom-dots span:nth-child(2){animation-delay:.2s}.atom-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
.refl{position:absolute;top:424px;left:0;width:210px;height:180px;background:linear-gradient(180deg,rgba(38,37,35,.8),rgba(11,11,10,0) 85%);-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 70%);mask-image:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 70%)}
.floor{position:absolute;left:0;right:0;top:463px;height:1px;background:linear-gradient(90deg,rgba(243,239,231,0),rgba(243,239,231,.22),rgba(243,239,231,0))}
.floor::after{content:"";position:absolute;left:50%;top:0;width:90px;margin-left:-45px;height:1px;background:var(--acc)}
.promise{display:flex;align-items:flex-end;gap:24px;margin-top:48px;padding-top:30px;border-top:1px solid rgba(243,239,231,.14);max-width:560px}
.promise .big{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;font-size:96px;line-height:.8}
.promise p{margin:0;font-size:14.5px}
@media(max-width:980px){.hero-grid{grid-template-columns:1fr}}

/* I — capacités */
.caps{display:flex;gap:16px;margin-top:80px;min-height:520px}
.cap{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;flex:1;min-width:0;padding:36px 34px;background:#E9E4DA;border:0;color:#0B0B0A;text-align:left;overflow:hidden;transition:flex .8s cubic-bezier(.2,.7,.2,1),background .5s,color .5s}
.cap:hover{background:#DFD9CD}
.cap-top{display:flex;justify-content:space-between;width:100%}
.cap .serif{font-style:italic;font-size:24px}
.cap-t{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(28px,2.8vw,42px);line-height:1.05;margin:0}
.cap-d{font-size:15px;line-height:1.65;margin:14px 0 0;max-width:440px}
.cap-pts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;margin-top:28px;width:100%;animation:panel .7s .15s cubic-bezier(.2,.7,.2,1) both}
.cap-pt{display:flex;gap:12px;align-items:baseline;padding:12px 0;border-top:1px solid rgba(243,239,231,.18);font-size:14px;color:#D6D1C7}
.cap-pt::before{content:"";width:10px;height:1px;background:var(--acc);flex:none;transform:translateY(-4px)}
.cap-ring{position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;border:1px solid currentColor;opacity:.12}
.cap-ring::after{content:"";position:absolute;top:30px;left:30px;right:30px;bottom:30px;border-radius:50%;border:1px solid currentColor}
@media(max-width:900px){.caps{flex-direction:column;min-height:0}.cap{min-height:200px}.cap-pts{grid-template-columns:1fr}}

/* II — cas d'usage */
.uc-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:72px;margin-top:80px;align-items:start}
.uc{position:relative;display:grid;grid-template-columns:56px 1fr;align-items:center;width:100%;min-height:76px;padding:0;background:transparent;border:0;border-top:1px solid rgba(243,239,231,.12);color:#9A958B;text-align:left;transition:color .4s,padding .5s}
.uc:last-child{border-bottom:1px solid rgba(243,239,231,.12)}
.uc:hover{color:#F3EFE7;padding-left:8px}
.uc .num{font-size:12px;font-weight:600;letter-spacing:.14em}
.uc-t{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(22px,2vw,28px);line-height:1.15}
.uc-bar{position:absolute;left:0;top:-1px;height:1px;width:100%;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.uc-panel{position:relative;padding:52px;border:1px solid rgba(243,239,231,.12);background:linear-gradient(160deg,#151514,#0B0B0A 70%);min-height:520px;overflow:hidden;animation:panel .6s cubic-bezier(.2,.7,.2,1) both}
.uc-ghost{position:absolute;right:24px;top:-30px;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;font-size:230px;line-height:1;color:rgba(243,239,231,.05)}
.uc-panel p{font-size:17px;line-height:1.7;max-width:560px}
.uc-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:36px}
.uc-step{padding:20px 18px;border:1px solid rgba(243,239,231,.14);animation:panel .6s cubic-bezier(.2,.7,.2,1) both}
.uc-step:nth-child(2){animation-delay:.12s}.uc-step:nth-child(3){animation-delay:.24s}
.uc-step .serif{font-style:italic;font-size:20px;color:#ADA89E}
.uc-step div{font-size:14px;margin-top:8px;color:#F3EFE7}
.uc-note{display:inline-block;margin-top:26px;padding:8px 14px;border:1px solid rgba(243,239,231,.2);font-size:12.5px;color:#D6D1C7}
@media(max-width:980px){.uc-grid{grid-template-columns:1fr;gap:40px}.uc-panel{padding:32px 24px;min-height:0}.uc-flow{grid-template-columns:1fr}}

/* III — comparateur */
.seg{display:inline-flex;border:1px solid #0B0B0A;margin-top:56px}
.seg button{min-height:50px;padding:0 24px;background:transparent;border:0;color:#0B0B0A;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;transition:background .4s,color .4s}
.seg button + button{border-left:1px solid #0B0B0A}
.cmp{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:72px;margin-top:56px;align-items:start}
.crit{padding:22px 0;border-top:1px solid rgba(11,11,10,.16)}
.crit-h{display:flex;justify-content:space-between;gap:16px;font-size:15px;font-weight:600;margin-bottom:14px}
.bar-row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:16px;margin-top:8px;font-size:12.5px;color:#5E5A53;transition:opacity .5s}
.bar{height:6px;background:#E2DCD0;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#0B0B0A;transition:width 1s cubic-bezier(.2,.7,.2,1),background .5s}
.verdict{padding:44px;background:#0B0B0A;color:#F3EFE7;animation:panel .6s cubic-bezier(.2,.7,.2,1) both}
.verdict p{color:#D6D1C7 !important;font-size:16px;line-height:1.7}
.verdict .lbl{color:#ADA89E !important}
.verdict-t{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;font-size:36px;line-height:1.15;margin:16px 0 0}
.illus{margin-top:18px;font-size:12.5px;color:#5E5A53}
@media(max-width:900px){.cmp{grid-template-columns:1fr;gap:40px}.bar-row{grid-template-columns:90px 1fr}.seg{display:flex;flex-direction:column}.seg button + button{border-left:0;border-top:1px solid #0B0B0A}}

/* IV — démo ATOM */
.demo{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:0;margin-top:80px;border:1px solid rgba(243,239,231,.16)}
.demo-l{padding:40px;border-right:1px solid rgba(243,239,231,.16)}
.task{display:flex;align-items:center;gap:16px;width:100%;min-height:72px;padding:14px 16px;margin-top:10px;background:transparent;border:1px solid rgba(243,239,231,.14);color:#D6D1C7;text-align:left;font-size:15px;transition:border-color .4s,color .4s,background .4s}
.task:hover{border-color:rgba(243,239,231,.5);color:#F3EFE7}
.task-r{width:16px;height:16px;border-radius:50%;border:1px solid currentColor;flex:none;position:relative}
.run{width:100%;margin-top:28px}
.demo-r{display:flex;flex-direction:column;min-height:560px;background:linear-gradient(180deg,#121211,#0B0B0A)}
.con-h{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid rgba(243,239,231,.12)}
.con-h .who{display:flex;align-items:center;gap:12px;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;letter-spacing:.2em}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:blink 1.6s ease-in-out infinite}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:6px 10px;border:1px solid rgba(243,239,231,.3);color:#F3EFE7}
.prog{height:1px;background:rgba(243,239,231,.1);position:relative}
.prog i{position:absolute;left:0;top:0;height:1px;background:var(--acc);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.con-b{flex:1;padding:28px}
.idle{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:380px;max-width:420px}
.idle .serif{font-style:italic;font-size:30px;line-height:1.25;color:#F3EFE7}
.line{display:grid;grid-template-columns:36px 1fr 24px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(243,239,231,.08);font-size:15px;color:#F3EFE7;animation:typein .7s steps(28,end) both}
@keyframes typein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.line .k{font-size:11.5px;font-weight:600;letter-spacing:.14em;color:#ADA89E}
.spin{width:14px;height:14px;border-radius:50%;border:1px solid rgba(243,239,231,.25);border-top-color:var(--acc);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.result{margin-top:26px;padding:26px 28px;background:#F3EFE7;color:#0B0B0A;animation:panel .7s cubic-bezier(.2,.7,.2,1) both}
.result p{margin:8px 0 0;color:#2A2926 !important;font-size:15px}
.result .lbl{color:#5E5A53 !important}
.result-t{font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;line-height:1.15}
.con-f{padding:14px 28px;border-top:1px solid rgba(243,239,231,.12);font-size:12.5px;color:#ADA89E}
@media(max-width:900px){.demo{grid-template-columns:1fr}.demo-l{border-right:0;border-bottom:1px solid rgba(243,239,231,.16);padding:28px 20px}.con-b{padding:20px}}

.cta{text-align:center;padding:160px 0}
.cta .h2{font-size:clamp(44px,6vw,96px)}
.cta .ctas{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:48px}
</style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":6100},"accent":{"editor":"color","default":"#00AEEF","options":["#00AEEF","#7C5CFF","#F5B700"]}}'>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { menu: false, cap: 0, cas: 0, mode: 0, tache: 0, step: -1, running: false }; this.timer = null; }
  componentWillUnmount() { if (this.timer) { clearInterval(this.timer); this.timer = null; } }
  renderVals() {
    var self = this, s = this.state;
    var acc = (this.props && this.props.accent) || '#00AEEF';
    var CAPS = [
      { n: 'i.', k: 'Sur vos données', t: 'Affinage de modèles', d: 'Des modèles entraînés sur vos données et vos cas d’usage, pour une intelligence propre à votre domaine.', pts: ['Formation spécifique au domaine', 'Optimisation des performances', 'Apprentissage continu', 'Confidentialité & sécurité'] },
      { n: 'ii.', k: 'Qui décident', t: 'Agents autonomes', d: 'Des agents capables d’exécuter des tâches complexes, de prendre des décisions et de s’adapter.', pts: ['Automatisation de tâches', 'Prise de décision', 'Coordination multi-agents', 'Apprentissage & adaptation'] },
      { n: 'iii.', k: 'Dans vos processus', t: 'Intégration métier', d: 'L’IA insérée dans vos processus existants, sans rupture pour vos équipes.', pts: ['Automatisation des flux', 'Traitement de données', 'Analytique prédictive', 'Insights temps réel'] }
    ];
    var caps = CAPS.map(function (c, i) {
      var on = s.cap === i;
      return {
        n: c.n, k: c.k, t: c.t, d: c.d, active: on, pressed: on ? 'true' : 'false',
        pts: c.pts.map(function (x) { return { x: x }; }),
        style: on ? 'flex:2.3;background:#0B0B0A;color:#F3EFE7' : '',
        lblStyle: on ? 'color:#ADA89E' : '',
        pick: function () { self.setState({ cap: i }); }
      };
    });
    var CAS = [
      { t: 'Automatisation du support client', d: 'Des agents qui comprennent les demandes, y répondent ou agissent, et passent la main quand il le faut. Notre promesse : traiter jusqu’à 90 % des demandes avec une qualité de réponse de niveau humain.', flow: ['Comprendre la demande', 'Répondre ou agir', 'Escalader vers un humain si nécessaire'], note: 'Promesse affichée par Baquelis — non une statistique.' },
      { t: 'Pipeline de génération de contenu', d: 'Produire, relire et adapter des contenus à grande échelle, dans le ton de votre marque et sous contrôle éditorial.', flow: ['Brief et sources', 'Génération et relecture', 'Validation humaine'], note: 'Le dernier mot reste toujours à vos équipes.' },
      { t: 'Intelligence métier prédictive', d: 'Anticiper plutôt que constater : des modèles qui lisent vos données pour éclairer les décisions à venir.', flow: ['Collecte des données', 'Analytique prédictive', 'Insights temps réel'], note: 'Des modèles entraînés sur vos propres données.' },
      { t: 'Optimisation des processus', d: 'Repérer les frictions, automatiser les étapes répétitives et mesurer le gain, processus par processus.', flow: ['Cartographier', 'Automatiser les flux', 'Mesurer et ajuster'], note: 'Une amélioration continue, pas un chantier ponctuel.' },
      { t: 'Modèles affinés vs RAG', d: 'Choisir la bonne approche pour votre cas : un modèle affiné apporte une précision supérieure, des réponses plus rapides et une intelligence spécifique à votre domaine.', flow: ['Précision supérieure', 'Réponses plus rapides', 'Intelligence spécifique'], note: 'Voir le comparateur ci-dessous.' },
      { t: 'Automatisation métier agentique', d: 'Plusieurs agents coordonnés qui prennent en charge un processus de bout en bout, en s’adaptant aux situations imprévues.', flow: ['Coordination multi-agents', 'Prise de décision', 'Apprentissage & adaptation'], note: 'Supervision humaine à chaque point clé.' }
    ];
    var cas = CAS.map(function (u, i) {
      var on = s.cas === i;
      return {
        n: '0' + (i + 1), t: u.t, d: u.d, note: u.note, active: on, pressed: on ? 'true' : 'false',
        flow: u.flow.map(function (x, j) { return { n: ['i.', 'ii.', 'iii.'][j], x: x }; }),
        rowStyle: on ? 'color:#F3EFE7;padding-left:8px' : '',
        barStyle: on ? 'transform:scaleX(1)' : '',
        pick: function () { self.setState({ cas: i }); }
      };
    });
    var MODES = [
      { t: 'Modèle affiné', k: 'Point de vue — modèle affiné', v: 'Quand la précision sur votre métier prime.', d: 'Le modèle apprend votre domaine en profondeur : précision supérieure, réponses plus rapides, intelligence spécifique. C’est l’approche que nous privilégions pour les cas d’usage critiques.' },
      { t: 'RAG', k: 'Point de vue — RAG', v: 'Quand vos connaissances changent chaque jour.', d: 'La recherche augmentée interroge vos documents à chaque requête : utile lorsque les informations évoluent très vite. Nous la combinons souvent à un modèle affiné.' }
    ];
    var modes = MODES.map(function (m, i) {
      var on = s.mode === i;
      return { t: m.t, k: m.k, v: m.v, d: m.d, active: on, pressed: on ? 'true' : 'false', style: on ? 'background:#0B0B0A;color:#F3EFE7' : '', pick: function () { self.setState({ mode: i }); } };
    });
    var CR = [
      { t: 'Précision sur votre domaine', a: 5, b: 3 },
      { t: 'Rapidité de réponse', a: 5, b: 3 },
      { t: 'Intelligence spécifique', a: 5, b: 3 },
      { t: 'Prise en compte d’informations très récentes', a: 3, b: 5 }
    ];
    var crits = CR.map(function (c) {
      var aOn = s.mode === 0;
      return {
        t: c.t, win: c.a > c.b ? 'Avantage : modèle affiné' : 'Avantage : RAG',
        aBar: 'width:' + (c.a * 20) + '%;background:' + (aOn ? '#0B0B0A' : '#B9B2A5'),
        bBar: 'width:' + (c.b * 20) + '%;background:' + (aOn ? '#B9B2A5' : '#0B0B0A'),
        aRow: aOn ? '' : 'opacity:.6', bRow: aOn ? 'opacity:.6' : ''
      };
    });
    var TACHES = [
      { t: 'Trier les demandes du support', steps: ['Lecture des demandes entrantes', 'Classement par intention et par urgence', 'Rédaction de réponses pour les demandes simples', 'Escalade des cas sensibles vers l’équipe', 'Synthèse transmise au responsable'], rt: 'File triée, réponses proposées.', rd: 'Les cas sensibles attendent une validation humaine. Démonstration : aucune réponse n’a été envoyée.' },
      { t: 'Préparer la synthèse hebdomadaire', steps: ['Collecte des rapports d’avancement', 'Extraction des faits marquants', 'Détection des risques et blocages', 'Rédaction de la synthèse', 'Mise en forme pour la direction'], rt: 'Synthèse prête à relire.', rd: 'Faits marquants, risques et décisions à prendre, sur une page. Démonstration scénarisée.' },
      { t: 'Anticiper la charge du mois', steps: ['Lecture de l’historique d’activité', 'Détection des tendances', 'Projection de la charge à venir', 'Recommandations d’organisation', 'Mise à jour du tableau de bord'], rt: 'Projection disponible.', rd: 'Une recommandation d’organisation, à valider par vos équipes. Démonstration scénarisée.' }
    ];
    var tk = TACHES[s.tache];
    var taches = TACHES.map(function (t, i) {
      var on = s.tache === i;
      return {
        t: t.t, pressed: on ? 'true' : 'false',
        style: on ? 'border-color:#F3EFE7;color:#F3EFE7;background:rgba(243,239,231,.04)' : '',
        dot: on ? ('background:' + acc + ';border-color:' + acc) : '',
        pick: function () { if (self.timer) { clearInterval(self.timer); self.timer = null; } self.setState({ tache: i, step: -1, running: false }); }
      };
    });
    var total = tk.steps.length;
    var lines = [];
    if (s.step >= 0) {
      for (var j = 0; j <= Math.min(s.step, total - 1); j++) {
        var doing = s.running && j === s.step;
        lines.push({ k: '0' + (j + 1), x: tk.steps[j], doing: doing, done: !doing });
      }
    }
    var finished = s.step >= total;
    var pct = s.step < 0 ? 0 : Math.min(100, Math.round((Math.min(s.step + (finished ? 0 : 1), total) / total) * 100));
    return {
      rootStyle: '--acc:' + acc,
      menu: s.menu, menuExp: s.menu ? 'true' : 'false',
      toggleMenu: function () { self.setState({ menu: !s.menu }); },
      caps: caps, cas: cas, modes: modes, crits: crits, taches: taches,
      lines: lines, idle: s.step < 0, finished: finished,
      resultT: tk.rt, resultD: tk.rd,
      progStyle: 'width:' + pct + '%',
      runLabel: s.running ? 'ATOM travaille…' : (finished ? 'Relancer ATOM' : 'Lancer ATOM'),
      run: function () {
        if (self.state.running) return;
        if (self.timer) clearInterval(self.timer);
        self.setState({ step: 0, running: true });
        self.timer = setInterval(function () {
          var st = self.state.step + 1;
          if (st >= total) {
            clearInterval(self.timer); self.timer = null;
            self.setState({ step: total, running: false });
          } else {
            self.setState({ step: st });
          }
        }, 1100);
      }
    };
  }
}
</script>
