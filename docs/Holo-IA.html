<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Holo — IA</title>

<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Unbounded:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F3F8}
sc-for,sc-if{display:contents}
.hl,.hl *{box-sizing:border-box}
.hl{font-family:'Figtree',system-ui,sans-serif;background:#F4F3F8;color:#14131A;line-height:1.55;font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased}
.hl h1,.hl h2,.hl h3,.hl h4,.hl p{margin:0}
.hl img{display:block;max-width:100%}
.disp{font-family:'Unbounded','Figtree',sans-serif;font-weight:600;letter-spacing:-.025em;line-height:1.06;overflow-wrap:anywhere}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px;position:relative}
.sec{padding:120px 0;position:relative}
.h2{font-size:clamp(28px,3.3vw,48px)}
.lead{font-size:clamp(17px,1.35vw,20px);color:#5D5B6A;max-width:620px}
.muted{color:#5D5B6A}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#5D5B6A;display:inline-flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:26px;height:10px;border-radius:10px;background:conic-gradient(from 200deg,#ffcdee,#c4ebff,#cdfde6,#fff1bd,#e0cdff,#ffcdee);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.glass{background:rgba(255,255,255,.6);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 30px 70px -40px rgba(40,30,90,.35);border-radius:28px}
.lnk{color:#006A93;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.lnk:hover{text-decoration:underline;text-underline-offset:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;color:#14131A;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,background .3s}
.btn-p{background:#0093CC;box-shadow:0 14px 34px -14px rgba(0,147,204,.75)}
.btn-p::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);transition:transform .8s ease}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 20px 44px -16px rgba(0,147,204,.85)}
.btn-p:hover::after{transform:translateX(120%)}
.btn-g{background:rgba(255,255,255,.75);border:1px solid rgba(20,19,26,.12)}
.btn-g:hover{background:#fff;transform:translateY(-2px)}
.btn[aria-disabled="true"]{opacity:.6;cursor:progress}
.hl a:focus-visible,.hl button:focus-visible,.hl input:focus-visible,.hl textarea:focus-visible{outline:3px solid #0093CC;outline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(20,19,26,.1);font-size:13px;font-weight:500}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes dash{to{background-position:24px 0}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,147,204,.45)}50%{box-shadow:0 0 0 8px rgba(0,147,204,0)}}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.rv{animation:rise .95s cubic-bezier(.2,.7,.2,1) backwards}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}.d4{animation-delay:.38s}
.fade{animation:fadein .55s cubic-bezier(.2,.7,.2,1) backwards}
.hdr{position:relative;z-index:20;padding:16px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 8px 8px 18px;border-radius:999px}
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#14131A;min-height:44px}
.mark{width:32px;height:32px;border-radius:11px;position:relative;background:conic-gradient(from 200deg,#ffbfe8,#b4e6ff,#bdfbdf,#ffeeaa,#d8c2ff,#ffbfe8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 8px 18px -8px rgba(80,60,160,.6);animation:hue 10s linear infinite}
.mark::after{content:"";position:absolute;left:9px;top:9px;width:14px;height:14px;border-radius:4px;background:#14131A;transform:rotate(45deg)}
.wordmark{font-family:'Unbounded',sans-serif;font-weight:600;font-size:19px;letter-spacing:-.02em}
.nav{display:flex;gap:2px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;font-weight:500;font-size:15px;color:#14131A;transition:background .25s}
.nav a:hover{background:rgba(20,19,26,.06)}
.nav a.on{background:#14131A;color:#fff}
.hright{display:flex;align-items:center;gap:8px}
.hcta{min-height:46px}
.burger{display:none;width:46px;height:46px;border-radius:999px;border:1px solid rgba(20,19,26,.12);background:#fff;align-items:center;justify-content:center;cursor:pointer;color:#14131A}
.mnav{margin-top:10px;padding:10px;display:grid;gap:4px;border-radius:24px}
.mnav a{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:14px;text-decoration:none;color:#14131A;font-weight:500}
.mnav a:hover{background:rgba(20,19,26,.06)}
@media (max-width:980px){.nav,.hcta{display:none}.burger{display:inline-flex}}
@media (min-width:981px){.mnav{display:none}}
.ftr{background:#ECEBF2;padding:84px 0 32px;border-top:1px solid rgba(20,19,26,.06)}
.fgrid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:40px}
.ftr h4{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600;margin-bottom:10px}
.fl{display:flex;align-items:center;min-height:44px;text-decoration:none;color:#3F3D4A;font-size:15px;transition:color .2s}
.fl:hover{color:#006A93}
.ftxt{color:#3F3D4A;font-size:15px;padding:11px 0}
.fbot{margin-top:56px;padding-top:22px;border-top:1px solid rgba(20,19,26,.1);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:#5D5B6A}
@media (max-width:860px){.fgrid{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}}
/* hero */
.hero{padding:48px 0 40px;position:relative}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.h1{font-size:clamp(32px,4.2vw,60px);margin:24px 0 26px}
.grad{background:linear-gradient(92deg,#14131A 8%,#3A2C7A 55%,#00618A 96%);-webkit-background-clip:text;background-clip:text;color:transparent}
.promise{display:flex;gap:18px;align-items:center;padding:18px 22px;border-radius:22px;background:#fff;border:1px solid rgba(20,19,26,.08);margin-top:30px;max-width:560px}
.promise b{font-family:'Unbounded',sans-serif;font-size:36px;font-weight:600;letter-spacing:-.04em;line-height:1}
.row-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.orbit{position:relative;height:580px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;width:520px;height:520px;border-radius:50%;background:conic-gradient(from 0deg,#ffcdee,#c4ebff,#cdfde6,#fff1bd,#e0cdff,#ffcdee);-webkit-mask:radial-gradient(closest-side,transparent 96%,#000 97%);mask:radial-gradient(closest-side,transparent 96%,#000 97%);animation:spin 18s linear infinite}
.ring2{position:absolute;width:420px;height:420px;border-radius:50%;border:1px dashed rgba(20,19,26,.18);animation:spin 40s linear infinite reverse}
.portal{position:relative;width:330px;height:460px;border-radius:180px;overflow:hidden;box-shadow:0 60px 100px -50px rgba(40,20,100,.6),inset 0 0 0 1px rgba(255,255,255,.8)}
.portal img{width:330px;height:460px;object-fit:cover;animation:hue 16s linear infinite}
.fchip{position:absolute;z-index:2;display:inline-flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;font-size:13px;font-weight:700}
.fchip i{width:8px;height:8px;border-radius:50%;background:#0093CC;display:block;animation:pulse 2.4s ease-in-out infinite}
.fc1{top:70px;left:0;animation:floaty 6s ease-in-out infinite}
.fc2{top:250px;right:-10px;animation:floaty 7s ease-in-out infinite .5s}
.fc3{bottom:60px;left:30px;animation:floaty 8s ease-in-out infinite 1s}
/* capacites */
.cap-tabs{display:flex;flex-wrap:wrap;gap:10px;margin-top:44px}
.cap-tab{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 22px 10px 12px;border-radius:999px;border:1px solid rgba(20,19,26,.1);background:rgba(255,255,255,.65);cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;color:#14131A;transition:all .35s}
.cap-tab:hover{background:#fff;transform:translateY(-2px)}
.cap-tab span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-size:12px;background:#fff;border:1px solid rgba(20,19,26,.08)}
.cap-panel{margin-top:22px;padding:40px;display:grid;grid-template-columns:.9fr 1.1fr;gap:40px;align-items:center}
.cap-panel h3{font-size:clamp(22px,2.2vw,32px);margin:14px 0}
.pipe{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.pipe::before{content:"";position:absolute;left:12%;right:12%;top:38px;height:2px;background:repeating-linear-gradient(90deg,rgba(20,19,26,.45) 0 6px,transparent 6px 12px);background-size:24px 2px;animation:dash 1s linear infinite}
.node{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.node-c{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#fff;position:relative;box-shadow:0 18px 30px -18px rgba(40,30,90,.55);font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600}
.node-c::before{content:"";position:absolute;left:-3px;top:-3px;right:-3px;bottom:-3px;border-radius:50%;z-index:-1;background:conic-gradient(from 200deg,#ffcdee,#c4ebff,#cdfde6,#fff1bd,#e0cdff,#ffcdee);animation:spin 6s linear infinite}
.node b{font-size:14px;line-height:1.35}
/* cas */
.cas{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin-top:48px;align-items:start}
.cas-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.case{position:relative;display:flex;flex-direction:column;gap:22px;justify-content:space-between;min-height:170px;padding:22px;border-radius:24px;border:1px solid #fff;background:rgba(255,255,255,.6);cursor:pointer;text-align:left;font-family:inherit;color:#14131A;overflow:hidden;transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s,background .35s}
.case:hover{transform:translateY(-5px);box-shadow:0 30px 50px -34px rgba(40,30,90,.55);background:rgba(255,255,255,.85)}
.case-n{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600;color:#5D5B6A}
.case-t{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:500;line-height:1.3;letter-spacing:-.01em}
.case-strip{position:absolute;left:0;top:0;bottom:0;width:0;background:url(assets/holo-foil.webp) center/cover;transition:width .5s}
.cas-d{padding:34px;position:relative;overflow:hidden;min-height:520px}
.cas-d::before{content:"";position:absolute;right:-70px;bottom:-70px;width:240px;height:240px;border-radius:50%;background:url(assets/iridescent-blur.webp) center/cover;opacity:.7;filter:blur(8px)}
.cas-d > *{position:relative}
.cas-d h3{font-size:clamp(22px,2vw,30px);margin:14px 0 14px}
.how{display:grid;gap:10px;margin-top:22px}
.how div{display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:center;padding:14px;border-radius:16px;background:rgba(255,255,255,.85);border:1px solid rgba(20,19,26,.06);font-size:15px;font-weight:600}
.how span{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#14131A;color:#fff;font-family:'Unbounded',sans-serif;font-size:11px}
.claim{margin-top:18px;font-size:13px;color:#5D5B6A;padding:12px 14px;border-radius:14px;border:1px dashed rgba(20,19,26,.22)}
/* compare */
.prio{display:flex;flex-wrap:wrap;gap:8px;margin:34px 0 26px}
.prio button{min-height:48px;padding:0 20px;border-radius:999px;border:1px solid rgba(20,19,26,.12);background:rgba(255,255,255,.7);cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;color:#14131A;transition:all .3s}
.prio button:hover{background:#fff}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col{padding:30px;border-radius:30px;background:rgba(255,255,255,.6);border:1px solid #fff;position:relative;overflow:hidden;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s,opacity .5s}
.col-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.col-h h3{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:600;letter-spacing:-.02em}
.reco{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:8px 12px;border-radius:999px;background:#14131A;color:#fff}
.crow{display:grid;gap:4px;padding:14px 0;border-top:1px solid rgba(20,19,26,.08);transition:background .3s}
.crow small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#5D5B6A}
.crow span{font-size:15px}
.verdict{margin-top:22px;padding:22px 24px;display:flex;gap:16px;align-items:center}
.verdict-ico{width:48px;height:48px;border-radius:16px;flex:none;background:url(assets/holo-foil.webp) center/cover;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
/* atom */
.atom{display:grid;grid-template-columns:340px 1fr;overflow:hidden;margin-top:48px}
.atom-side{padding:28px;border-right:1px solid rgba(20,19,26,.08);display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.35)}
.atom-id{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.atom-av{width:52px;height:52px;border-radius:17px;background:url(assets/holo-foil.webp) center/cover;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);animation:hue 8s linear infinite}
.atom-av span{background:rgba(255,255,255,.75);border-radius:10px;padding:2px 7px}
.demo-tag{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#5D5B6A;padding:8px 12px;border-radius:999px;border:1px dashed rgba(20,19,26,.3);align-self:flex-start}
.task{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:12px 16px;border-radius:18px;border:1px solid rgba(20,19,26,.08);background:rgba(255,255,255,.7);cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;color:#14131A;text-align:left;transition:all .3s}
.task:hover{background:#fff;transform:translateX(4px)}
.task i{width:10px;height:10px;border-radius:50%;flex:none;background:rgba(20,19,26,.2)}
.atom-main{padding:28px;display:flex;flex-direction:column;gap:14px;min-height:560px}
.atom-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid rgba(20,19,26,.08)}
.ask{align-self:flex-end;background:#14131A;color:#fff;padding:14px 18px;border-radius:20px 20px 4px 20px;max-width:80%;font-size:15px}
.astep{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:16px;background:rgba(255,255,255,.85);border:1px solid rgba(20,19,26,.06);font-size:15px}
.astep-ico{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center}
.ok{background:#14131A;color:#fff}
.spin{border:2px solid rgba(20,19,26,.15);border-top-color:#0093CC;animation:spin .8s linear infinite}
.ares{padding:20px;border-radius:20px;background:#fff;border:1px solid rgba(0,147,204,.45);box-shadow:0 20px 40px -26px rgba(0,147,204,.7)}
.ares small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#5D5B6A;margin-bottom:8px}
.ares p{animation:type 1.6s steps(48,end) backwards}
.idle{flex:1;display:grid;place-items:center;text-align:center;color:#5D5B6A;padding:30px;border-radius:20px;border:1px dashed rgba(20,19,26,.18)}
.atom-ctl{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.cta{position:relative;border-radius:40px;overflow:hidden;padding:90px 64px;background:#14131A;color:#fff}
.cta-art{position:absolute;right:-140px;top:-160px;width:560px;height:560px;border-radius:50%;background:url(assets/holo-foil.webp) center/cover;animation:hue 14s linear infinite}
.cta-in{position:relative;max-width:640px}
.cta h2{font-size:clamp(28px,3.4vw,50px);margin:20px 0}
.cta p{color:rgba(255,255,255,.78);font-size:18px;max-width:520px}
.cta .eyebrow{color:rgba(255,255,255,.75)}
@media (max-width:980px){
 .hero-grid,.cas,.atom,.cap-panel{grid-template-columns:1fr}
 .atom-side{border-right:0;border-bottom:1px solid rgba(20,19,26,.08)}
 .orbit{height:520px}
}
@media (max-width:760px){
 .cmp{grid-template-columns:1fr}
 .pipe{grid-template-columns:1fr 1fr;row-gap:26px}.pipe::before{display:none}
 .cap-panel{padding:24px}
 .cta{padding:64px 26px}.cta-art{top:-330px;right:-200px}
 .atom-main{min-height:0}
}
@media (max-width:640px){
 .wrap{padding:0 16px}.sec{padding:80px 0}
 .ring{width:330px;height:330px}.ring2{width:280px;height:280px}
 .portal,.portal img{width:230px;height:320px}
 .orbit{height:400px}
 .fchip{display:none}
 .cas-d{padding:24px;min-height:0}
}
@media (prefers-reduced-motion:reduce){.hl *{animation:none!important;transition:none!important}}
</style>
</helmet>

 <div class="wrap">

 </div>

<main>
<section class="hero">
 <div class="wrap hero-grid">
  <div>
   <span class="eyebrow rv">Excellence IA</span>
   <h1 class="disp h1 rv d1">Transformez la productivité avec <span class="grad">les agents IA.</span></h1>
   <p class="lead rv d2">Modèles affinés sur vos données, agents autonomes qui décident et s’adaptent, intégration dans vos processus existants. L’IA devient un membre à part entière de votre équipe.</p>
   <div class="promise rv d3"><b>×10</b><span class="muted">Notre promesse : la personnalisation de modèles et les agents autonomes peuvent multiplier votre productivité par 10.</span></div>
   <div class="row-cta rv d4">
    <a class="btn btn-p" href="#atom" style="{{ ui.cta }}">Essayer la démo ATOM</a>
    <a class="btn btn-g" href="Holo-Contact.html">Parler à un expert</a>
   </div>
  </div>
  <div class="orbit rv d2" aria-hidden="true">
   <div class="ring"></div>
   <div class="ring2"></div>

<section class="sec" id="atom" style="padding-top:20px" aria-labelledby="atom-t">
 <div class="wrap">

   <div class="atom-side">
    <div class="atom-id"><span class="atom-av"><span>A</span></span><div><b style="font-size:17px">ATOM</b><br><span class="muted" style="font-size:14px">Agent IA · Baquelis</span></div></div>
    <span class="demo-tag"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4M12 16h.01"></path></svg>Démonstration scénarisée</span>

   <div class="atom-main" aria-live="polite">
    <div class="atom-top"><b>{{ demo.label }}</b><span class="muted" style="font-size:14px">{{ demo.status }}</span></div>
    <div class="ask">{{ demo.prompt }}</div>
    <sc-if value="{{ demo.idle }}" hint-placeholder-val="{{ false }}">
     <div class="idle"><div><b style="color:#14131A">Prêt à démarrer</b><br>Lancez l’agent pour afficher ses étapes de raisonnement.</div></div>

    <sc-for list="{{ demo.steps }}" as="st" hint-placeholder-count="3">
     <sc-if value="{{ st.show }}" hint-placeholder-val="{{ true }}">
      <div class="astep fade">
       <sc-if value="{{ st.done }}" hint-placeholder-val="{{ true }}"><span class="astep-ico ok"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
       <sc-if value="{{ st.busy }}" hint-placeholder-val="{{ false }}"><span class="astep-ico spin" aria-hidden="true"></span></sc-if>
       <span>{{ st.txt }}</span>
      </div>
     </sc-if>
    </sc-for>
    <sc-if value="{{ demo.done }}" hint-placeholder-val="{{ false }}">
     <div class="ares fade"><small>Résultat</small><p>{{ demo.result }}</p></div>
    </sc-if>
    <div class="atom-ctl">
     <button class="btn btn-p" type="button" style="{{ ui.cta }}" onClick="{{ run }}" aria-disabled="{{ demo.busyAttr }}">{{ demo.runLabel }}</button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":6100},"accent":{"editor":"color","default":"#0093CC","options":["#0093CC","#00AEEF","#B8A4FF"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { menu:false, cap:0, cas:0, prio:0, task:0, shown:-1, running:false, done:false };
    this.timer = null;
  }
  componentWillUnmount(){
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  }
  stopTimer(){
    if (this.timer) { clearInterval(this.timer); this.timer = null; }
  }
  renderVals(){
    const s = this.state;
    const accent = (this.props && this.props.accent) || "#0093CC";
    const irid = "conic-gradient(from 200deg,#ffcdee,#c4ebff,#cdfde6,#fff1bd,#e0cdff,#ffcdee)";

    const C = [
      { t:"Affinage de modèles", d:"Des modèles entraînés sur vos données et vos cas d’usage, pour une intelligence propre à votre domaine.", pts:["Formation spécifique au domaine","Optimisation des performances","Apprentissage continu","Confidentialité & sécurité"] },
      { t:"Agents autonomes", d:"Des agents qui exécutent des tâches complexes, prennent des décisions et s’adaptent au contexte.", pts:["Automatisation de tâches","Prise de décision","Coordination multi-agents","Apprentissage & adaptation"] },
      { t:"Intégration métier", d:"L’IA intégrée dans vos processus existants, là où elle crée de la valeur au quotidien.", pts:["Automatisation des flux","Traitement de données","Analytique prédictive","Insights temps réel"] }
    ];
    const caps = C.map((c, i) => {
      const on = i === s.cap;
      return {
        n: "0" + (i + 1), t: c.t, d: c.d, on: on, pressed: on ? "true" : "false",
        pts: c.pts.map((p, k) => ({ n: "0" + (k + 1), t: p, delay: "animation-delay:" + (0.1 + k * 0.12).toFixed(2) + "s" })),
        tabStyle: on ? "background:#14131A;color:#fff;border-color:#14131A" : "",
        numStyle: on ? "background:" + irid + ";color:#14131A;border-color:#fff" : "",
        pick: () => this.setState({ cap: i })
      };
    });

    const K = [
      { t:"Automatisation du support client", d:"Des agents qui prennent en charge les demandes entrantes avec une qualité de réponse de niveau humain, et passent la main à votre équipe quand il le faut.", how:["Compréhension de la demande et du contexte client","Réponse ou action directement dans vos outils","Escalade vers l’équipe pour les cas sensibles"], claim:"Promesse affichée par Baquelis : des agents capables de traiter 90 % des demandes. Résultat à valider sur votre contexte." },
      { t:"Pipeline de génération de contenu", d:"Produire, adapter et contrôler du contenu à grande échelle, dans votre ton et selon vos règles.", how:["Brief structuré et sources validées","Génération et variantes par canal","Relecture humaine avant publication"], claim:"" },
      { t:"Intelligence métier prédictive", d:"Anticiper plutôt que constater : tendances, risques et opportunités détectés dans vos données.", how:["Connexion à vos données historiques","Modèles de prévision adaptés à votre métier","Alertes et insights en temps réel"], claim:"" },
      { t:"Optimisation des processus", d:"Repérer les frictions, automatiser les étapes à faible valeur et mesurer le gain dans la durée.", how:["Cartographie des flux existants","Automatisation des tâches répétitives","Mesure continue de l’efficacité"], claim:"" },
      { t:"Modèles affinés vs RAG", d:"Un modèle entraîné sur votre domaine : précision supérieure, réponses plus rapides, intelligence spécifique.", how:["Analyse de vos données et cas d’usage","Affinage du modèle et évaluation","Déploiement et apprentissage continu"], claim:"" },
      { t:"Automatisation métier agentique", d:"Des agents coordonnés qui prennent en charge des processus complets, de bout en bout, sous supervision humaine.", how:["Découpage du processus en missions","Coordination multi-agents","Supervision humaine et adaptation"], claim:"" }
    ];
    const cases = K.map((c, i) => {
      const on = i === s.cas;
      return {
        n: "0" + (i + 1), t: c.t, d: c.d, on: on, pressed: on ? "true" : "false",
        claim: c.claim, hasClaim: c.claim !== "",
        how: c.how.map((h, k) => ({ n: "0" + (k + 1), t: h, delay: "animation-delay:" + (0.1 + k * 0.12).toFixed(2) + "s" })),
        style: on ? "background:#fff;box-shadow:0 30px 50px -30px rgba(40,30,90,.55);padding-left:34px" : "",
        strip: on ? "width:10px" : "",
        pick: () => this.setState({ cas: i })
      };
    });

    const PR = [
      { t:"Précision", reco:"a", row:0, title:"Modèle affiné.", text:"Le savoir de votre domaine est intégré au modèle : précision supérieure sur vos cas d’usage." },
      { t:"Rapidité", reco:"a", row:1, title:"Modèle affiné.", text:"Pas d’étape de recherche documentaire à chaque requête : des réponses plus rapides." },
      { t:"Expertise métier", reco:"a", row:2, title:"Modèle affiné.", text:"Vocabulaire, ton et raisonnement spécifiques à votre métier." },
      { t:"Données très changeantes", reco:"b", row:3, title:"RAG, ou une approche hybride.", text:"Mettre à jour une base documentaire est plus simple que ré-entraîner un modèle ; l’affinage reste utile pour le ton et le raisonnement." }
    ];
    const pr = PR[s.prio];
    const prios = PR.map((p, i) => ({
      t: p.t, pressed: i === s.prio ? "true" : "false",
      style: i === s.prio ? "background:#14131A;color:#fff;border-color:#14131A" : "",
      pick: () => this.setState({ prio: i })
    }));
    const R = [
      { k:"Précision sur votre domaine", a:"Supérieure : le savoir est dans le modèle", b:"Dépend de la qualité de la recherche documentaire" },
      { k:"Vitesse de réponse", a:"Plus rapide : pas d’étape de recherche", b:"Une étape de recherche à chaque requête" },
      { k:"Intelligence spécifique", a:"Vocabulaire, ton et raisonnement métier", b:"Généraliste, enrichi par vos documents" },
      { k:"Données qui changent souvent", a:"Apprentissage continu ou ré-entraînement", b:"Mise à jour simple de la base documentaire" }
    ];
    const rows = R.map((r, i) => ({ k: r.k, a: r.a, b: r.b, style: i === pr.row ? "background:linear-gradient(90deg,rgba(196,235,255,.55),rgba(224,205,255,.35));margin:0 -12px;padding:14px 12px;border-radius:14px;border-top-color:transparent" : "" }));
    const hi = "transform:translateY(-6px);background:rgba(255,255,255,.9);box-shadow:0 40px 70px -40px rgba(40,30,90,.55),0 0 0 2px #0093CC";
    const lo = "opacity:.78";
    const cmp = {
      aReco: pr.reco === "a", bReco: pr.reco === "b",
      aStyle: pr.reco === "a" ? hi : lo, bStyle: pr.reco === "b" ? hi : lo,
      title: pr.title, text: pr.text
    };

    const T = [
      { label:"Traiter une demande client", prompt:"Un client signale un retard de livraison. Prépare la réponse.", steps:["Lecture du message et de l’historique client","Identification de l’intention : retard de livraison","Vérification du statut dans l’outil de suivi","Rédaction d’une réponse personnalisée","Contrôle qualité avant validation"], result:"Réponse prête : statut expliqué, nouvelle date indiquée, envoi soumis à la validation de l’équipe." },
      { label:"Préparer un rapport d’activité", prompt:"Prépare la synthèse d’activité de la semaine pour la direction.", steps:["Collecte des indicateurs de la semaine","Comparaison avec la semaine précédente","Détection des points d’attention","Rédaction de la synthèse","Mise en page pour la direction"], result:"Synthèse d’une page prête à partager, points d’attention en tête." },
      { label:"Qualifier un nouveau contact", prompt:"Un formulaire vient d’arriver. Qualifie ce contact.", steps:["Lecture du formulaire entrant","Analyse du besoin exprimé","Évaluation de l’adéquation avec les offres","Proposition d’une formule adaptée","Création de la fiche de suivi"], result:"Contact qualifié : formule suggérée, fiche créée, rendez-vous à proposer." }
    ];
    const task = T[s.task];
    const tasks = T.map((t, i) => ({
      label: t.label, pressed: i === s.task ? "true" : "false",
      style: i === s.task ? "background:#fff;border-color:#14131A;box-shadow:0 16px 30px -22px rgba(40,30,90,.6)" : "",
      dot: i === s.task ? "background:" + irid : "",
      pick: () => { this.stopTimer(); this.setState({ task: i, shown: -1, running: false, done: false }); }
    }));
    const demoSteps = task.steps.map((x, i) => ({
      txt: x,
      show: i <= s.shown,
      done: i < s.shown || (s.done && i <= s.shown),
      busy: i === s.shown && s.running
    }));
    const n = task.steps.length;

    return {
      ui: { cta: "background:" + accent, menu: s.menu, menuOpen: s.menu ? "true" : "false" },
      toggleMenu: () => this.setState({ menu: !s.menu }),
      caps: caps, cases: cases, prios: prios, rows: rows, cmp: cmp, tasks: tasks,
      demo: {
        label: task.label, prompt: task.prompt, result: task.result, steps: demoSteps,
        idle: s.shown < 0, done: s.done, busyAttr: s.running ? "true" : "false",
        status: s.running ? "ATOM travaille…" : (s.done ? "Tâche terminée" : "En attente"),
        runLabel: s.running ? "En cours…" : (s.done ? "Relancer l’agent" : "Lancer l’agent")
      },
      run: () => {
        if (this.state.running) return;
        this.stopTimer();
        this.setState({ shown: 0, running: true, done: false });
        this.timer = setInterval(() => {
          const next = this.state.shown + 1;
          if (next >= n) {
            this.stopTimer();
            this.setState({ shown: n - 1, running: false, done: true });
          } else {
            this.setState({ shown: next });
          }
        }, 950);
      },
      reset: () => { this.stopTimer(); this.setState({ shown: -1, running: false, done: false }); }
    };
  }
}
</script>
