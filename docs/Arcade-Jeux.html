<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Arcade — Jeux &amp; Web3</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;family=Silkscreen&amp;display=swap">
<style>
body{margin:0;background:#0D0A1A}
sc-for,sc-if{display:contents}
.ar{position:relative;overflow:hidden;background:#0D0A1A;color:#EDE8FF;font-family:'Chakra Petch',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.ar *,.ar *::before,.ar *::after{box-sizing:border-box}
.ar h1,.ar h2,.ar h3,.ar h4,.ar p,.ar figure,.ar blockquote{margin:0}
.ar a{color:inherit}
.ar button,.ar input,.ar textarea{font-family:inherit}
.ar img{display:block;max-width:100%}
.ar :focus-visible{outline:2px solid #00E5FF;outline-offset:3px}
.wrap{position:relative;max-width:1240px;margin:0 auto;padding:0 40px}
.px{font-family:'Silkscreen',monospace;font-size:11px;line-height:1.5;letter-spacing:.1em;text-transform:uppercase}
.mut{color:#9C93C4}.cy{color:#00E5FF}.mg{color:#FF3EA5}.gd{color:#FFD166}
.scan{position:absolute;inset:0;z-index:80;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px,rgba(0,0,0,0) 4px)}
.hdr{position:relative;z-index:30;background:rgba(13,10,26,.92);border-bottom:1px solid rgba(156,147,196,.16)}
.hdr-in{display:flex;align-items:center;gap:28px;min-height:76px}
.logo{display:inline-flex;align-items:center;gap:12px;min-height:44px;text-decoration:none}
.logo-t{font-weight:700;font-size:19px;letter-spacing:.24em}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:#9C93C4;transition:color .2s}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:#00E5FF;box-shadow:0 0 10px #00E5FF;transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav a:hover,.nav a[aria-current="page"]{color:#EDE8FF}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1)}
.hdr-cta{display:flex;align-items:center;gap:18px}
.burger{display:none;align-items:center;justify-content:center;width:44px;height:44px;background:transparent;border:1px solid rgba(156,147,196,.35);color:#EDE8FF;cursor:pointer}
.mnav{display:none}
@media(max-width:1000px){.nav,.hud-p1{display:none}.burger{display:inline-flex}.hdr-cta{margin-left:auto}.mnav{display:grid;gap:2px;padding:8px 16px 20px;border-top:1px solid rgba(156,147,196,.16)}.mnav a{display:flex;align-items:center;min-height:48px;padding:0 8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid rgba(156,147,196,.1)}}
@media(max-width:480px){.hdr-cta .btn{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border:1px solid transparent;font:600 14px/1 'Chakra Petch',sans-serif;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s,color .2s,border-color .2s}
.btn-p{background:#FF3EA5;color:#0D0A1A;box-shadow:4px 4px 0 #00E5FF}
.btn-p:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #00E5FF,0 0 32px rgba(255,62,165,.45)}
.btn-p:active{transform:translate(4px,4px);box-shadow:0 0 0 #00E5FF}
.btn-g{background:transparent;color:#EDE8FF;border-color:rgba(237,232,255,.32)}
.btn-g:hover{border-color:#00E5FF;color:#00E5FF;box-shadow:inset 0 0 24px rgba(0,229,255,.18)}
.btn-sm{min-height:44px;padding:0 18px;font-size:13px}
.fr{position:relative;background:#171230;border:1px solid rgba(156,147,196,.2)}
.fr::before,.fr::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;transition:width .25s,height .25s}
.fr::before{top:-1px;left:-1px;border-top:2px solid #00E5FF;border-left:2px solid #00E5FF}
.fr::after{bottom:-1px;right:-1px;border-bottom:2px solid #FF3EA5;border-right:2px solid #FF3EA5}
.hv:hover::before,.hv:hover::after{width:30px;height:30px}
.sec{position:relative;padding:120px 0}
.kick{display:inline-flex;align-items:center;gap:10px;color:#00E5FF}
.kick::before{content:"";width:8px;height:8px;background:currentColor;box-shadow:0 0 12px currentColor}
.h2{margin-top:18px;font-size:clamp(32px,4.6vw,60px);line-height:1.04;font-weight:700;letter-spacing:-.01em;text-transform:uppercase;overflow-wrap:anywhere}
.lead{margin-top:20px;max-width:640px;font-size:19px;color:#9C93C4}
.bar{position:relative;height:10px;overflow:hidden;background:rgba(156,147,196,.14)}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,#00E5FF 0,#00E5FF 8px,rgba(0,0,0,0) 8px,rgba(0,0,0,0) 10px);box-shadow:0 0 12px rgba(0,229,255,.45);transition:width .6s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.in{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}.d5{animation-delay:.65s}
.blink{animation:blink 1.1s steps(1) infinite}
.ftr{position:relative;padding:72px 0 32px;background:#0A0815;border-top:1px solid rgba(156,147,196,.16)}
.ftr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:40px}
.ftr-h{margin-bottom:14px;color:#9C93C4}
.ftr-l{display:grid}
.ftr-l a{display:inline-flex;align-items:center;min-height:44px;font-size:15px;text-decoration:none;transition:color .2s}
.ftr-l a:hover{color:#00E5FF}
.ftr-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(156,147,196,.14)}
.ftr-bot a{text-decoration:underline;text-underline-offset:4px}
/* ===== page : jeux ===== */
.ph{position:relative;padding:88px 0 100px;overflow:hidden}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(480px,100%),1fr));gap:56px;align-items:center}
.h1{margin-top:22px;font-size:clamp(38px,5.6vw,80px);line-height:.98;font-weight:700;text-transform:uppercase;overflow-wrap:anywhere}
.h1 em{font-style:normal;color:#FF3EA5;text-shadow:-2px 0 #00E5FF,0 0 30px rgba(255,62,165,.45)}
.shot{position:relative;overflow:hidden}
.shot img{width:100%;height:540px;object-fit:cover;filter:saturate(1.15) contrast(1.05)}
.shot::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,rgba(13,10,26,.85),rgba(13,10,26,0) 45%)}
.hud{position:absolute;z-index:2;left:20px;right:20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hud.t{top:18px}.hud.b{bottom:20px;align-items:flex-end}
.hp{width:180px}
.hp .bar>i{background:repeating-linear-gradient(90deg,#FF3EA5 0,#FF3EA5 8px,rgba(0,0,0,0) 8px,rgba(0,0,0,0) 10px);box-shadow:0 0 12px rgba(255,62,165,.5)}
.mini{width:84px;height:84px;border:1px solid rgba(0,229,255,.6);background:rgba(13,10,26,.6);position:relative}
.mini i{position:absolute;width:6px;height:6px;background:#00E5FF}
.mini i.me{background:#FFD166;box-shadow:0 0 8px #FFD166;animation:blink 1.2s steps(1) infinite}
.quote{margin-top:36px;padding:22px 24px;border-left:0;border:1px dashed rgba(156,147,196,.35);font-size:20px;font-weight:500}
.boss{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:10px;margin-top:48px}
.bt{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:92px;padding:16px 18px;background:#171230;border:1px solid rgba(156,147,196,.2);color:#EDE8FF;font:inherit;text-align:left;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}
.bt:hover{transform:translateY(-3px);border-color:rgba(0,229,255,.55)}
.bt b{font-size:18px;line-height:1.2}
.arena{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(400px,100%),1fr));gap:48px;margin-top:16px;padding:44px;min-height:520px}
.wd{animation:up .45s both}
.illu{display:inline-block;margin-top:14px;padding:4px 10px;border:1px solid rgba(255,209,102,.5);color:#FFD166}
.gauge{position:relative;width:100%;max-width:420px;height:230px;margin:10px auto 0}
.gauge svg{position:absolute;left:0;top:0;width:100%;height:220px}
.needle{position:absolute;left:50%;bottom:20px;width:4px;height:170px;margin-left:-2px;background:linear-gradient(#FFD166,#FF3EA5);transform-origin:50% 100%;transition:transform .35s cubic-bezier(.2,.8,.3,1.2);box-shadow:0 0 14px rgba(255,62,165,.6)}
.hub{position:absolute;left:50%;bottom:10px;width:24px;height:24px;margin-left:-12px;background:#EDE8FF;border:4px solid #171230}
.read{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:6px}
.read b{font-size:46px;line-height:1;font-weight:700}
.rng{width:100%;height:44px;margin-top:14px;accent-color:#FF3EA5;cursor:pointer}
.loop{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto auto;gap:12px;align-items:center;justify-items:center;max-width:420px;margin:10px auto 0}
.core{grid-column:2;grid-row:2;position:relative;display:grid;place-items:center;width:130px;height:130px;text-align:center}
.core::before{content:"";position:absolute;inset:0;border:2px dashed rgba(0,229,255,.55);border-radius:50%;animation:spin 12s linear infinite}
.sys{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:120px;min-height:84px;padding:10px;background:#0F0B22;border:1px solid rgba(156,147,196,.3);color:#EDE8FF;font:600 14px/1.2 'Chakra Petch',sans-serif;cursor:pointer;transition:all .2s}
.sys:hover{border-color:#00E5FF}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin-top:18px}
.dots i{display:block;height:12px;background:rgba(156,147,196,.15);transition:background .3s,box-shadow .3s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px;margin-top:20px}
.stats div{padding:12px 14px;border:1px solid rgba(156,147,196,.2)}
.stats b{display:block;font-size:20px}
.tog{display:inline-flex;align-items:center;gap:14px;min-height:52px;padding:8px 18px 8px 8px;background:transparent;border:1px solid rgba(156,147,196,.35);color:#EDE8FF;font:600 15px 'Chakra Petch',sans-serif;cursor:pointer}
.tog-k{position:relative;width:56px;height:30px;background:#0F0B22;border:1px solid rgba(156,147,196,.4)}
.tog-k i{position:absolute;top:3px;left:3px;width:22px;height:22px;background:#9C93C4;transition:transform .25s,background .25s}
.log{margin-top:18px;border:1px solid rgba(156,147,196,.2)}
.log-r{display:flex;justify-content:space-between;gap:14px;padding:12px 16px;border-bottom:1px dashed rgba(156,147,196,.16);font-size:15px;animation:up .35s both}
.log-r:last-child{border-bottom:0}
.xfer{margin-top:48px;border-top:1px solid rgba(156,147,196,.2)}
.xr{display:grid;grid-template-columns:1fr auto 1.4fr;gap:24px;align-items:center;padding:26px 8px;border-bottom:1px solid rgba(156,147,196,.2);transition:background .25s,padding .25s}
.xr:hover{background:rgba(0,229,255,.04);padding-left:20px}
.xr h3{font-size:22px;line-height:1.2;font-weight:700;text-transform:uppercase}
.xr svg{color:#FF3EA5;transition:transform .25s}
.xr:hover svg{transform:translateX(6px)}
@media(max-width:760px){.xr{grid-template-columns:1fr}.xr svg{transform:rotate(90deg)}.xr:hover svg{transform:rotate(90deg)}}
.w3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:56px;align-items:center}
.holo{position:relative;overflow:hidden}
.holo img{width:100%;height:480px;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.holo:hover img{transform:scale(1.06)}
.holo-tag{position:absolute;left:18px;bottom:18px;z-index:2;padding:8px 12px;background:rgba(13,10,26,.85);border:1px solid rgba(255,209,102,.6)}
.w3-l{display:grid;gap:10px;margin-top:28px}
.w3-l div{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid rgba(156,147,196,.2);transition:border-color .2s}
.w3-l div:hover{border-color:#FFD166}
.w3-l div::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;background:#FFD166;box-shadow:0 0 8px #FFD166}
.cta{position:relative;padding:120px 0;text-align:center;background:#100C20;overflow:hidden}
.cta .h2{max-width:900px;margin-left:auto;margin-right:auto}
.cta-row{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:40px}
@media(max-width:640px){.sec{padding:80px 0}.arena{padding:24px}.ph{padding:56px 0 72px}.shot img{height:340px}.holo img{height:320px}.sys{width:96px}.core{width:96px;height:96px}}
@media (prefers-reduced-motion:reduce){.ar *,.ar *::before,.ar *::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ar">
<sc-if value="{{ scan }}" hint-placeholder-val="{{ true }}"><div class="scan" aria-hidden="true"></div></sc-if>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="Arcade-Accueil.html" aria-label="Baquelis — accueil">
      <svg width="28" height="28" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="0" width="1" height="7" fill="#EDE8FF"></rect><rect x="2" y="1" width="1" height="5" fill="#FF3EA5"></rect><rect x="1" y="2" width="1" height="3" fill="#FF3EA5"></rect><rect x="0" y="3" width="1" height="1" fill="#FF3EA5"></rect><rect x="4" y="1" width="1" height="5" fill="#00E5FF"></rect><rect x="5" y="2" width="1" height="3" fill="#00E5FF"></rect><rect x="6" y="3" width="1" height="1" fill="#00E5FF"></rect><rect x="3" y="3" width="1" height="1" fill="#0D0A1A"></rect></svg>
      <span class="logo-t">BAQUELIS</span>
    </a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="Arcade-Expertises.html">Expertises</a>
      <a href="Arcade-IA.html">IA</a>
      <a href="Arcade-Jeux.html" aria-current="page">Jeux &amp; Web3</a>
      <a href="Arcade-Offres.html">Offres</a>
      <a href="Arcade-Contact.html">Contact</a>
    </nav>
    <div class="hdr-cta">
      <span class="px mut hud-p1">P1 · Prêt</span>
      <a class="btn btn-p btn-sm" href="Arcade-Contact.html">Commencer</a>
    </div>
    <button class="burger" type="button" aria-label="Ouvrir le menu" onClick="{{ toggleMenu }}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 5h16M2 10h16M2 15h16"></path></svg></button>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div class="mnav">
      <a href="Arcade-Expertises.html">Expertises</a>
      <a href="Arcade-IA.html">IA</a>
      <a href="Arcade-Jeux.html">Jeux &amp; Web3</a>
      <a href="Arcade-Offres.html">Offres</a>
      <a href="Arcade-Contact.html">Contact — Commencer</a>
    </div>
  </sc-if>
</header>

<!-- HERO -->
<section class="ph">
  <div class="wrap ph-grid">
    <div>
      <p class="px kick in">Jeux &amp; Web3 — mode difficile</p>
      <h1 class="h1 in d1">Les jeux sont les applications les plus <em>difficiles.</em></h1>
      <p class="lead in d2">Performances temps réel, gestion d'état complexe, expériences fluides : un jeu ne pardonne rien. C'est précisément pour cela qu'il est notre meilleure preuve d'excellence technique.</p>
      <blockquote class="quote in d3">« Si nous maîtrisons les applications de jeu, nous pouvons gérer n'importe quel défi technique. »</blockquote>
    </div>
    <div class="shot fr in d4">
      <img src="assets/gamer-dark.webp" alt="Joueur concentré devant un écran dans une pièce sombre">
      <div class="hud t">
        <div class="hp"><p class="px mg">Exigence</p><div class="bar"><i style="width:100%"></i></div></div>
        <div class="mini" aria-hidden="true"><i style="left:12px;top:14px"></i><i style="left:58px;top:22px"></i><i style="left:30px;top:60px"></i><i class="me" style="left:44px;top:40px"></i></div>
      </div>
      <div class="hud b">
        <span class="px cy">Temps réel · actif</span>
        <span class="px gd blink">Mode difficile</span>
      </div>
    </div>
  </div>
</section>

<!-- EXIGENCES -->
<section class="sec" style="padding-top:40px" aria-labelledby="ex-h">
  <div class="wrap">
    <p class="px kick">Pourquoi les jeux définissent l'excellence</p>
    <h2 class="h2" id="ex-h">Quatre boss à battre.</h2>
    <p class="lead">Chaque exigence se manipule. Les valeurs affichées dans les simulateurs sont illustratives : elles montrent la logique, pas une mesure.</p>
    <div class="boss" role="tablist" aria-label="Exigences">
      <button class="bt" type="button" role="tab" onClick="{{ b0 }}" style="{{ bS0 }}" aria-selected="{{ bA0 }}"><span class="px cy">Boss 1</span><b>Performance temps réel</b></button>
      <button class="bt" type="button" role="tab" onClick="{{ b1 }}" style="{{ bS1 }}" aria-selected="{{ bA1 }}"><span class="px cy">Boss 2</span><b>Architecture complexe</b></button>
      <button class="bt" type="button" role="tab" onClick="{{ b2 }}" style="{{ bS2 }}" aria-selected="{{ bA2 }}"><span class="px cy">Boss 3</span><b>Multijoueur évolutif</b></button>
      <button class="bt" type="button" role="tab" onClick="{{ b3 }}" style="{{ bS3 }}" aria-selected="{{ bA3 }}"><span class="px cy">Boss 4</span><b>Sécurité &amp; anti-triche</b></button>
    </div>
    <div class="arena fr" role="tabpanel">
      <div>
        <p class="px gd">Boss {{ bossNum }} / 4</p>
        <h3 style="margin-top:12px;font-size:clamp(28px,3.2vw,42px);line-height:1.05;font-weight:700;text-transform:uppercase">{{ boss.t }}</h3>
        <p style="margin-top:16px;font-size:19px">{{ boss.d }}</p>
        <div style="margin-top:26px;padding:18px 20px;border:1px solid rgba(0,229,255,.35);background:rgba(0,229,255,.05)">
          <p class="px cy">Pour vos projets</p>
          <p style="margin-top:6px">{{ boss.x }}</p>
        </div>
      </div>
      <div>
        <sc-if value="{{ w0 }}" hint-placeholder-val="{{ true }}">
          <div class="wd">
            <p class="px mut">Jauge de latence</p>
            <div class="gauge">
              <svg viewBox="0 0 200 110" aria-hidden="true"><path d="M15 100a85 85 0 0 1 170 0" fill="none" stroke="rgba(156,147,196,.18)" stroke-width="14"></path><path d="M15 100a85 85 0 0 1 120-77" fill="none" stroke="#00E5FF" stroke-width="14" stroke-dasharray="4 3"></path><path d="M150 37a85 85 0 0 1 35 63" fill="none" stroke="#FFD166" stroke-width="14" stroke-dasharray="4 3"></path></svg>
              <div class="needle" style="{{ needleStyle }}"></div>
              <div class="hub"></div>
            </div>
            <div class="read"><div><span class="px mut">Latence</span><b style="{{ latStyle }}">{{ latency }}</b></div><span class="px" style="{{ latStyle }}">{{ latState }}</span></div>
            <label class="px mut" for="load" style="display:block;margin-top:18px">Charge simulée : {{ loadPct }}</label>
            <input class="rng" id="load" type="range" min="0" max="100" value="{{ load }}" onInput="{{ setLoad }}">
            <span class="px illu">Valeurs illustratives</span>
          </div>
        </sc-if>
        <sc-if value="{{ w1 }}" hint-placeholder-val="{{ false }}">
          <div class="wd">
            <p class="px mut">Boucle de jeu — activez les systèmes</p>
            <div class="loop">
              <button class="sys" type="button" style="{{ sys0.style }}" onClick="{{ sys0.pick }}" aria-pressed="{{ sys0.on }}"><span class="px">{{ sys0.st }}</span>Graphismes</button>
              <button class="sys" type="button" style="{{ sys1.style }}" onClick="{{ sys1.pick }}" aria-pressed="{{ sys1.on }}"><span class="px">{{ sys1.st }}</span>Physique</button>
              <div class="core"><div><p style="font-weight:700;font-size:22px">{{ sysCount }}/4</p><p class="px mut">Boucle</p></div></div>
              <button class="sys" type="button" style="{{ sys2.style }}" onClick="{{ sys2.pick }}" aria-pressed="{{ sys2.on }}"><span class="px">{{ sys2.st }}</span>Réseau</button>

            <p class="px mut">Simulateur de joueurs simultanés</p>
            <div class="read"><div><span class="px mut">Joueurs connectés</span><b class="cy">{{ players }}</b></div><span class="px gd">Illustratif</span></div>

            <input class="rng" id="pl" type="range" min="0" max="100" value="{{ pl }}" onInput="{{ setPl }}">
            <div class="stats">
              <div><span class="px mut">Cohérence d'état</span><b class="cy">Maintenue</b></div>
              <div><span class="px mut">Latence</span><b class="cy">Minimale</b></div>
              <div><span class="px mut">Expérience</span><b>Fluide</b></div>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ w3 }}" hint-placeholder-val="{{ false }}">
          <div class="wd">
            <p class="px mut">Console anti-triche</p>
            <button class="tog" type="button" onClick="{{ toggleShield }}" aria-pressed="{{ shieldAria }}" style="margin-top:12px"><span class="tog-k"><i style="{{ knobStyle }}"></i></span>Protection {{ shieldLabel }}</button>
            <div class="log">
              <sc-for list="{{ logs }}" as="l" hint-placeholder-count="4">
                <div class="log-r"><span>{{ l.t }}</span><span class="px" style="{{ l.s }}">{{ l.r }}</span></div>
              </sc-for>
            </div>
            <div class="stats">
              <div><span class="px mut">Expérience joueur</span><b style="{{ xpStyle }}">{{ xpLabel }}</b></div>
              <div><span class="px mut">Équité</span><b style="{{ xpStyle }}">{{ fairLabel }}</b></div>
            </div>
            <span class="px illu">Événements illustratifs</span>
          </div>
        </sc-if>
      </div>
    </div>
  </div>
</section>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5300},"scanlines":{"editor":"boolean","default":true},"neon":{"editor":"color","default":"#FF3EA5","options":["#FF3EA5","#00E5FF","#FFD166"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { menuOpen:false, boss:0, load:35, sys:[true,true,false,true], pl:40, shield:true };
    this.B = [
      { t:'Performance temps réel', d:'Réponse sub-milliseconde et synchronisation parfaite entre tous les systèmes, à chaque image.', x:'Des interfaces et des tableaux de bord qui réagissent instantanément, même sous forte charge.' },
      { t:'Architecture complexe', d:'Graphismes, physique, réseau et saisie gérés simultanément, sans qu’aucun ne ralentisse les autres.', x:'Des applications où de nombreux modules cohabitent sans se gêner.' },
      { t:'Multijoueur évolutif', d:'Des milliers d’utilisateurs simultanés, une cohérence d’état garantie et une latence minimale.', x:'Des plateformes qui tiennent les pics de trafic et la collaboration en direct.' },
      { t:'Sécurité & anti-triche', d:'Une protection avancée qui détecte les abus sans jamais dégrader l’expérience des joueurs honnêtes.', x:'La sécurité de vos données et de vos transactions, invisible pour vos utilisateurs.' }
    ];
    this.L = ['Vitesse de déplacement anormale','Requêtes répétées hors cadence','État modifié côté client','Entrées automatisées (macro)'];
  }
  fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  renderVals(){
    var s = this.state, p = this.props || {}, self = this;
    var neon = p.neon || '#FF3EA5';
    var scan = !(p.scanlines === false || p.scanlines === 'false');
    var lat = 0.2 + s.load * 0.0085;
    var hot = lat >= 1;
    var players = Math.round(Math.pow(10, 1 + s.pl * 0.03));
    var count = s.sys.filter(function(x){ return x; }).length;
    var pos = ['grid-column:2;grid-row:1','grid-column:3;grid-row:2','grid-column:2;grid-row:3','grid-column:1;grid-row:2'];
    var dots = [];
    for (var i = 0; i < 100; i++) {
      var lit = i < s.pl;
      dots.push({ s: lit ? (i % 7 === 0 ? 'background:#FF3EA5;box-shadow:0 0 6px #FF3EA5' : 'background:#00E5FF;box-shadow:0 0 6px rgba(0,229,255,.7)') : '' });
    }
    var v = {
      scan: scan,
      menuOpen: s.menuOpen,
      toggleMenu: function(){ self.setState({ menuOpen: !self.state.menuOpen }); },
      boss: this.B[s.boss],
      bossNum: String(s.boss + 1),
      w0: s.boss === 0, w1: s.boss === 1, w2: s.boss === 2, w3: s.boss === 3,
      load: String(s.load),
      loadPct: s.load + ' %',
      setLoad: function(e){ self.setState({ load: Number(e.target.value) }); },
      latency: lat.toFixed(2).replace('.', ',') + ' ms',
      latState: hot ? 'Seuil atteint' : 'Sous la milliseconde',
      latStyle: hot ? 'color:#FFD166' : 'color:#00E5FF',
      needleStyle: 'transform:rotate(' + (-90 + s.load * 1.8) + 'deg)',
      sysCount: String(count),
      sysMsg: count === 4 ? '4/4 systèmes synchronisés dans la même image.' : count + '/4 — la boucle de jeu est incomplète.',
      sysMsgStyle: 'margin-top:20px;font-weight:600;text-align:center;color:' + (count === 4 ? '#00E5FF' : '#FFD166'),
      pl: String(s.pl),
      setPl: function(e){ self.setState({ pl: Number(e.target.value) }); },
      players: this.fmt(players),
      dots: dots,
      shieldAria: s.shield ? 'true' : 'false',
      shieldLabel: s.shield ? 'activée' : 'désactivée',
      toggleShield: function(){ self.setState({ shield: !self.state.shield }); },
      knobStyle: s.shield ? 'transform:translateX(26px);background:#00E5FF;box-shadow:0 0 10px #00E5FF' : '',
      logs: this.L.map(function(t){ return { t:t, r: s.shield ? 'Bloqué' : 'Non détecté', s: s.shield ? 'color:#00E5FF' : 'color:#FF3EA5' }; }),
      xpLabel: s.shield ? 'Fluide' : 'Dégradée',
      fairLabel: s.shield ? 'Préservée' : 'Compromise',
      xpStyle: s.shield ? 'color:#00E5FF' : 'color:#FF3EA5'
    };
    [0,1,2,3].forEach(function(i){
      var on = s.boss === i;
      v['b' + i] = function(){ self.setState({ boss: i }); };
      v['bS' + i] = on ? 'border-color:' + neon + ';box-shadow:0 0 0 1px ' + neon + ',0 16px 40px -20px ' + neon + ';background:#1E1844' : '';
      v['bA' + i] = on ? 'true' : 'false';
      var a = s.sys[i];
      v['sys' + i] = { on: a ? 'true' : 'false', st: a ? 'Actif' : 'Arrêt',
        style: pos[i] + (a ? ';border-color:#00E5FF;color:#EDE8FF;box-shadow:0 0 22px -6px rgba(0,229,255,.8)' : ';opacity:.55'),
        pick: function(){ var arr = self.state.sys.slice(); arr[i] = !arr[i]; self.setState({ sys: arr }); } };
    });
    return v;
  }
}
</script>
