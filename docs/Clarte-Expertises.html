<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Clarté — Expertises</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&amp;display=swap">
<style>
body{margin:0}
sc-for,sc-if{display:contents}
.bq{font-family:"Hanken Grotesk",system-ui,sans-serif;color:#0F1720;background:#FFFFFF;-webkit-font-smoothing:antialiased;line-height:1.5}
.bq *{box-sizing:border-box}
.bq a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.serif{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:0}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#4A5563;margin:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--l);color:#0F1720;font-weight:600;font-size:13px;padding:5px 11px;border-radius:999px;white-space:nowrap}
.chip-o{display:inline-flex;align-items:center;gap:6px;border:1px solid #E3E7EC;color:#4A5563;font-weight:500;font-size:13px;padding:5px 11px;border-radius:999px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;transition:background .25s,color .25s,transform .25s,border-color .25s;border:1px solid transparent;cursor:pointer;font-family:inherit;white-space:nowrap}
.bq .btn-p{background:var(--c);color:#fff}
.bq .btn-p:hover{background:#0F1720;transform:translateY(-1px)}
.bq .btn-g{border-color:#0F1720;color:#0F1720;background:transparent}
.bq .btn-g:hover{background:#0F1720;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{transition:transform .25s}
.btn:hover svg{transform:translateX(3px)}
.bq .lnk{color:var(--c);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid transparent;transition:border-color .2s}
.lnk:hover{border-bottom-color:currentColor}
.tb-l{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--l);margin-right:8px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,244,50,.7)}70%{box-shadow:0 0 0 8px rgba(198,244,50,0)}100%{box-shadow:0 0 0 0 rgba(198,244,50,0)}}
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #E3E7EC}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:21px;letter-spacing:-.03em;min-height:44px}
.nav-d{display:flex;gap:4px}
.nav-d a{text-decoration:none;font-weight:500;font-size:15px;color:#4A5563;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;transition:background .2s,color .2s}
.nav-d a:hover{background:#F3F5F7;color:#0F1720}
.nav-d a[aria-current="page"]{color:#0F1720;background:#F3F5F7}
.burger{display:none;width:48px;height:48px;border-radius:999px;border:1px solid #E3E7EC;background:#fff;align-items:center;justify-content:center;cursor:pointer;color:#0F1720}
.mnav{display:none;border-top:1px solid #E3E7EC;padding:12px 20px 20px}
.mnav a{display:flex;align-items:center;min-height:48px;text-decoration:none;font-weight:600;font-size:17px;border-bottom:1px solid #E3E7EC}
.card{background:#fff;border:1px solid #E3E7EC;border-radius:20px}
.lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s}
.lift:hover{transform:translateY(-4px);box-shadow:0 22px 44px -24px rgba(15,23,32,.28);border-color:#C9D1DA}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.fadein{animation:fadein .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.opt{font-family:inherit;cursor:pointer;text-align:left;border-radius:14px;transition:background .25s,border-color .25s,color .25s,box-shadow .25s}
.opt:hover{border-color:#0F1720}
.bq :focus-visible{outline:3px solid var(--c);outline-offset:3px}
.ft a{text-decoration:none;color:#C5CDD6;display:inline-flex;min-height:36px;align-items:center;transition:color .2s}
.ft a:hover{color:#fff}
.img-z{overflow:hidden;border-radius:24px}
.img-z img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.img-z:hover img{transform:scale(1.04)}
.acc{width:100%;font-family:inherit;background:none;border:0;cursor:pointer;color:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:64px;padding:16px 0}
.acc svg{transition:transform .3s}
.eng{transition:background .35s,color .35s}
.eng:hover{background:#F3F5F7}
@media (max-width:960px){.nav-d{display:none}.burger{display:inline-flex}.mnav{display:block}.hide-s{display:none}}
@media (max-width:640px){.wrap{padding:0 20px}}
</style>
</helmet>
<div class="bq" style="{{ rootStyle }}">

<div style="background:#0F1720;color:#fff;font-size:13px">
<div class="wrap" style="display:flex;justify-content:space-between;align-items:center;gap:8px 16px;min-height:40px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px">
<span><span class="dot"></span>Prix publics : dès 4 500 €/mois, sans frais cachés. <a href="Clarte-Offres.html" class="tb-l">Voir le comparatif</a></span>
<a href="index.html" class="tb-l">Toutes les propositions</a>
</div>
</div>

<header class="hdr">
<div class="wrap" style="display:flex;align-items:center;justify-content:space-between;height:76px;gap:24px">
<a href="Clarte-Accueil.html" class="logo" aria-label="Baquelis, accueil">
<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="#0F1720"></rect><rect x="8" y="8" width="14" height="14" rx="3" fill="none" stroke="#fff" stroke-width="2"></rect><rect x="15" y="15" width="7" height="7" rx="1.5" style="fill:var(--l)"></rect></svg>
<span>Baquelis</span>
</a>
<nav class="nav-d" aria-label="Navigation principale">
<a href="Clarte-Expertises.html" aria-current="page">Expertises</a>
<a href="Clarte-IA.html">IA</a>
<a href="Clarte-Jeux.html">Jeux &amp; Web3</a>
<a href="Clarte-Offres.html">Offres</a>
<a href="Clarte-Contact.html">Contact</a>
</nav>
<div style="display:flex;gap:10px;align-items:center">
<a href="Clarte-Contact.html" class="btn btn-p hide-s">Réserver un appel</a>
<button class="burger" type="button" aria-label="Ouvrir ou fermer le menu" onClick="{{ toggleNav }}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"></path></svg></button>
</div>
</div>
<sc-if value="{{ navOpen }}" hint-placeholder-val="{{ false }}">
<nav class="mnav" aria-label="Navigation mobile">
<a href="Clarte-Expertises.html">Expertises</a>
<a href="Clarte-IA.html">IA</a>
<a href="Clarte-Jeux.html">Jeux &amp; Web3</a>
<a href="Clarte-Offres.html">Offres</a>
<a href="Clarte-Contact.html">Contact</a>
<a href="Clarte-Contact.html" class="btn btn-p" style="margin-top:16px;border:0;justify-content:center">Commencer</a>
</nav>
</sc-if>
</header>

<!-- HERO -->
<section style="padding:88px 0 72px">
<div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:56px;align-items:end">
<div>
<p class="eyebrow rise">Expertises</p>
<h1 class="rise d1" style="margin:20px 0 0;font-weight:700;font-size:clamp(38px,4.6vw,66px);line-height:1.03;letter-spacing:-.045em;overflow-wrap:anywhere">Nous ne livrons pas seulement du code.</h1>
<p class="serif rise d2" style="font-size:clamp(22px,2.2vw,30px);line-height:1.3;margin:20px 0 0;color:var(--c)">Nous construisons des systèmes évolutifs qui grandissent avec votre entreprise.</p>
</div>
<div class="rise d3" style="display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid #E3E7EC;border-left:1px solid #E3E7EC">
<sc-for list="{{ index }}" as="x" hint-placeholder-count="4">
<a href="{{ x.href }}" class="eng" style="display:block;text-decoration:none;padding:22px;border-right:1px solid #E3E7EC;border-bottom:1px solid #E3E7EC;min-height:120px">
<div class="num" style="font-size:44px;font-weight:700;line-height:1">{{ x.v }}</div>
<div style="color:#4A5563;font-size:14px;margin-top:8px">{{ x.l }}</div>
</a>
</sc-for>
</div>
</div>
</section>

<!-- PILIERS -->
<section id="piliers" style="background:#F3F5F7;padding:104px 0">
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap">
<h2 style="font-size:clamp(30px,3.4vw,48px);line-height:1.06;letter-spacing:-.035em;margin:0;font-weight:700">Les 4 piliers, <span class="serif" style="font-weight:400">en détail.</span></h2>
<p style="color:#4A5563;margin:0;max-width:380px">Chaque pilier se traduit en pratiques concrètes. Sélectionnez un pilier, puis une pratique.</p>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:8px;margin-top:40px" role="tablist" aria-label="Piliers">
<sc-for list="{{ pillarTabs }}" as="p" hint-placeholder-count="4">
<button type="button" role="tab" class="opt" style="{{ p.style }}" aria-selected="{{ p.pressed }}" onClick="{{ p.pick }}">
<span class="num" style="display:block;font-size:13px;opacity:.7">{{ p.n }}</span>
<span style="display:block;font-weight:600;font-size:18px;margin-top:6px">{{ p.t }}</span>
</button>
</sc-for>
</div>
<div class="card fadein" style="margin-top:16px;padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:40px" role="tabpanel">
<div>
<p class="eyebrow">{{ pillar.n }} · {{ pillar.t }}</p>
<p class="serif" style="font-size:clamp(24px,2.4vw,32px);line-height:1.3;margin:16px 0 0">« {{ pillar.q }} »</p>
<div style="margin-top:32px;padding:22px;background:#F3F5F7;border-radius:16px;display:flex;gap:20px;align-items:center">
<span class="num" style="font-size:48px;font-weight:700;line-height:1;color:var(--c);white-space:nowrap">{{ pillar.fig }}</span>
<span style="font-size:14px;color:#4A5563">{{ pillar.figL }}</span>
</div>
<p style="margin:24px 0 0;color:#4A5563"><strong style="color:#0F1720">Ce que ça change pour vous : </strong>{{ pillar.impact }}</p>
</div>
<div style="border-top:1px solid #E3E7EC">
<sc-for list="{{ feats }}" as="f" hint-placeholder-count="4">
<div style="border-bottom:1px solid #E3E7EC">
<button type="button" class="acc" aria-expanded="{{ f.open }}" onClick="{{ f.pick }}">
<span style="display:flex;gap:14px;align-items:center"><span class="num" style="font-size:13px;color:#4A5563">{{ f.n }}</span><strong style="font-size:18px">{{ f.t }}</strong></span>
<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" style="{{ f.rot }}" aria-hidden="true"><path d="M9 3v12M3 9h12"></path></svg>
</button>
<sc-if value="{{ f.isOpen }}" hint-placeholder-val="{{ false }}">
<p class="fadein" style="margin:0 0 20px 34px;color:#4A5563">{{ f.d }}</p>
</sc-if>
</div>
</sc-for>
</div>
</div>
</div>
</section>

<!-- DOMAINES -->
<section id="domaines" style="padding:104px 0">
<div class="wrap">
<p class="eyebrow">Domaines d’intervention</p>
<h2 style="font-size:clamp(30px,3.4vw,48px);line-height:1.06;letter-spacing:-.035em;margin:16px 0 0;font-weight:700;max-width:760px">Cinq terrains, <span class="serif" style="font-weight:400;color:var(--c)">une même exigence.</span></h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:32px;margin-top:48px;align-items:start">
<div style="display:grid;gap:0;border-top:1px solid #E3E7EC" role="tablist" aria-label="Domaines">
<sc-for list="{{ domTabs }}" as="d" hint-placeholder-count="5">
<button type="button" role="tab" class="opt" style="{{ d.style }}" aria-selected="{{ d.pressed }}" onClick="{{ d.pick }}">
<span style="display:flex;justify-content:space-between;align-items:center;width:100%;gap:12px"><span style="display:flex;gap:14px;align-items:center"><span class="num" style="font-size:13px;opacity:.7">{{ d.n }}</span><span style="font-weight:600;font-size:19px">{{ d.t }}</span></span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"></path></svg></span>
</button>
</sc-for>
</div>
<div class="fadein" style="display:grid;gap:16px">
<div class="img-z" style="height:340px"><img src="{{ dom.img }}" alt="{{ dom.alt }}" style="width:100%;height:340px;object-fit:cover;display:block"></div>
<div class="card" style="padding:28px">
<h3 style="margin:0;font-size:24px;letter-spacing:-.02em">{{ dom.t }}</h3>
<p style="margin:10px 0 0;color:#4A5563">{{ dom.d }}</p>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:18px">
<sc-for list="{{ dom.tags }}" as="tg" hint-placeholder-count="4"><span class="chip-o">{{ tg }}</span></sc-for>
</div>
<p style="margin:18px 0 0;font-size:13px;color:#4A5563">Technologies : [STACK À CONFIRMER]</p>
</div>
</div>
</div>
</div>
</section>

<!-- MÉTHODE -->
<section id="methode" style="background:#0F1720;color:#fff;padding:104px 0">
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap">
<div><p class="eyebrow" style="color:#9AA6B4">Méthode</p><h2 style="font-size:clamp(30px,3.4vw,48px);line-height:1.06;letter-spacing:-.035em;margin:16px 0 0;font-weight:700">De l’appel découverte <span class="serif" style="font-weight:400;color:var(--l)">au suivi en temps réel.</span></h2></div>
<div class="num" style="font-size:15px;color:#C5CDD6">Étape <strong style="color:#fff;font-size:22px">{{ stepNum }}</strong> / 5</div>
</div>
<div style="height:4px;background:#2B3644;border-radius:4px;margin-top:40px;overflow:hidden" aria-hidden="true"><div style="{{ stepBar }}"></div></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:8px;margin-top:16px" role="tablist" aria-label="Étapes">
<sc-for list="{{ stepTabs }}" as="s" hint-placeholder-count="5">
<button type="button" role="tab" class="opt" style="{{ s.style }}" aria-selected="{{ s.pressed }}" onClick="{{ s.pick }}">
<span class="num" style="display:block;font-size:13px;opacity:.75">{{ s.n }}</span>
<span style="display:block;font-weight:600;margin-top:6px">{{ s.t }}</span>
</button>
</sc-for>
</div>
<div class="fadein" style="margin-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px">
<div style="background:#18222E;border-radius:20px;padding:32px;grid-column:span 1">
<div class="num" style="font-size:88px;font-weight:800;line-height:.9;color:var(--l)">{{ step.n }}</div>
<h3 style="font-size:28px;margin:18px 0 0;letter-spacing:-.02em">{{ step.t }}</h3>
<p style="color:#C5CDD6;margin:12px 0 0;font-size:17px">{{ step.d }}</p>
</div>
<div style="display:grid;gap:16px">
<div style="background:#18222E;border-radius:20px;padding:24px"><p class="eyebrow" style="color:#9AA6B4">Ce que vous obtenez</p><p style="margin:10px 0 0;font-size:17px">{{ step.out }}</p></div>
<div style="background:#18222E;border-radius:20px;padding:24px"><p class="eyebrow" style="color:#9AA6B4">Qui est impliqué</p><p style="margin:10px 0 0;font-size:17px">{{ step.who }}</p></div>
<div style="background:#18222E;border-radius:20px;padding:24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><p class="eyebrow" style="color:#9AA6B4">Délai</p><span class="chip">{{ step.delay }}</span></div>
</div>
</div>
<div style="display:flex;gap:10px;margin-top:24px;justify-content:flex-end">
<button type="button" class="btn" style="border-color:#5B6776;color:#fff;background:transparent" onClick="{{ prev }}" aria-label="Étape précédente"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"></path></svg>Précédente</button>
<button type="button" class="btn" style="background:var(--l);color:#0F1720" onClick="{{ next }}" aria-label="Étape suivante">Suivante<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"></path></svg></button>
</div>
</div>
</section>

<!-- ENGAGEMENTS -->
<section id="engagements" style="padding:104px 0">
<div class="wrap">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:48px;align-items:start">
<div style="position:sticky;top:120px">
<p class="eyebrow">Engagements</p>
<h2 style="font-size:clamp(30px,3.4vw,48px);line-height:1.06;letter-spacing:-.035em;margin:16px 0 0;font-weight:700">Quatre engagements, <span class="serif" style="font-weight:400">écrits noir sur blanc.</span></h2>
<p style="color:#4A5563;margin:18px 0 0;max-width:420px">Impact mesurable, innovation, fiabilité, engagement à long terme : notre manifeste découle directement de nos quatre piliers.</p>
<a href="Clarte-Offres.html" class="btn btn-p" style="margin-top:28px">Voir les formules</a>
</div>
<div style="border-top:1px solid #E3E7EC">
<sc-for list="{{ engs }}" as="e" hint-placeholder-count="4">
<div class="eng" style="border-bottom:1px solid #E3E7EC;padding:0 12px">
<button type="button" class="acc" aria-expanded="{{ e.open }}" onClick="{{ e.pick }}" style="min-height:96px">
<span style="display:flex;gap:20px;align-items:baseline"><span class="num" style="font-size:15px;color:var(--c);font-weight:700">{{ e.n }}</span><span style="font-size:clamp(22px,2.4vw,32px);font-weight:700;letter-spacing:-.025em">{{ e.t }}</span></span>
<svg width="22" height="22" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" style="{{ e.rot }}" aria-hidden="true"><path d="M9 3v12M3 9h12"></path></svg>
</button>
<sc-if value="{{ e.isOpen }}" hint-placeholder-val="{{ false }}">
<div class="fadein" style="padding:0 0 28px 38px">
<p class="serif" style="font-size:21px;margin:0;line-height:1.35">{{ e.q }}</p>
<p style="color:#4A5563;margin:10px 0 0">{{ e.d }}</p>
</div>
</sc-if>
</div>
</sc-for>
</div>
</div>
</div>
</section>

<!-- CTA -->
<section style="padding:0 0 104px">
<div class="wrap">
<div style="background:#F3F5F7;border-radius:32px;padding:clamp(36px,6vw,72px);display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap;align-items:center">
<h2 style="font-size:clamp(30px,3.6vw,52px);line-height:1.04;letter-spacing:-.04em;margin:0;font-weight:700;max-width:640px">Prêt à transformer votre entreprise ?</h2>
<div style="display:flex;gap:12px;flex-wrap:wrap">
<a href="Clarte-Contact.html" class="btn btn-p">Réserver un appel</a>
<a href="Clarte-Offres.html" class="btn btn-g">Voir les prix</a>
</div>
</div>
</div>
</section>

<footer class="ft" style="background:#0F1720;color:#fff;padding:72px 0 28px">
<div class="wrap">
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:40px">
<div>
<div style="display:flex;align-items:center;gap:10px;font-weight:700;font-size:21px;letter-spacing:-.03em"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="#fff"></rect><rect x="8" y="8" width="14" height="14" rx="3" fill="none" stroke="#0F1720" stroke-width="2"></rect><rect x="15" y="15" width="7" height="7" rx="1.5" style="fill:var(--l)"></rect></svg>Baquelis</div>
<p style="color:#C5CDD6;font-size:14px;margin:16px 0 0">Flexibilité. Continuité. Performance.</p>
