<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#07090C}
sc-for,sc-if{display:contents}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.nx{--c:#00AEEF;--w:#FFB547;background:#07090C;color:#E7EDF3;font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.nx *{box-sizing:border-box}
.nx a{color:inherit;text-decoration:none}
.nx img{display:block;max-width:100%}
.nx button{font-family:inherit;color:inherit}
.nx h1,.nx h2,.nx h3,.nx h4,.nx p{margin:0}
.nx ::selection{background:var(--c);color:#03131B}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px;position:relative}
.lab{font-family:'Geist Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#8A96A3}
.c{color:var(--c)}
.mut{color:#8A96A3}
.disp{font-weight:600;letter-spacing:-.045em;line-height:.98;overflow-wrap:anywhere}
.h2{font-size:clamp(34px,4.4vw,60px);font-weight:600;letter-spacing:-.04em;line-height:1.03;overflow-wrap:anywhere}
.lead{font-size:clamp(17px,1.35vw,19px);color:#B4BFCA;line-height:1.65}
.gridbg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#131920 1px,transparent 1px),linear-gradient(90deg,#131920 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 60% 40%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 70% 60% at 60% 40%,#000 25%,transparent 78%)}
.panel{background:#0E1217;border:1px solid #1C232B;border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:10px;border:1px solid var(--c);background:var(--c);color:#03131B;font:600 15px/1 'Geist',sans-serif;cursor:pointer;box-shadow:0 10px 30px -12px color-mix(in srgb,var(--c) 75%,transparent);transition:box-shadow .3s,transform .3s,border-color .3s,background .3s}
.nx a.btn{color:#03131B}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent),0 14px 40px -8px color-mix(in srgb,var(--c) 80%,transparent)}
.btn svg{transition:transform .3s}
.btn:hover svg{transform:translateX(3px)}
.btn-g,.nx a.btn-g{background:rgba(255,255,255,.02);color:#E7EDF3;border-color:#2A333D;box-shadow:none}
.btn-g:hover{border-color:var(--c);box-shadow:0 0 26px -8px color-mix(in srgb,var(--c) 70%,transparent)}
.btn-sm{min-height:44px;padding:0 16px;font-size:14px}
.kbd{display:inline-flex;align-items:center;font:500 11px/1 'Geist Mono',monospace;padding:4px 6px;border:1px solid #2A333D;border-bottom-width:2px;border-radius:6px;color:#8A96A3;background:#0B0E12}
.nx :focus-visible{outline:2px solid var(--c);outline-offset:3px}
.hdr{position:relative;z-index:50;border-bottom:1px solid #1C232B;background:rgba(7,9,12,.75);backdrop-filter:blur(14px)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:21px;letter-spacing:-.035em;min-height:44px}
.lspin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.nl{display:inline-flex;align-items:center;min-height:44px;padding:0 13px;font-size:14px;color:#B4BFCA;border-radius:8px;transition:color .2s,background .2s}
.nl:hover{color:#fff;background:#0E1217}
.cmdk{display:inline-flex;align-items:center;gap:10px;min-height:44px;min-width:44px;padding:0 8px 0 12px;background:#0B0E12;border:1px solid #1C232B;border-radius:10px;color:#8A96A3;font-size:14px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.cmdk:hover{border-color:#2F3A45;color:#E7EDF3;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent)}
.burger{display:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #1C232B;border-radius:10px;background:#0B0E12;cursor:pointer}
.mnav{border-top:1px solid #1C232B;padding:8px 20px 22px}
.mi{display:flex;justify-content:space-between;align-items:center;min-height:54px;border-bottom:1px solid #1C232B;font-size:18px}
.palx{position:absolute;left:0;right:0;top:86px;z-index:90;padding:0 20px;animation:palIn .28s cubic-bezier(.2,.8,.2,1) both}
.pal{max-width:660px;margin:0 auto;background:rgba(14,18,23,.97);border:1px solid #2A333D;border-radius:16px;box-shadow:0 40px 120px -20px #000,0 0 70px -24px color-mix(in srgb,var(--c) 55%,transparent);backdrop-filter:blur(20px);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:12px;padding:0 12px 0 18px;border-bottom:1px solid #1C232B;color:#8A96A3}
.pal-in input{flex:1;min-width:0;min-height:60px;background:transparent;border:0;color:#E7EDF3;font:400 17px 'Geist',sans-serif;outline:none}
.pal-in input::placeholder{color:#76838F}
.pal-tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid #1C232B}
.ptab{min-height:44px;padding:0 14px;border:1px solid transparent;border-radius:8px;background:transparent;color:#8A96A3;font:500 12px 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:color .2s,background .2s}
.ptab:hover{color:#E7EDF3}
.pal-list{max-height:360px;overflow:auto;padding:8px}
.pit{display:grid;grid-template-columns:76px minmax(0,1fr) auto 18px;align-items:center;gap:12px;min-height:50px;padding:0 12px;border-radius:10px;transition:background .15s}
.pit:hover,.pit:focus-visible{background:#151B22}
.pk{font:500 10px/1 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:6px 0;border-radius:5px;border:1px solid #2A333D;color:#8A96A3;text-align:center}
.pgo{opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .2s;color:var(--c)}
.pit:hover .pgo,.pit:focus-visible .pgo{opacity:1;transform:none}
.pal-f{display:flex;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid #1C232B;font:500 11px 'Geist Mono',monospace;color:#8A96A3;letter-spacing:.04em}
@keyframes palIn{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
.ft{border-top:1px solid #1C232B;padding:80px 0 28px;position:relative;background:linear-gradient(#07090C,#090C10)}
.fgrid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:40px}
.fl{display:flex;align-items:center;min-height:44px;color:#B4BFCA;font-size:14px;transition:color .2s}
.fl:hover{color:var(--c)}
.fi{display:flex;align-items:center;min-height:44px;color:#8A96A3;font:500 13px 'Geist Mono',monospace}
.fwm{font-weight:600;font-size:clamp(56px,17vw,250px);letter-spacing:-.065em;line-height:.82;color:transparent;-webkit-text-stroke:1px #222B34;margin:72px 0 0;white-space:nowrap;user-select:none;text-align:center}
.fbot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid #1C232B;padding-top:22px;margin-top:8px;font:500 12px 'Geist Mono',monospace;color:#8A96A3}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}.d4{animation-delay:.38s}.d5{animation-delay:.48s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes rot{to{--a:360deg}}
.live{display:inline-flex;align-items:center;gap:8px;font:500 11px/1 'Geist Mono',monospace;letter-spacing:.1em;color:var(--w);padding:6px 10px;border:1px solid rgba(255,181,71,.32);border-radius:999px;background:rgba(255,181,71,.06)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--w);box-shadow:0 0 10px var(--w);animation:pulse 1.6s infinite}
.sect{padding:120px 0;position:relative}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:56px}
.eyb{display:inline-flex;align-items:center;gap:10px;margin-bottom:20px}
.eyb::before{content:"";width:18px;height:1px;background:var(--c);box-shadow:0 0 8px var(--c)}
.spot{position:relative;overflow:hidden;isolation:isolate}
.spot .glow{position:absolute;width:560px;height:560px;left:50%;top:0;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 20%,transparent),transparent);opacity:0;transition:opacity .4s,left .55s cubic-bezier(.2,.8,.2,1),top .55s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:0}
.spot:hover .glow{opacity:1}
.zs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);z-index:3}
.zs i{display:block}
.spot:has(.zs i:nth-child(1):hover) .glow{left:15%;top:15%}
.spot:has(.zs i:nth-child(2):hover) .glow{left:50%;top:15%}
.spot:has(.zs i:nth-child(3):hover) .glow{left:85%;top:15%}
.spot:has(.zs i:nth-child(4):hover) .glow{left:15%;top:50%}
.spot:has(.zs i:nth-child(5):hover) .glow{left:50%;top:50%}
.spot:has(.zs i:nth-child(6):hover) .glow{left:85%;top:50%}
.spot:has(.zs i:nth-child(7):hover) .glow{left:15%;top:85%}
.spot:has(.zs i:nth-child(8):hover) .glow{left:50%;top:85%}
.spot:has(.zs i:nth-child(9):hover) .glow{left:85%;top:85%}
.spot>.in{position:relative;z-index:1}
.glowb{position:relative}
.glowb::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),transparent 0 55%,var(--c) 72%,#fff 76%,var(--c) 80%,transparent 95%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 5s linear infinite;pointer-events:none}
/* page: accueil */
.hero{position:relative;padding:72px 0 40px}
.halo{position:absolute;width:900px;height:900px;right:-160px;top:-160px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%);pointer-events:none}
.hero-g{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:10px;min-height:34px;padding:0 14px 0 10px;border:1px solid #1C232B;border-radius:999px;background:#0B0E12;font:500 12px 'Geist Mono',monospace;letter-spacing:.06em;color:#B4BFCA}
.pill b{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.hw{display:block;transition:color .5s,text-shadow .5s}
.rtabs{display:flex;flex-wrap:wrap;gap:8px;margin:34px 0 22px}
.rtab{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:1px solid #1C232B;border-radius:10px;background:#0B0E12;color:#8A96A3;font:500 13px 'Geist Mono',monospace;cursor:pointer;transition:border-color .25s,color .25s,box-shadow .25s,background .25s}
.rtab:hover{color:#E7EDF3;border-color:#2F3A45}
.swap{animation:up .6s cubic-bezier(.2,.8,.2,1) both;min-height:178px}
.pts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px}
.pt{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#C9D2DB}
.pt svg{color:var(--c);flex:none}
.core{position:relative;width:100%;max-width:620px;margin-left:auto;aspect-ratio:1/1}
.core svg{display:block;width:100%;height:auto;overflow:visible}
.orb{transform-box:view-box;transform-origin:300px 300px;animation:spin 60s linear infinite}
.o1{animation-duration:34s}.o2{animation-duration:58s;animation-direction:reverse}.o3{animation-duration:92s}.ofast{animation-duration:7s}.otext{animation-duration:140s;animation-direction:reverse}
.hit{fill:none;stroke:transparent;stroke-width:34;pointer-events:stroke;cursor:pointer}
.ncore{transform-box:fill-box;transform-origin:center;animation:breath 4.2s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.14);opacity:.65}}
.flow{stroke-dasharray:3 7;animation:flow 1s linear infinite;transition:opacity .4s}
.rl{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid #1C232B;border-radius:999px;background:rgba(11,14,18,.88);backdrop-filter:blur(6px);font:500 12px 'Geist Mono',monospace;letter-spacing:.04em;color:#B4BFCA;cursor:pointer;white-space:nowrap;transition:border-color .3s,color .3s,box-shadow .3s}
.rl:hover{color:#fff;border-color:#33404C}
.rl i{width:7px;height:7px;border-radius:50%;background:currentColor}
.con{overflow:hidden}
.con-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-bottom:1px solid #1C232B;flex-wrap:wrap}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;background:#1C232B}
.con-g{display:grid;grid-template-columns:1.25fr 1fr 1fr}
.con-g>div{padding:22px;border-right:1px solid #1C232B;min-width:0}
.con-g>div:last-child{border-right:0}
.lg{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px dashed #1C232B;font-size:14px;color:#C9D2DB}
.lg:last-child{border-bottom:0}
.lg svg{margin-top:3px;color:var(--c)}
.newl{animation:up .5s both}
.bars{display:flex;align-items:flex-end;gap:5px;height:96px;margin:16px 0 18px}
.bars span{flex:1;border-radius:3px 3px 0 0;background:#1E2A35;transition:height .8s cubic-bezier(.2,.8,.2,1),background .4s}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #1C232B;font-size:14px}
.prog{height:6px;border-radius:6px;background:#151B22;overflow:hidden;margin-top:10px}
.prog span{display:block;height:6px;border-radius:6px;background:var(--c);box-shadow:0 0 12px var(--c);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.ben{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));border:1px solid #1C232B;border-radius:16px;overflow:hidden}
.bi{position:relative;padding:34px 28px 36px;border-right:1px solid #1C232B;background:#090C10;transition:background .35s}
.bi:last-child{border-right:0}
.bi::after{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--c);box-shadow:0 0 12px var(--c);transform:scaleX(0);transform-origin:left;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.bi:hover{background:#0E1217}
.bi:hover::after{transform:scaleX(1)}
.ico{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #1C232B;border-radius:10px;color:var(--c);background:#0B0E12;margin-bottom:26px}
.bento{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.bc{display:block;text-align:left;width:100%;padding:0;background:#0B0E12;border:1px solid #1C232B;border-radius:18px;cursor:pointer;transition:border-color .35s,box-shadow .35s,transform .35s}
.bc:hover{border-color:#2A3540;transform:translateY(-2px)}
.bc .in{display:block;padding:28px}
.bvis{display:block;height:150px;margin:-4px 0 18px}
.bvis svg{width:100%;height:150px;display:block}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:1px solid #1C232B;border-radius:6px;font:500 12px 'Geist Mono',monospace;color:#B4BFCA;background:#07090C}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.pdet{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:0;margin-top:14px;border:1px solid #1C232B;border-radius:16px;overflow:hidden;animation:up .5s both}
.pdet>div{padding:22px 24px;border-right:1px solid #1C232B;background:#090C10}
.pdet>div:last-child{border-right:0}
.term{font:400 13.5px/1.9 'Geist Mono',monospace;color:#B4BFCA;padding:22px}
.tl{opacity:0;animation:up .5s forwards}
.caret{display:inline-block;width:8px;height:16px;background:var(--c);vertical-align:-3px;animation:blink 1s steps(1) infinite}
.games{position:relative;overflow:hidden;border-radius:20px;border:1px solid #1C232B;background:#0B0E12}
.games .gimg{position:absolute;right:0;top:0;bottom:0;width:58%;background:url(assets/controller-neon.webp) center/cover no-repeat;opacity:.55;-webkit-mask-image:linear-gradient(90deg,transparent,#000 45%);mask-image:linear-gradient(90deg,transparent,#000 45%);transition:transform 1.4s cubic-bezier(.2,.8,.2,1),opacity .6s}
.games:hover .gimg{transform:scale(1.04);opacity:.7}
.ex{padding:18px 0;border-top:1px solid #1C232B}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;position:relative}
.sline{position:absolute;left:22px;right:22px;top:22px;height:1px;background:#1C232B}
.sline span{display:block;height:1px;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.st{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:0;background:transparent;border:0;text-align:left;cursor:pointer;color:#8A96A3;min-height:44px}
.sn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1px solid #2A333D;background:#07090C;font:500 13px 'Geist Mono',monospace;transition:all .35s}
.st:hover .sn{border-color:var(--c);color:#E7EDF3}
.sdet{margin-top:40px;padding:30px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center;animation:up .5s both}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px;align-items:stretch}
.pc{padding:30px;border-radius:18px;background:#0B0E12;border:1px solid #1C232B;display:flex;flex-direction:column;transition:transform .35s,border-color .35s}
.pc:hover{transform:translateY(-3px);border-color:#2A3540}
.pflex{background:linear-gradient(180deg,#0E161D,#0B0E12);border-color:color-mix(in srgb,var(--c) 40%,#1C232B);box-shadow:0 30px 80px -30px color-mix(in srgb,var(--c) 45%,transparent)}
.cta{position:relative;overflow:hidden;border:1px solid #1C232B;border-radius:24px;padding:96px 40px;text-align:center;background:radial-gradient(ellipse at 50% 120%,color-mix(in srgb,var(--c) 16%,transparent),transparent 60%),#090C10}
.cta svg.bgr{position:absolute;left:50%;top:50%;width:1100px;height:1100px;transform:translate(-50%,-50%);pointer-events:none;opacity:.7}
@media (max-width:1080px){.nav-links{display:none!important}.burger{display:inline-flex}.hide-m{display:none!important}.hero-g{grid-template-columns:1fr}.core{margin:0 auto}.con-g{grid-template-columns:1fr}.con-g>div{border-right:0;border-bottom:1px solid #1C232B}.games .gimg{width:100%;opacity:.25}}
@media (max-width:900px){.bento{grid-template-columns:1fr}.bento>*{grid-column:auto!important}.fgrid{grid-template-columns:1fr 1fr}.steps{grid-template-columns:1fr}.sline{display:none}.st{flex-direction:row;align-items:center}.sdet{grid-template-columns:1fr}}
@media (max-width:720px){.wrap{padding:0 20px}.sect{padding:80px 0}.hide-s{display:none!important}.rl{font-size:11px;padding:0 10px}.cta{padding:64px 22px}.bi{border-right:0;border-bottom:1px solid #1C232B}.pdet>div{border-right:0;border-bottom:1px solid #1C232B}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.nx *{animation:none!important;transition:none!important}.tl{opacity:1}}
</style>
</helmet>

  <div class="wrap hrow">

      <span>Baquelis</span>

        m:[{l:'Rapports',v:'Hebdomadaires'},{l:'Passation',v:'Renforcée'},{l:'Engagement',v:'6 mois min.'}],
        log:['Rapport hebdomadaire envoyé','Documentation de passation mise à jour','Décisions techniques consignées','Feuille de route du trimestre partagée','Accès et secrets revus avec vos équipes'] },
      { k:'Performance', n:'03', slug:'performance', h:'Cinq experts seniors, prêts pour l’enjeu.',
        p:'Lead tech et Product Owner inclus, gestion de projet agile complète, couverture 24/7 et tableaux de bord quotidiens avec la formule Performance.',
        pts:[{t:'Lead tech + Product Owner'},{t:'Support prioritaire 24/7'},{t:'Espace Slack dédié'}],
        report:'Rapport quotidien personnalisé',
        m:[{l:'Équipe',v:'5 experts seniors'},{l:'Couverture',v:'24/7'},{l:'Rapports',v:'Quotidiens'}],
        log:['Rapport quotidien personnalisé envoyé','Demande hotline traitée de nuit','Tableau de bord mis à jour','Démo de sprint planifiée avec le PO','Revue de performance livrée'] }
    ];
    const R = RINGS[r];
    const on = i => i === r;
    const glowTxt = 'color:#E7EDF3;text-shadow:0 0 42px color-mix(in srgb,var(--c) 55%,transparent)';
    const dimTxt = 'color:#56626E';
    const ringS = i => on(i) ? 'stroke:var(--c);stroke-opacity:1;filter:drop-shadow(0 0 6px var(--c))' : 'stroke:#33404C';
    const nodeS = i => on(i) ? 'fill:var(--c);filter:drop-shadow(0 0 8px var(--c))' : 'fill:#33404C';
    const labS = (i, x, y) => 'left:' + x + '%;top:' + y + '%;' + (on(i) ? 'border-color:var(--c);color:#fff;box-shadow:0 0 28px -4px color-mix(in srgb,var(--c) 65%,transparent);background:#0E1217' : '');
    const pick = i => () => this.setState({ ring: i });
    const len = R.log.length, start = s.tick % len;
    const logs = [0,1,2,3,4].map(k => ({
      t: R.log[(start + len - k) % len],
      time: k === 0 ? 'à l’instant' : 'il y a ' + (k * 4 + 2) + ' min',
      style: k === 0 ? 'color:#E7EDF3' : 'opacity:' + (1 - k * 0.15)
    }));
    const bars = [];
    for (let i = 0; i < 16; i++) {
      const h = 16 + ((i * 29 + s.tick * 17 + r * 11) % 72);
      bars.push({ style: 'height:' + h + 'px;' + (i === 15 ? 'background:var(--c);box-shadow:0 0 12px var(--c)' : (i > 11 ? 'background:#2A3A48' : '')) });
    }
    const prog = 28 + ((s.tick * 7 + r * 13) % 64);
    const PIL = [
      [{t:'Architecture évolutive',d:'Des fondations pensées pour absorber la croissance sans réécriture.'},{t:'Pile technologique moderne',d:'Des choix techniques actuels, maintenables et documentés.'},{t:'Solutions cloud-native',d:'Déploiement, mise à l’échelle et résilience intégrés dès la conception.'},{t:'Optimisation des performances',d:'Mesurer, profiler, améliorer — en continu.'}],
      [{t:'Intégration d’équipe dédiée',d:'Vos experts rejoignent vos outils, vos rituels, vos objectifs.'},{t:'Engagement à long terme',d:'Une relation construite dans la durée, pas une mission ponctuelle.'},{t:'Alignement culturel',d:'Une façon de travailler qui épouse la vôtre.'},{t:'Communication fluide',d:'Des échanges directs avec les personnes qui construisent.'}],
      [{t:'Prototypage rapide',d:'Valider une idée vite, avant d’engager plus loin.'},{t:'Méthodologie agile',d:'Des itérations courtes et des priorités claires.'},{t:'Assurance qualité',d:'Tests et revues intégrés au rythme de livraison.'},{t:'Intégration continue',d:'Chaque changement vérifié, chaque livraison maîtrisée.'}],
      [{t:'Suivi des progrès en temps réel',d:'L’avancement visible à tout moment, sans relance.'},{t:'Tarification transparente',d:'Un prix mensuel clair, sans coût caché.'},{t:'Rapports réguliers',d:'Mensuels, hebdomadaires ou quotidiens selon la formule.'},{t:'Communication ouverte',d:'Les difficultés sont dites tôt, avec des options.'}]
    ];
    const pc = (i, span) => 'grid-column:span ' + span + ';' + (s.pilier === i ? 'border-color:color-mix(in srgb,var(--c) 70%,#1C232B);box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 40%,transparent),0 30px 80px -30px color-mix(in srgb,var(--c) 50%,transparent)' : '');
    const pp = i => () => this.setState({ pilier: i });
    const STEPS = [
      { t:'Appel découverte', d:'Nous écoutons vos enjeux, votre contexte technique et vos échéances, pour comprendre ce qui compte vraiment.', delai:'Délai : [DÉLAI]' },
      { t:'Cadrage & choix de formule', d:'Intégration, Flex ou Performance : nous recommandons la formule adaptée à votre périmètre et à votre horizon.', delai:'Délai : [DÉLAI]' },
      { t:'Sélection du profil ou de l’équipe', d:'Un profil dédié ou une équipe de 5 experts seniors. Changement de profil sous 30 jours (Intégration) ou 15 jours (Flex).', delai:'Changement : 30 j / 15 j' },
      { t:'Intégration à vos outils et rituels', d:'Messagerie, gestion des tickets, cérémonies agiles : l’équipe travaille comme une extension de la vôtre.', delai:'Délai : [DÉLAI]' },
      { t:'Suivi temps réel & ajustements', d:'Rapports mensuels, hebdomadaires ou quotidiens selon la formule, et des ajustements continus.', delai:'En continu' }
    ];
    const steps = STEPS.map((x, i) => ({
      n: '0' + (i + 1), t: x.t, sel: s.etape === i ? 'true' : 'false',
      style: i <= s.etape ? 'border-color:var(--c);color:#03131B;background:var(--c);box-shadow:0 0 18px -2px var(--c)' : '',
      pick: () => this.setState({ etape: i })
    }));
    const st = STEPS[s.etape];
    return Object.assign(this.shell('Accueil'), {
      R, ringWord: R.k,
      hw0: on(0) ? glowTxt : dimTxt, hw1: on(1) ? glowTxt : dimTxt, hw2: on(2) ? glowTxt : dimTxt,
      ringTabs: RINGS.map((x, i) => ({ n: x.n, k: x.k, sel: on(i) ? 'true' : 'false', pick: pick(i),
        style: on(i) ? 'border-color:var(--c);color:#E7EDF3;background:#0E1217;box-shadow:0 0 24px -8px var(--c)' : '' })),
      copies: RINGS.map((x, i) => ({ on: on(i), h: x.h, p: x.p, pts: x.pts })),
      rs0: ringS(0), rs1: ringS(1), rs2: ringS(2), ns0: nodeS(0), ns1: nodeS(1), ns2: nodeS(2),
      cs0: on(0) ? '' : 'opacity:0', cs1: on(1) ? '' : 'opacity:0', cs2: on(2) ? '' : 'opacity:0',
      sp0: 'stroke:var(--c);opacity:' + (on(0) ? '.9' : '0'), sp1: 'stroke:var(--c);opacity:' + (on(1) ? '.9' : '0'), sp2: 'stroke:var(--c);opacity:' + (on(2) ? '.9' : '0'),
      rl0: labS(0, 34.7, 37.1), rl1: labS(1, 75.3, 32.3), rl2: labS(2, 26.1, 84.1),
      rp0: on(0) ? 'true' : 'false', rp1: on(1) ? 'true' : 'false', rp2: on(2) ? 'true' : 'false',
      pick0: pick(0), pick1: pick(1), pick2: pick(2),
      logs, bars, tasks: String([14, 22, 37][r] + s.tick),
      progStyle: 'width:' + prog + '%', progTxt: prog + ' %',
      pc0: pc(0, 4), pc1: pc(1, 2), pc2: pc(2, 2), pc3: pc(3, 4),
      pa0: s.pilier === 0 ? 'true' : 'false', pa1: s.pilier === 1 ? 'true' : 'false', pa2: s.pilier === 2 ? 'true' : 'false', pa3: s.pilier === 3 ? 'true' : 'false',
      pp0: pp(0), pp1: pp(1), pp2: pp(2), pp3: pp(3),
      pfeat: PIL[s.pilier].map((x, i) => ({ n: 'P/0' + (s.pilier + 1) + '.' + (i + 1), t: x.t, d: x.d })),
      steps, step: { n: '0' + (s.etape + 1), t: st.t, d: st.d, delai: st.delai },
      lineStyle: 'width:' + (s.etape * 25) + '%'
    });
  }
}
</script>
