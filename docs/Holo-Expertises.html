<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Holo — Expertises</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Unbounded:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F3F8}
sc-for,sc-if{display:contents}
.hl,.hl *{box-sizing:border-box}
.hl{font-family:'Figtree',system-ui,sans-serif;background:#F4F3F8;color:#14131A;line-height:1.55;font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased}
.hl h1,.hl h2,.hl h3,.hl h4,.hl p{margin:0}
.hl img{display:block;max-width:100%}
.disp{font-family:'Unbounded','Figtree',sans-serif;font-weight:600;letter-spacing:-.025em;line-height:1.06;overflow-wrap:anywhere}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px;position:relative}
.sec{padding:120px 0;position:relative}
.h2{font-size:clamp(28px,3.3vw,48px)}
.lead{font-size:clamp(17px,1.35vw,20px);color:#5D5B6A;max-width:620px}
.muted{color:#5D5B6A}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#5D5B6A;display:inline-flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:26px;height:10px;border-radius:10px;background:conic-gradient(from 200deg,#ffcdee,#c4ebff,#cdfde6,#fff1bd,#e0cdff,#ffcdee);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.glass{background:rgba(255,255,255,.6);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 30px 70px -40px rgba(40,30,90,.35);border-radius:28px}
.lnk{color:#006A93;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.lnk:hover{text-decoration:underline;text-underline-offset:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;color:#14131A;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,background .3s}
.btn-p{background:#0093CC;box-shadow:0 14px 34px -14px rgba(0,147,204,.75)}
.btn-p::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);transition:transform .8s ease}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 20px 44px -16px rgba(0,147,204,.85)}
.btn-p:hover::after{transform:translateX(120%)}
.btn-g{background:rgba(255,255,255,.75);border:1px solid rgba(20,19,26,.12)}
.btn-g:hover{background:#fff;transform:translateY(-2px)}
.hl a:focus-visible,.hl button:focus-visible,.hl input:focus-visible,.hl textarea:focus-visible{outline:3px solid #0093CC;outline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(20,19,26,.1);font-size:13px;font-weight:500}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes grow{from{transform:scaleY(.2);opacity:0}to{transform:none;opacity:1}}
.rv{animation:rise .95s cubic-bezier(.2,.7,.2,1) backwards}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}.d4{animation-delay:.38s}
.fade{animation:fadein .55s cubic-bezier(.2,.7,.2,1) backwards}
.hdr{position:relative;z-index:20;padding:16px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 8px 8px 18px;border-radius:999px}
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#14131A;min-height:44px}
.mark{width:32px;height:32px;border-radius:11px;position:relative;background:conic-gradient(from 200deg,#ffbfe8,#b4e6ff,#bdfbdf,#ffeeaa,#d8c2ff,#ffbfe8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 8px 18px -8px rgba(80,60,160,.6);animation:hue 10s linear infinite}
.mark::after{content:"";position:absolute;left:9px;top:9px;width:14px;height:14px;border-radius:4px;background:#14131A;transform:rotate(45deg)}
.wordmark{font-family:'Unbounded',sans-serif;font-weight:600;font-size:19px;letter-spacing:-.02em}
.nav{display:flex;gap:2px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;font-weight:500;font-size:15px;color:#14131A;transition:background .25s}
.nav a:hover{background:rgba(20,19,26,.06)}
.nav a.on{background:#14131A;color:#fff}
.hright{display:flex;align-items:center;gap:8px}
.hcta{min-height:46px}
.burger{display:none;width:46px;height:46px;border-radius:999px;border:1px solid rgba(20,19,26,.12);background:#fff;align-items:center;justify-content:center;cursor:pointer;color:#14131A}
.mnav{margin-top:10px;padding:10px;display:grid;gap:4px;border-radius:24px}
.mnav a{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:14px;text-decoration:none;color:#14131A;font-weight:500}
.mnav a:hover{background:rgba(20,19,26,.06)}
@media (max-width:980px){.nav,.hcta{display:none}.burger{display:inline-flex}}
@media (min-width:981px){.mnav{display:none}}
.ftr{background:#ECEBF2;padding:84px 0 32px;border-top:1px solid rgba(20,19,26,.06)}
.fgrid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:40px}
.ftr h4{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600;margin-bottom:10px}
.fl{display:flex;align-items:center;min-height:44px;text-decoration:none;color:#3F3D4A;font-size:15px;transition:color .2s}
.fl:hover{color:#006A93}
.ftxt{color:#3F3D4A;font-size:15px;padding:11px 0}
.fbot{margin-top:56px;padding-top:22px;border-top:1px solid rgba(20,19,26,.1);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:#5D5B6A}
@media (max-width:860px){.fgrid{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}}
/* hero */
.hero{padding:48px 0 40px;position:relative}
.hero-bg{position:absolute;left:-260px;top:-200px;width:900px;height:900px;border-radius:50%;background:url(assets/iridescent-wave.webp) center/cover;opacity:.32;filter:blur(60px);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:end}
.h1{font-size:clamp(34px,4.6vw,66px);margin:24px 0 26px}
.grad{background:linear-gradient(92deg,#14131A 8%,#3A2C7A 55%,#00618A 96%);-webkit-background-clip:text;background-clip:text;color:transparent}
.prisms{position:relative;height:500px;display:flex;align-items:flex-end;justify-content:center;gap:18px;padding:0 10px 30px}
.prisms::before{content:"";position:absolute;left:4%;right:4%;bottom:0;height:60px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,40,140,.22),rgba(60,40,140,0))}
.prism{position:relative;flex:1;max-width:120px;border-radius:26px 26px 18px 18px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);cursor:pointer;padding:0;font-family:inherit;color:#14131A;overflow:hidden;transform-origin:bottom;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) backwards;transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s;box-shadow:0 30px 60px -36px rgba(40,30,90,.5)}
.prism:hover{transform:translateY(-10px)}
.prism::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:url(assets/holo-foil.webp) center/cover;opacity:.9;transition:height .6s cubic-bezier(.2,.7,.2,1)}
.prism::after{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.85));transition:height .6s cubic-bezier(.2,.7,.2,1)}
.prism:hover::before,.prism:hover::after{height:62%}
.prism-n{position:absolute;left:0;right:0;bottom:18px;text-align:center;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;z-index:1}
.prism-l{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;padding:0 8px;line-height:1.3;z-index:1}
.pr1{height:300px}.pr2{height:380px;animation-delay:.1s}.pr3{height:340px;animation-delay:.2s}.pr4{height:420px;animation-delay:.3s}
/* accordion */
.acc{display:grid;gap:14px;margin-top:52px}
.acc-item{border-radius:28px;overflow:hidden;transition:box-shadow .4s}
.acc-h{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;width:100%;padding:24px 28px;border:0;background:transparent;cursor:pointer;text-align:left;font-family:inherit;color:#14131A;min-height:44px}
.acc-n{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-size:14px;font-weight:600;background:#fff;border:1px solid rgba(20,19,26,.08);transition:all .4s}
.acc-t{font-family:'Unbounded',sans-serif;font-size:clamp(17px,1.7vw,24px);font-weight:500;letter-spacing:-.02em}
.acc-plus{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(20,19,26,.14);background:#fff;transition:transform .45s cubic-bezier(.2,.7,.2,1),background .3s}
.acc-h:hover .acc-plus{background:#14131A;color:#fff}
.acc-p{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;padding:0 28px 28px}
.acc-q{font-size:19px;line-height:1.6;color:#3F3D4A;margin-bottom:24px;max-width:620px}
.acc-pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}
.acc-pt{padding:18px;border-radius:18px;background:rgba(255,255,255,.8);border:1px solid rgba(20,19,26,.06);transition:transform .35s,box-shadow .35s}
.acc-pt:hover{transform:translateY(-3px);box-shadow:0 18px 30px -22px rgba(40,30,90,.5)}
.acc-pt b{display:flex;align-items:center;gap:10px;font-size:15px;margin-bottom:6px}
.acc-pt b svg{color:#006A93;flex:none}
.acc-pt span{font-size:14px;color:#5D5B6A}
.acc-img{border-radius:22px;overflow:hidden;height:340px;position:relative}
.acc-img img{width:100%;height:340px;object-fit:cover}
.acc-img::after{content:"";position:absolute;right:16px;top:16px;width:64px;height:64px;border-radius:20px;background:url(assets/holo-foil.webp) center/cover;box-shadow:inset 0 0 0 1px rgba(255,255,255,.8);animation:hue 8s linear infinite}
/* domaines */
.doms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:16px;margin-top:52px}
.dom{position:relative;padding:28px 24px 26px;border-radius:26px;background:rgba(255,255,255,.62);border:1px solid #fff;overflow:hidden;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s;min-height:290px;display:flex;flex-direction:column;gap:14px}
.dom::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:url(assets/holo-foil.webp) center/cover;transition:height .6s cubic-bezier(.2,.7,.2,1)}
.dom::after{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.9));transition:height .6s cubic-bezier(.2,.7,.2,1)}
.dom:hover{transform:translateY(-8px);box-shadow:0 36px 60px -40px rgba(40,30,90,.55)}
.dom:hover::before,.dom:hover::after{height:96px}
.dom > *{position:relative;z-index:1}
.dom-ico{width:52px;height:52px;border-radius:17px;background:#fff;display:grid;place-items:center;box-shadow:0 10px 22px -14px rgba(40,30,90,.5);color:#14131A;margin-top:14px}
.dom h3{font-family:'Unbounded',sans-serif;font-size:17px;font-weight:500;letter-spacing:-.01em;line-height:1.25}
.dom p{font-size:15px;color:#5D5B6A}
/* methode */
.meth{display:grid;grid-template-columns:380px 1fr;gap:32px;margin-top:52px;align-items:start}
.m-list{display:grid;gap:8px;position:relative}
.m-btn{display:flex;align-items:center;gap:16px;width:100%;padding:14px 18px;border-radius:20px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;font-family:inherit;color:#14131A;min-height:64px;transition:all .35s}
.m-btn:hover{background:rgba(255,255,255,.6)}
.m-dot{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600;background:#fff;border:1px solid rgba(20,19,26,.14);transition:all .4s}
.m-name{font-weight:700;font-size:16px;line-height:1.3}
.m-panel{padding:40px;min-height:420px;display:flex;flex-direction:column;gap:24px;position:relative;overflow:hidden}
.m-panel::before{content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;background:url(assets/holo-foil.webp) center/cover;opacity:.75;filter:blur(1px);animation:hue 12s linear infinite}
.m-panel > *{position:relative}
.m-prog{height:8px;border-radius:8px;background:rgba(20,19,26,.08);overflow:hidden}
.m-prog i{display:block;height:8px;border-radius:8px;background:linear-gradient(90deg,#7fd3ff,#b9a2ff,#ffb7e2,#ffe58f);background-size:200% 100%;animation:shimmer 3s linear infinite alternate;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.m-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.m-box{padding:20px;border-radius:18px;background:rgba(255,255,255,.85);border:1px solid rgba(20,19,26,.06)}
.m-box small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#5D5B6A;margin-bottom:8px}
.m-delai{display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:700;padding:10px 14px;border-radius:999px;background:#14131A;color:#fff;align-self:flex-start}
.m-nav{display:flex;gap:10px;margin-top:auto}
/* engagements */
.engs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:18px;margin-top:52px}
.eng{position:relative;padding:34px 30px;border-radius:30px;min-height:320px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;overflow:hidden;background:rgba(255,255,255,.6);border:1px solid #fff;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s}
.eng::before{content:"";position:absolute;left:-2px;top:-2px;right:-2px;bottom:-2px;border-radius:32px;background:conic-gradient(from 0deg,#ffcdee,#c4ebff,#cdfde6,#fff1bd,#e0cdff,#ffcdee);opacity:0;transition:opacity .5s;z-index:0}
.eng::after{content:"";position:absolute;left:2px;top:2px;right:2px;bottom:2px;border-radius:28px;background:#F8F7FB;z-index:0}
.eng:hover{transform:translateY(-6px);box-shadow:0 40px 70px -46px rgba(40,30,90,.6)}
.eng:hover::before{opacity:1}
.eng > *{position:relative;z-index:1}
.eng-n{font-family:'Unbounded',sans-serif;font-size:56px;font-weight:600;letter-spacing:-.05em;line-height:1;background:url(assets/holo-foil.webp) center/cover;-webkit-background-clip:text;background-clip:text;color:transparent;filter:saturate(1.4) contrast(1.1)}
.eng h3{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:10px}
.eng p{color:#3F3D4A;font-size:15px}
.cta{position:relative;border-radius:40px;overflow:hidden;padding:90px 64px;background:#14131A;color:#fff}
.cta-art{position:absolute;right:-140px;top:-160px;width:560px;height:560px;border-radius:50%;background:url(assets/holo-foil.webp) center/cover;animation:hue 14s linear infinite}
.cta-in{position:relative;max-width:640px}
.cta h2{font-size:clamp(28px,3.4vw,50px);margin:20px 0}
.cta p{color:rgba(255,255,255,.78);font-size:18px;max-width:520px}
.cta .eyebrow{color:rgba(255,255,255,.75)}
.row-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
@media (max-width:980px){
 .hero-grid,.meth{grid-template-columns:1fr}
 .prisms{height:420px}
 .pr1{height:240px}.pr2{height:300px}.pr3{height:270px}.pr4{height:340px}
}
@media (max-width:760px){
 .acc-p{grid-template-columns:1fr;padding:0 18px 22px}
 .acc-h{padding:18px;gap:14px}
 .acc-n{width:44px;height:44px}
 .acc-img,.acc-img img{height:220px}
 .m-cols{grid-template-columns:1fr}
 .m-panel{padding:26px}
 .cta{padding:64px 26px}.cta-art{top:-330px;right:-200px}
}
@media (max-width:640px){
 .wrap{padding:0 16px}.sec{padding:80px 0}
 .prisms{gap:10px;height:360px}
 .pr1{height:200px}.pr2{height:250px}.pr3{height:225px}.pr4{height:290px}
 .prism-l{display:none}
}
@media (prefers-reduced-motion:reduce){.hl *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="hl" style="background:#F4F3F8;color:#14131A">

<header class="hdr">
 <div class="wrap">
  <div class="bar glass">
   <a class="logo" href="Holo-Accueil.html" aria-label="Baquelis, accueil"><span class="mark" aria-hidden="true"></span><span class="wordmark">Baquelis</span></a>
   <nav class="nav" aria-label="Navigation principale">
    <a class="on" href="Holo-Expertises.html" aria-current="page">Expertises</a>
    <a href="Holo-IA.html">IA</a>
    <a href="Holo-Jeux.html">Jeux &amp; Web3</a>

   </nav>
   <div class="hright">
    <a class="btn btn-p hcta" href="Holo-Contact.html" style="{{ ui.cta }}">Réserver un appel</a>
    <button class="burger" type="button" aria-label="Ouvrir ou fermer le menu" aria-expanded="{{ ui.menuOpen }}" onClick="{{ toggleMenu }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
   </div>
  </div>
  <sc-if value="{{ ui.menu }}" hint-placeholder-val="{{ false }}">
   <nav class="mnav glass fade" aria-label="Navigation mobile">

    <a href="Holo-Offres.html">Offres</a>
    <a href="Holo-Contact.html">Contact</a>
    <a class="btn btn-p" href="Holo-Contact.html" style="{{ ui.cta }}">Réserver un appel</a>
   </nav>
  </sc-if>
 </div>
</header>

<main>
<section class="hero">
 <div class="hero-bg" aria-hidden="true"></div>
 <div class="wrap hero-grid">
  <div style="padding-bottom:40px">
   <span class="eyebrow rv">Expertises</span>
   <h1 class="disp h1 rv d1">Du code <span class="grad">à la continuité.</span></h1>
   <p class="lead rv d2">Nous ne livrons pas seulement du code : nous construisons des systèmes évolutifs qui grandissent avec votre entreprise, et nous sécurisons chaque étape de votre parcours technologique.</p>
   <div class="row-cta rv d3">
    <a class="btn btn-p" href="Holo-Offres.html" style="{{ ui.cta }}">Commencer</a>
    <a class="btn btn-g" href="#methode">Voir la méthode</a>
   </div>
  </div>
  <div class="rv d2">
   <div class="prisms" role="group" aria-label="Les quatre piliers, cliquez pour ouvrir le détail">
    <button class="prism pr1" type="button" style="{{ hp.s0 }}" onClick="{{ hp.p0 }}" aria-label="Pilier 01 : Solutions éprouvées"><span class="prism-l">Solutions éprouvées</span><span class="prism-n">01</span></button>
    <button class="prism pr2" type="button" style="{{ hp.s1 }}" onClick="{{ hp.p1 }}" aria-label="Pilier 02 : Partenariat, pas d’externalisation"><span class="prism-l">Partenariat</span><span class="prism-n">02</span></button>
    <button class="prism pr3" type="button" style="{{ hp.s2 }}" onClick="{{ hp.p2 }}" aria-label="Pilier 03 : Rapidité avec précision"><span class="prism-l">Rapidité</span><span class="prism-n">03</span></button>
    <button class="prism pr4" type="button" style="{{ hp.s3 }}" onClick="{{ hp.p3 }}" aria-label="Pilier 04 : Transparence radicale"><span class="prism-l">Transparence</span><span class="prism-n">04</span></button>
   </div>
  </div>
 </div>
</section>

<section class="sec" style="padding-top:60px" aria-labelledby="pil-t">
 <div class="wrap">
  <span class="eyebrow">Solutions éprouvées</span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5600},"accent":{"editor":"color","default":"#0093CC","options":["#0093CC","#00AEEF","#B8A4FF"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { menu:false, open:0, step:0 };
  }
  renderVals(){
    const s = this.state;
    const accent = (this.props && this.props.accent) || "#0093CC";
    const irid = "conic-gradient(from 200deg,#ffcdee,#c4ebff,#cdfde6,#fff1bd,#e0cdff,#ffcdee)";

    const P = [
      { t:"Solutions éprouvées", img:"assets/wafer.webp", alt:"Plaquette de silicium aux reflets irisés",
        q:"Nous ne livrons pas seulement du code — nous construisons des systèmes évolutifs qui grandissent avec votre entreprise.",
        pts:[{t:"Architecture évolutive",d:"Des fondations pensées pour absorber la croissance sans tout réécrire."},{t:"Pile technologique moderne",d:"Des outils actuels, maintenus et choisis pour durer."},{t:"Solutions cloud-native",d:"Déploiement, résilience et montée en charge pensés pour le cloud."},{t:"Optimisation des performances",d:"Mesurer, profiler, améliorer : l’exigence héritée du jeu vidéo."}] },
      { t:"Partenariat, pas d’externalisation", img:"assets/team-office.webp", alt:"Équipe au travail dans un bureau lumineux",
        q:"Nos experts deviennent une extension de votre équipe : vos outils, vos rituels, vos objectifs.",
        pts:[{t:"Intégration d’équipe dédiée",d:"Un profil ou une équipe qui rejoint votre quotidien."},{t:"Engagement à long terme",d:"La continuité plutôt que la mission ponctuelle."},{t:"Alignement culturel",d:"Votre façon de travailler, votre rythme, vos valeurs."},{t:"Communication fluide",d:"Des échanges directs, sans intermédiaire inutile."}] },
      { t:"Rapidité avec précision", img:"assets/laptop-code.webp", alt:"Ordinateur portable affichant du code",
        q:"Du concept à la livraison, nous avançons vite, sans compromis sur la qualité.",
        pts:[{t:"Prototypage rapide",d:"Valider une idée tôt, avant d’investir lourdement."},{t:"Méthodologie agile",d:"Des cycles courts et des priorités revues avec vous."},{t:"Assurance qualité",d:"Des tests et des revues à chaque étape."},{t:"Intégration continue",d:"Chaque changement est intégré, vérifié et livrable."}] },
      { t:"Transparence radicale", img:"assets/meeting-room.webp", alt:"Salle de réunion lumineuse et vitrée",
        q:"Pas de coûts cachés ni de mises à jour vagues : des progrès visibles en temps réel.",
        pts:[{t:"Suivi des progrès en temps réel",d:"Vous voyez l’avancement, à tout moment."},{t:"Tarification transparente",d:"Un prix mensuel clair, sans surprise."},{t:"Rapports réguliers",d:"Mensuels, hebdomadaires ou quotidiens selon la formule."},{t:"Communication ouverte",d:"Les bonnes nouvelles comme les risques, sans filtre."}] }
    ];
    const piliers = P.map((p, i) => {
      const open = i === s.open;
      return {
        n: "0" + (i + 1), t: p.t, q: p.q, pts: p.pts, img: p.img, alt: p.alt, open: open,
        expanded: open ? "true" : "false",
        itemStyle: open ? "background:rgba(255,255,255,.78);box-shadow:inset 0 1px 0 #fff,0 40px 80px -50px rgba(40,30,90,.55)" : "",
        numStyle: open ? "background:" + irid + ";border-color:#fff" : "",
        plusStyle: open ? "transform:rotate(45deg);background:#14131A;color:#fff" : "",
        toggle: () => this.setState({ open: open ? -1 : i })
      };
    });

    const hpStyle = (i) => s.open === i ? "transform:translateY(-16px);box-shadow:0 40px 70px -30px rgba(60,40,140,.55);border-color:#fff;background:rgba(255,255,255,.85)" : "";
    const hp = {
      s0: hpStyle(0), s1: hpStyle(1), s2: hpStyle(2), s3: hpStyle(3),
      p0: () => this.setState({ open: 0 }), p1: () => this.setState({ open: 1 }),
      p2: () => this.setState({ open: 2 }), p3: () => this.setState({ open: 3 })
    };

    const S = [
      { t:"Appel découverte", fait:"Un échange sur vos objectifs, votre contexte technique et vos contraintes.", obtient:"Une lecture claire du besoin et des premières pistes.", delai:"[DÉLAI]" },
      { t:"Cadrage & choix de formule", fait:"Définition du périmètre, des priorités et du rythme de collaboration.", obtient:"La formule adaptée : Intégration, Flex ou Performance.", delai:"[DÉLAI]" },
      { t:"Sélection du profil ou de l’équipe", fait:"Proposition d’un profil technique dédié, d’un profil senior ou d’une équipe de 5 experts seniors.", obtient:"Les bonnes compétences, avec la possibilité de changer de profil.", delai:"changement de profil sous 30 jours (Intégration) ou 15 jours (Flex)" },
      { t:"Intégration à vos outils et rituels", fait:"Accès à vos outils, participation à vos rituels, documentation partagée.", obtient:"Une extension naturelle de votre équipe, alignée sur votre culture.", delai:"[DÉLAI]" },
      { t:"Suivi temps réel & ajustements", fait:"Suivi des progrès en temps réel et rapports mensuels, hebdomadaires ou quotidiens selon la formule.", obtient:"Une visibilité permanente et des ajustements continus.", delai:"en continu" }
    ];
    const steps = S.map((x, i) => {
      const on = i === s.step;
      return {
        n: "0" + (i + 1), t: x.t, fait: x.fait, obtient: x.obtient, delai: x.delai, on: on,
        pressed: on ? "true" : "false",
        btnStyle: on ? "background:rgba(255,255,255,.85);border-color:#fff;box-shadow:0 20px 40px -28px rgba(40,30,90,.5)" : "",
        dot: on ? "background:" + irid + ";border-color:#fff;transform:scale(1.1)" : (i < s.step ? "background:#14131A;color:#fff;border-color:#14131A" : ""),
        pick: () => this.setState({ step: i })
      };
    });

    return {
      ui: { cta: "background:" + accent, menu: s.menu, menuOpen: s.menu ? "true" : "false" },
      toggleMenu: () => this.setState({ menu: !s.menu }),
      hp: hp,
      piliers: piliers,
      steps: steps,
      method: {
        fill: "width:" + ((s.step + 1) / 5 * 100).toFixed(0) + "%",
        prev: () => this.setState({ step: (s.step + 4) % 5 }),
        next: () => this.setState({ step: (s.step + 1) % 5 })
      }
    };
  }
}
</script>
