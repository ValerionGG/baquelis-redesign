<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Arcade — Accueil</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;family=Silkscreen&amp;display=swap">
<style>
body{margin:0;background:#0D0A1A}
sc-for,sc-if{display:contents}
.ar{position:relative;overflow:hidden;background:#0D0A1A;color:#EDE8FF;font-family:'Chakra Petch',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.ar *,.ar *::before,.ar *::after{box-sizing:border-box}
.ar h1,.ar h2,.ar h3,.ar h4,.ar p,.ar figure,.ar blockquote{margin:0}
.ar a{color:inherit}
.ar button,.ar input,.ar textarea{font-family:inherit}
.ar img{display:block;max-width:100%}
.ar :focus-visible{outline:2px solid #00E5FF;outline-offset:3px}
.wrap{position:relative;max-width:1240px;margin:0 auto;padding:0 40px}
.px{font-family:'Silkscreen',monospace;font-size:11px;line-height:1.5;letter-spacing:.1em;text-transform:uppercase}
.mut{color:#9C93C4}.cy{color:#00E5FF}.mg{color:#FF3EA5}.gd{color:#FFD166}
.scan{position:absolute;inset:0;z-index:80;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px,rgba(0,0,0,0) 4px)}
/* header */
.hdr{position:relative;z-index:30;background:rgba(13,10,26,.92);border-bottom:1px solid rgba(156,147,196,.16)}
.hdr-in{display:flex;align-items:center;gap:28px;min-height:76px}
.logo{display:inline-flex;align-items:center;gap:12px;min-height:44px;text-decoration:none}
.logo-t{font-weight:700;font-size:19px;letter-spacing:.24em}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:#9C93C4;transition:color .2s}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:#00E5FF;box-shadow:0 0 10px #00E5FF;transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav a:hover,.nav a[aria-current="page"]{color:#EDE8FF}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1)}
.hdr-cta{display:flex;align-items:center;gap:18px}
.burger{display:none;align-items:center;justify-content:center;width:44px;height:44px;background:transparent;border:1px solid rgba(156,147,196,.35);color:#EDE8FF;cursor:pointer}
.mnav{display:none}
@media(max-width:1000px){.nav,.hud-p1{display:none}.burger{display:inline-flex}.hdr-cta{margin-left:auto}.mnav{display:grid;gap:2px;padding:8px 16px 20px;border-top:1px solid rgba(156,147,196,.16)}.mnav a{display:flex;align-items:center;min-height:48px;padding:0 8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid rgba(156,147,196,.1)}}
@media(max-width:480px){.hdr-cta .btn{display:none}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border:1px solid transparent;font:600 14px/1 'Chakra Petch',sans-serif;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s,color .2s,border-color .2s}
.btn-p{background:#FF3EA5;color:#0D0A1A;box-shadow:4px 4px 0 #00E5FF}
.btn-p:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #00E5FF,0 0 32px rgba(255,62,165,.45)}
.btn-p:active{transform:translate(4px,4px);box-shadow:0 0 0 #00E5FF}
.btn-g{background:transparent;color:#EDE8FF;border-color:rgba(237,232,255,.32)}
.btn-g:hover{border-color:#00E5FF;color:#00E5FF;box-shadow:inset 0 0 24px rgba(0,229,255,.18)}
.btn-sm{min-height:44px;padding:0 18px;font-size:13px}
/* frames & type */
.fr{position:relative;background:#171230;border:1px solid rgba(156,147,196,.2)}
.fr::before,.fr::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;transition:width .25s,height .25s}
.fr::before{top:-1px;left:-1px;border-top:2px solid #00E5FF;border-left:2px solid #00E5FF}
.fr::after{bottom:-1px;right:-1px;border-bottom:2px solid #FF3EA5;border-right:2px solid #FF3EA5}
.hv:hover::before,.hv:hover::after{width:30px;height:30px}
.sec{position:relative;padding:120px 0}
.kick{display:inline-flex;align-items:center;gap:10px;color:#00E5FF}
.kick::before{content:"";width:8px;height:8px;background:currentColor;box-shadow:0 0 12px currentColor}
.h2{margin-top:18px;font-size:clamp(32px,4.6vw,60px);line-height:1.04;font-weight:700;letter-spacing:-.01em;text-transform:uppercase;overflow-wrap:anywhere}
.lead{margin-top:20px;max-width:640px;font-size:19px;color:#9C93C4}
.bar{position:relative;height:10px;overflow:hidden;background:rgba(156,147,196,.14)}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,#00E5FF 0,#00E5FF 8px,rgba(0,0,0,0) 8px,rgba(0,0,0,0) 10px);box-shadow:0 0 12px rgba(0,229,255,.45);transition:width .6s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes fill{from{width:0}}
.in{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}.d5{animation-delay:.65s}
.blink{animation:blink 1.1s steps(1) infinite}
/* marquee */
.mq{overflow:hidden;border-top:1px solid rgba(156,147,196,.16);border-bottom:1px solid rgba(156,147,196,.16);background:#110D22}
.mq-t{display:flex;width:max-content;animation:mq 42s linear infinite}
.mq-t span{display:inline-flex;align-items:center;gap:28px;padding:18px 0 18px 28px;font-weight:600;font-size:15px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.mq-t span::after{content:"";width:8px;height:8px;background:#FF3EA5;box-shadow:0 0 10px #FF3EA5}
@keyframes mq{to{transform:translateX(-50%)}}
/* footer */
.ftr{position:relative;padding:72px 0 32px;background:#0A0815;border-top:1px solid rgba(156,147,196,.16)}
.ftr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:40px}
.ftr-h{margin-bottom:14px;color:#9C93C4}
.ftr-l{display:grid}
.ftr-l a{display:inline-flex;align-items:center;min-height:44px;font-size:15px;text-decoration:none;transition:color .2s}
.ftr-l a:hover{color:#00E5FF}
.ftr-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(156,147,196,.14)}
.ftr-bot a{text-decoration:underline;text-underline-offset:4px}
/* ===== page : accueil ===== */
.ts{position:relative;min-height:820px;padding:56px 0 0;overflow:hidden}
.ts-glow{position:absolute;left:50%;top:430px;width:1100px;height:520px;margin-left:-550px;background:radial-gradient(ellipse at center,rgba(255,62,165,.20),rgba(0,229,255,.06) 45%,rgba(13,10,26,0) 70%);pointer-events:none}
.floor{position:absolute;left:-30%;right:-30%;bottom:0;height:360px;perspective:380px;pointer-events:none;-webkit-mask-image:linear-gradient(to top,#000 20%,rgba(0,0,0,0));mask-image:linear-gradient(to top,#000 20%,rgba(0,0,0,0))}
.floor-g{position:absolute;inset:0;transform:rotateX(64deg);transform-origin:50% 100%;background-image:linear-gradient(rgba(0,229,255,.38) 1px,rgba(0,0,0,0) 1px),linear-gradient(90deg,rgba(255,62,165,.30) 1px,rgba(0,0,0,0) 1px);background-size:72px 72px;animation:floor 2.6s linear infinite}
@keyframes floor{to{background-position:0 72px}}
.hud-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding-bottom:18px;border-bottom:1px dashed rgba(156,147,196,.22)}
.ts-c{position:relative;text-align:center;padding-top:72px}
.logo-xl{position:relative;display:inline-block;margin-top:22px;font-weight:700;font-size:clamp(52px,13.4vw,196px);line-height:.92;letter-spacing:.04em;color:#EDE8FF;text-shadow:0 0 60px rgba(255,62,165,.28)}
.logo-xl::before,.logo-xl::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;pointer-events:none;mix-blend-mode:screen;opacity:.8}
.logo-xl::before{color:#FF3EA5;transform:translateX(-4px);animation:gl1 5s steps(1) infinite}
.logo-xl::after{color:#00E5FF;transform:translateX(4px);animation:gl2 5s steps(1) infinite}
@keyframes gl1{0%{clip-path:inset(0 0 0 0);transform:translateX(-4px)}90%{clip-path:inset(18% 0 58% 0);transform:translateX(-12px)}92%{clip-path:inset(62% 0 12% 0);transform:translateX(7px)}94%{clip-path:inset(0 0 0 0);transform:translateX(-4px)}}
@keyframes gl2{0%{clip-path:inset(0 0 0 0);transform:translateX(4px)}90%{clip-path:inset(55% 0 20% 0);transform:translateX(12px)}92%{clip-path:inset(8% 0 70% 0);transform:translateX(-6px)}94%{clip-path:inset(0 0 0 0);transform:translateX(4px)}}
.sig{margin-top:30px;font-size:clamp(20px,2.6vw,32px);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.sig b{color:#FF3EA5;text-shadow:0 0 12px #FF3EA5}
.pitch{max-width:680px;margin:18px auto 0;font-size:18px;color:#9C93C4}
.start-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:22px;margin-top:44px}
.start{display:inline-flex;align-items:center;gap:14px;min-height:62px;padding:0 34px;border:0;color:#0D0A1A;font:700 16px/1 'Chakra Petch',sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:transform .15s,filter .2s}
.start:hover{transform:translate(-2px,-2px);filter:brightness(1.08)}
.start:active{transform:translate(4px,4px)}
.ts-foot{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin-top:56px;padding-bottom:40px}
.lvl{position:relative;padding:40px 0 120px}
.lvl-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:40px}
.lvl-head p.mut{max-width:420px}
.lvl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:20px}
.lv{display:flex;flex-direction:column;align-items:flex-start;gap:14px;width:100%;min-height:270px;padding:24px;text-align:left;color:#EDE8FF;font:inherit;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s}
.lv:hover{transform:translateY(-4px);border-color:rgba(0,229,255,.55)}
.lv-top{display:flex;justify-content:space-between;width:100%}
.lv svg{color:#00E5FF;filter:drop-shadow(0 0 8px rgba(0,229,255,.5))}
.lv-t{font-size:22px;font-weight:700;line-height:1.15;text-transform:uppercase}
.lv-pips{display:flex;gap:4px;margin-top:auto}
.lv-pips i{width:16px;height:8px;background:#00E5FF;box-shadow:0 0 8px rgba(0,229,255,.6)}
.pn{margin-top:24px;padding:44px;min-height:400px}
.att{display:grid;place-items:center;min-height:310px;text-align:center}
.att-lines{position:relative;width:100%;max-width:760px;height:96px;margin:22px auto 10px}
.att-lines p{position:absolute;left:0;right:0;top:0;opacity:0;font-size:clamp(18px,2.2vw,26px);font-weight:500;animation:att 16s infinite}
.att-lines p:nth-child(2){animation-delay:4s}.att-lines p:nth-child(3){animation-delay:8s}.att-lines p:nth-child(4){animation-delay:12s}
@keyframes att{0%{opacity:0;transform:translateY(8px)}3%,22%{opacity:1;transform:none}25%,100%{opacity:0}}
.pn-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:52px;animation:up .6s both}
.pn-t{margin-top:10px;font-size:clamp(28px,3.4vw,44px);font-weight:700;line-height:1.05;text-transform:uppercase}
.pn-q{margin-top:20px;font-size:20px;font-style:italic;font-weight:500}
.pn-rw{display:flex;flex-direction:column;gap:6px;margin:26px 0;padding:16px 18px;border:1px dashed rgba(255,209,102,.45);background:rgba(255,209,102,.05)}
.sk{padding:14px 0;border-bottom:1px solid rgba(156,147,196,.14)}
.sk-h{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;font-weight:600}
.sk .bar>i{width:100%;animation:fill 1.1s cubic-bezier(.2,.7,.2,1) both}
.sk:nth-of-type(2) .bar>i{animation-delay:.15s}.sk:nth-of-type(3) .bar>i{animation-delay:.3s}.sk:nth-of-type(4) .bar>i{animation-delay:.45s}
.sk-d{margin-top:8px;font-size:15px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px;margin-top:56px}
.pw{padding:30px 26px;min-height:280px;transition:transform .25s,border-color .25s}
.pw:hover{transform:translateY(-6px);border-color:rgba(255,62,165,.5)}
.pw-ic{display:grid;place-items:center;width:56px;height:56px;margin:18px 0 22px;border:1px solid rgba(0,229,255,.4);color:#00E5FF;transition:box-shadow .25s,background .25s}
.pw:hover .pw-ic{background:rgba(0,229,255,.1);box-shadow:0 0 24px rgba(0,229,255,.35)}
.pw h3{font-size:21px;line-height:1.2;font-weight:700}
.pw p{margin-top:10px;font-size:16px;color:#9C93C4}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:64px;align-items:center}
.qline{display:flex;align-items:center;gap:16px;width:100%;min-height:64px;padding:12px 18px;margin-top:10px;background:transparent;border:1px solid rgba(156,147,196,.2);color:#EDE8FF;font:inherit;text-align:left;cursor:pointer;transition:border-color .2s,background .2s}
.qline:hover{border-color:rgba(0,229,255,.5)}
.qbox{flex:none;width:18px;height:18px;border:2px solid #9C93C4}
.qline b{display:block;font-size:17px}
.rare{display:flex;gap:18px;align-items:center;margin-top:28px;padding:18px 20px;border:1px solid rgba(255,209,102,.5);background:rgba(255,209,102,.06);box-shadow:0 0 30px -10px rgba(255,209,102,.4)}
.rare-x{flex:none;font-size:40px;font-weight:700;color:#FFD166;text-shadow:0 0 16px rgba(255,209,102,.6);line-height:1}
.term{overflow:hidden}
.term-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid rgba(156,147,196,.2);background:#120E26}
.term-dots{display:flex;gap:6px}.term-dots i{width:8px;height:8px;background:#9C93C4}
.term-b{min-height:330px;padding:26px 24px;font-size:15px;line-height:1.9}
.term-b p{opacity:0;animation:up .45s both}
.term-b p:nth-child(2){animation-delay:.35s}.term-b p:nth-child(3){animation-delay:.7s}.term-b p:nth-child(4){animation-delay:1.05s}.term-b p:nth-child(5){animation-delay:1.4s}.term-b p:nth-child(6){animation-delay:1.75s}
.ok{display:inline-block;min-width:34px;font-family:'Silkscreen',monospace;font-size:11px;color:#00E5FF}
.cursor{display:inline-block;width:10px;height:18px;vertical-align:-3px;background:#FF3EA5;animation:blink 1s steps(1) infinite}
.gm{position:relative;overflow:hidden;background:#100C20}
.gm-img{position:relative}
.gm-img img{width:100%;height:520px;object-fit:cover;filter:saturate(1.1) contrast(1.05)}
.gm-hud{position:absolute;left:18px;right:18px;top:16px;display:flex;justify-content:space-between}
.gm-cross{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border:1px solid rgba(0,229,255,.7)}
.gm-cross::before,.gm-cross::after{content:"";position:absolute;background:#00E5FF}
.gm-cross::before{left:31px;top:-14px;width:2px;height:90px}
.gm-cross::after{top:31px;left:-14px;height:2px;width:90px}
.req{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px;margin-top:32px}
.req div{padding:16px 18px;border:1px solid rgba(156,147,196,.2);transition:border-color .2s,transform .2s}
.req div:hover{border-color:#FF3EA5;transform:translateX(4px)}
.req b{display:block;margin-top:4px;font-size:17px}
.map{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:56px}
.map::before{content:"";position:absolute;left:10%;right:10%;top:35px;border-top:2px dashed rgba(156,147,196,.35)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:44px;padding:0 4px;background:transparent;border:0;color:#EDE8FF;font:inherit;text-align:center;cursor:pointer}
.node-sq{display:grid;place-items:center;width:72px;height:72px;background:#171230;border:2px solid rgba(156,147,196,.35);font-weight:700;font-size:20px;transition:all .25s}
.node:hover .node-sq{border-color:#00E5FF;transform:translateY(-3px)}
.node span.lbl{font-size:15px;font-weight:600;line-height:1.25}
@media(max-width:760px){.map{grid-template-columns:1fr;gap:10px}.map::before{display:none}.node{flex-direction:row;text-align:left}.node-sq{width:56px;height:56px;flex:none}}
.mt-pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:40px;margin-top:36px;padding:36px}
.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:20px;margin-top:56px}
.of{display:flex;flex-direction:column;gap:14px;padding:30px;min-height:330px;transition:transform .25s,border-color .25s}
.of:hover{transform:translateY(-6px);border-color:rgba(0,229,255,.5)}
.of-pop{border-color:rgba(255,209,102,.6);box-shadow:0 0 48px -18px rgba(255,209,102,.5)}
.of-pr{font-size:40px;font-weight:700;line-height:1}
.of-pr small{font-size:15px;font-weight:500;color:#9C93C4}
.of ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:15px;color:#9C93C4}
.of li{display:flex;gap:10px}.of li::before{content:"";flex:none;width:6px;height:6px;margin-top:9px;background:#00E5FF}
.dlg{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:start;padding:36px;border:2px solid #EDE8FF;background:#120E26;box-shadow:6px 6px 0 #FF3EA5}
.dlg-av{width:96px;height:96px;padding:10px;border:2px solid rgba(156,147,196,.5);background:#171230}
.dlg-name{display:inline-block;padding:6px 12px;background:#00E5FF;color:#0D0A1A;font-family:'Silkscreen',monospace;font-size:12px;letter-spacing:.08em}
.dlg-q{margin-top:18px;font-size:clamp(19px,2vw,24px);line-height:1.5;font-weight:500}
.dlg-next{display:flex;justify-content:flex-end;margin-top:14px;color:#FF3EA5;animation:blink 1s steps(1) infinite}
@media(max-width:640px){.dlg{grid-template-columns:1fr;padding:24px}.pn{padding:24px}.mt-pn{padding:24px}}
.cta{position:relative;text-align:center;padding:140px 0;overflow:hidden}
.cta-c{font-size:clamp(48px,9vw,128px);font-weight:700;line-height:1;letter-spacing:.06em;color:#EDE8FF;text-shadow:-3px 0 #FF3EA5,3px 0 #00E5FF}
.cta-n{display:inline-block;width:1.1ch;color:#FFD166;text-shadow:0 0 24px rgba(255,209,102,.6)}
.cta-n::after{content:"9";animation:cd 10s steps(1) infinite}
@keyframes cd{0%{content:"9"}10%{content:"8"}20%{content:"7"}30%{content:"6"}40%{content:"5"}50%{content:"4"}60%{content:"3"}70%{content:"2"}80%{content:"1"}90%{content:"0"}}
@media(max-width:640px){.sec{padding:80px 0}.ts-c{padding-top:48px}}
@media (prefers-reduced-motion:reduce){.ar *,.ar *::before,.ar *::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ar">
<sc-if value="{{ scan }}" hint-placeholder-val="{{ true }}"><div class="scan" aria-hidden="true"></div></sc-if>

<header class="hdr">
  <div class="wrap hdr-in">
