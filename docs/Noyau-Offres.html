<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Noyau — Offres</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&amp;family=Geist+Mono:wght@400..600&amp;display=swap">
<style>
body{margin:0;background:#07090C}
sc-for,sc-if{display:contents}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.nx{--c:#00AEEF;--w:#FFB547;background:#07090C;color:#E7EDF3;font-family:'Geist',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative;overflow:hidden}
.nx *{box-sizing:border-box}
.nx a{color:inherit;text-decoration:none}
.nx img{display:block;max-width:100%}
.nx button{font-family:inherit;color:inherit}
.nx h1,.nx h2,.nx h3,.nx h4,.nx p{margin:0}
.nx ::selection{background:var(--c);color:#03131B}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px;position:relative}
.lab{font-family:'Geist Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#8A96A3}
.c{color:var(--c)}
.mut{color:#8A96A3}
.disp{font-weight:600;letter-spacing:-.045em;line-height:.98;overflow-wrap:anywhere}
.h2{font-size:clamp(34px,4.4vw,60px);font-weight:600;letter-spacing:-.04em;line-height:1.03;overflow-wrap:anywhere}
.lead{font-size:clamp(17px,1.35vw,19px);color:#B4BFCA;line-height:1.65}
.gridbg{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#131920 1px,transparent 1px),linear-gradient(90deg,#131920 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 25%,transparent 78%);mask-image:radial-gradient(ellipse 70% 60% at 50% 30%,#000 25%,transparent 78%)}
.panel{background:#0E1217;border:1px solid #1C232B;border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:10px;border:1px solid var(--c);background:var(--c);color:#03131B;font:600 15px/1 'Geist',sans-serif;cursor:pointer;box-shadow:0 10px 30px -12px color-mix(in srgb,var(--c) 75%,transparent);transition:box-shadow .3s,transform .3s,border-color .3s,background .3s}
.nx a.btn{color:#03131B}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent),0 14px 40px -8px color-mix(in srgb,var(--c) 80%,transparent)}
.btn svg{transition:transform .3s}
.btn:hover svg{transform:translateX(3px)}
.btn-g,.nx a.btn-g{background:rgba(255,255,255,.02);color:#E7EDF3;border-color:#2A333D;box-shadow:none}
.btn-g:hover{border-color:var(--c);box-shadow:0 0 26px -8px color-mix(in srgb,var(--c) 70%,transparent)}
.btn-sm{min-height:44px;padding:0 16px;font-size:14px}
.kbd{display:inline-flex;align-items:center;font:500 11px/1 'Geist Mono',monospace;padding:4px 6px;border:1px solid #2A333D;border-bottom-width:2px;border-radius:6px;color:#8A96A3;background:#0B0E12}
.nx :focus-visible{outline:2px solid var(--c);outline-offset:3px}
.hdr{position:relative;z-index:50;border-bottom:1px solid #1C232B;background:rgba(7,9,12,.75);backdrop-filter:blur(14px)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:20px;height:76px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:21px;letter-spacing:-.035em;min-height:44px}
.lspin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
.nl{display:inline-flex;align-items:center;min-height:44px;padding:0 13px;font-size:14px;color:#B4BFCA;border-radius:8px;transition:color .2s,background .2s}
.nl:hover{color:#fff;background:#0E1217}
.cmdk{display:inline-flex;align-items:center;gap:10px;min-height:44px;min-width:44px;padding:0 8px 0 12px;background:#0B0E12;border:1px solid #1C232B;border-radius:10px;color:#8A96A3;font-size:14px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.cmdk:hover{border-color:#2F3A45;color:#E7EDF3;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent)}
.burger{display:none}
.ib{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #1C232B;border-radius:10px;background:#0B0E12;cursor:pointer}
.mnav{border-top:1px solid #1C232B;padding:8px 20px 22px}
.mi{display:flex;justify-content:space-between;align-items:center;min-height:54px;border-bottom:1px solid #1C232B;font-size:18px}
.palx{position:absolute;left:0;right:0;top:86px;z-index:90;padding:0 20px;animation:palIn .28s cubic-bezier(.2,.8,.2,1) both}
.pal{max-width:660px;margin:0 auto;background:rgba(14,18,23,.97);border:1px solid #2A333D;border-radius:16px;box-shadow:0 40px 120px -20px #000,0 0 70px -24px color-mix(in srgb,var(--c) 55%,transparent);backdrop-filter:blur(20px);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:12px;padding:0 12px 0 18px;border-bottom:1px solid #1C232B;color:#8A96A3}
.pal-in input{flex:1;min-width:0;min-height:60px;background:transparent;border:0;color:#E7EDF3;font:400 17px 'Geist',sans-serif;outline:none}
.pal-in input::placeholder{color:#76838F}
.pal-tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid #1C232B}
.ptab{min-height:44px;padding:0 14px;border:1px solid transparent;border-radius:8px;background:transparent;color:#8A96A3;font:500 12px 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:color .2s,background .2s}
.ptab:hover{color:#E7EDF3}
.pal-list{max-height:360px;overflow:auto;padding:8px}
.pit{display:grid;grid-template-columns:76px minmax(0,1fr) auto 18px;align-items:center;gap:12px;min-height:50px;padding:0 12px;border-radius:10px;transition:background .15s}
.pit:hover,.pit:focus-visible{background:#151B22}
.pk{font:500 10px/1 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:6px 0;border-radius:5px;border:1px solid #2A333D;color:#8A96A3;text-align:center}
.pgo{opacity:0;transform:translateX(-4px);transition:opacity .2s,transform .2s;color:var(--c)}
.pit:hover .pgo,.pit:focus-visible .pgo{opacity:1;transform:none}
.pal-f{display:flex;justify-content:space-between;gap:12px;padding:12px 18px;border-top:1px solid #1C232B;font:500 11px 'Geist Mono',monospace;color:#8A96A3;letter-spacing:.04em}
@keyframes palIn{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
.ft{border-top:1px solid #1C232B;padding:80px 0 28px;position:relative;background:linear-gradient(#07090C,#090C10)}
.fgrid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:40px}
.fl{display:flex;align-items:center;min-height:44px;color:#B4BFCA;font-size:14px;transition:color .2s}
.fl:hover{color:var(--c)}
.fi{display:flex;align-items:center;min-height:44px;color:#8A96A3;font:500 13px 'Geist Mono',monospace}
.fwm{font-weight:600;font-size:clamp(56px,17vw,250px);letter-spacing:-.065em;line-height:.82;color:transparent;-webkit-text-stroke:1px #222B34;margin:72px 0 0;white-space:nowrap;user-select:none;text-align:center}
.fbot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid #1C232B;padding-top:22px;margin-top:8px;font:500 12px 'Geist Mono',monospace;color:#8A96A3}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.up{animation:up .9s cubic-bezier(.2,.8,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}.d4{animation-delay:.38s}.d5{animation-delay:.48s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes rot{to{--a:360deg}}
.live{display:inline-flex;align-items:center;gap:8px;font:500 11px/1 'Geist Mono',monospace;letter-spacing:.1em;color:var(--w);padding:6px 10px;border:1px solid rgba(255,181,71,.32);border-radius:999px;background:rgba(255,181,71,.06)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--w);box-shadow:0 0 10px var(--w);animation:pulse 1.6s infinite}
.sect{padding:120px 0;position:relative}
.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:56px}
.eyb{display:inline-flex;align-items:center;gap:10px;margin-bottom:20px}
.eyb::before{content:"";width:18px;height:1px;background:var(--c);box-shadow:0 0 8px var(--c)}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:1px solid #1C232B;border-radius:6px;font:500 12px 'Geist Mono',monospace;color:#B4BFCA;background:#07090C}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid #1C232B;border-radius:12px;background:#0B0E12}
.sg{min-height:44px;padding:0 18px;border:1px solid transparent;border-radius:9px;background:transparent;color:#8A96A3;font:500 14px 'Geist',sans-serif;cursor:pointer;transition:all .25s}
.sg:hover{color:#E7EDF3}
.glowb{position:relative}
.glowb::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),transparent 0 55%,var(--c) 72%,#fff 76%,var(--c) 80%,transparent 95%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 5s linear infinite;pointer-events:none}
/* page: offres */
.hero{position:relative;padding:96px 0 48px;text-align:center}
.halo{position:absolute;left:50%;top:180px;width:1000px;height:700px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 14%,transparent),transparent 70%);pointer-events:none}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px;align-items:stretch}
.pc{position:relative;padding:32px;border-radius:20px;background:#0B0E12;border:1px solid #1C232B;display:flex;flex-direction:column;transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .35s}
.pc:hover{transform:translateY(-4px);border-color:#2A3540}
.pflex{background:linear-gradient(180deg,#0E171F,#0B0E12 60%);border-color:color-mix(in srgb,var(--c) 45%,#1C232B);box-shadow:0 40px 100px -40px color-mix(in srgb,var(--c) 55%,transparent),0 0 0 1px color-mix(in srgb,var(--c) 15%,transparent)}
.price{font:500 clamp(40px,4vw,54px)/1 'Geist Mono',monospace;letter-spacing:-.05em;transition:opacity .3s}
.pl{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid #1C232B;font-size:14.5px}
.pl svg{flex:none;margin-top:4px;color:var(--c)}
.save{display:flex;align-items:center;gap:10px;margin-top:22px;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,181,71,.28);background:rgba(255,181,71,.05);font:500 13px 'Geist Mono',monospace;color:#FFB547}
.tw{overflow-x:auto;border:1px solid #1C232B;border-radius:16px;background:#0B0E12}
.ct{width:100%;min-width:820px;border-collapse:collapse;font-size:14.5px}
.ct th,.ct td{padding:16px 20px;text-align:left;border-top:1px solid #1C232B;vertical-align:top;transition:background .3s,color .3s}
.ct thead th{border-top:0;vertical-align:bottom}
.ct tbody th{font-weight:500;color:#B4BFCA;width:24%}
.ct tbody tr:hover th,.ct tbody tr:hover td{background:#0E1217}
.colb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:44px;padding:10px 12px;border:1px solid #1C232B;border-radius:10px;background:transparent;cursor:pointer;text-align:left;transition:border-color .3s,background .3s}
.colb:hover{border-color:#2A3540}
.sim{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:0;overflow:hidden}
.sim>div{padding:40px;min-width:0}
.rng{width:100%;height:44px;accent-color:var(--c);cursor:pointer}
.bigv{font:500 clamp(48px,6vw,84px)/1 'Geist Mono',monospace;letter-spacing:-.05em}
.cmp{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:14px;align-items:center;margin-top:14px;font-size:14px}
.cbar{height:14px;border-radius:7px;background:#151B22;overflow:hidden}
.cbar span{display:block;height:14px;border-radius:7px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.fq{border-top:1px solid #1C232B}
.fb{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:20px;align-items:center;width:100%;min-height:72px;padding:18px 0;text-align:left;background:transparent;border:0;cursor:pointer;font:500 clamp(17px,1.5vw,20px) 'Geist',sans-serif;letter-spacing:-.01em;transition:color .3s}
.fb:hover{color:var(--c)}
.pm{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #2A333D;border-radius:50%;transition:transform .4s,border-color .3s,color .3s}
.fa{padding:0 64px 26px 0;color:#B4BFCA;max-width:860px;animation:up .4s both}
.cta{position:relative;overflow:hidden;border:1px solid #1C232B;border-radius:24px;padding:88px 40px;text-align:center;background:radial-gradient(ellipse at 50% 120%,color-mix(in srgb,var(--c) 16%,transparent),transparent 60%),#090C10}
@media (max-width:1080px){.nav-links{display:none!important}.burger{display:inline-flex}.hide-m{display:none!important}.sim{grid-template-columns:1fr}}
@media (max-width:900px){.fgrid{grid-template-columns:1fr 1fr}}
@media (max-width:720px){.wrap{padding:0 20px}.sect{padding:80px 0}.hide-s{display:none!important}.sim>div{padding:26px}.pc{padding:26px}.fa{padding-right:0}.cmp{grid-template-columns:90px minmax(0,1fr);}.cmp .v{grid-column:1 / -1}.cta{padding:64px 22px}}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.nx *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="nx" style="{{ rootStyle }}">

<header class="hdr">
  <div class="wrap hrow">
    <a class="logo" href="Noyau-Accueil.html" aria-label="Baquelis — accueil">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13.5" fill="none" stroke="#2A333D"></circle><circle class="lspin" cx="15" cy="15" r="9" fill="none" stroke-width="1.5" stroke-dasharray="14 4.85" style="stroke:var(--c)"></circle><circle cx="15" cy="15" r="3.6" style="fill:var(--c);filter:drop-shadow(0 0 4px var(--c))"></circle></svg>
      <span>Baquelis</span>
    </a>
    <nav class="nav-links" aria-label="Navigation principale" style="display:flex;gap:2px">
      <sc-for list="{{ navs }}" as="n" hint-placeholder-count="5"><a class="nl" href="{{ n.href }}" aria-current="{{ n.cur }}" style="{{ n.style }}">{{ n.label }}</a></sc-for>
    </nav>
    <div style="display:flex;align-items:center;gap:10px">
      <button type="button" class="cmdk" onClick="{{ openPal }}" aria-expanded="{{ palExp }}" aria-label="Recherche rapide dans les pages et sections">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span class="hide-s">Aller à…</span><span class="kbd hide-s">⌘K</span>
      </button>
      <a class="btn btn-sm hide-m" href="Noyau-Contact.html">Réserver un appel</a>
      <button type="button" class="ib burger" onClick="{{ toggleMenu }}" aria-expanded="{{ menuExp }}" aria-label="Ouvrir le menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 8h16M4 16h16"></path></svg></button>
    </div>
  </div>
  <sc-if value="{{ menu }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav" aria-label="Menu mobile">
      <sc-for list="{{ navs }}" as="n" hint-placeholder-count="5"><a class="mi" href="{{ n.href }}">{{ n.label }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></sc-for>
      <a class="btn" href="Noyau-Contact.html" style="margin-top:18px;width:100%">Commencer</a>
    </nav>
  </sc-if>
</header>
<sc-if value="{{ pal }}" hint-placeholder-val="{{ false }}">
  <div class="palx">
    <div class="pal" role="dialog" aria-label="Navigation rapide">
      <div class="pal-in">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input type="text" value="{{ q }}" onInput="{{ setQ }}" placeholder="Page, section… (ex. FAQ, ATOM, Flex)" aria-label="Filtrer les pages et sections" autocomplete="off">
        <button type="button" class="kbd" onClick="{{ closePal }}" aria-label="Fermer la recherche" style="min-height:44px;min-width:52px;justify-content:center;cursor:pointer">Échap</button>
      </div>
      <div class="pal-tabs" role="group" aria-label="Type de résultat"><sc-for list="{{ palTabs }}" as="t" hint-placeholder-count="3"><button type="button" class="ptab" style="{{ t.style }}" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}">{{ t.label }}</button></sc-for></div>
      <div class="pal-list">
        <sc-for list="{{ palItems }}" as="it" hint-placeholder-count="6"><a class="pit" href="{{ it.href }}"><span class="pk">{{ it.kind }}</span><span style="color:#E7EDF3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ it.label }}</span><span class="mut hide-s" style="font-size:13px">{{ it.page }}</span><svg class="pgo" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a></sc-for>
        <sc-if value="{{ palEmpty }}" hint-placeholder-val="{{ false }}"><p class="mut" style="padding:30px 14px;text-align:center;font-size:15px">Aucun résultat pour « {{ q }} ». Essayez « offres » ou « agents ».</p></sc-if>
      </div>
      <div class="pal-f"><span>{{ palCount }}</span><span>Baquelis · navigation rapide</span></div>
    </div>
  </div>
</sc-if>

<!-- HERO -->
<section class="hero">
  <div class="gridbg" aria-hidden="true"></div>
  <div class="halo" aria-hidden="true"></div>
  <div class="wrap">
    <p class="lab eyb up" style="justify-content:center">Formules mensuelles · tarification transparente</p>
    <h1 class="disp up d1" style="font-size:clamp(42px,6vw,86px)">Trois formules.<br><span class="mut">Aucun coût caché.</span></h1>
    <p class="lead up d2" style="margin:24px auto 0;max-width:620px">Un profil dédié, un senior flexible ou une équipe de 5 experts : choisissez le niveau d’engagement qui correspond à votre projet.</p>
    <div class="up d3" style="margin-top:34px;display:flex;justify-content:center">
      <div class="seg" role="group" aria-label="Affichage des prix"><sc-for list="{{ views }}" as="v" hint-placeholder-count="2"><button type="button" class="sg" style="{{ v.style }}" aria-pressed="{{ v.pressed }}" onClick="{{ v.pick }}">{{ v.t }}</button></sc-for></div>
    </div>
  </div>
</section>

<!-- CARTES -->
<section style="padding:24px 0 40px;position:relative">
  <div class="wrap">
    <div class="prices">
      <sc-for list="{{ plans }}" as="p" hint-placeholder-count="3">
        <div class="pc" style="{{ p.cardStyle }}">
          <sc-if value="{{ p.flex }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" class="glowb" style="position:absolute;inset:0;border-radius:20px;pointer-events:none"></span></sc-if>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:26px"><p class="lab" style="{{ p.labStyle }}">{{ p.name }}</p><sc-if value="{{ p.flex }}" hint-placeholder-val="{{ false }}"><span class="mono" style="font-size:11px;padding:5px 9px;border-radius:999px;background:var(--c);color:#03131B;font-weight:600">PLUS POPULAIRE</span></sc-if></div>
          <p class="mut" style="font-size:14px;margin-top:8px;min-height:44px">{{ p.ideal }}</p>
          <div style="margin-top:18px;min-height:96px">
            <p><span class="price">{{ p.big }}</span><span class="mut"> {{ p.unit }}</span></p>
            <p class="mono mut" style="font-size:12px;margin-top:10px">{{ p.sub }}</p>
          </div>
          <div style="margin-top:14px">
            <sc-for list="{{ p.feats }}" as="f" hint-placeholder-count="6"><div class="pl"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span>{{ f.t }}</span></div></sc-for>
          </div>
          <div class="save"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8M15 8h5v5"></path></svg>{{ p.save }}</div>
          <div style="display:flex;gap:8px;margin-top:auto;padding-top:22px;flex-wrap:wrap">
            <a class="btn" href="Noyau-Contact.html" style="{{ p.btnStyle }}">Choisir {{ p.name }}</a>

      views, plans,
      c0: cs(0), c1: cs(1), c2: cs(2), b0: bs(0), b1: bs(1), b2: bs(2),
      a0: s.col === 0 ? 'true' : 'false', a1: s.col === 1 ? 'true' : 'false', a2: s.col === 2 ? 'true' : 'false',
      col0: () => this.setState({ col: 0 }), col1: () => this.setState({ col: 1 }), col2: () => this.setState({ col: 2 }),
      simPlans, simName: sp.name,
      minM: String(sp.min), months: String(months), monthsTxt: months + ' mois', minTxt: sp.min + ' mois',
      setMonths: e => this.setState({ months: Number(e.target.value) }),
      priceTxt: this.eur(sp.price) + '/mois', saveTxt: this.eur(sp.save) + '/mois',
      totalTxt: this.eur(total), recTxt: this.eur(recT), baqTxt: this.eur(baqT),
      barRec: 'width:100%;background:#46525E',
      barBaq: 'width:' + (baqT / recT * 100).toFixed(1) + '%;background:var(--c);box-shadow:0 0 12px var(--c)',
      faqs
    });
  }
}
</script>
</body>
</html>
