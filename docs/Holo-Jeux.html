<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Holo — Jeux &amp; Web3</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Unbounded:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F3F8}
sc-for,sc-if{display:contents}
.hl,.hl *{box-sizing:border-box}
.hl{font-family:'Figtree',system-ui,sans-serif;background:#F4F3F8;color:#14131A;line-height:1.55;font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased}
.hl h1,.hl h2,.hl h3,.hl h4,.hl p{margin:0}
.hl img{display:block;max-width:100%}
.disp{font-family:'Unbounded','Figtree',sans-serif;font-weight:600;letter-spacing:-.025em;line-height:1.06;overflow-wrap:anywhere}
.wrap{max-width:1320px;margin:0 auto;padding:0 40px;position:relative}
.sec{padding:120px 0;position:relative}
.h2{font-size:clamp(28px,3.3vw,48px)}
.lead{font-size:clamp(17px,1.35vw,20px);color:#5D5B6A;max-width:620px}
.muted{color:#5D5B6A}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#5D5B6A;display:inline-flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:26px;height:10px;border-radius:10px;background:conic-gradient(from 200deg,#ffcdee,#c4ebff,#cdfde6,#fff1bd,#e0cdff,#ffcdee);box-shadow:inset 0 0 0 1px rgba(255,255,255,.8)}
.glass{background:rgba(255,255,255,.6);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 30px 70px -40px rgba(40,30,90,.35);border-radius:28px}
.lnk{color:#006A93;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.lnk:hover{text-decoration:underline;text-underline-offset:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;border:0;cursor:pointer;font-family:inherit;color:#14131A;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,background .3s}
.btn-p{background:#0093CC;box-shadow:0 14px 34px -14px rgba(0,147,204,.75)}
.btn-p::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%);transition:transform .8s ease}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 20px 44px -16px rgba(0,147,204,.85)}
.btn-p:hover::after{transform:translateX(120%)}
.btn-g{background:rgba(255,255,255,.75);border:1px solid rgba(20,19,26,.12)}
.btn-g:hover{background:#fff;transform:translateY(-2px)}
.hl a:focus-visible,.hl button:focus-visible,.hl input:focus-visible,.hl textarea:focus-visible{outline:3px solid #0093CC;outline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:32px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.75);border:1px solid rgba(20,19,26,.1);font-size:13px;font-weight:500}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flowy{to{background-position:0 -24px}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.rv{animation:rise .95s cubic-bezier(.2,.7,.2,1) backwards}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}.d4{animation-delay:.38s}
.fade{animation:fadein .55s cubic-bezier(.2,.7,.2,1) backwards}
.hdr{position:relative;z-index:20;padding:16px 0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 8px 8px 18px;border-radius:999px}
.logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:#14131A;min-height:44px}
.mark{width:32px;height:32px;border-radius:11px;position:relative;background:conic-gradient(from 200deg,#ffbfe8,#b4e6ff,#bdfbdf,#ffeeaa,#d8c2ff,#ffbfe8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.85),0 8px 18px -8px rgba(80,60,160,.6);animation:hue 10s linear infinite}
.mark::after{content:"";position:absolute;left:9px;top:9px;width:14px;height:14px;border-radius:4px;background:#14131A;transform:rotate(45deg)}
.wordmark{font-family:'Unbounded',sans-serif;font-weight:600;font-size:19px;letter-spacing:-.02em}
.nav{display:flex;gap:2px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;font-weight:500;font-size:15px;color:#14131A;transition:background .25s}
.nav a:hover{background:rgba(20,19,26,.06)}
.nav a.on{background:#14131A;color:#fff}
.hright{display:flex;align-items:center;gap:8px}
.hcta{min-height:46px}
.burger{display:none;width:46px;height:46px;border-radius:999px;border:1px solid rgba(20,19,26,.12);background:#fff;align-items:center;justify-content:center;cursor:pointer;color:#14131A}
.mnav{margin-top:10px;padding:10px;display:grid;gap:4px;border-radius:24px}
.mnav a{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:14px;text-decoration:none;color:#14131A;font-weight:500}
.mnav a:hover{background:rgba(20,19,26,.06)}
@media (max-width:980px){.nav,.hcta{display:none}.burger{display:inline-flex}}
@media (min-width:981px){.mnav{display:none}}
.ftr{background:#ECEBF2;padding:84px 0 32px;border-top:1px solid rgba(20,19,26,.06)}
.fgrid{display:grid;grid-template-columns:1.5fr repeat(3,1fr);gap:40px}
.ftr h4{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600;margin-bottom:10px}
.fl{display:flex;align-items:center;min-height:44px;text-decoration:none;color:#3F3D4A;font-size:15px;transition:color .2s}
.fl:hover{color:#006A93}
.ftxt{color:#3F3D4A;font-size:15px;padding:11px 0}
.fbot{margin-top:56px;padding-top:22px;border-top:1px solid rgba(20,19,26,.1);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:#5D5B6A}
@media (max-width:860px){.fgrid{grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr))}}
/* hero */
.hero{padding:48px 0 40px;position:relative}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.h1{font-size:clamp(30px,4vw,58px);margin:24px 0 26px}
.grad{background:linear-gradient(92deg,#14131A 8%,#3A2C7A 55%,#00618A 96%);-webkit-background-clip:text;background-clip:text;color:transparent}
.quote{margin-top:28px;padding:20px 24px;border-radius:22px;background:#fff;border:1px solid rgba(20,19,26,.08);font-family:'Unbounded',sans-serif;font-size:15px;font-weight:400;line-height:1.5;max-width:560px}
.row-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hvis{position:relative;height:600px;display:flex;align-items:center;justify-content:center}
.halo{position:absolute;width:520px;height:520px;border-radius:50%;background:url(assets/holo-foil.webp) center/cover;filter:blur(30px) saturate(1.3);opacity:.7;animation:hue 14s linear infinite}
.frame{position:relative;width:440px;height:540px;border-radius:40px;overflow:hidden;box-shadow:0 60px 100px -50px rgba(40,20,100,.6),inset 0 0 0 1px rgba(255,255,255,.8)}
.frame img{width:440px;height:540px;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
.frame:hover img{transform:scale(1.07) rotate(2deg)}
.hud{position:absolute;z-index:2;padding:14px 16px;border-radius:18px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:10px}
.hud i{width:8px;height:8px;border-radius:50%;background:#0093CC;display:block;animation:blink 1.6s ease-in-out infinite}
.hud1{top:60px;left:0;animation:floaty 6s ease-in-out infinite}
.hud2{bottom:70px;right:0;animation:floaty 7s ease-in-out infinite .6s}
/* exigences */
.req{display:grid;grid-template-columns:380px 1fr;gap:28px;margin-top:48px;align-items:start}
.req-list{display:grid;gap:8px}
.req-btn{display:grid;grid-template-columns:46px 1fr;gap:16px;align-items:center;width:100%;padding:16px 18px;border-radius:22px;border:1px solid transparent;background:transparent;cursor:pointer;text-align:left;font-family:inherit;color:#14131A;transition:all .35s;min-height:64px}
.req-btn:hover{background:rgba(255,255,255,.6);transform:translateX(4px)}
.req-n{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-family:'Unbounded',sans-serif;font-size:12px;font-weight:600;background:#fff;border:1px solid rgba(20,19,26,.08);transition:all .35s}
.req-btn b{display:block;font-size:16px}
.req-btn span.s{display:block;font-size:14px;color:#5D5B6A;line-height:1.4}
.lab{padding:36px;min-height:520px;display:flex;flex-direction:column;gap:22px;position:relative;overflow:hidden}
.lab-h{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.illus{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#5D5B6A;padding:8px 12px;border-radius:999px;border:1px dashed rgba(20,19,26,.3)}
.lab h3{font-size:clamp(22px,2vw,30px);margin-top:12px}
.range{width:100%;height:44px;accent-color:#0093CC;cursor:pointer}
.gauge{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center}
.gauge-v{font-family:'Unbounded',sans-serif;font-size:44px;font-weight:600;letter-spacing:-.04em}
.gauge-v small{font-family:'Figtree',sans-serif;font-size:16px;letter-spacing:0;margin-left:4px}
.verdict{display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;background:#fff;border:1px solid rgba(20,19,26,.1)}
.verdict i{width:10px;height:10px;border-radius:50%;display:block}
.toggles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:10px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;border-radius:16px;border:1px solid rgba(20,19,26,.1);background:rgba(255,255,255,.8);cursor:pointer;font-family:inherit;font-size:15px;font-weight:600;color:#14131A;transition:all .3s}
.tg:hover{background:#fff}
.sw{width:42px;height:24px;border-radius:24px;background:rgba(20,19,26,.18);position:relative;flex:none;transition:background .3s}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .3s}
.budget{height:44px;border-radius:14px;background:rgba(20,19,26,.06);display:flex;overflow:hidden;border:1px solid rgba(20,19,26,.08)}
.seg{height:44px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#14131A;transition:width .6s cubic-bezier(.2,.7,.2,1);overflow:hidden;white-space:nowrap}
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:8px;padding:20px;border-radius:20px;background:rgba(255,255,255,.7);border:1px solid rgba(20,19,26,.06)}
.dt{width:14px;height:14px;justify-self:center;border-radius:50%;background:rgba(20,19,26,.12);transition:background .4s,transform .4s}
.big{font-family:'Unbounded',sans-serif;font-size:36px;font-weight:600;letter-spacing:-.04em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));gap:10px}
.kpi{padding:18px;border-radius:18px;background:#fff;border:1px solid rgba(20,19,26,.06)}
.kpi small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#5D5B6A;margin-bottom:6px}
.kpi b{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:600}
.meter{height:14px;border-radius:14px;background:rgba(20,19,26,.08);overflow:hidden}
.meter i{display:block;height:14px;border-radius:14px;background:linear-gradient(90deg,#7fd3ff,#b9a2ff,#ffb7e2);transition:width .6s cubic-bezier(.2,.7,.2,1)}
/* why */
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:16px;margin-top:48px}
.wcard{padding:30px;border-radius:28px;background:rgba(255,255,255,.6);border:1px solid #fff;display:flex;flex-direction:column;gap:18px;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s;position:relative;overflow:hidden}
.wcard:hover{transform:translateY(-6px);box-shadow:0 40px 70px -46px rgba(40,30,90,.6)}
.wfrom{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#5D5B6A}
.warrow{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:url(assets/holo-foil.webp) center/cover;box-shadow:inset 0 0 0 1px rgba(255,255,255,.85);color:#14131A;transition:transform .5s}
.wcard:hover .warrow{transform:rotate(90deg)}
.wcard h3{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:600;letter-spacing:-.02em}
.wcard p{color:#3F3D4A;font-size:15px}
/* web3 diagram */
.dia-wrap{position:relative;margin-top:48px;border-radius:40px;padding:44px;overflow:hidden;background:#EEEDF4}
.dia-bg1{position:absolute;left:-120px;top:-140px;width:520px;height:520px;border-radius:50%;background:url(assets/iridescent-blur.webp) center/cover;opacity:.75;filter:blur(30px)}
.dia-bg2{position:absolute;right:-160px;bottom:-200px;width:600px;height:600px;border-radius:50%;background:url(assets/holo-foil.webp) center/cover;opacity:.55;filter:blur(40px);animation:hue 18s linear infinite}
.dia{position:relative;display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
.layers{display:grid;gap:0}
.layer{position:relative;padding:18px;border-radius:26px}
.layer-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:#3F3D4A}
.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:10px}
.dnode{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.95);background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;color:#14131A;text-align:left;transition:all .35s cubic-bezier(.2,.7,.2,1)}
.dnode:hover{background:#fff;transform:translateY(-3px);box-shadow:0 18px 30px -20px rgba(40,30,90,.55)}
.dnode i{width:10px;height:10px;border-radius:3px;flex:none;transform:rotate(45deg);background:rgba(20,19,26,.25);transition:background .3s}
.link{height:34px;width:2px;margin:0 auto;background:repeating-linear-gradient(180deg,rgba(20,19,26,.5) 0 6px,transparent 6px 12px);background-size:2px 24px;animation:flowy 1s linear infinite}
.dpanel{padding:28px;position:relative;display:flex;flex-direction:column;gap:14px;min-height:360px}
.dpanel h3{font-family:'Unbounded',sans-serif;font-size:22px;font-weight:600;letter-spacing:-.02em}
.dpanel ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.dpanel li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.dpanel li svg{flex:none;color:#006A93;margin-top:3px}
.cta{position:relative;border-radius:40px;overflow:hidden;padding:90px 64px;background:#14131A;color:#fff}
.cta-art{position:absolute;right:-140px;top:-160px;width:560px;height:560px;border-radius:50%;background:url(assets/holo-foil.webp) center/cover;animation:hue 14s linear infinite}
.cta-in{position:relative;max-width:640px}
.cta h2{font-size:clamp(28px,3.4vw,50px);margin:20px 0}
.cta p{color:rgba(255,255,255,.78);font-size:18px;max-width:520px}
.cta .eyebrow{color:rgba(255,255,255,.75)}
@media (max-width:980px){
 .hero-grid,.req,.dia{grid-template-columns:1fr}
 .hvis{height:540px}
}
@media (max-width:760px){
 .lab{padding:24px}
 .gauge{grid-template-columns:1fr}
 .dots{grid-template-columns:repeat(10,1fr)}
 .dia-wrap{padding:20px}
 .cta{padding:64px 26px}.cta-art{top:-330px;right:-200px}
}
@media (max-width:640px){
 .wrap{padding:0 16px}.sec{padding:80px 0}
 .frame,.frame img{width:290px;height:360px}
 .halo{width:340px;height:340px}
 .hvis{height:420px}
 .hud{display:none}
}
@media (prefers-reduced-motion:reduce){.hl *{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="hl" style="background:#F4F3F8;color:#14131A">

<header class="hdr">
 <div class="wrap">
  <div class="bar glass">
   <a class="logo" href="Holo-Accueil.html" aria-label="Baquelis, accueil"><span class="mark" aria-hidden="true"></span><span class="wordmark">Baquelis</span></a>
   <nav class="nav" aria-label="Navigation principale">
    <a href="Holo-Expertises.html">Expertises</a>
    <a href="Holo-IA.html">IA</a>
    <a class="on" href="Holo-Jeux.html" aria-current="page">Jeux &amp; Web3</a>
    <a href="Holo-Offres.html">Offres</a>
    <a href="Holo-Contact.html">Contact</a>
   </nav>
   <div class="hright">
    <a class="btn btn-p hcta" href="Holo-Contact.html" style="{{ ui.cta }}">Réserver un appel</a>
    <button class="burger" type="button" aria-label="Ouvrir ou fermer le menu" aria-expanded="{{ ui.menuOpen }}" onClick="{{ toggleMenu }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
   </div>
  </div>
  <sc-if value="{{ ui.menu }}" hint-placeholder-val="{{ false }}">
   <nav class="mnav glass fade" aria-label="Navigation mobile">
    <a href="Holo-Expertises.html">Expertises</a>
    <a href="Holo-IA.html">IA</a>
    <a href="Holo-Jeux.html" aria-current="page">Jeux &amp; Web3</a>
    <a href="Holo-Offres.html">Offres</a>
    <a href="Holo-Contact.html">Contact</a>
    <a class="btn btn-p" href="Holo-Contact.html" style="{{ ui.cta }}">Réserver un appel</a>
   </nav>
  </sc-if>
 </div>
</header>

<main>
<section class="hero">
 <div class="wrap hero-grid">
  <div>
   <span class="eyebrow rv">Jeux &amp; Web3</span>
   <h1 class="disp h1 rv d1">Les jeux sont les applications <span class="grad">les plus difficiles.</span></h1>
   <p class="lead rv d2">Performances temps réel, gestion d’état complexe, expériences fluides : le jeu vidéo concentre toutes les contraintes techniques à la fois. C’est notre terrain d’entraînement, et votre garantie.</p>
   <p class="quote rv d3">« Si nous maîtrisons les applications de jeu, nous pouvons gérer n’importe quel défi technique. »</p>
   <div class="row-cta rv d4">
    <a class="btn btn-p" href="#plateforme" style="{{ ui.cta }}">Voir la plateforme Web3</a>
    <a class="btn btn-g" href="Holo-Contact.html">Parler de votre projet</a>
   </div>
  </div>
  <div class="hvis rv d2">
   <div class="halo" aria-hidden="true"></div>
   <div class="frame"><img src="assets/controller-white.webp" alt="Manette de jeu blanche sur fond gris clair"></div>
   <div class="hud hud1 glass" aria-hidden="true"><i></i>Synchronisation temps réel</div>
   <div class="hud hud2 glass" aria-hidden="true"><i></i>État cohérent</div>
  </div>
 </div>
</section>

<section class="sec" style="padding-top:60px" aria-labelledby="req-t">
 <div class="wrap">
  <span class="eyebrow">Pourquoi les jeux définissent l’excellence</span>
  <h2 id="req-t" class="disp h2" style="margin-top:18px;max-width:900px">Quatre exigences, à tester vous-même.</h2>
  <div class="req">
   <div class="req-list" role="group" aria-label="Choisir une exigence">
    <sc-for list="{{ reqs }}" as="r" hint-placeholder-count="4">
     <button class="req-btn" type="button" style="{{ r.style }}" aria-pressed="{{ r.pressed }}" onClick="{{ r.pick }}"><span class="req-n" style="{{ r.numStyle }}">{{ r.n }}</span><span><b>{{ r.t }}</b><span class="s">{{ r.d }}</span></span></button>
    </sc-for>
   </div>
   <div class="lab glass">
    <sc-if value="{{ lab.r0 }}" hint-placeholder-val="{{ true }}">
     <div class="fade" style="display:flex;flex-direction:column;gap:22px">
      <div class="lab-h"><div><span class="eyebrow">Exigence 01</span><h3 class="disp">Performance temps réel</h3></div><span class="illus">Valeurs illustratives</span></div>
      <p class="muted">Réponse sub-milliseconde et synchronisation parfaite entre systèmes. Faites varier la latence et observez le ressenti.</p>
      <div class="gauge">
       <svg width="240" height="140" viewBox="0 0 240 140" aria-hidden="true"><path d="M30 120 A90 90 0 0 1 210 120" fill="none" stroke="rgba(20,19,26,.1)" stroke-width="18" stroke-linecap="round"></path><path d="M30 120 A90 90 0 0 1 210 120" fill="none" stroke="{{ lat.color }}" stroke-width="18" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="{{ lat.off }}" style="transition:stroke-dashoffset .4s,stroke .4s"></path></svg>
       <div>
        <div class="gauge-v">{{ lat.v }}<small>ms</small></div>
        <span class="verdict"><i style="{{ lat.dot }}"></i>{{ lat.verdict }}</span>
       </div>
      </div>
      <label for="lat" style="font-weight:700">Latence simulée</label>
      <input id="lat" class="range" type="range" min="1" max="200" step="1" value="{{ lat.v }}" onInput="{{ setLat }}">
      <p class="muted" style="font-size:14px">{{ lat.note }}</p>
     </div>
    </sc-if>
    <sc-if value="{{ lab.r1 }}" hint-placeholder-val="{{ false }}">
     <div class="fade" style="display:flex;flex-direction:column;gap:22px">
      <div class="lab-h"><div><span class="eyebrow">Exigence 02</span><h3 class="disp">Architecture complexe</h3></div><span class="illus">Répartition illustrative</span></div>
      <p class="muted">Graphismes, physique, réseau et saisie doivent tenir ensemble dans le budget de chaque image. Activez les systèmes un à un.</p>
      <div class="toggles">
       <sc-for list="{{ systems }}" as="y" hint-placeholder-count="4">
        <button class="tg" type="button" role="switch" aria-checked="{{ y.checked }}" onClick="{{ y.toggle }}">{{ y.t }}<span class="sw" style="{{ y.sw }}"><i style="{{ y.knob }}"></i></span></button>
       </sc-for>
      </div>
      <div class="budget" aria-hidden="true">
       <sc-for list="{{ systems }}" as="y" hint-placeholder-count="4">
        <span class="seg" style="{{ y.seg }}">{{ y.short }}</span>
       </sc-for>
      </div>
      <div class="kpis">
       <div class="kpi"><small>Systèmes actifs</small><b>{{ arch.count }} sur 4</b></div>
       <div class="kpi"><small>Budget utilisé</small><b>{{ arch.used }}</b></div>
       <div class="kpi"><small>Marge restante</small><b>{{ arch.left }}</b></div>
      </div>
     </div>
    </sc-if>
    <sc-if value="{{ lab.r2 }}" hint-placeholder-val="{{ false }}">
     <div class="fade" style="display:flex;flex-direction:column;gap:22px">
      <div class="lab-h"><div><span class="eyebrow">Exigence 03</span><h3 class="disp">Multijoueur évolutif</h3></div><span class="illus">Simulation illustrative</span></div>
      <p class="muted">Des milliers d’utilisateurs simultanés, un état cohérent pour tous et une latence minimale. Faites monter la charge.</p>
      <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px"><span class="big">{{ mp.players }}</span><span class="muted">joueurs simultanés (illustratif)</span></div>
      <label for="mp" style="font-weight:700">Joueurs simultanés</label>
      <input id="mp" class="range" type="range" min="100" max="10000" step="100" value="{{ mp.raw }}" onInput="{{ setPlayers }}">
      <div class="dots" aria-hidden="true">
       <sc-for list="{{ mp.dots }}" as="d" hint-placeholder-count="60">
        <span class="dt" style="{{ d.s }}"></span>
       </sc-for>
      </div>
      <div class="kpis">
       <div class="kpi"><small>Instances de jeu</small><b>{{ mp.inst }}</b></div>
       <div class="kpi"><small>Cohérence d’état</small><b>Maintenue</b></div>
       <div class="kpi"><small>Latence</small><b>Minimale</b></div>
      </div>
     </div>
    </sc-if>
    <sc-if value="{{ lab.r3 }}" hint-placeholder-val="{{ false }}">
     <div class="fade" style="display:flex;flex-direction:column;gap:22px">
      <div class="lab-h"><div><span class="eyebrow">Exigence 04</span><h3 class="disp">Sécurité &amp; anti-triche</h3></div><span class="illus">Démonstration illustrative</span></div>
      <p class="muted">Une protection avancée qui ne dégrade jamais l’expérience. Activez les couches de protection : la fluidité ne bouge pas.</p>
      <div class="toggles">
       <sc-for list="{{ guards }}" as="g" hint-placeholder-count="3">
        <button class="tg" type="button" role="switch" aria-checked="{{ g.checked }}" onClick="{{ g.toggle }}">{{ g.t }}<span class="sw" style="{{ g.sw }}"><i style="{{ g.knob }}"></i></span></button>
       </sc-for>
      </div>
      <div><div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px"><span>Niveau de protection</span><span>{{ sec.label }}</span></div><div class="meter"><i style="{{ sec.bar }}"></i></div></div>
      <div><div style="display:flex;justify-content:space-between;font-weight:700;margin-bottom:8px"><span>Expérience joueur</span><span>Préservée</span></div><div class="meter"><i style="width:100%"></i></div></div>
     </div>
    </sc-if>
   </div>
  </div>
 </div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5500},"accent":{"editor":"color","default":"#0093CC","options":["#0093CC","#00AEEF","#B8A4FF"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { menu:false, req:0, lat:16, sys:[true,true,false,false], players:2400, guard:[true,false,false], node:"gw" };
  }
  renderVals(){
    const s = this.state;
    const accent = (this.props && this.props.accent) || "#0093CC";
    const irid = "conic-gradient(from 200deg,#ffcdee,#c4ebff,#cdfde6,#fff1bd,#e0cdff,#ffcdee)";
    const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");

    const RQ = [
      { t:"Performance temps réel", d:"Réponse sub-milliseconde, synchronisation parfaite." },
      { t:"Architecture complexe", d:"Graphismes, physique, réseau, saisie simultanés." },
      { t:"Multijoueur évolutif", d:"Des milliers d’utilisateurs, état cohérent." },
      { t:"Sécurité & anti-triche", d:"Protection avancée, expérience intacte." }
    ];
    const reqs = RQ.map((r, i) => ({
      n: "0" + (i + 1), t: r.t, d: r.d, pressed: i === s.req ? "true" : "false",
      style: i === s.req ? "background:rgba(255,255,255,.85);border-color:#fff;box-shadow:0 20px 40px -28px rgba(40,30,90,.5)" : "",
      numStyle: i === s.req ? "background:" + irid + ";border-color:#fff" : "",
      pick: () => this.setState({ req: i })
    }));

    const v = s.lat;
    let verdict = "Imperceptible", color = "#0093CC", note = "Le joueur ne perçoit aucun délai : c’est la zone que nous visons.";
    if (v > 16 && v <= 50) { verdict = "Fluide"; color = "#5BB8A0"; note = "Toujours confortable, mais la marge se réduit pour les systèmes les plus exigeants."; }
    else if (v > 50 && v <= 100) { verdict = "Perceptible"; color = "#E0A43B"; note = "Le délai commence à se sentir : il faut optimiser réseau et traitement."; }
    else if (v > 100) { verdict = "Dégradé"; color = "#D65C6B"; note = "L’expérience se dégrade nettement : c’est exactement ce que nous évitons."; }
    const lat = { v: v, verdict: verdict, note: note, color: color, dot: "background:" + color, off: String(Math.round(283 - 283 * v / 200)) };

    const SY = [ { t:"Graphismes", short:"Graph.", w:40, c:"#C4EBFF" }, { t:"Physique", short:"Phys.", w:22, c:"#E0CDFF" }, { t:"Réseau", short:"Rés.", w:18, c:"#FFCDEE" }, { t:"Saisie", short:"Sais.", w:8, c:"#FFF1BD" } ];
    let used = 0, count = 0;
    const systems = SY.map((y, i) => {
      const on = !!s.sys[i];
      if (on) { used += y.w; count++; }
      return {
        t: y.t, short: y.short, checked: on ? "true" : "false",
        sw: on ? "background:#14131A" : "", knob: on ? "transform:translateX(18px)" : "",
        seg: "width:" + (on ? y.w : 0) + "%;background:" + y.c,
        toggle: () => { const a = s.sys.slice(); a[i] = !a[i]; this.setState({ sys: a }); }
      };
    });
    const arch = { count: count, used: used + " %", left: (100 - used) + " %" };

    const p = s.players;
    const lit = Math.max(1, Math.round(p / 10000 * 60));
    const dots = [];
    for (let i = 0; i < 60; i++) {
      dots.push({ s: i < lit ? "background:" + irid + ";transform:scale(1.15);box-shadow:0 0 0 1px rgba(255,255,255,.9)" : "" });
    }
    const mp = { raw: p, players: fmt(p), dots: dots, inst: String(Math.max(1, Math.ceil(p / 2500))) };

    const GD = ["Validation côté serveur", "Détection d’anomalies", "Chiffrement des échanges"];
    let gc = 0;
    const guards = GD.map((t, i) => {
      const on = !!s.guard[i];
      if (on) gc++;
      return {
        t: t, checked: on ? "true" : "false",
        sw: on ? "background:#14131A" : "", knob: on ? "transform:translateX(18px)" : "",
        toggle: () => { const a = s.guard.slice(); a[i] = !a[i]; this.setState({ guard: a }); }
      };
    });
    const secLabels = ["Aucune", "Partielle", "Renforcée", "Avancée"];
    const sec = { label: secLabels[gc], bar: "width:" + Math.round(gc / 3 * 100) + "%" };

    const L = [
      { t:"Clients", nodes:[
        { id:"web", t:"Web", d:"L’accès navigateur à la plateforme, rapide et sans installation.", p1:"Interface réactive et accessible", p2:"Connexion sécurisée au portefeuille" },
        { id:"mob", t:"Mobile", d:"L’expérience de jeu et de gestion des actifs dans la poche.", p1:"Sessions courtes et reprises fluides", p2:"Notifications temps réel" },
        { id:"pc", t:"PC & console", d:"Les clients de jeu les plus exigeants en performance.", p1:"Rendu et saisie à faible latence", p2:"Synchronisation avec les autres clients" } ] },
      { t:"Passerelle temps réel", nodes:[
        { id:"gw", t:"Passerelle temps réel", d:"Le point d’entrée unique : elle reçoit, authentifie et distribue chaque message entre clients et services.", p1:"Synchronisation des états en continu", p2:"Répartition de charge entre instances" },
        { id:"auth", t:"Identité & sessions", d:"Qui joue, avec quels droits, depuis quel appareil.", p1:"Connexion classique ou par portefeuille", p2:"Sessions robustes et révocables" } ] },
      { t:"Services de jeu", nodes:[
        { id:"state", t:"État autoritaire", d:"Le serveur fait foi : il calcule l’état du jeu et le partage à tous les joueurs.", p1:"Cohérence d’état entre milliers de joueurs", p2:"Base de l’anti-triche" },
        { id:"match", t:"Matchmaking", d:"Réunir les bons joueurs, au bon endroit, rapidement.", p1:"Équilibrage des parties", p2:"Création d’instances à la demande" },
        { id:"ac", t:"Anti-triche", d:"Détecter les comportements anormaux sans pénaliser les joueurs honnêtes.", p1:"Validation côté serveur", p2:"Détection d’anomalies" } ] },
      { t:"Couche Web3 & données", nodes:[
        { id:"wallet", t:"Portefeuilles", d:"Les joueurs détiennent réellement leurs actifs numériques.", p1:"Connexion et signature sécurisées", p2:"Expérience simplifiée pour les nouveaux joueurs" },
        { id:"ledger", t:"Registre d’actifs", d:"La propriété des objets numériques, enregistrée et vérifiable.", p1:"Traçabilité des échanges", p2:"Interopérabilité entre expériences" },
        { id:"data", t:"Données & analytique", d:"Comprendre l’usage pour améliorer l’expérience et l’économie du jeu.", p1:"Tableaux de bord temps réel", p2:"Détection de tendances" } ] }
    ];
    let cur = null, curLayer = "";
    const layers = L.map((l, li) => {
      let active = false;
      const nodes = l.nodes.map((nd) => {
        const on = nd.id === s.node;
        if (on) { cur = nd; curLayer = l.t; active = true; }
        return {
          t: nd.t, pressed: on ? "true" : "false",
          style: on ? "background:#14131A;color:#fff;border-color:#14131A;box-shadow:0 20px 34px -18px rgba(20,19,26,.6)" : "",
          dot: on ? "background:" + irid : "",
          pick: () => this.setState({ node: nd.id })
        };
      });
      return { t: l.t, n: "0" + (li + 1), nodes: nodes, link: li < L.length - 1, style: active ? "background:rgba(255,255,255,.78)" : "" };
    });
    const node = { layer: curLayer, t: cur.t, d: cur.d, p1: cur.p1, p2: cur.p2 };

    return {
      ui: { cta: "background:" + accent, menu: s.menu, menuOpen: s.menu ? "true" : "false" },
      toggleMenu: () => this.setState({ menu: !s.menu }),
      reqs: reqs,
      lab: { r0: s.req === 0, r1: s.req === 1, r2: s.req === 2, r3: s.req === 3 },
      lat: lat, setLat: (e) => this.setState({ lat: Number(e.target.value) || 1 }),
      systems: systems, arch: arch,
      mp: mp, setPlayers: (e) => this.setState({ players: Number(e.target.value) || 100 }),
      guards: guards, sec: sec,
      layers: layers, node: node
    };
  }
}
</script>
