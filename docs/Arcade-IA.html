<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Arcade — IA</title>
<script src="vendor/preact.min.js"></script>
<script src="dc.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;family=Silkscreen&amp;display=swap">
<style>
body{margin:0;background:#0D0A1A}
sc-for,sc-if{display:contents}
.ar{position:relative;overflow:hidden;background:#0D0A1A;color:#EDE8FF;font-family:'Chakra Petch',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.ar *,.ar *::before,.ar *::after{box-sizing:border-box}
.ar h1,.ar h2,.ar h3,.ar h4,.ar p,.ar figure{margin:0}
.ar a{color:inherit}
.ar button,.ar input,.ar textarea{font-family:inherit}
.ar img{display:block;max-width:100%}
.ar :focus-visible{outline:2px solid #00E5FF;outline-offset:3px}
.wrap{position:relative;max-width:1240px;margin:0 auto;padding:0 40px}
.px{font-family:'Silkscreen',monospace;font-size:11px;line-height:1.5;letter-spacing:.1em;text-transform:uppercase}
.mut{color:#9C93C4}.cy{color:#00E5FF}.mg{color:#FF3EA5}.gd{color:#FFD166}
.scan{position:absolute;inset:0;z-index:80;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px,rgba(0,0,0,0) 4px)}
.hdr{position:relative;z-index:30;background:rgba(13,10,26,.92);border-bottom:1px solid rgba(156,147,196,.16)}
.hdr-in{display:flex;align-items:center;gap:28px;min-height:76px}
.logo{display:inline-flex;align-items:center;gap:12px;min-height:44px;text-decoration:none}
.logo-t{font-weight:700;font-size:19px;letter-spacing:.24em}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:#9C93C4;transition:color .2s}
.nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:#00E5FF;box-shadow:0 0 10px #00E5FF;transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav a:hover,.nav a[aria-current="page"]{color:#EDE8FF}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1)}
.hdr-cta{display:flex;align-items:center;gap:18px}
.burger{display:none;align-items:center;justify-content:center;width:44px;height:44px;background:transparent;border:1px solid rgba(156,147,196,.35);color:#EDE8FF;cursor:pointer}
.mnav{display:none}
@media(max-width:1000px){.nav,.hud-p1{display:none}.burger{display:inline-flex}.hdr-cta{margin-left:auto}.mnav{display:grid;gap:2px;padding:8px 16px 20px;border-top:1px solid rgba(156,147,196,.16)}.mnav a{display:flex;align-items:center;min-height:48px;padding:0 8px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid rgba(156,147,196,.1)}}
@media(max-width:480px){.hdr-cta .btn{display:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border:1px solid transparent;font:600 14px/1 'Chakra Petch',sans-serif;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s,color .2s,border-color .2s}
.btn-p{background:#FF3EA5;color:#0D0A1A;box-shadow:4px 4px 0 #00E5FF}
.btn-p:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #00E5FF,0 0 32px rgba(255,62,165,.45)}
.btn-p:active{transform:translate(4px,4px);box-shadow:0 0 0 #00E5FF}
.btn-g{background:transparent;color:#EDE8FF;border-color:rgba(237,232,255,.32)}
.btn-g:hover{border-color:#00E5FF;color:#00E5FF;box-shadow:inset 0 0 24px rgba(0,229,255,.18)}
.btn-sm{min-height:44px;padding:0 18px;font-size:13px}
.fr{position:relative;background:#171230;border:1px solid rgba(156,147,196,.2)}
.fr::before,.fr::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none;transition:width .25s,height .25s}
.fr::before{top:-1px;left:-1px;border-top:2px solid #00E5FF;border-left:2px solid #00E5FF}
.fr::after{bottom:-1px;right:-1px;border-bottom:2px solid #FF3EA5;border-right:2px solid #FF3EA5}
.hv:hover::before,.hv:hover::after{width:30px;height:30px}
.sec{position:relative;padding:120px 0}
.kick{display:inline-flex;align-items:center;gap:10px;color:#00E5FF}
.kick::before{content:"";width:8px;height:8px;background:currentColor;box-shadow:0 0 12px currentColor}
.h2{margin-top:18px;font-size:clamp(32px,4.6vw,60px);line-height:1.04;font-weight:700;letter-spacing:-.01em;text-transform:uppercase;overflow-wrap:anywhere}
.lead{margin-top:20px;max-width:640px;font-size:19px;color:#9C93C4}
.bar{position:relative;height:10px;overflow:hidden;background:rgba(156,147,196,.14)}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,#00E5FF 0,#00E5FF 8px,rgba(0,0,0,0) 8px,rgba(0,0,0,0) 10px);box-shadow:0 0 12px rgba(0,229,255,.45);transition:width .6s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.in{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}.d5{animation-delay:.65s}
.blink{animation:blink 1.1s steps(1) infinite}
.ftr{position:relative;padding:72px 0 32px;background:#0A0815;border-top:1px solid rgba(156,147,196,.16)}
.ftr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:40px}
.ftr-h{margin-bottom:14px;color:#9C93C4}
.ftr-l{display:grid}
.ftr-l a{display:inline-flex;align-items:center;min-height:44px;font-size:15px;text-decoration:none;transition:color .2s}
.ftr-l a:hover{color:#00E5FF}
.ftr-bot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(156,147,196,.14)}
.ftr-bot a{text-decoration:underline;text-underline-offset:4px}
/* ===== page : IA ===== */
.ph{position:relative;padding:96px 0 120px;overflow:hidden}
.ph-bg{position:absolute;inset:0;background:url(assets/circuit-board.webp) center/cover no-repeat;opacity:.22;filter:hue-rotate(40deg) saturate(1.2)}
.ph-ov{position:absolute;inset:0;background:linear-gradient(90deg,#0D0A1A 30%,rgba(13,10,26,.6) 70%,rgba(13,10,26,.85)),linear-gradient(0deg,#0D0A1A,rgba(13,10,26,0) 40%)}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:64px;align-items:center}
.h1{margin-top:22px;font-size:clamp(40px,6vw,86px);line-height:.98;font-weight:700;text-transform:uppercase;overflow-wrap:anywhere}
.h1 em{font-style:normal;color:#FF3EA5;text-shadow:0 0 30px rgba(255,62,165,.45)}
.loot{max-width:440px;margin-left:auto;padding:30px;border:2px solid #FFD166;background:rgba(23,18,48,.92);box-shadow:0 0 0 6px rgba(255,209,102,.08),0 0 60px -14px rgba(255,209,102,.55);animation:up .8s .4s both,float 6s 1.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.loot-x{font-size:110px;line-height:.9;font-weight:700;color:#FFD166;text-shadow:0 0 30px rgba(255,209,102,.6)}
.loot dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:20px 0 0;font-size:15px}
.loot dt{color:#9C93C4}.loot dd{margin:0}
.caps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px;margin-top:48px}
.cap{display:flex;align-items:center;gap:16px;min-height:88px;padding:16px 20px;background:#171230;border:1px solid rgba(156,147,196,.2);color:#EDE8FF;font:inherit;text-align:left;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}
.cap:hover{transform:translateY(-3px);border-color:rgba(0,229,255,.55)}
.cap-ic{display:grid;place-items:center;flex:none;width:52px;height:52px;border:1px solid rgba(0,229,255,.45);color:#00E5FF}
.cap b{display:block;font-size:19px}
.tree{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:48px;margin-top:16px;padding:44px}
.tree-g{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tree-g::before{content:"";position:absolute;left:50%;top:24px;bottom:24px;border-left:2px dashed rgba(156,147,196,.3)}
.tree-g::after{content:"";position:absolute;top:50%;left:24px;right:24px;border-top:2px dashed rgba(156,147,196,.3)}
.sk{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:130px;padding:18px;background:#0F0B22;border:1px solid rgba(156,147,196,.3);color:#EDE8FF;font:inherit;text-align:left;cursor:pointer;transition:all .2s;animation:up .45s both}
.sk:hover{border-color:#00E5FF;box-shadow:0 0 24px -6px rgba(0,229,255,.6)}
.sk b{font-size:17px;line-height:1.25}
.ql{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:24px;margin-top:48px}
.qlist{display:grid;gap:8px;align-content:start}
.qi{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;width:100%;min-height:68px;padding:10px 16px;background:transparent;border:1px solid rgba(156,147,196,.2);color:#EDE8FF;font:inherit;text-align:left;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.qi:hover{border-color:rgba(0,229,255,.5);transform:translateX(4px)}
.qi-n{font-weight:700;font-size:20px;color:#9C93C4}
.qi-t{font-weight:600;line-height:1.25}
.qd{padding:40px;animation:up .4s both}
.qd h3{margin-top:12px;font-size:clamp(26px,3vw,38px);line-height:1.08;font-weight:700;text-transform:uppercase}
.qsteps{margin:12px 0 0;display:grid;gap:10px;counter-reset:q}
.qst{display:flex;gap:14px;align-items:flex-start;counter-increment:q}
.qst::before{content:counter(q);display:grid;place-items:center;flex:none;width:28px;height:28px;border:1px solid #00E5FF;color:#00E5FF;font-family:'Silkscreen',monospace;font-size:11px}
.note{margin-top:20px;padding:14px 16px;border:1px dashed rgba(255,209,102,.5);background:rgba(255,209,102,.05);font-size:15px}
.track{display:flex;flex-wrap:wrap;align-items:center;gap:18px;margin-top:28px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:stretch;margin-top:48px}
.fx{padding:30px;text-align:center;transition:all .3s}
.fx-t{margin-top:10px;font-size:clamp(24px,3vw,38px);font-weight:700;line-height:1.05;text-transform:uppercase}
.vs-mid{display:grid;place-items:center;font-size:clamp(40px,5vw,72px);font-weight:700;font-style:italic;color:#FFD166;text-shadow:-3px 0 #FF3EA5,3px 0 #00E5FF}
.scn{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{min-height:48px;padding:10px 18px;background:transparent;border:1px solid rgba(156,147,196,.35);color:#EDE8FF;font:500 15px/1.3 'Chakra Petch',sans-serif;cursor:pointer;transition:all .2s}
.chip:hover{border-color:#00E5FF;color:#00E5FF}
.verdict{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-top:20px;padding:20px 24px;border:1px solid rgba(255,209,102,.5);background:rgba(255,209,102,.05);animation:up .35s both}
.cmp{margin-top:28px;border:1px solid rgba(156,147,196,.2)}
.cmp-r{display:grid;grid-template-columns:1.1fr 1fr 1fr;border-bottom:1px solid rgba(156,147,196,.15)}
.cmp-r:last-child{border-bottom:0}
.cmp-r>div{padding:16px 18px;font-size:15px}
.cmp-r>div:first-child{font-weight:600}
.cmp-h>div{background:#120E26}
@media(max-width:760px){.vs{grid-template-columns:1fr}.cmp-r{grid-template-columns:1fr}.cmp-r>div:first-child{padding-bottom:4px}}
.demo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:24px;margin-top:48px}
.task{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;margin-top:10px;padding:12px 18px;background:transparent;border:1px solid rgba(156,147,196,.25);color:#EDE8FF;font:inherit;text-align:left;cursor:pointer;transition:all .2s}
.task:hover{border-color:rgba(0,229,255,.5)}
.task-r{flex:none;width:18px;height:18px;border:2px solid #9C93C4;border-radius:50%}
.con{display:flex;flex-direction:column;min-height:520px;overflow:hidden}
.con-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;background:#120E26;border-bottom:1px solid rgba(156,147,196,.2)}
.con-b{flex:1;padding:24px;font-size:15px;line-height:1.7}
.ln{display:flex;gap:14px;padding:8px 0;border-bottom:1px dashed rgba(156,147,196,.14);animation:up .35s both}
.ln-k{flex:none;width:38px;font-family:'Silkscreen',monospace;font-size:11px;color:#00E5FF;padding-top:3px}
.spin{flex:none;width:14px;height:14px;margin-top:4px;border:2px solid rgba(255,62,165,.3);border-top-color:#FF3EA5;border-radius:50%;animation:spin .8s linear infinite}
.res{margin-top:18px;padding:18px;border:1px solid #00E5FF;background:rgba(0,229,255,.06);animation:up .4s both}
.cta{position:relative;padding:120px 0;text-align:center;background:#100C20;overflow:hidden}
.cta .h2{max-width:900px;margin-left:auto;margin-right:auto}
.cta-row{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:40px}
@media(max-width:640px){.sec{padding:80px 0}.tree,.qd{padding:24px}.ph{padding:56px 0 72px}.loot{margin-left:0}}
@media (prefers-reduced-motion:reduce){.ar *,.ar *::before,.ar *::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ar">
<sc-if value="{{ scan }}" hint-placeholder-val="{{ true }}"><div class="scan" aria-hidden="true"></div></sc-if>

<header class="hdr">
  <div class="wrap hdr-in">
    <a class="logo" href="Arcade-Accueil.html" aria-label="Baquelis — accueil">
      <svg width="28" height="28" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="0" width="1" height="7" fill="#EDE8FF"></rect><rect x="2" y="1" width="1" height="5" fill="#FF3EA5"></rect><rect x="1" y="2" width="1" height="3" fill="#FF3EA5"></rect><rect x="0" y="3" width="1" height="1" fill="#FF3EA5"></rect><rect x="4" y="1" width="1" height="5" fill="#00E5FF"></rect><rect x="5" y="2" width="1" height="3" fill="#00E5FF"></rect><rect x="6" y="3" width="1" height="1" fill="#00E5FF"></rect><rect x="3" y="3" width="1" height="1" fill="#0D0A1A"></rect></svg>
      <span class="logo-t">BAQUELIS</span>
    </a>
    <nav class="nav" aria-label="Navigation principale">
      <a href="Arcade-Expertises.html">Expertises</a>
      <a href="Arcade-IA.html" aria-current="page">IA</a>
      <a href="Arcade-Jeux.html">Jeux &amp; Web3</a>
      <a href="Arcade-Offres.html">Offres</a>
      <a href="Arcade-Contact.html">Contact</a>
    </nav>
    <div class="hdr-cta">
      <span class="px mut hud-p1">P1 · Prêt</span>
      <a class="btn btn-p btn-sm" href="Arcade-Contact.html">Commencer</a>
    </div>
    <button class="burger" type="button" aria-label="Ouvrir le menu" onClick="{{ toggleMenu }}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 5h16M2 10h16M2 15h16"></path></svg></button>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div class="mnav">
      <a href="Arcade-Expertises.html">Expertises</a>
      <a href="Arcade-IA.html">IA</a>
      <a href="Arcade-Jeux.html">Jeux &amp; Web3</a>
      <a href="Arcade-Offres.html">Offres</a>
      <a href="Arcade-Contact.html">Contact — Commencer</a>
    </div>
  </sc-if>
</header>

<!-- HERO -->
<section class="ph">
  <div class="ph-bg" aria-hidden="true"></div>
  <div class="ph-ov" aria-hidden="true"></div>
  <div class="wrap ph-grid">
    <div>
      <p class="px kick in">Intelligence artificielle — journal de quêtes</p>
      <h1 class="h1 in d1">Transformez la productivité avec les <em>agents IA.</em></h1>
      <p class="lead in d2">Des modèles affinés sur vos données, des agents autonomes qui exécutent et décident, une IA intégrée à vos processus existants. Excellence IA par la technologie.</p>
      <div class="in d3" style="display:flex;flex-wrap:wrap;gap:16px;margin-top:36px">
        <a class="btn btn-p" href="#atom">Lancer la démo ATOM</a>
        <a class="btn btn-g" href="Arcade-Contact.html">Parler à un expert</a>
      </div>
    </div>
    <aside class="loot" aria-label="Objet rare : multiplicateur de productivité">
      <p class="px gd">Objet rare · légendaire</p>
      <p class="loot-x">×10</p>
      <p style="margin-top:8px;font-size:21px;font-weight:700;text-transform:uppercase">Multiplicateur de productivité</p>
      <p class="mut" style="margin-top:8px;font-size:15px">Notre expertise en personnalisation de modèles et en agents autonomes peut multiplier votre productivité par 10.</p>
      <dl>
        <dt class="px">Type</dt><dd>Promesse Baquelis</dd>
        <dt class="px">Nature</dt><dd>Ambition, pas statistique</dd>
        <dt class="px">Effet</dt><dd>Selon vos processus et vos données</dd>
      </dl>
    </aside>
  </div>
</section>

<!-- CAPACITÉS -->
<section class="sec" style="padding-top:40px" aria-labelledby="cp-h">
  <div class="wrap">
    <p class="px kick">Trois classes de capacités</p>
    <h2 class="h2" id="cp-h">Choisissez votre classe.</h2>
    <div class="caps" role="tablist" aria-label="Capacités IA">
      <button class="cap" type="button" role="tab" onClick="{{ c0 }}" style="{{ cS0 }}" aria-selected="{{ cA0 }}"><span class="cap-ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span><span><span class="px mut">Classe 01</span><b>Affinage de modèles</b></span></button>
      <button class="cap" type="button" role="tab" onClick="{{ c1 }}" style="{{ cS1 }}" aria-selected="{{ cA1 }}"><span class="cap-ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="7" width="14" height="12"></rect><path d="M12 3v4M9 12h.01M15 12h.01M9 16h6"></path></svg></span><span><span class="px mut">Classe 02</span><b>Agents autonomes</b></span></button>
      <button class="cap" type="button" role="tab" onClick="{{ c2 }}" style="{{ cS2 }}" aria-selected="{{ cA2 }}"><span class="cap-ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="6" cy="6" r="3"></circle><circle cx="18" cy="18" r="3"></circle><path d="M9 6h5a4 4 0 0 1 4 4v5M15 18h-5a4 4 0 0 1-4-4V9"></path></svg></span><span><span class="px mut">Classe 03</span><b>Intégration métier</b></span></button>
    </div>
    <div class="tree fr" role="tabpanel">
      <div>
        <p class="px gd">Arbre de compétences · {{ cap.name }}</p>
        <h3 style="margin-top:12px;font-size:clamp(28px,3.2vw,42px);line-height:1.05;font-weight:700;text-transform:uppercase">{{ cap.name }}</h3>
        <p style="margin-top:16px;font-size:19px">{{ cap.pitch }}</p>
        <div style="margin-top:28px;padding:18px 20px;border:1px solid rgba(0,229,255,.35);background:rgba(0,229,255,.05)">
          <p class="px cy">Compétence inspectée</p>
          <p style="margin-top:6px;font-weight:600">{{ skillCur.n }}</p>
          <p class="mut" style="margin-top:4px;font-size:15px">{{ skillCur.d }}</p>
        </div>
      </div>
      <div class="tree-g">
        <sc-for list="{{ skills }}" as="k" hint-placeholder-count="4">
          <button class="sk" type="button" onClick="{{ k.pick }}" style="{{ k.style }}"><span class="px mut">{{ k.lbl }}</span><b>{{ k.n }}</b></button>
        </sc-for>
      </div>
    </div>
  </div>
</section>

<!-- CAS D'USAGE -->
<section class="sec" style="background:#100C20" aria-labelledby="qu-h">
  <div class="wrap">
    <p class="px kick">Six cas d'usage — journal de quêtes</p>
    <h2 class="h2" id="qu-h">Choisissez vos quêtes.</h2>
    <p class="lead">Six missions concrètes où l'IA crée de la valeur. Sélectionnez une quête pour voir l'objectif, le déroulé et la récompense — puis suivez celles qui vous concernent.</p>
    <div class="ql">
      <div class="qlist" role="group" aria-label="Cas d'usage">
        <sc-for list="{{ quests }}" as="q" hint-placeholder-count="6">
          <button class="qi" type="button" onClick="{{ q.pick }}" style="{{ q.style }}">
            <span class="qi-n" style="{{ q.nStyle }}">{{ q.n }}</span>
            <span><span class="qi-t">{{ q.t }}</span><span class="px mut" style="display:block">{{ q.cap }}</span></span>
            <span class="px" style="{{ q.tagStyle }}">{{ q.tag }}</span>
          </button>
        </sc-for>
      </div>
      <div class="qd fr">
        <p class="px gd">Quête {{ quest.n }} · classe {{ quest.cap }}</p>
        <h3>{{ quest.t }}</h3>
        <p class="px cy" style="margin-top:24px">Objectif</p>
        <p style="margin-top:6px;font-size:18px">{{ quest.obj }}</p>
        <p class="px cy" style="margin-top:24px">Déroulé</p>
        <div class="qsteps"><sc-for list="{{ quest.steps }}" as="st" hint-placeholder-count="3"><div class="qst">{{ st.t }}</div></sc-for></div>
        <p class="px cy" style="margin-top:24px">Récompense</p>
        <p style="margin-top:6px">{{ quest.rw }}</p>
        <sc-if value="{{ quest.hasNote }}" hint-placeholder-val="{{ true }}"><p class="note"><span class="px gd">Promesse Baquelis · </span>{{ quest.note }}</p></sc-if>
        <div class="track">
          <button class="btn btn-p btn-sm" type="button" onClick="{{ toggleQuest }}">{{ trackLabel }}</button>
          <span class="px mut">Quêtes suivies : {{ trackCount }}/6</span>
        </div>
        <div class="bar" style="margin-top:14px"><i style="{{ trackStyle }}"></i></div>
      </div>
    </div>
  </div>
</section>

<!-- VS -->
<section class="sec" aria-labelledby="vs-h">
  <div class="wrap">
    <p class="px kick">Comparateur — écran de duel</p>
    <h2 class="h2" id="vs-h">Modèle affiné vs RAG.</h2>
    <p class="lead">Un modèle affiné offre une précision supérieure, des réponses plus rapides et une intelligence spécifique. Le RAG garde ses forces. Décrivez votre situation : nous désignons le vainqueur.</p>
    <div class="vs">
      <div class="fx fr" style="{{ aStyle }}"><p class="px mg">Joueur 1</p><p class="fx-t">Modèle affiné</p><p class="mut" style="margin-top:8px;font-size:15px">Entraîné sur vos données et votre domaine.</p></div>
      <div class="vs-mid" aria-hidden="true">VS</div>
      <div class="fx fr" style="{{ rStyle }}"><p class="px cy">Joueur 2</p><p class="fx-t">RAG</p><p class="mut" style="margin-top:8px;font-size:15px">Un modèle général qui consulte vos documents.</p></div>
    </div>
    <div class="scn" role="group" aria-label="Votre situation">
      <sc-for list="{{ scenarios }}" as="sc" hint-placeholder-count="4">
        <button class="chip" type="button" onClick="{{ sc.pick }}" style="{{ sc.style }}">{{ sc.t }}</button>
      </sc-for>
    </div>
    <div class="verdict"><span class="px gd">Verdict</span><p style="flex:1;min-width:240px;font-size:18px;font-weight:600">{{ verdict }}</p></div>
    <div class="cmp">
      <div class="cmp-r cmp-h"><div class="px mut">Critère</div><div class="px mg">Modèle affiné</div><div class="px cy">RAG</div></div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <div class="cmp-r"><div>{{ r.c }}</div><div style="{{ r.aS }}">{{ r.a }}</div><div style="{{ r.rS }}">{{ r.r }}</div></div>
      </sc-for>
    </div>
  </div>
</section>

<!-- DÉMO ATOM -->
<section class="sec" id="atom" style="background:#100C20" aria-labelledby="at-h">
  <div class="wrap">
    <p class="px kick">ATOM — l'agent IA de Baquelis</p>
    <h2 class="h2" id="at-h">Démo : confiez une mission à ATOM.</h2>
    <p class="lead">Démonstration scénarisée : aucune donnée réelle, aucun appel réseau. Elle illustre la façon dont un agent planifie, exécute et rend compte.</p>
    <div class="demo">
      <div>
        <p class="px mut">1 · Choisissez une mission</p>
        <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="3">
          <button class="task" type="button" onClick="{{ t.pick }}" style="{{ t.style }}"><span class="task-r" style="{{ t.rStyle }}"></span><span><b style="display:block">{{ t.t }}</b><span class="mut" style="font-size:15px">{{ t.s }}</span></span></button>
        </sc-for>
        <p class="px mut" style="margin-top:28px">2 · Lancez l'agent</p>
        <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:12px">
          <button class="btn btn-p" type="button" onClick="{{ launch }}">{{ launchLabel }}</button>
          <button class="btn btn-g" type="button" onClick="{{ reset }}">Réinitialiser</button>
        </div>
      </div>
      <div class="con fr" aria-live="polite">
        <div class="con-bar"><span class="px cy">ATOM · {{ statusLabel }}</span><span class="px mg">Démonstration scénarisée</span></div>
        <div style="padding:0 24px;margin-top:18px"><div class="bar"><i style="{{ progStyle }}"></i></div></div>
        <div class="con-b">
          <p class="mut" style="margin-bottom:10px">&gt; mission : {{ taskCur.t }}</p>
          <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><p class="mut">En attente. Lancez ATOM pour voir les étapes s'exécuter. <span class="blink">_</span></p></sc-if>
          <sc-for list="{{ lines }}" as="l" hint-placeholder-count="2">
            <div class="ln"><span class="ln-k">{{ l.k }}</span><span>{{ l.t }}</span><span class="px cy" style="margin-left:auto;padding-top:3px">OK</span></div>
          </sc-for>
          <sc-if value="{{ running }}" hint-placeholder-val="{{ false }}"><div class="ln"><span class="spin" aria-hidden="true"></span><span>{{ curLine }}</span></div></sc-if>
          <sc-if value="{{ done }}" hint-placeholder-val="{{ false }}"><div class="res"><p class="px cy">Mission accomplie — résultat scénarisé</p><p style="margin-top:6px">{{ taskCur.r }}</p></div></sc-if>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="cta" aria-labelledby="cta-h">
  <div class="wrap">
    <p class="px gd blink">Nouvelle quête disponible</p>
    <h2 class="h2" id="cta-h">Prêt à transformer votre entreprise ?</h2>
    <p class="lead" style="margin-left:auto;margin-right:auto">Parlons de vos données, de vos processus et de la quête qui créera le plus de valeur.</p>
    <div class="cta-row">
      <a class="btn btn-p" href="Arcade-Contact.html">Nous contacter</a>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":6200},"scanlines":{"editor":"boolean","default":true},"neon":{"editor":"color","default":"#FF3EA5","options":["#FF3EA5","#00E5FF","#FFD166"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { menuOpen:false, cap:0, skill:0, quest:0, tracked:[false,false,false,false,false,false], scn:0, task:0, shown:0, running:false, done:false };
    this.timer = null;
    this.C = [
      { name:'Affinage de modèles', pitch:'Des modèles entraînés sur vos données et vos cas d’usage, pour une intelligence propre à votre métier.',
        skills:[ {n:'Formation spécifique au domaine', d:'Le modèle apprend votre vocabulaire, vos règles et vos cas réels.'}, {n:'Optimisation des performances', d:'Plus précis sur vos tâches, plus rapide à répondre.'}, {n:'Apprentissage continu', d:'Le modèle s’améliore à mesure que vos données évoluent.'}, {n:'Confidentialité & sécurité', d:'Vos données d’entraînement restent protégées et maîtrisées.'} ] },
      { name:'Agents autonomes', pitch:'Des agents qui exécutent des tâches complexes, prennent des décisions et s’adaptent.',
        skills:[ {n:'Automatisation de tâches', d:'Les tâches répétitives et multi-étapes prises en charge de bout en bout.'}, {n:'Prise de décision', d:'Des choix encadrés par vos règles et vos garde-fous.'}, {n:'Coordination multi-agents', d:'Plusieurs agents spécialisés qui collaborent sur une même mission.'}, {n:'Apprentissage & adaptation', d:'Des agents qui ajustent leur comportement selon les résultats.'} ] },
      { name:'Intégration métier', pitch:'L’IA intégrée dans vos processus existants, là où se crée la valeur.',
        skills:[ {n:'Automatisation des flux', d:'Vos flux de travail existants, automatisés sans tout reconstruire.'}, {n:'Traitement de données', d:'Collecte, nettoyage et structuration de vos données.'}, {n:'Analytique prédictive', d:'Anticiper les tendances à partir de votre historique.'}, {n:'Insights temps réel', d:'Les bons signaux, au bon moment, pour décider.'} ] }
    ];
    this.Q = [
      { t:'Automatisation du support client', cap:'Agents', obj:'Des agents IA qui traitent les demandes entrantes avec une qualité de réponse de niveau humain.', steps:['Classer les demandes par intention','Répondre aux cas courants','Escalader les cas sensibles vers vos équipes'], rw:'Des équipes support libérées pour les cas à forte valeur.', note:'jusqu’à 90 % des demandes traitées par les agents — affirmation du site, à valider sur votre contexte.' },
      { t:'Pipeline de génération de contenu', cap:'Affinage', obj:'Produire des contenus cohérents avec votre ton de marque, à grande échelle, avec validation humaine.', steps:['Structurer le brief','Générer avec un modèle affiné à votre ton','Relire, valider et publier'], rw:'Un volume de contenu maîtrisé, sans perte de cohérence.', note:'' },
      { t:'Intelligence métier prédictive', cap:'Intégration', obj:'Anticiper plutôt que constater : des modèles qui repèrent les tendances dans vos données.', steps:['Connecter vos sources de données','Modéliser les signaux utiles','Diffuser des insights en temps réel'], rw:'Des décisions prises plus tôt, sur des bases plus solides.', note:'' },
      { t:'Optimisation des processus', cap:'Intégration', obj:'Repérer les goulets d’étranglement et automatiser les flux répétitifs.', steps:['Cartographier vos flux','Automatiser les étapes répétitives','Mesurer et ajuster'], rw:'Des opérations plus fluides et une efficacité accrue.', note:'' },
      { t:'Modèles affinés vs RAG', cap:'Affinage', obj:'Choisir la bonne approche : précision supérieure, réponses plus rapides et intelligence spécifique avec un modèle affiné.', steps:['Analyser vos données et vos usages','Comparer les approches','Déployer la plus adaptée — ou les combiner'], rw:'La bonne architecture IA, pas la plus à la mode.', note:'' },
      { t:'Automatisation métier agentique', cap:'Agents', obj:'Des agents coordonnés qui prennent en charge des processus entiers, de la décision à l’exécution.', steps:['Définir la mission et les garde-fous','Coordonner plusieurs agents','Superviser et faire apprendre'], rw:'Des processus qui tournent seuls, sous votre contrôle.', note:'' }
    ];
    this.S = [
      { t:'Vocabulaire métier pointu, ton de marque précis', w:'a', v:'Modèle affiné : l’intelligence spécifique à votre domaine fait la différence.' },
      { t:'Base documentaire qui change chaque semaine', w:'r', v:'RAG : vos connaissances restent à jour sans nouvel affinage.' },
      { t:'Volume élevé, réponses en temps réel', w:'a', v:'Modèle affiné : des réponses plus rapides, sans étape de recherche.' },
      { t:'Un peu des deux', w:'b', v:'Combinaison : un modèle affiné qui s’appuie aussi sur une recherche documentaire.' }
    ];
    this.R = [
      { c:'Précision sur votre domaine', a:'Supérieure : le modèle a appris votre domaine', r:'Dépend des documents retrouvés', w:'a' },
      { c:'Vitesse de réponse', a:'Réponses plus rapides', r:'Étape de recherche en plus', w:'a' },
      { c:'Intelligence spécifique', a:'Vocabulaire, ton et règles intégrés', r:'Connaissance générale + documents', w:'a' },
      { c:'Connaissances à jour', a:'Nécessite un nouvel affinage', r:'Il suffit d’ajouter des documents', w:'r' },
      { c:'Citer ses sources', a:'Réponse issue du modèle', r:'Peut citer les documents utilisés', w:'r' }
    ];
    this.T = [
      { t:'Qualifier les demandes du support', s:'Tri, réponses suggérées, escalade.', steps:['Lecture de la file de demandes (exemple fictif)','Classement par intention : facturation, technique, compte','Rédaction de réponses suggérées pour les cas courants','Escalade des cas sensibles vers un humain','Synthèse transmise au responsable support'], r:'Cas courants traités en brouillon, cas sensibles escaladés, synthèse prête à relire.' },
      { t:'Préparer la revue hebdomadaire', s:'Collecte, analyse, rédaction.', steps:['Collecte des indicateurs depuis vos outils (exemple)','Détection des écarts par rapport à la semaine précédente','Rédaction d’une synthèse claire','Mise en forme des tableaux de bord','Envoi pour validation humaine'], r:'Revue hebdomadaire rédigée, écarts signalés, prête à être validée.' },
      { t:'Rédiger une fiche produit', s:'Brief, ton de marque, vérification.', steps:['Analyse du brief produit','Application du ton de marque (modèle affiné)','Rédaction de la fiche','Vérification des contraintes et mentions','Export au format attendu'], r:'Fiche produit cohérente avec votre ton, vérifiée et exportée.' }
    ];
  }
  componentWillUnmount(){ if (this.timer) { clearInterval(this.timer); this.timer = null; } }
  renderVals(){
    var s = this.state, p = this.props || {}, self = this;
    var neon = p.neon || '#FF3EA5';
    var scan = !(p.scanlines === false || p.scanlines === 'false');
    var cap = this.C[s.cap];
    var q = this.Q[s.quest];
    var sc = this.S[s.scn];
    var task = this.T[s.task];
    var count = s.tracked.filter(function(x){ return x; }).length;
    var stop = function(){ if (self.timer) { clearInterval(self.timer); self.timer = null; } };
    var v = {
      scan: scan,
      menuOpen: s.menuOpen,
      toggleMenu: function(){ self.setState({ menuOpen: !self.state.menuOpen }); },
      cap: cap,
      skillCur: cap.skills[s.skill],
      skills: cap.skills.map(function(k, i){
        return { n:k.n, lbl:'Compétence 0' + (i + 1), style: i === s.skill ? 'border-color:#00E5FF;background:#16123A;box-shadow:0 0 28px -6px rgba(0,229,255,.7)' : '',
          pick: function(){ self.setState({ skill: i }); } };
      }),
      quests: this.Q.map(function(x, i){
        var on = i === s.quest, tr = s.tracked[i];
        return { n:'0' + (i + 1), t:x.t, cap:x.cap, tag: tr ? 'Suivie' : 'Dispo',
          tagStyle: tr ? 'color:#FFD166' : 'color:#9C93C4',
          style: on ? 'border-color:' + neon + ';background:rgba(255,255,255,.03)' : '',
          nStyle: on ? 'color:' + neon : '',
          pick: function(){ self.setState({ quest: i }); } };
      }),
      quest: { n:'0' + (s.quest + 1), t:q.t, cap:q.cap, obj:q.obj, rw:q.rw, note:q.note, hasNote: !!q.note, steps: q.steps.map(function(t){ return { t:t }; }) },
      toggleQuest: function(){ var a = self.state.tracked.slice(); a[self.state.quest] = !a[self.state.quest]; self.setState({ tracked: a }); },
      trackLabel: s.tracked[s.quest] ? 'Quête suivie — retirer' : 'Suivre cette quête',
      trackCount: String(count),
      trackStyle: 'width:' + Math.round(count / 6 * 100) + '%',
      scenarios: this.S.map(function(x, i){
        return { t:x.t, style: i === s.scn ? 'border-color:#FFD166;color:#FFD166;background:rgba(255,209,102,.08)' : '', pick: function(){ self.setState({ scn: i }); } };
      }),
      verdict: sc.v,
      aStyle: (sc.w === 'a' || sc.w === 'b') ? 'border-color:#FF3EA5;box-shadow:0 0 0 1px #FF3EA5,0 0 60px -16px #FF3EA5;transform:scale(1.02)' : 'opacity:.6',
      rStyle: (sc.w === 'r' || sc.w === 'b') ? 'border-color:#00E5FF;box-shadow:0 0 0 1px #00E5FF,0 0 60px -16px #00E5FF;transform:scale(1.02)' : 'opacity:.6',
      rows: this.R.map(function(r){
        return { c:r.c, a:r.a, r:r.r, aS: r.w === 'a' ? 'color:#FF3EA5;font-weight:600' : 'color:#9C93C4', rS: r.w === 'r' ? 'color:#00E5FF;font-weight:600' : 'color:#9C93C4' };
      }),
      tasks: this.T.map(function(x, i){
        var on = i === s.task;
        return { t:x.t, s:x.s, style: on ? 'border-color:#00E5FF;background:rgba(0,229,255,.06)' : '', rStyle: on ? 'border-color:#00E5FF;background:#00E5FF;box-shadow:0 0 10px #00E5FF' : '',
          pick: function(){ stop(); self.setState({ task: i, shown: 0, running: false, done: false }); } };
      }),
      taskCur: task,
      launch: function(){
        stop();
        self.setState({ shown: 0, running: true, done: false });
        self.timer = setInterval(function(){
          var total = self.T[self.state.task].steps.length;
          var n = self.state.shown + 1;
          if (n >= total) { stop(); self.setState({ shown: total, running: false, done: true }); }
          else { self.setState({ shown: n }); }
        }, 900);
      },
      reset: function(){ stop(); self.setState({ shown: 0, running: false, done: false }); },
      launchLabel: s.running ? 'Mission en cours…' : (s.done ? 'Relancer ATOM' : 'Lancer ATOM'),
      statusLabel: s.running ? 'en cours' : (s.done ? 'terminé' : 'prêt'),
      idle: !s.running && !s.done && s.shown === 0,
      running: s.running,
      done: s.done,
      curLine: s.running ? task.steps[Math.min(s.shown, task.steps.length - 1)] : '',
      lines: task.steps.slice(0, s.shown).map(function(t, i){ return { t:t, k:'0' + (i + 1) }; }),
      progStyle: 'width:' + Math.round(s.shown / task.steps.length * 100) + '%'
    };
    [0,1,2].forEach(function(i){
      var on = s.cap === i;
      v['c' + i] = function(){ self.setState({ cap: i, skill: 0 }); };
      v['cS' + i] = on ? 'border-color:' + neon + ';box-shadow:0 0 0 1px ' + neon + ',0 16px 40px -20px ' + neon + ';background:#1E1844' : '';
      v['cA' + i] = on ? 'true' : 'false';
    });
    return v;
  }
}
</script>
