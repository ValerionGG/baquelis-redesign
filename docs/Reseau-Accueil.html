@media(min-width:901px){.mnav{display:none}}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:#8E9BB5}
.dot{width:8px;height:8px;border-radius:50%;background:#3DFFA2;animation:ping 1.8s infinite;flex:none}

.sec{padding:clamp(72px,9vw,128px) 0;position:relative}
.card{background:#0C1428;border:1px solid #17223D;border-radius:16px;transition:border-color .25s,transform .25s,box-shadow .25s}
.lift:hover{transform:translateY(-4px);border-color:#00AEEF;box-shadow:0 22px 50px -26px rgba(0,174,239,.6)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:20px}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;border:1px solid #2A3A60;color:#8E9BB5;white-space:nowrap}
.illu{color:#FFB020;border-color:rgba(255,176,32,.45)}

.ftr{border-top:1px solid #17223D;background:#050915;padding:72px 0 28px;font-size:15px}
.ftr-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:40px}
.ftr h4{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8E9BB5;font-weight:500;margin:0 0 12px}
.ftr-l a{display:flex;align-items:center;min-height:40px;color:#E6ECF7;text-decoration:none;transition:color .2s}
.ftr-l a:hover{color:#3DFFA2}
.ftr-b{margin-top:56px;padding-top:22px;border-top:1px solid #17223D;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#8E9BB5;font-size:13px}
.rv{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.18s}.d3{animation-delay:.28s}.d4{animation-delay:.4s}.d5{animation-delay:.55s}
:focus-visible{outline:2px solid #00AEEF;outline-offset:3px}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(61,255,162,.55)}70%{box-shadow:0 0 0 10px rgba(61,255,162,0)}100%{box-shadow:0 0 0 0 rgba(61,255,162,0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pk{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes marq{to{transform:translateX(-50%)}}
@keyframes halo{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.75);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes feedA{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes feedB{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes scan{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@keyframes lineIn{0%,8%{opacity:0;transform:translateY(6px)}14%,88%{opacity:1;transform:none}100%{opacity:0}}

.hstats{display:flex;gap:28px;flex-wrap:wrap;margin-top:40px;padding-top:24px;border-top:1px solid #17223D}

.g-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.chip:hover{border-color:#00AEEF}
.net{width:100%;height:auto;display:block;margin-top:6px}
.node{cursor:pointer;transition:opacity .35s}
.node:focus{outline:none}
.node:focus-visible .core{stroke-width:4}

.halo{fill:none;stroke-width:2;animation:halo 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.eb{stroke-width:1.6;transition:stroke .3s,opacity .3s}
.pk{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:3 97;animation:pk 2.6s linear infinite}

.spin{animation:spin 80s linear infinite;transform-box:fill-box;transform-origin:center}

.ft{font-size:12px;color:#8E9BB5}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":8200},"accent":{"editor":"color","default":"#3DFFA2","options":["#3DFFA2","#00AEEF","#FFB020"]}}'>
class Component extends DCLogic {
  constructor(props){
    super(props);
    this.state = { menu: false, node: 'vous', pilier: 0, etape: 0, tick: 0, live: true };
  }
  componentDidMount(){
    this.timer = setInterval(() => { if (this.state.live) this.setState({ tick: this.state.tick + 1 }); }, 2200);
  }
  componentWillUnmount(){ clearInterval(this.timer); }
  renderVals(){
    const s = this.state;
    const A = (this.props && this.props.accent) || '#3DFFA2';
    const NODES = {
      vous: { k: 'Nœud central', t: 'Vous', d: 'Votre entreprise reste au centre du réseau : chaque équipe, chaque modèle, chaque déploiement vous renvoie un signal clair.', i: ['Suivi des progrès en temps réel', 'Rapports réguliers', 'Tarification transparente', 'Communication ouverte'], h: 'Reseau-Offres.html', l: 'Voir les formules' },
      equipe: { k: 'Équipes dédiées', t: 'Équipe', d: 'Partenariat, pas d’externalisation : nos experts deviennent une extension de votre équipe.', i: ['Intégration d’équipe dédiée', 'Engagement à long terme', 'Alignement culturel', 'Communication fluide'], h: 'Reseau-Expertises.html', l: 'Nos expertises' },
      ia: { k: 'Intelligence artificielle', t: 'IA', d: 'Des modèles affinés sur vos données et des agents autonomes qui exécutent, décident et s’adaptent.', i: ['Affinage de modèles', 'Agents autonomes', 'Intégration métier', 'Démo ATOM'], h: 'Reseau-IA.html', l: 'Explorer l’IA' },
      jeux: { k: 'Jeux & Web3', t: 'Jeux', d: 'Les jeux sont les applications les plus difficiles : les maîtriser prouve que nous pouvons relever n’importe quel défi technique.', i: ['Performance temps réel', 'Architecture complexe', 'Multijoueur évolutif', 'Sécurité & anti-triche'], h: 'Reseau-Jeux.html', l: 'Jeux & Web3' },
      cloud: { k: 'Cloud & performance', t: 'Cloud', d: 'Nous ne livrons pas seulement du code : nous construisons des systèmes évolutifs qui grandissent avec votre entreprise.', i: ['Architecture évolutive', 'Solutions cloud-native', 'Pile technologique moderne', 'Optimisation des performances'], h: 'Reseau-Expertises.html', l: 'Solutions éprouvées' }
    };
    const NB = { vous: ['equipe', 'ia', 'jeux', 'cloud'], equipe: ['vous', 'ia', 'jeux'], ia: ['vous', 'equipe', 'cloud'], jeux: ['vous', 'equipe', 'cloud'], cloud: ['vous', 'ia', 'jeux'] };
    const E = { e1: ['vous', 'equipe'], e2: ['vous', 'ia'], e3: ['vous', 'jeux'], e4: ['vous', 'cloud'], e5: ['equipe', 'ia'], e6: ['ia', 'cloud'], e7: ['cloud', 'jeux'], e8: ['jeux', 'equipe'] };
    const edge = {};
    Object.keys(E).forEach(k => {
      const on = E[k].indexOf(s.node) > -1;
      edge[k] = {
        b: on ? 'stroke:' + A + ';opacity:.9' : 'stroke:#22325A;opacity:.9',
        p: on ? 'stroke:' + A + ';animation-duration:1.3s' : 'stroke:#00AEEF;opacity:.4'
      };
    });
    const nd = {};
    Object.keys(NODES).forEach(k => {
      const act = k === s.node;
      const near = act || NB[s.node].indexOf(k) > -1;
      nd[k] = {
        g: 'opacity:' + (near ? 1 : 0.35),
        core: act ? 'fill:' + A + ';stroke:' + A : 'fill:#0C1428;stroke:#00AEEF',
        halo: act ? 'stroke:' + A : 'stroke:#00AEEF',
        ic: act ? 'stroke:#060B18' : 'stroke:#E6ECF7',
        lbl: act ? 'fill:' + A : 'fill:#E6ECF7',
        pick: () => this.setState({ node: k })
      };
    });
    const order = ['vous', 'equipe', 'ia', 'jeux', 'cloud'];
    const chips = order.map(k => ({
      l: NODES[k].t.toUpperCase(),
      pr: k === s.node ? 'true' : 'false',
      st: k === s.node ? 'border-color:' + A + ';color:' + A + ';background:#0C1428' : '',
      pick: () => this.setState({ node: k })
    }));
    const N = NODES[s.node];
    const panel = { k: N.k, t: N.t, d: N.d, h: N.h, l: N.l, items: N.i, links: NB[s.node].length + ' CONNEXIONS ACTIVES' };

    const P = [
      { n: '01', t: 'Solutions éprouvées', q: 'Nous ne livrons pas seulement du code — nous construisons des systèmes évolutifs qui grandissent avec votre entreprise.', i: ['Architecture évolutive', 'Pile technologique moderne', 'Solutions cloud-native', 'Optimisation des performances'] },
      { n: '02', t: 'Partenariat, pas d’externalisation', q: 'Nos experts deviennent une extension de votre équipe.', i: ['Intégration d’équipe dédiée', 'Engagement à long terme', 'Alignement culturel', 'Communication fluide'] },
      { n: '03', t: 'Rapidité avec précision', q: 'Du concept à la livraison, vite et sans compromis sur la qualité.', i: ['Prototypage rapide', 'Méthodologie agile', 'Assurance qualité', 'Intégration continue'] },
      { n: '04', t: 'Transparence radicale', q: 'Pas de coûts cachés ni de mises à jour vagues : des progrès visibles en temps réel.', i: ['Suivi des progrès en temps réel', 'Tarification transparente', 'Rapports réguliers', 'Communication ouverte'] }
    ];
    const piliers = P.map((p, i) => ({
      n: p.n, t: p.t, sel: i === s.pilier ? 'true' : 'false',
      st: i === s.pilier ? 'background:#0C1428;border-color:' + A + ';box-shadow:inset 3px 0 0 ' + A : '',
      pick: () => this.setState({ pilier: i })
    }));
    const cp = P[s.pilier];
    const pil = { n: cp.n, t: cp.t, q: cp.q, items: cp.i.map((l, j) => ({ l: l, st: 'animation-delay:' + (j * 0.08) + 's' })) };

    const POOL = [
      ['COMMIT', 'feat(paiement) : validation des montants côté serveur', 'profil senior · Flex'],
      ['TICKET', '#214 Accélérer le chargement du tableau de bord → en revue', 'équipe produit'],
      ['DÉPLOI', 'Pré-production mise à jour — build vert', 'intégration continue'],
      ['ALERTE', 'Temps de réponse API au-dessus du seuil — analyse en cours', 'supervision'],
      ['REVUE', 'Revue de code approuvée par le Lead tech', 'Lead tech · Performance'],
      ['TICKET', '#219 Agent IA : réponses support bilingues → terminé', 'équipe IA'],
      ['COMMIT', 'fix(sync) : cohérence d’état entre clients connectés', 'profil senior · Flex'],
      ['RAPPORT', 'Rapport hebdomadaire publié dans votre espace', 'Product Owner'],
      ['ALERTE', 'Résolu — temps de réponse API revenu sous le seuil', 'supervision'],
      ['TICKET', '#223 Ingestion des nouveaux formats de données → en cours', 'équipe data'],
      ['COMMIT', 'perf(cache) : suppression des requêtes redondantes', 'profil dédié · Intégration'],
      ['RAPPORT', 'Point quotidien partagé sur l’espace Slack dédié', 'Lead tech · Performance']
    ];
    const COL = { COMMIT: A, TICKET: '#00AEEF', 'DÉPLOI': A, ALERTE: '#FFB020', REVUE: '#00AEEF', RAPPORT: '#E6ECF7' };
    const pad = x => (x < 10 ? '0' : '') + x;
    const clock = t => { const sec = 9 * 3600 + 41 * 60 + t * 37; return pad(Math.floor(sec / 3600) % 24) + ':' + pad(Math.floor(sec / 60) % 60) + ':' + pad(sec % 60); };
    const feed = [];
    for (let k = 0; k < 6; k++) {
      const t = s.tick - k;
      const ev = POOL[((t % POOL.length) + POOL.length) % POOL.length];
      const c = COL[ev[0]];
      feed.push({
        time: clock(t + 20), type: ev[0], msg: ev[1], who: ev[2],
        bs: 'color:' + c + ';border-color:' + c,
        row: k === 0 ? 'animation:' + (s.tick % 2 ? 'feedA' : 'feedB') + ' .7s ease both;background:rgba(61,255,162,.05)' : 'opacity:' + (1 - k * 0.11)
      });
    }
    const prog = 38 + (s.tick * 3) % 58;
    const vel = [];
    for (let i = 0; i < 12; i++) {
      const h = 18 + Math.round(50 * (0.5 + 0.5 * Math.sin((i + s.tick) * 0.85)));
      vel.push('height:' + h + 'px;background:' + (i === 11 ? A : '#00AEEF') + ';opacity:' + (0.45 + i * 0.045));
    }
    const board = {
      prog: prog + ' %',
      progBar: 'width:' + prog + '%;background:linear-gradient(90deg,#00AEEF,' + A + ')',
      closed: String(12 + Math.floor(s.tick / 2)),
      count: (124 + s.tick) + ' événements',
      status: s.live ? 'EN DIRECT' : 'EN PAUSE',
      dot: s.live ? 'background:' + A : 'background:#FFB020;animation:none',
      stTag: s.live ? '' : 'color:#FFB020;border-color:rgba(255,176,32,.5)',
      btn: s.live ? 'Pause' : 'Reprendre'
    };

    const S = [
      { t: 'Appel découverte', d: 'Nous écoutons vos objectifs, vos contraintes et votre contexte technique pour comprendre où le réseau doit se brancher.', delai: '[DÉLAI]' },
      { t: 'Cadrage & choix de formule', d: 'Intégration, Flex ou Performance : nous choisissons ensemble le niveau d’engagement adapté à votre projet.', delai: '[DÉLAI]' },
      { t: 'Sélection du profil ou de l’équipe', d: 'Un profil dédié, un profil senior ou une équipe de 5 experts seniors avec Lead tech et Product Owner.', delai: '[DÉLAI]' },
      { t: 'Intégration à vos outils et rituels', d: 'Vos canaux, votre gestion de projet, vos cérémonies agiles : nos experts deviennent une extension de votre équipe.', delai: '[DÉLAI]' },
      { t: 'Suivi temps réel & ajustements', d: 'Rapports réguliers, communication ouverte et changement de profil si nécessaire.', delai: 'Changement de profil sous 30 j (Intégration) ou 15 j (Flex)' }
    ];
    const steps = S.map((x, i) => ({
      n: '0' + (i + 1), t: x.t, pr: i === s.etape ? 'true' : 'false',
      st: i < s.etape ? 'border-color:' + A + ';background:#0C1428;color:' + A : (i === s.etape ? 'border-color:' + A + ';background:' + A + ';color:#060B18;box-shadow:0 0 0 6px rgba(61,255,162,.15)' : 'border-color:#2A3A60;background:#060B18;color:#8E9BB5'),
      pick: () => this.setState({ etape: i })
    }));
    const cs = S[s.etape];
    const method = { n: '0' + (s.etape + 1), t: cs.t, d: cs.d, delai: cs.delai, line: 'width:' + (s.etape * 25) + '%;background:' + A };

    return {
      menuOpen: s.menu,
      toggleMenu: () => this.setState({ menu: !s.menu }),
      toggleLive: () => this.setState({ live: !s.live }),
      ui: { dotBg: 'background:' + A, accentText: 'color:' + A, ctaBg: 'background:' + A, stroke: 'stroke:' + A },
      edge: edge, nd: nd, chips: chips, panel: panel,
      piliers: piliers, pil: pil,
      feed: feed, vel: vel, board: board,
      steps: steps, method: method
    };
  }
}
</script>
