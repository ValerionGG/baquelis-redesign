<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<script src="dc.js"></script>

<body>
<div id="dc-root"></div>
<script type="text/x-dc-template" id="dc-template">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&amp;family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&amp;display=swap">
<style>
body{margin:0}
sc-for,sc-if{display:contents}
.bq{font-family:"Hanken Grotesk",system-ui,sans-serif;color:#0F1720;background:#FFFFFF;-webkit-font-smoothing:antialiased;line-height:1.5}
.bq *{box-sizing:border-box}
.bq a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.serif{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:0}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:#4A5563;margin:0}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--l);color:#0F1720;font-weight:600;font-size:13px;padding:5px 11px;border-radius:999px;white-space:nowrap}
.chip-o{display:inline-flex;align-items:center;gap:6px;border:1px solid #E3E7EC;color:#4A5563;font-weight:500;font-size:13px;padding:5px 11px;border-radius:999px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-weight:600;font-size:15px;text-decoration:none;transition:background .25s,color .25s,transform .25s,border-color .25s;border:1px solid transparent;cursor:pointer;font-family:inherit;white-space:nowrap}
.bq .btn-p{background:var(--c);color:#fff}
.bq .btn-p:hover{background:#0F1720;transform:translateY(-1px)}
.bq .btn-g{border-color:#0F1720;color:#0F1720;background:transparent}
.bq .btn-g:hover{background:#0F1720;color:#fff}
.btn svg{transition:transform .25s}
.btn:hover svg{transform:translateX(3px)}
.tb-l{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--l);margin-right:8px;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,244,50,.7)}70%{box-shadow:0 0 0 8px rgba(198,244,50,0)}100%{box-shadow:0 0 0 0 rgba(198,244,50,0)}}
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #E3E7EC}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:21px;letter-spacing:-.03em;min-height:44px}
.nav-d{display:flex;gap:4px}
.nav-d a{text-decoration:none;font-weight:500;font-size:15px;color:#4A5563;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;transition:background .2s,color .2s}
.nav-d a:hover{background:#F3F5F7;color:#0F1720}
.nav-d a[aria-current="page"]{color:#0F1720;background:#F3F5F7}
.burger{display:none;width:48px;height:48px;border-radius:999px;border:1px solid #E3E7EC;background:#fff;align-items:center;justify-content:center;cursor:pointer;color:#0F1720}
.mnav{display:none;border-top:1px solid #E3E7EC;padding:12px 20px 20px}
.mnav a{display:flex;align-items:center;min-height:48px;text-decoration:none;font-weight:600;font-size:17px;border-bottom:1px solid #E3E7EC}
.card{background:#fff;border:1px solid #E3E7EC;border-radius:20px}
.lift{transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .35s}
.lift:hover{transform:translateY(-4px);box-shadow:0 22px 44px -24px rgba(15,23,32,.28);border-color:#C9D1DA}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.fadein{animation:fadein .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.opt{font-family:inherit;cursor:pointer;text-align:left;border-radius:14px;transition:background .25s,border-color .25s,color .25s,box-shadow .25s,transform .25s}
.opt:hover{border-color:#0F1720}
.bq :focus-visible{outline:3px solid var(--c);outline-offset:3px}
.ft a{text-decoration:none;color:#C5CDD6;display:inline-flex;min-height:36px;align-items:center;transition:color .2s}
.ft a:hover{color:#fff}
.img-z{overflow:hidden;border-radius:24px}
.img-z img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.img-z:hover img{transform:scale(1.04)}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.spin{animation:spin 1s linear infinite;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.cmp-row{transition:background .25s}
.cmp-row:hover{background:#F3F5F7}
@media (max-width:960px){.nav-d{display:none}.burger{display:inline-flex}.mnav{display:block}.hide-s{display:none}}
@media (max-width:640px){.wrap{padding:0 20px}}
</style>
</helmet>
<div class="bq" style="{{ rootStyle }}">

<div style="background:#0F1720;color:#fff;font-size:13px">
<div class="wrap" style="display:flex;justify-content:space-between;align-items:center;gap:8px 16px;min-height:40px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px">
<span><span class="dot"></span>Prix publics : dès 4 500 €/mois, sans frais cachés. <a href="Clarte-Offres.html" class="tb-l">Voir le comparatif</a></span>
<a href="index.html" class="tb-l">Toutes les propositions</a>
</div>
</div>

<header class="hdr">
<div class="wrap" style="display:flex;align-items:center;justify-content:space-between;height:76px;gap:24px">
<a href="Clarte-Accueil.html" class="logo" aria-label="Baquelis, accueil">
<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="#0F1720"></rect><rect x="8" y="8" width="14" height="14" rx="3" fill="none" stroke="#fff" stroke-width="2"></rect><rect x="15" y="15" width="7" height="7" rx="1.5" style="fill:var(--l)"></rect></svg>
<span>Baquelis</span>
</a>
<nav class="nav-d" aria-label="Navigation principale">
<a href="Clarte-Expertises.html">Expertises</a>
<a href="Clarte-IA.html" aria-current="page">IA</a>
<a href="Clarte-Jeux.html">Jeux &amp; Web3</a>
<a href="Clarte-Offres.html">Offres</a>
<a href="Clarte-Contact.html">Contact</a>
</nav>
<div style="display:flex;gap:10px;align-items:center">
<a href="Clarte-Contact.html" class="btn btn-p hide-s">Réserver un appel</a>
<button class="burger" type="button" aria-label="Ouvrir ou fermer le menu" onClick="{{ toggleNav }}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"></path></svg></button>
</div>
</div>
<sc-if value="{{ navOpen }}" hint-placeholder-val="{{ false }}">
<nav class="mnav" aria-label="Navigation mobile">
<a href="Clarte-Expertises.html">Expertises</a>
<a href="Clarte-IA.html">IA</a>
<a href="Clarte-Jeux.html">Jeux &amp; Web3</a>
<a href="Clarte-Offres.html">Offres</a>
<a href="Clarte-Contact.html">Contact</a>
<a href="Clarte-Contact.html" class="btn btn-p" style="margin-top:16px;border:0;justify-content:center">Commencer</a>
</nav>
</sc-if>
</header>

<!-- HERO -->
<section style="padding:88px 0 80px">
<div class="wrap" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));gap:56px;align-items:center">
<div>
<div class="rise" style="display:flex;gap:10px;flex-wrap:wrap"><span class="chip">Excellence IA</span><span class="chip-o">Modèles affinés · Agents autonomes</span></div>
<h1 class="rise d1" style="margin:24px 0 0;font-weight:700;font-size:clamp(38px,4.6vw,66px);line-height:1.03;letter-spacing:-.045em;overflow-wrap:anywhere">Transformez la productivité avec les agents IA.</h1>
<p class="rise d2" style="font-size:18px;color:#4A5563;margin:22px 0 0;max-width:540px">Des modèles entraînés sur vos données, des agents qui exécutent des tâches complexes, et une intégration directe dans vos processus. <span class="serif" style="color:#0F1720;font-size:21px">Excellence IA par la technologie.</span></p>
<div class="rise d3" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:30px">
<a href="#atom" class="btn btn-p">Lancer la démo ATOM <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"></path></svg></a>
<a href="Clarte-Offres.html" class="btn btn-g">Voir les formules</a>
</div>
</div>
<div class="rise d2" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px">
<div style="background:#0F1720;color:#fff;border-radius:24px;padding:30px;grid-column:1/-1;position:relative;overflow:hidden;min-height:260px">
<img src="assets/wafer.webp" alt="" style="position:absolute;right:-60px;top:-40px;width:320px;height:320px;object-fit:cover;border-radius:50%;opacity:.55">
<p class="eyebrow" style="color:#9AA6B4;position:relative">Productivité</p>
<div class="num" style="font-size:clamp(96px,10vw,150px);font-weight:800;line-height:.9;letter-spacing:-.06em;color:var(--l);margin-top:18px;position:relative">×10</div>
<p style="margin:14px 0 0;color:#C5CDD6;max-width:340px;position:relative">Ce que la personnalisation de modèles et les agents autonomes peuvent apporter. Une promesse Baquelis, pas une statistique.</p>
</div>
<div class="card" style="padding:24px">
<div class="num" style="font-size:52px;font-weight:700;line-height:1;color:var(--c)">90 %</div>
<p style="margin:10px 0 0;color:#4A5563;font-size:14px">des demandes support traitées par des agents, avec une qualité de niveau humain. Affirmation Baquelis.</p>
</div>
<div class="card" style="padding:24px">
<div class="num" style="font-size:52px;font-weight:700;line-height:1">6</div>
<p style="margin:10px 0 0;color:#4A5563;font-size:14px">cas d’usage documentés, du support client à l’automatisation agentique.</p>
</div>
</div>
</div>
</section>

<!-- CAPACITÉS -->
<section style="background:#F3F5F7;padding:104px 0">
<div class="wrap">
<p class="eyebrow">3 capacités</p>
<h2 style="font-size:clamp(30px,3.4vw,48px);line-height:1.06;letter-spacing:-.035em;margin:16px 0 0;font-weight:700;max-width:760px">De la donnée brute <span class="serif" style="font-weight:400;color:var(--c)">à l’agent qui agit.</span></h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:12px;margin-top:40px" role="tablist" aria-label="Capacités IA">
<sc-for list="{{ capTabs }}" as="c" hint-placeholder-count="3">
<button type="button" role="tab" class="opt" style="{{ c.style }}" aria-selected="{{ c.pressed }}" onClick="{{ c.pick }}">
<span style="display:flex;justify-content:space-between;align-items:center"><span class="num" style="font-size:13px;opacity:.7">{{ c.n }}</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="{{ c.icon }}"></path></svg></span>
<span style="display:block;font-weight:700;font-size:22px;margin-top:22px;letter-spacing:-.02em">{{ c.t }}</span>
<span style="display:block;font-size:15px;margin-top:6px;opacity:.85">{{ c.s }}</span>
</button>
</sc-for>
</div>
<div class="card fadein" style="margin-top:16px;padding:clamp(24px,4vw,40px)" role="tabpanel">
<div style="display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:end">
<p style="margin:0;font-size:19px;max-width:620px">{{ cap.d }}</p>
<span class="chip-o">Pipeline type · illustratif</span>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px;margin-top:32px">
<sc-for list="{{ cap.steps }}" as="st" hint-placeholder-count="4">
<div class="lift" style="border:1px solid #E3E7EC;border-radius:16px;padding:20px;position:relative;background:#fff">
<div style="display:flex;justify-content:space-between;align-items:center"><span class="num" style="width:32px;height:32px;border-radius:10px;background:#F3F5F7;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">{{ st.n }}</span><svg width="40" height="8" viewBox="0 0 40 8" aria-hidden="true"><path class="flow" d="M0 4h40" stroke="var(--c)" stroke-width="2" style="stroke:var(--c)"></path></svg></div>
<strong style="display:block;margin-top:16px;font-size:17px">{{ st.t }}</strong>
<span style="display:block;color:#4A5563;font-size:14px;margin-top:4px">{{ st.d }}</span>
</div>
</sc-for>
</div>
</div>
</div>
</section>

<!-- CAS D'USAGE -->
<section style="padding:104px 0">
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap">
<div><p class="eyebrow">Cas d’usage</p><h2 style="font-size:clamp(30px,3.4vw,48px);line-height:1.06;letter-spacing:-.035em;margin:16px 0 0;font-weight:700">Six usages, <span class="serif" style="font-weight:400">un même objectif : l’impact.</span></h2></div>
<p style="color:#4A5563;margin:0;max-width:360px">Sélectionnez un cas d’usage pour voir ce qu’il change et la capacité mobilisée.</p>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:24px;margin-top:40px;align-items:start">
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px" role="tablist" aria-label="Cas d’usage">
<sc-for list="{{ caseTabs }}" as="u" hint-placeholder-count="6">
<button type="button" role="tab" class="opt" style="{{ u.style }}" aria-selected="{{ u.pressed }}" onClick="{{ u.pick }}">
<span class="num" style="display:block;font-size:30px;font-weight:700;line-height:1">{{ u.n }}</span>
<span style="display:block;font-weight:600;margin-top:12px;font-size:15px;line-height:1.3">{{ u.t }}</span>
</button>
</sc-for>
</div>
<div class="card fadein" style="padding:clamp(24px,3.4vw,36px);min-height:420px;display:flex;flex-direction:column" role="tabpanel">
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span class="num" style="font-size:64px;font-weight:800;line-height:1;color:var(--c)">{{ uc.n }}</span><span class="chip">{{ uc.cap }}</span></div>
<h3 style="font-size:28px;margin:20px 0 0;letter-spacing:-.025em;line-height:1.15">{{ uc.t }}</h3>
<p style="color:#4A5563;margin:12px 0 0;font-size:17px">{{ uc.d }}</p>
<div style="margin-top:auto;padding-top:24px;display:grid;gap:8px">
<sc-for list="{{ uc.gains }}" as="g" hint-placeholder-count="3">
<div style="display:flex;gap:10px;align-items:center;border-top:1px solid #E3E7EC;padding-top:10px;font-weight:500"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="8" style="fill:var(--l)"></circle><path d="M5.5 9.2l2.2 2.2 4.8-4.8" stroke="#0F1720" stroke-width="1.6"></path></svg>{{ g }}</div>
</sc-for>
</div>
<p style="margin:16px 0 0;font-size:13px;color:#4A5563">{{ uc.note }}</p>
</div>
</div>
</div>
</section>

<!-- COMPARATEUR -->
<section style="background:#F3F5F7;padding:104px 0">
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap">
<div><p class="eyebrow">Comparateur</p><h2 style="font-size:clamp(30px,3.4vw,48px);line-height:1.06;letter-spacing:-.035em;margin:16px 0 0;font-weight:700">Modèle affiné <span class="serif" style="font-weight:400;color:var(--c)">ou</span> RAG ?</h2></div>
<div style="display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;background:#fff;border:1px solid #E3E7EC;border-radius:999px;padding:4px" role="group" aria-label="Approche mise en avant">
<sc-for list="{{ cmpTabs }}" as="t" hint-placeholder-count="2">
<button type="button" class="opt" style="{{ t.style }}" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}">{{ t.t }}</button>
</sc-for>
</div>
</div>
<p style="color:#4A5563;margin:18px 0 0;max-width:640px">Le RAG va chercher des documents à chaque requête ; un modèle affiné a intégré votre domaine. Notre position : pour une intelligence spécifique à votre métier, le modèle affiné offre une précision supérieure et des réponses plus rapides.</p>
<div class="card" style="margin-top:32px;overflow:hidden" role="table" aria-label="Comparaison modèle affiné et RAG">
<div role="row" style="display:grid;grid-template-columns:1.2fr 1fr 1fr;border-bottom:1px solid #E3E7EC;font-weight:700">
<div role="columnheader" style="padding:20px 24px;color:#4A5563;font-size:13px;letter-spacing:.12em;text-transform:uppercase">Critère</div>
<div role="columnheader" style="{{ hA }}">Modèle affiné</div>
<div role="columnheader" style="{{ hB }}">RAG</div>
</div>
<sc-for list="{{ cmpRows }}" as="r" hint-placeholder-count="5">
<div role="row" class="cmp-row" style="display:grid;grid-template-columns:1.2fr 1fr 1fr;border-bottom:1px solid #E3E7EC">
<div role="cell" style="padding:20px 24px;font-weight:600">{{ r.k }}</div>
<div role="cell" style="{{ r.sA }}">{{ r.a }}</div>
<div role="cell" style="{{ r.sB }}">{{ r.b }}</div>
</div>
</sc-for>
</div>
<p style="font-size:13px;color:#4A5563;margin:14px 0 0">Comparaison qualitative. Le bon choix dépend de vos données et de votre cas d’usage : nous le tranchons ensemble au cadrage.</p>
</div>
</section>

<!-- ATOM -->
<section id="atom" style="padding:104px 0">
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap">
<div><p class="eyebrow">Démo ATOM</p><h2 style="font-size:clamp(30px,3.4vw,48px);line-height:1.06;letter-spacing:-.035em;margin:16px 0 0;font-weight:700">Regardez un agent <span class="serif" style="font-weight:400;color:var(--c)">travailler à découvert.</span></h2></div>
<span class="chip" style="background:#FFF6E0;color:#5C3D00;border:1px solid #F1D48A">Démonstration scénarisée · aucune donnée réelle</span>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:24px;margin-top:40px;align-items:start">
<div>
<p style="font-weight:600;margin:0 0 12px">1. Choisissez une tâche</p>
<div style="display:grid;gap:8px" role="group" aria-label="Tâche de l’agent">
<sc-for list="{{ taskTabs }}" as="k" hint-placeholder-count="3">
<button type="button" class="opt" style="{{ k.style }}" aria-pressed="{{ k.pressed }}" onClick="{{ k.pick }}">
<span style="display:block;font-weight:600">{{ k.t }}</span>
<span style="display:block;font-size:14px;opacity:.8;margin-top:2px">{{ k.s }}</span>
</button>
</sc-for>
</div>
<p style="font-weight:600;margin:24px 0 12px">2. Lancez l’agent</p>
<button type="button" class="btn btn-p" style="width:100%" onClick="{{ start }}">{{ startLabel }} <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 3l9 5-9 5z"></path></svg></button>
<p style="font-size:13px;color:#4A5563;margin:12px 0 0">ATOM est l’agent IA de Baquelis. Cette interface rejoue un scénario écrit à l’avance pour illustrer les étapes d’un agent autonome.</p>
</div>

<div style="border:1px solid #E3E7EC;border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 40px 80px -48px rgba(15,23,32,.4)" aria-live="polite">
<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid #E3E7EC;background:#F3F5F7;gap:12px;flex-wrap:wrap">
<span style="display:flex;align-items:center;gap:10px;font-weight:700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" style="fill:var(--c)"></circle><ellipse cx="12" cy="12" rx="10" ry="4" stroke="#0F1720" stroke-width="1.4"></ellipse><ellipse cx="12" cy="12" rx="10" ry="4" stroke="#0F1720" stroke-width="1.4" transform="rotate(60 12 12)"></ellipse><ellipse cx="12" cy="12" rx="10" ry="4" stroke="#0F1720" stroke-width="1.4" transform="rotate(120 12 12)"></ellipse></svg>ATOM</span>
<span class="mono" style="font-size:13px;color:#4A5563">{{ status }}</span>
</div>
<div style="height:3px;background:#E3E7EC"><div style="{{ progStyle }}"></div></div>
<div style="padding:24px;min-height:440px">

</div>
</sc-for>
<sc-if value="{{ running }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px dashed #C9D1DA;border-radius:12px;color:#4A5563">
<svg class="spin" width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="8" stroke="#E3E7EC" stroke-width="2.5"></circle><path d="M10 2a8 8 0 0 1 8 8" stroke="var(--c)" stroke-width="2.5" style="stroke:var(--c)"></path></svg>
<span class="mono" style="font-size:14px">{{ nextLabel }}<span class="blink">_</span></span>
</div>
</sc-if>
<sc-if value="{{ idle }}" hint-placeholder-val="{{ false }}">
<div style="padding:28px;border:1px dashed #C9D1DA;border-radius:12px;color:#4A5563;text-align:center">Choisissez une tâche puis lancez l’agent pour voir ses étapes.</div>
</sc-if>
</div>
<sc-if value="{{ done }}" hint-placeholder-val="{{ true }}">
<div class="fadein" style="margin-top:18px;background:#0F1720;color:#fff;border-radius:16px;padding:20px">
<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><strong>Résultat</strong><span class="chip">Validation humaine requise</span></div>
<p style="margin:10px 0 0;color:#C5CDD6">{{ task.result }}</p>
</div>
</sc-if>
</div>
</div>
</div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":6100},"accent":{"editor":"color","default":"#0083B8","options":["#0083B8","#0F766E","#3B5BDB"]},"highlight":{"editor":"color","default":"#C6F432","options":["#C6F432","#FFD84D","#8DF0C8"]}}'>
class Component extends DCLogic {
  constructor(props){ super(props); this.state = { cap: 0, uc: 0, cmp: 0, task: 0, run: 0, running: false, nav: false }; this.timer = null; }
  componentWillUnmount(){ if (this.timer) { clearInterval(this.timer); this.timer = null; } }
  tasks(){
    return [
      { t: "Trier les demandes support", s: "Automatisation du support client", prompt: "Classer et répondre aux demandes entrantes du jour",
        steps: [["Lecture des demandes", "file support › demandes non traitées"], ["Classification par intention", "facturation · technique · compte · autre"], ["Recherche dans la base de connaissance", "réponses validées, ton de marque"], ["Rédaction des réponses", "brouillons prêts à l’envoi"], ["Escalade des cas sensibles", "transmis à un humain avec le contexte"]],
        result: "Demandes classées, réponses rédigées pour les cas courants, cas sensibles escaladés avec un résumé. Scénario illustratif." },
      { t: "Préparer un brief de contenu", s: "Pipeline de génération de contenu", prompt: "Produire un brief et un premier jet pour un article métier",
        steps: [["Analyse du sujet", "objectif · audience · angle"], ["Collecte des sources internes", "documents fournis par l’équipe"], ["Plan détaillé", "sections · messages clés"], ["Premier jet", "rédigé dans le ton de la marque"], ["Contrôle qualité", "cohérence · relecture humaine demandée"]],
        result: "Brief structuré et premier jet prêts pour relecture par votre équipe. Scénario illustratif." },
      { t: "Anticiper la charge de la semaine", s: "Intelligence métier prédictive", prompt: "Estimer la charge opérationnelle des prochains jours",
        steps: [["Lecture de l’historique", "données d’activité agrégées"], ["Détection des tendances", "saisonnalité · signaux faibles"], ["Projection", "scénarios bas · central · haut"], ["Recommandations", "affectation des ressources"], ["Tableau de bord", "insights temps réel publiés"]],
        result: "Projection en trois scénarios et recommandations d’affectation publiées dans le tableau de bord. Scénario illustratif." }
    ];
  }
  renderVals() {
    const p = this.props || {};
    const s = this.state;
    const CA = [
      { t: "Affinage de modèles", s: "Vos données, votre cas d’usage", icon: "M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM12 12l8-4.5M12 12v9M12 12L4 7.5", d: "Des modèles entraînés sur vos données et vos cas d’usage, pour une intelligence propre à votre domaine.",
        steps: [["Formation spécifique au domaine", "votre vocabulaire, vos règles"], ["Optimisation des performances", "précision et vitesse"], ["Apprentissage continu", "le modèle progresse avec vous"], ["Confidentialité & sécurité", "vos données restent protégées"]] },
      { t: "Agents autonomes", s: "Tâches complexes, décisions, adaptation", icon: "M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3", d: "Des agents capables d’exécuter des tâches complexes, de prendre des décisions et de s’adapter.",
        steps: [["Automatisation de tâches", "les tâches répétitives disparaissent"], ["Prise de décision", "selon vos règles métier"], ["Coordination multi-agents", "plusieurs agents, un objectif"], ["Apprentissage & adaptation", "amélioration continue"]] },
      { t: "Intégration métier", s: "L’IA dans vos processus existants", icon: "M4 6h7v5H4zM13 13h7v5h-7zM11 8.5h4.5V13M8.5 11v4.5H13", d: "L’IA branchée sur vos outils et processus existants, sans tout reconstruire.",
        steps: [["Automatisation des flux", "de bout en bout"], ["Traitement de données", "structuration et enrichissement"], ["Analytique prédictive", "anticiper plutôt que subir"], ["Insights temps réel", "des décisions mieux informées"]] }
    ];
    const capTabs = CA.map((x, i) => ({
      n: "0" + (i + 1), t: x.t, s: x.s, icon: x.icon, pressed: i === s.cap ? "true" : "false",
      style: "padding:24px;min-height:170px;border:1px solid " + (i === s.cap ? "#0F1720;background:#0F1720;color:#fff" : "#E3E7EC;background:#fff;color:#0F1720"),
      pick: () => this.setState({ cap: i })
    }));
    const c = CA[s.cap];
    const cap = { d: c.d, steps: c.steps.map((x, i) => ({ n: String(i + 1), t: x[0], d: x[1] })) };
    const UC = [
      { t: "Automatisation du support client", cap: "Agents autonomes", d: "Des agents qui traitent 90 % des demandes avec une qualité de réponse de niveau humain, et transmettent le reste à vos équipes.", gains: ["Réponses immédiates, à toute heure", "Équipes concentrées sur les cas à valeur", "Ton de marque respecté"], note: "« 90 % » : affirmation Baquelis, présentée comme promesse." },
      { t: "Pipeline de génération de contenu", cap: "Intégration métier", d: "Un pipeline qui transforme vos sources internes en contenus structurés, relus par vos équipes.", gains: ["Production accélérée", "Cohérence éditoriale", "Relecture humaine conservée"], note: "Résultats selon vos volumes et votre processus éditorial." },
      { t: "Intelligence métier prédictive", cap: "Intégration métier", d: "Des modèles qui lisent vos données pour anticiper la demande, la charge ou les risques.", gains: ["Analytique prédictive", "Insights temps réel", "Décisions mieux informées"], note: "Les projections dépendent de la qualité de vos données." },
      { t: "Optimisation des processus", cap: "Agents autonomes", d: "Identifier les tâches fastidieuses et les automatiser pour rationaliser les opérations.", gains: ["Moins de tâches répétitives", "Flux de travail rationalisés", "Efficacité maximale"], note: "Démarche itérative, processus par processus." },
      { t: "Modèles affinés vs RAG", cap: "Affinage de modèles", d: "Quand la précision compte, un modèle affiné offre une précision supérieure, des réponses plus rapides et une intelligence spécifique.", gains: ["Précision supérieure", "Réponses plus rapides", "Intelligence spécifique"], note: "Voir le comparateur ci-dessous." },
      { t: "Automatisation métier agentique", cap: "Agents autonomes", d: "Des agents coordonnés qui prennent en charge des processus complets, avec des points de contrôle humains.", gains: ["Coordination multi-agents", "Prise de décision encadrée", "Apprentissage & adaptation"], note: "Points de validation humaine définis au cadrage." }
    ];
    const caseTabs = UC.map((x, i) => ({
      n: "0" + (i + 1), t: x.t, pressed: i === s.uc ? "true" : "false",
      style: "padding:20px;min-height:132px;border:1px solid " + (i === s.uc ? "var(--c);background:#fff;color:#0F1720;box-shadow:0 0 0 1px var(--c),0 18px 36px -24px rgba(15,23,32,.35)" : "#E3E7EC;background:#F3F5F7;color:#0F1720"),
      pick: () => this.setState({ uc: i })
    }));
    const uc = Object.assign({ n: "0" + (s.uc + 1) }, UC[s.uc]);
    const on = "padding:20px 24px;background:#F2FBFF;box-shadow:inset 0 0 0 0 transparent;border-left:2px solid var(--c);";
    const off = "padding:20px 24px;color:#4A5563;border-left:2px solid transparent;";
    const R = [
      ["Précision sur votre domaine", "Supérieure : le domaine est appris", "Dépend des documents retrouvés"],
      ["Vitesse de réponse", "Plus rapide : pas d’étape de recherche", "Recherche à chaque requête"],
      ["Intelligence", "Spécifique à votre métier", "Générale, enrichie de documents"],
      ["Évolution des connaissances", "Apprentissage continu", "Ajout de documents à l’index"],
      ["Données", "Entraînement sur vos données, confidentialité intégrée", "Indexation de vos documents"]
    ];
    const cmpRows = R.map((r) => ({ k: r[0], a: r[1], b: r[2], sA: s.cmp === 0 ? on + "font-weight:600" : off, sB: s.cmp === 1 ? on + "font-weight:600" : off }));
    const cmpTabs = ["Modèle affiné", "RAG"].map((t, i) => ({
      t, pressed: i === s.cmp ? "true" : "false",
      style: "border:0;border-radius:999px;padding:0 18px;min-height:44px;font-weight:600;" + (i === s.cmp ? "background:#0F1720;color:#fff" : "background:transparent;color:#0F1720"),
      pick: () => this.setState({ cmp: i })
    }));
    const TK = this.tasks();
    const task = TK[s.task];
    const total = task.steps.length;
    const taskTabs = TK.map((x, i) => ({
      t: x.t, s: x.s, pressed: i === s.task ? "true" : "false",
      style: "padding:16px 18px;min-height:64px;border:1px solid " + (i === s.task ? "#0F1720;background:#0F1720;color:#fff" : "#E3E7EC;background:#fff;color:#0F1720"),
      pick: () => { if (this.timer) { clearInterval(this.timer); this.timer = null; } this.setState({ task: i, run: 0, running: false }); }
    }));
    const start = () => {
      if (this.timer) clearInterval(this.timer);
      this.setState({ run: 0, running: true });
      this.timer = setInterval(() => {
        const n = this.state.run + 1;
        if (n >= total) { clearInterval(this.timer); this.timer = null; this.setState({ run: total, running: false }); }
        else this.setState({ run: n });
      }, 1100);
    };
    const done = s.run >= total;
    const shown = task.steps.slice(0, s.run).map((x) => ({ t: x[0], d: x[1] }));
    const nxt = task.steps[Math.min(s.run, total - 1)];
    return {
      rootStyle: "--c:" + (p.accent || "#0083B8") + ";--l:" + (p.highlight || "#C6F432") + ";",
      navOpen: s.nav,
      toggleNav: () => this.setState({ nav: !s.nav }),
      capTabs, cap, caseTabs, uc, cmpRows, cmpTabs,
      hA: "padding:20px 24px;border-left:2px solid " + (s.cmp === 0 ? "var(--c);background:#F2FBFF;color:var(--c)" : "transparent"),
      hB: "padding:20px 24px;border-left:2px solid " + (s.cmp === 1 ? "var(--c);background:#F2FBFF;color:var(--c)" : "transparent"),
      taskTabs, task, start, shown, done,
      running: s.running,
      idle: !s.running && s.run === 0,
      startLabel: done ? "Relancer l’agent" : (s.running ? "Agent en cours…" : "Lancer l’agent"),
      nextLabel: nxt[0] + "…",
      status: s.running ? "en cours · étape " + Math.min(s.run + 1, total) + "/" + total : (done ? "terminé · " + total + "/" + total : "prêt"),
      progStyle: "height:3px;background:var(--c);transition:width .6s cubic-bezier(.2,.7,.2,1);width:" + Math.round(s.run / total * 100) + "%"
    };
  }
}
</script>
